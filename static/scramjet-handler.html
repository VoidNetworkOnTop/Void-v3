<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Game Loader</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #loading-text {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div id="loading-text">Loading game...</div>
    </div>
    <div id="game-container">
        <iframe id="game-frame" allowfullscreen></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameFrame = document.getElementById('game-frame');
            const loadingOverlay = document.getElementById('loading-overlay');
            const urlParams = new URLSearchParams(window.location.search);
            const gameUrl = urlParams.get('url');

            if (!gameUrl) {
                loadingOverlay.innerHTML = '<div id="loading-text">No game URL provided</div>';
                return;
            }

            gameFrame.src = gameUrl;

            gameFrame.onload = () => {
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 1000);
            };

            gameFrame.onerror = () => {
                loadingOverlay.innerHTML = '<div id="loading-text">Failed to load game</div>';
            };
        });
    </script>
</body>
</html>
