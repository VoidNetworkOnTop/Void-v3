<!DOCTYPE html>
<html>
<head>
  <title>VAST XML Test</title>
</head>
<body>
  <h1>VAST XML Test</h1>
  <pre id="result">Loading...</pre>
  
  <script>
    // Direct VAST request
    fetch('https://pubads.g.doubleclick.net/gampad/ads?iu=/21775744923/external/single_ad_samples&sz=640x480&output=vast&unviewed_position_start=1&env=vp&impl=s&correlator=')
      .then(response => response.text())
      .then(data => {
        document.getElementById('result').textContent = data.substring(0, 1000) + '...'; // Show first 1000 chars
        console.log('VAST response received', data);
      })
      .catch(error => {
        document.getElementById('result').textContent = 'Error: ' + error;
        console.error('Error fetching VAST:', error);
      });
  </script>
</body>
</html>
