<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Network Admin Panel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d1b69 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .status-connected {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4caf50;
        }

        .status-error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }

        .status-loading {
            background: rgba(255, 193, 7, 0.3);
            border: 1px solid #ffc107;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-bottom: 20px;
            color: #4ecdc4;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.2);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }

        .btn-danger:hover {
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-warning {
            background: linear-gradient(45deg, #ffa726, #ff9800);
        }

        .btn-warning:hover {
            box-shadow: 0 5px 15px rgba(255, 167, 38, 0.4);
        }

        .result-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .user-info.banned {
            background: rgba(244, 67, 54, 0.1);
            border-color: #f44336;
        }

        .user-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-detail:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4ecdc4;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logs {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            opacity: 0.8;
        }

        .log-error { color: #ff6b6b; }
        .log-success { color: #4ecdc4; }
        .log-warning { color: #ffa726; }
        .log-info { color: #64b5f6; }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Void Network Admin Panel</h1>
            <p>Firebase Admin Dashboard</p>
            <div id="authStatus" class="status-indicator status-error">
                ❌ Not authenticated
            </div>
            <div id="connectionStatus" class="status-indicator status-loading">
                <span class="loading"></span> Initializing Firebase...
            </div>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="card" style="max-width: 400px; margin: 0 auto 30px auto;">
            <h3>🔐 Admin Login</h3>
            <div class="form-group">
                <label for="adminEmail">Admin Email:</label>
                <input type="email" id="adminEmail" placeholder="void.client@yandex.com" value="void.client@yandex.com">
            </div>
            <div class="form-group">
                <label for="adminPassword">Password:</label>
                <input type="password" id="adminPassword" placeholder="Enter password...">
            </div>
            <button class="btn" onclick="loginAdmin()">Login as Admin</button>
            <div id="loginResult"></div>
        </div>

        <!-- Admin Actions (hidden until logged in) -->
        <div id="adminActions" style="display: none;">
            <div style="text-align: center; margin-bottom: 20px;">
                <button class="btn btn-warning" onclick="logoutAdmin()">Logout</button>
            </div>

        <div class="grid">
            <!-- Search User Card -->
            <div class="card">
                <h3>🔍 Search User</h3>
                <div class="form-group">
                    <label for="searchIdentifier">User ID, Username, or Email:</label>
                    <input type="text" id="searchIdentifier" placeholder="Enter user identifier...">
                </div>
                <button class="btn" onclick="searchUser()">Search User</button>
                <div id="searchResult"></div>
            </div>

            <!-- Add Coins Card -->
            <div class="card">
                <h3>💰 Add Coins</h3>
                <div class="form-group">
                    <label for="addCoinsIdentifier">User Identifier:</label>
                    <input type="text" id="addCoinsIdentifier" placeholder="User ID, username, or email...">
                </div>
                <div class="form-group">
                    <label for="addCoinsAmount">Amount to Add:</label>
                    <input type="number" id="addCoinsAmount" min="1" max="1000000000" placeholder="Enter amount...">
                </div>
                <button class="btn" onclick="addCoins()">Add Coins</button>
                <div id="addCoinsResult"></div>
            </div>

            <!-- Remove Coins Card -->
            <div class="card">
                <h3>💸 Remove Coins</h3>
                <div class="form-group">
                    <label for="removeCoinsIdentifier">User Identifier:</label>
                    <input type="text" id="removeCoinsIdentifier" placeholder="User ID, username, or email...">
                </div>
                <div class="form-group">
                    <label for="removeCoinsAmount">Amount to Remove:</label>
                    <input type="number" id="removeCoinsAmount" min="1" placeholder="Enter amount...">
                </div>
                <button class="btn btn-warning" onclick="removeCoins()">Remove Coins</button>
                <div id="removeCoinsResult"></div>
            </div>

            <!-- Ban User Card -->
            <div class="card">
                <h3>🔨 Ban User</h3>
                <div class="form-group">
                    <label for="banIdentifier">User Identifier:</label>
                    <input type="text" id="banIdentifier" placeholder="User ID, username, or email...">
                </div>
                <div class="form-group">
                    <label for="banReason">Ban Reason:</label>
                    <textarea id="banReason" rows="3" placeholder="Enter ban reason...">Manual ban via Admin Panel</textarea>
                </div>
                <button class="btn btn-danger" onclick="banUser()">Ban User</button>
                <div id="banResult"></div>
            </div>

            <!-- Firebase Status Card -->
            <div class="card">
                <h3>🔥 Firebase Status</h3>
                <button class="btn" onclick="checkFirebaseStatus()">Check Status</button>
                <button class="btn" onclick="testConnection()">Test Connection</button>
                <div id="statusResult"></div>
            </div>

            <!-- Quick Actions Card -->
            <div class="card">
                <h3>⚡ Quick Actions</h3>
                <button class="btn" onclick="clearAllResults()">Clear All Results</button>
                <button class="btn" onclick="exportLogs()">Export Logs</button>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Admin Name:</label>
                    <input type="text" id="adminName" placeholder="Your name..." value="Admin Panel">
                </div>
            </div>
        </div>
        </div> <!-- End adminActions -->

        <!-- Logs Section (only visible when authenticated) -->
        <div id="logsSection" class="logs" style="display: none;">
            <h3>📋 Activity Logs</h3>
            <div id="logs"></div>
        </div>
    </div>

    <!-- Firebase SDK v9 -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getFirestore, collection, doc, getDoc, getDocs, query, where, limit, runTransaction, updateDoc, setDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

        // Firebase configuration with your actual project settings
        const firebaseConfig = {
            apiKey: "AIzaSyCkAp_GCGCtw4zv7GgHJOE9GPgIaPEuOvQ",
            authDomain: "void-games-c8d9e.firebaseapp.com",
            projectId: "void-games-c8d9e",
            storageBucket: "void-games-c8d9e.appspot.com",
            messagingSenderId: "1063089929776",
            appId: "1:1063089929776:web:8e226a23a4f3ab9c5777f5"
        };

        // Initialize Firebase
        let app;
        let db;
        let auth;
        let isConnected = false;
        let isAuthenticated = false;
        let currentUser = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            // Make available globally
            window.db = db;
            window.auth = auth;
            window.firebaseModules = { 
                collection, doc, getDoc, getDocs, query, where, limit, 
                runTransaction, updateDoc, setDoc, deleteDoc, serverTimestamp,
                signInWithEmailAndPassword, signOut
            };
            
            // Set up auth state listener
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    isAuthenticated = true;
                    window.isAuthenticated = true;
                    window.currentUser = user;
                    updateAuthStatus(true, user);
                    testInitialConnection();
                } else {
                    currentUser = null;
                    isAuthenticated = false;
                    window.isAuthenticated = false;
                    window.currentUser = null;
                    updateAuthStatus(false, null);
                    updateConnectionStatus(false, 'Not authenticated');
                }
            });
            
        } catch (error) {
            console.error('Failed to initialize Firebase:', error);
            logMessage('Failed to initialize Firebase: ' + error.message, 'error');
            updateConnectionStatus(false, 'Initialization failed: ' + error.message);
        }

        function updateAuthStatus(authenticated, user) {
            const authStatusEl = document.getElementById('authStatus');
            const logsSection = document.getElementById('logsSection');
            
            if (authenticated && user) {
                authStatusEl.className = 'status-indicator status-connected';
                authStatusEl.innerHTML = `✅ Signed in as: ${user.email}`;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminActions').style.display = 'block';
                logsSection.style.display = 'block'; // Show logs when authenticated
                logMessage(`Authenticated as: ${user.email}`, 'success');
            } else {
                authStatusEl.className = 'status-indicator status-error';
                authStatusEl.innerHTML = '❌ Not authenticated';
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('adminActions').style.display = 'none';
                logsSection.style.display = 'none'; // Hide logs when not authenticated
                logMessage('Not authenticated', 'warning');
            }
        }

        async function testInitialConnection() {
            if (!isAuthenticated) {
                updateConnectionStatus(false, 'Authentication required');
                return;
            }
            
            try {
                updateConnectionStatus(null, 'Testing connection...');
                logMessage('Testing Firebase connection...', 'info');
                
                // Test with a simple query
                const usersRef = collection(db, 'users');
                const testQuery = query(usersRef, limit(1));
                const querySnapshot = await getDocs(testQuery);
                
                isConnected = true;
                window.isConnected = true;
                updateConnectionStatus(true, 'Connected successfully');
                logMessage('Firebase connected successfully', 'success');
            } catch (error) {
                console.error('Firebase connection failed:', error);
                isConnected = false;
                window.isConnected = false;
                updateConnectionStatus(false, 'Connection failed: ' + error.message);
                logMessage('Firebase connection failed: ' + error.message, 'error');
            }
        }

        // Make functions available globally
        window.testInitialConnection = testInitialConnection;
        window.updateAuthStatus = updateAuthStatus;
    </script>

    <script>
        // Global variables
        let isConnected = false;
        let isAuthenticated = false;
        let currentUser = null;

        // This function is now in the module script above

        function updateConnectionStatus(connected, message) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = 'status-indicator';
            
            if (connected === null) {
                statusEl.className += ' status-loading';
                statusEl.innerHTML = '<span class="loading"></span> ' + message;
            } else if (connected) {
                statusEl.className += ' status-connected';
                statusEl.innerHTML = '✅ ' + message;
            } else {
                statusEl.className += ' status-error';
                statusEl.innerHTML = '❌ ' + message;
            }
        }

        function logMessage(message, type = 'info') {
            const logsEl = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logsEl.appendChild(logEntry);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        async function findUserByIdentifier(identifier) {
            if (!window.isAuthenticated) {
                throw new Error('Authentication required');
            }
            if (!window.isConnected) {
                throw new Error('Firebase not connected');
            }

            const { collection, doc, getDoc, getDocs, query, where, limit } = window.firebaseModules;
            const db = window.db;

            identifier = identifier.trim();
            logMessage(`Searching for user: "${identifier}"`, 'info');

            try {
                // Strategy 1: Direct ID lookup for long identifiers
                if (identifier.length >= 20 && !identifier.includes('@')) {
                    const userDocRef = doc(db, 'users', identifier);
                    const userDoc = await getDoc(userDocRef);
                    if (userDoc.exists()) {
                        logMessage('Found user by direct ID lookup', 'success');
                        return { data: userDoc.data(), id: userDoc.id, foundBy: 'user_id' };
                    }
                }

                // Strategy 2: Email search with multiple approaches
                if (identifier.includes('@')) {
                    const usersRef = collection(db, 'users');
                    
                    // Try exact email match first
                    logMessage(`Trying exact email match for: ${identifier}`, 'info');
                    const emailQuery = query(usersRef, where('email', '==', identifier), limit(1));
                    const querySnapshot = await getDocs(emailQuery);
                    
                    if (!querySnapshot.empty) {
                        const doc = querySnapshot.docs[0];
                        logMessage('Found user by exact email', 'success');
                        return { data: doc.data(), id: doc.id, foundBy: 'email' };
                    }
                    
                    // Try lowercase email match
                    logMessage(`Trying lowercase email match for: ${identifier.toLowerCase()}`, 'info');
                    const emailQueryLower = query(usersRef, where('email', '==', identifier.toLowerCase()), limit(1));
                    const querySnapshotLower = await getDocs(emailQueryLower);
                    
                    if (!querySnapshotLower.empty) {
                        const doc = querySnapshotLower.docs[0];
                        logMessage('Found user by lowercase email', 'success');
                        return { data: doc.data(), id: doc.id, foundBy: 'email_lowercase' };
                    }
                    
                    // Fallback: Manual search through users (for debugging)
                    logMessage('Email query failed, trying manual search...', 'warning');
                    const allUsersQuery = query(usersRef, limit(100));
                    const allUsersSnapshot = await getDocs(allUsersQuery);
                    
                    for (const doc of allUsersSnapshot.docs) {
                        const userData = doc.data();
                        logMessage(`Checking user: ${userData.username || 'no username'}, email: ${userData.email || 'no email'}`, 'info');
                        
                        if (userData.email) {
                            if (userData.email.toLowerCase() === identifier.toLowerCase()) {
                                logMessage('Found user by manual email search', 'success');
                                return { data: userData, id: doc.id, foundBy: 'email_manual' };
                            }
                        }
                    }
                    
                    logMessage(`No user found with email: ${identifier}`, 'warning');
                    
                } else {
                    // Strategy 3: Username search
                    const usersRef = collection(db, 'users');
                    const usernameQuery = query(usersRef, where('username', '==', identifier), limit(1));
                    const querySnapshot = await getDocs(usernameQuery);
                    
                    if (!querySnapshot.empty) {
                        const doc = querySnapshot.docs[0];
                        logMessage('Found user by username', 'success');
                        return { data: doc.data(), id: doc.id, foundBy: 'username' };
                    }

                    // Strategy 4: Case-insensitive fallback (limited scope)
                    const limitedQuery = query(usersRef, limit(50));
                    const limitedSnapshot = await getDocs(limitedQuery);
                    for (const doc of limitedSnapshot.docs) {
                        const userData = doc.data();
                        if (userData.username && userData.username.toLowerCase() === identifier.toLowerCase()) {
                            logMessage('Found user by case-insensitive username', 'success');
                            return { data: userData, id: doc.id, foundBy: 'username_case_insensitive' };
                        }
                    }
                }

                logMessage('User not found', 'warning');
                return null;
            } catch (error) {
                logMessage('Search error: ' + error.message, 'error');
                throw error;
            }
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const resultEl = document.getElementById('loginResult');
            
            if (!email || !password) {
                resultEl.innerHTML = '<div class="result-area">❌ Please enter email and password</div>';
                return;
            }

            resultEl.innerHTML = '<div class="result-area"><span class="loading"></span> Signing in...</div>';
            
            try {
                const { signInWithEmailAndPassword } = window.firebaseModules;
                const userCredential = await signInWithEmailAndPassword(window.auth, email, password);
                
                // Check if this is the admin email
                if (userCredential.user.email !== 'void.client@yandex.com') {
                    await window.firebaseModules.signOut(window.auth);
                    resultEl.innerHTML = '<div class="result-area">❌ Unauthorized: Admin access required</div>';
                    logMessage('Unauthorized login attempt: ' + email, 'warning');
                    return;
                }
                
                resultEl.innerHTML = '<div class="result-area">✅ Successfully signed in as admin</div>';
                logMessage('Admin login successful: ' + email, 'success');
                
                // Clear the form
                document.getElementById('adminPassword').value = '';
                
            } catch (error) {
                console.error('Login failed:', error);
                let errorMessage = 'Login failed';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'User not found';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Invalid password';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Too many failed attempts. Try again later.';
                        break;
                    case 'auth/invalid-credential':
                        errorMessage = 'Invalid credentials - check email and password';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                resultEl.innerHTML = `<div class="result-area">❌ ${errorMessage}</div>`;
                logMessage('Login failed: ' + errorMessage, 'error');
            }
        }

        async function logoutAdmin() {
            try {
                await window.firebaseModules.signOut(window.auth);
                logMessage('Admin logged out successfully', 'info');
            } catch (error) {
                console.error('Logout failed:', error);
                logMessage('Logout failed: ' + error.message, 'error');
            }
        }

        async function searchUser() {
            const identifier = document.getElementById('searchIdentifier').value;
            const resultEl = document.getElementById('searchResult');
            
            if (!window.isAuthenticated) {
                resultEl.innerHTML = '<div class="result-area">❌ Please login as admin first</div>';
                return;
            }
            
            if (!identifier.trim()) {
                resultEl.innerHTML = '<div class="result-area">❌ Please enter a user identifier</div>';
                return;
            }

            resultEl.innerHTML = '<div class="result-area"><span class="loading"></span> Searching...</div>';

            try {
                const result = await findUserByIdentifier(identifier);
                
                if (!result) {
                    resultEl.innerHTML = '<div class="result-area">❌ User not found</div>';
                    return;
                }

                const { data: userData, id: userId, foundBy } = result;
                const isBanned = userData.banned || false;
                
                // Get leaderboard data
                let leaderboardData = null;
                try {
                    const { doc, getDoc } = window.firebaseModules;
                    const leaderboardDocRef = doc(window.db, 'leaderboard', userId);
                    const leaderboardDoc = await getDoc(leaderboardDocRef);
                    if (leaderboardDoc.exists()) {
                        leaderboardData = leaderboardDoc.data();
                    }
                } catch (error) {
                    logMessage('Could not fetch leaderboard data: ' + error.message, 'warning');
                }

                const userInfoHtml = `
                    <div class="user-info ${isBanned ? 'banned' : ''}">
                        <h4>👤 User Information</h4>
                        <div class="user-detail">
                            <strong>🆔 User ID:</strong>
                            <span>${userId}</span>
                        </div>
                        <div class="user-detail">
                            <strong>👤 Username:</strong>
                            <span>${userData.username || 'Unknown'}</span>
                        </div>
                        <div class="user-detail">
                            <strong>📧 Email:</strong>
                            <span>${userData.email || 'Unknown'}</span>
                        </div>
                        <div class="user-detail">
                            <strong>🔍 Found By:</strong>
                            <span>${foundBy.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase())}</span>
                        </div>
                        <div class="user-detail">
                            <strong>📊 Status:</strong>

        async function addCoins() {
            const identifier = document.getElementById('addCoinsIdentifier').value;
            const amount = parseInt(document.getElementById('addCoinsAmount').value);
            const resultEl = document.getElementById('addCoinsResult');
            const adminName = document.getElementById('adminName').value || 'Admin Panel';
            
            if (!window.isAuthenticated) {
                resultEl.innerHTML = '<div class="result-area">❌ Please login as admin first</div>';
                return;
            }
            
            if (!identifier.trim() || !amount) {
                resultEl.innerHTML = '<div class="result-area">❌ Please fill in all fields</div>';
                return;
            }

            if (amount <= 0 || amount > 1000000000) {
                resultEl.innerHTML = '<div class="result-area">❌ Invalid amount (1-1,000,000,000)</div>';
                return;
            }

            resultEl.innerHTML = '<div class="result-area"><span class="loading"></span> Adding coins...</div>';

            try {
                const userResult = await findUserByIdentifier(identifier);
                
                if (!userResult) {
                    resultEl.innerHTML = '<div class="result-area">❌ User not found</div>';
                    return;
                }

                const { data: userData, id: userId } = userResult;
                
                if (userData.banned) {
                    resultEl.innerHTML = '<div class="result-area">❌ Cannot modify banned user!</div>';
                    return;
                }

                const currentBalance = userData.accountBalance || 0;
                const newBalance = currentBalance + amount;

                // Update using transaction with proper read/write ordering
                const { doc, getDoc, runTransaction, updateDoc, serverTimestamp } = window.firebaseModules;
                
                await runTransaction(window.db, async (transaction) => {
                    const userRef = doc(window.db, 'users', userId);
                    const leaderboardRef = doc(window.db, 'leaderboard', userId);
                    
                    // Do ALL reads first
                    const userDoc = await transaction.get(userRef);
                    const leaderboardDoc = await transaction.get(leaderboardRef);
                    
                    if (!userDoc.exists()) {
                        throw new Error('User not found');
                    }

                    // Then do ALL writes
                    transaction.update(userRef, {
                        accountBalance: newBalance,
                        balanceUpdatedAt: serverTimestamp(),
                        balanceUpdatedBy: adminName
                    });

                    if (leaderboardDoc.exists()) {
                        transaction.update(leaderboardRef, {
                            accountBalance: newBalance,
                            balanceUpdatedAt: serverTimestamp()
                        });
                    }
                });

                const successHtml = `
                    <div class="user-info">
                        <h4>💰 Coins Added</h4>
                        <div class="user-detail">
                            <strong>👤 User:</strong>
                            <span>${userData.username || 'Unknown'}</span>
                        </div>
                        <div class="user-detail">
                            <strong>➕ Added:</strong>
                            <span>${amount.toLocaleString()} coins</span>
                        </div>
                        <div class="user-detail">
                            <strong>💰 New Balance:</strong>
                            <span>${newBalance.toLocaleString()} coins</span>
                        </div>
                        <div class="user-detail">
                            <strong>👮 Added by:</strong>
                            <span>${adminName}</span>
                        </div>
                    </div>
                `;

                resultEl.innerHTML = successHtml;
                logMessage(`Added ${amount.toLocaleString()} coins to ${userData.username || 'Unknown'}`, 'success');

                // Clear form
                document.getElementById('addCoinsIdentifier').value = '';
                document.getElementById('addCoinsAmount').value = '';

            } catch (error) {
                resultEl.innerHTML = `<div class="result-area">❌ Error: ${error.message}</div>`;
                logMessage('Add coins failed: ' + error.message, 'error');
            }
        }

        async function banUser() {
            const identifier = document.getElementById('banIdentifier').value;
            const reason = document.getElementById('banReason').value;
            const resultEl = document.getElementById('banResult');
            const adminName = document.getElementById('adminName').value || 'Admin Panel';
            
            if (!window.isAuthenticated) {
                resultEl.innerHTML = '<div class="result-area">❌ Please login as admin first</div>';
                return;
            }
            
            if (!identifier.trim() || !reason.trim()) {
                resultEl.innerHTML = '<div class="result-area">❌ Please fill in all fields</div>';
                return;
            }

            resultEl.innerHTML = '<div class="result-area"><span class="loading"></span> Banning user...</div>';

            try {
                const userResult = await findUserByIdentifier(identifier);
                
                if (!userResult) {
                    resultEl.innerHTML = '<div class="result-area">❌ User not found</div>';
                    return;
                }

                const { data: userData, id: userId } = userResult;
                
                if (userData.banned) {
                    resultEl.innerHTML = '<div class="result-area">❌ User already banned!</div>';
                    return;
                }

                // Ban using transaction with proper read/write ordering
                const { doc, runTransaction, setDoc, serverTimestamp } = window.firebaseModules;
                
                await runTransaction(window.db, async (transaction) => {
                    const userRef = doc(window.db, 'users', userId);
                    const leaderboardRef = doc(window.db, 'leaderboard', userId);
                    const bannedRef = doc(window.db, 'banned_users', userId);
                    
                    // Do ALL reads first
                    const userDoc = await transaction.get(userRef);
                    const leaderboardDoc = await transaction.get(leaderboardRef);
                    
                    if (!userDoc.exists()) {
                        throw new Error('User not found');
                    }

                    const userData = userDoc.data();

                    // Then do ALL writes
                    transaction.set(bannedRef, {
                        bannedAt: serverTimestamp(),
                        bannedBy: adminName,
                        username: userData.username || 'Unknown',
                        reason: reason,
                        balance: userData.accountBalance || 0,
                        email: userData.email || 'Unknown'
                    });

                    transaction.update(userRef, {
                        banned: true,
                        bannedAt: serverTimestamp(),
                        bannedBy: adminName,
                        banReason: reason
                    });

                    if (leaderboardDoc.exists()) {
                        transaction.update(leaderboardRef, {
                            banned: true,
                            bannedAt: serverTimestamp()
                        });
                    }
                });

                const successHtml = `
                    <div class="user-info banned">
                        <h4>🔨 User Banned</h4>
                        <div class="user-detail">
                            <strong>👤 User:</strong>
                            <span>${userData.username || 'Unknown'}</span>
                        </div>
                        <div class="user-detail">
                            <strong>📝 Reason:</strong>
                            <span>${reason}</span>
                        </div>
                        <div class="user-detail">
                            <strong>👮 Banned by:</strong>
                            <span>${adminName}</span>
                        </div>
                    </div>
                `;

                resultEl.innerHTML = successHtml;
                logMessage(`Banned user: ${userData.username || 'Unknown'} - Reason: ${reason}`, 'success');

                // Clear form
                document.getElementById('banIdentifier').value = '';
                document.getElementById('banReason').value = 'Manual ban via Admin Panel';

            } catch (error) {
                resultEl.innerHTML = `<div class="result-area">❌ Error: ${error.message}</div>`;
                logMessage('Ban user failed: ' + error.message, 'error');
            }
        }

        async function checkFirebaseStatus() {
            const resultEl = document.getElementById('statusResult');
            resultEl.innerHTML = '<div class="result-area"><span class="loading"></span> Checking Firebase status...</div>';

            try {
                const tests = [];
                const { collection, doc, query, where, limit, getDocs, setDoc, deleteDoc, serverTimestamp } = window.firebaseModules;

                // Test 1: Basic connection
                const test1Start = Date.now();
                try {
                    const usersRef = collection(window.db, 'users');
                    const testQuery = query(usersRef, limit(1));
                    await getDocs(testQuery);
                    tests.push({ name: 'Basic Connection', success: true, duration: Date.now() - test1Start });
                } catch (error) {
                    tests.push({ name: 'Basic Connection', success: false, error: error.message });
                }

                // Test 2: Query test
                const test2Start = Date.now();
                try {
                    const usersRef = collection(window.db, 'users');
                    const testQuery = query(usersRef, where('username', '==', 'test123nonexistent'), limit(1));
                    await getDocs(testQuery);
                    tests.push({ name: 'Query Test', success: true, duration: Date.now() - test2Start });
                } catch (error) {
                    tests.push({ name: 'Query Test', success: false, error: error.message });
                }

                // Test 3: Write test (if possible)
                const test3Start = Date.now();
                try {
                    const testRef = doc(window.db, 'test', 'connection-test');
                    await setDoc(testRef, { timestamp: serverTimestamp() });
                    await deleteDoc(testRef);
                    tests.push({ name: 'Write Test', success: true, duration: Date.now() - test3Start });
                } catch (error) {
                    tests.push({ name: 'Write Test', success: false, error: error.message });
                }

                let statusHtml = '<div class="user-info"><h4>🔥 Firebase Status Check</h4>';
                let overallStatus = 'excellent';

                tests.forEach(test => {
                    if (test.success) {
                        statusHtml += `
                            <div class="user-detail">
                                <strong>✅ ${test.name}:</strong>
                                <span>Success (${test.duration}ms)</span>
                            </div>
                        `;
                        if (test.duration > 3000) overallStatus = 'slow';
                        else if (test.duration > 1000) overallStatus = 'moderate';
                    } else {
                        statusHtml += `
                            <div class="user-detail">
                                <strong>❌ ${test.name}:</strong>
                                <span>Failed</span>
                            </div>
                        `;
                        overallStatus = 'failed';
                    }
                });

                const statusMessages = {
                    excellent: '🟢 Excellent',
                    moderate: '🟡 Good',
                    slow: '🟠 Slow but functional',
                    failed: '🔴 Connection issues'
                };

                statusHtml += `
                    <div class="user-detail">
                        <strong>📊 Overall Status:</strong>
                        <span>${statusMessages[overallStatus]}</span>
                    </div>
                </div>`;

                resultEl.innerHTML = statusHtml;
                logMessage(`Firebase status check completed - Status: ${statusMessages[overallStatus]}`, 'info');

            } catch (error) {
                resultEl.innerHTML = `<div class="result-area">❌ Status Check Failed: ${error.message}</div>`;
                logMessage('Firebase status check failed: ' + error.message, 'error');
            }
        }

        function exportLogs() {
            const logs = document.getElementById('logs').innerText;
            const blob = new Blob([logs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `void-network-admin-logs-${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            logMessage('Logs exported successfully', 'success');
        }
