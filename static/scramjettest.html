<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Test - Using Existing Files</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin-bottom: 20px; }
        input { width: 400px; padding: 10px; margin-right: 10px; }
        button { padding: 10px 20px; margin-right: 10px; }
        .status { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { background: #ffebee; border-color: #f44336; }
        .success { background: #e8f5e9; border-color: #4caf50; }
        .loading { background: #fff3e0; border-color: #ff9800; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px; }
        .debug { font-family: monospace; font-size: 12px; background: #f5f5f5; padding: 10px; margin: 10px 0; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Scramjet Test - Using Existing Setup</h1>
    
    <div class="controls">
        <input type="url" id="urlInput" placeholder="Enter URL (e.g., https://example.com)" />
        <button onclick="navigate()">Go</button>
        <button onclick="testServiceWorker()">Test SW</button>
        <button onclick="clearAll()">Clear & Restart</button>
    </div>
    
    <div id="status" class="status">Loading existing Scramjet setup...</div>
    <div id="debug" class="debug"></div>
    
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation" style="display:none;"></iframe>

    <!-- Load existing Scramjet files -->
    <script src="/scramjet/scramjet.config.js"></script>
    <script src="/scramjet/scramjet.bundle.js"></script>
    <script src="/scramjet/register.js"></script>

    <script>
        var isReady = false;
        var registration = null;

        function log(message) {
            const debug = document.getElementById('debug');
            const timestamp = new Date().toLocaleTimeString();
            debug.innerHTML += `[${timestamp}] ${message}<br>`;
            debug.scrollTop = debug.scrollHeight;
            console.log(message);
        }

        function updateStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            log('STATUS: ' + message);
        }

        async function clearAll() {
            log('=== CLEARING ALL ===');
            
            // Unregister all service workers
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
                log('Unregistering: ' + reg.scope);
                await reg.unregister();
            }
            
            // Clear iframe
            document.getElementById('proxyFrame').style.display = 'none';
            document.getElementById('proxyFrame').src = '';
            
            // Reset state
            isReady = false;
            registration = null;
            
            updateStatus('Cleared. Reloading page...', 'loading');
            
            // Reload page after short delay
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }

        async function waitForExistingRegistration() {
            log('=== WAITING FOR EXISTING SCRAMJET REGISTRATION ===');
            
            // Wait for the existing register.js to do its work
            if (typeof window.waitForScramjet === 'function') {
                log('Using existing waitForScramjet function...');
                try {
                    await window.waitForScramjet(15000);
                    log('Existing Scramjet registration completed successfully');
                    return true;
                } catch (error) {
                    log('Existing waitForScramjet failed: ' + error.message);
                }
            }
            
            // Fallback: manually wait for registration
            log('Fallback: manually checking for service worker...');
            const timeout = 15000;
            const start = Date.now();
            
            while (Date.now() - start < timeout) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                const scramjetReg = registrations.find(reg => 
                    reg.scope.includes('/scramjet/') && 
                    reg.active && 
                    reg.active.state === 'activated'
                );
                
                if (scramjetReg) {
                    log('Found active Scramjet registration: ' + scramjetReg.scope);
                    registration = scramjetReg;
                    return true;
                }
                
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            throw new Error('Service worker registration timeout');
        }

        async function testServiceWorker() {
            updateStatus('Testing service worker...', 'loading');
            log('=== TESTING SERVICE WORKER ===');
            
            try {
                // Check registrations
                const regs = await navigator.serviceWorker.getRegistrations();
                log('Active registrations: ' + regs.length);
                
                for (const reg of regs) {
                    log('- Scope: ' + reg.scope + ', Active: ' + (reg.active ? reg.active.state : 'none'));
                }
                
                // Test the endpoint
                log('Testing /scramjet/test endpoint...');
                const response = await fetch('/scramjet/test', { 
                    cache: 'no-cache',
                    headers: { 'x-test': 'true' }
                });
                
                log('Response status: ' + response.status);
                
                if (response.status === 404) {
                    updateStatus('❌ Service worker NOT intercepting (404)', 'error');
                    log('ERROR: Service worker is not intercepting requests');
                } else {
                    const text = await response.text();
                    log('Response text: ' + text);
                    updateStatus('✅ Service worker working! Status: ' + response.status, 'success');
                    return true;
                }
                
            } catch (error) {
                log('Test error: ' + error.message);
                updateStatus('Test failed: ' + error.message, 'error');
            }
            
            return false;
        }

        async function initialize() {
            try {
                // Wait a bit for existing scripts to load
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                updateStatus('Waiting for existing Scramjet registration...', 'loading');
                
                // Check if config is loaded
                if (window.__scramjet$config) {
                    log('✅ Scramjet config loaded');
                } else {
                    log('⚠️ Scramjet config not found');
                }
                
                // Wait for existing registration to complete
                await waitForExistingRegistration();
                
                updateStatus('Testing service worker...', 'loading');
                const testResult = await testServiceWorker();
                
                if (testResult) {
                    isReady = true;
                    updateStatus('✅ Ready! Enter a URL and click Go', 'success');
                } else {
                    updateStatus('⚠️ Service worker issues detected', 'error');
                }
                
            } catch (error) {
                log('Initialization error: ' + error.message);
                updateStatus('❌ Failed: ' + error.message, 'error');
                
                // Try to still allow navigation
                isReady = true;
                updateStatus('⚠️ Ready with warnings - you can try navigating', 'error');
            }
        }

        function navigate() {
            if (!isReady) {
                updateStatus('❌ Not ready - wait for initialization or click Test SW', 'error');
                return;
            }
            
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                updateStatus('❌ Please enter a URL', 'error');
                return;
            }
            
            // Add protocol if missing
            let fullUrl = url;
            if (!fullUrl.match(/^https?:\/\//)) {
                fullUrl = 'https://' + fullUrl;
            }
            
            try {
                new URL(fullUrl); // Validate
            } catch (e) {
                updateStatus('❌ Invalid URL format', 'error');
                return;
            }
            
            // Use existing Scramjet config if available
            let encodedUrl;
            if (window.__scramjet$config && window.__scramjet$config.encodeUrl) {
                encodedUrl = window.__scramjet$config.encodeUrl(fullUrl);
                log('Using existing Scramjet config for encoding');
            } else {
                // Fallback encoding
                encodedUrl = btoa(unescape(encodeURIComponent(fullUrl)))
                    .replace(/\+/g, "-")
                    .replace(/\//g, "_")
                    .replace(/=/g, "");
                log('Using fallback encoding');
            }
            
            const proxyUrl = `/scramjet/${encodedUrl}`;
            
            log('=== NAVIGATING ===');
            log('Original URL: ' + fullUrl);
            log('Encoded URL: ' + encodedUrl);
            log('Proxy URL: ' + proxyUrl);
            
            updateStatus('🔄 Loading: ' + fullUrl, 'loading');
            
            const iframe = document.getElementById('proxyFrame');
            iframe.style.display = 'block';
            iframe.src = proxyUrl;
            
            iframe.onload = () => {
                updateStatus('✅ Loaded: ' + fullUrl, 'success');
                log('Iframe loaded successfully');
            };
            
            iframe.onerror = () => {
                updateStatus('❌ Failed to load: ' + fullUrl, 'error');
                log('Iframe failed to load');
            };
        }

        // Listen for Scramjet ready event from register.js
        window.addEventListener('scramjet-ready', (event) => {
            log('🎉 Received scramjet-ready event');
            log('Registration: ' + event.detail.registration.scope);
            registration = event.detail.registration;
        });

        // Handle Enter key
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate();
        });

        // Initialize when page loads
        window.addEventListener('load', () => {
            log('=== PAGE LOADED ===');
            // Give time for existing scripts to run
            setTimeout(initialize, 2000);
        });
    </script>
</body>
</html>
