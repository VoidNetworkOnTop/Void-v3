<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Test - Clean Version</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin-bottom: 20px; }
        input { width: 400px; padding: 10px; margin-right: 10px; }
        button { padding: 10px 20px; margin-right: 10px; }
        .status { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { background: #ffebee; border-color: #f44336; }
        .success { background: #e8f5e9; border-color: #4caf50; }
        .loading { background: #fff3e0; border-color: #ff9800; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px; }
        .debug { font-family: monospace; font-size: 12px; background: #f5f5f5; padding: 10px; margin: 10px 0; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Scramjet Proxy Test - Clean Version</h1>
    
    <div class="controls">
        <input type="url" id="urlInput" placeholder="Enter URL (e.g., https://example.com)" />
        <button onclick="navigate()">Go</button>
        <button onclick="testServiceWorker()">Test SW</button>
        <button onclick="clearAll()">Clear & Restart</button>
    </div>
    
    <div id="status" class="status">Starting...</div>
    <div id="debug" class="debug"></div>
    
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation" style="display:none;"></iframe>

    <script>
        var isReady = false;
        var registration = null;

        // Simple config
        window.__scramjet$config = {
            encodeUrl: function(url) {
                return btoa(unescape(encodeURIComponent(url)))
                    .replace(/\+/g, "-")
                    .replace(/\//g, "_")
                    .replace(/=/g, "");
            }
        };

        function log(message) {
            const debug = document.getElementById('debug');
            const timestamp = new Date().toLocaleTimeString();
            debug.innerHTML += `[${timestamp}] ${message}<br>`;
            debug.scrollTop = debug.scrollHeight;
            console.log(message);
        }

        function updateStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            log('STATUS: ' + message);
        }

        async function clearAll() {
            log('=== CLEARING ALL ===');
            
            // Unregister all service workers
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
                log('Unregistering: ' + reg.scope);
                await reg.unregister();
            }
            
            // Clear iframe
            document.getElementById('proxyFrame').style.display = 'none';
            document.getElementById('proxyFrame').src = '';
            
            // Reset state
            isReady = false;
            registration = null;
            
            updateStatus('Cleared. Reloading page...', 'loading');
            
            // Reload page after short delay
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }

        async function registerServiceWorker() {
            log('=== REGISTERING SERVICE WORKER ===');
            
            if (!('serviceWorker' in navigator)) {
                throw new Error('Service workers not supported');
            }
            
            // Clear any existing registrations first
            const existing = await navigator.serviceWorker.getRegistrations();
            for (const reg of existing) {
                if (reg.scope.includes('/scramjet/')) {
                    log('Unregistering existing: ' + reg.scope);
                    await reg.unregister();
                }
            }
            
            // Wait a bit to ensure cleanup
            await new Promise(resolve => setTimeout(resolve, 500));
            
            log('Registering new service worker...');
            registration = await navigator.serviceWorker.register('/scramjet/scramjet-sw.js', {
                scope: '/scramjet/',
                updateViaCache: 'none'
            });
            
            log('Registration successful: ' + registration.scope);
            
            // Wait for activation
            if (registration.installing) {
                log('Service worker installing...');
                await new Promise(resolve => {
                    registration.installing.addEventListener('statechange', function() {
                        log('SW state: ' + this.state);
                        if (this.state === 'activated') {
                            resolve();
                        }
                    });
                });
            }
            
            // Ensure it claims clients
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            log('Service worker should be ready');
            return registration;
        }

        async function testServiceWorker() {
            updateStatus('Testing service worker...', 'loading');
            log('=== TESTING SERVICE WORKER ===');
            
            try {
                // Check registrations
                const regs = await navigator.serviceWorker.getRegistrations();
                log('Active registrations: ' + regs.length);
                
                for (const reg of regs) {
                    log('- Scope: ' + reg.scope + ', Active: ' + (reg.active ? reg.active.state : 'none'));
                }
                
                // Test the endpoint
                log('Testing /scramjet/test endpoint...');
                const response = await fetch('/scramjet/test', { 
                    cache: 'no-cache',
                    headers: { 'x-test': 'true' }
                });
                
                log('Response status: ' + response.status);
                
                if (response.status === 404) {
                    updateStatus('❌ Service worker NOT intercepting (404)', 'error');
                    log('ERROR: Service worker is not intercepting requests');
                } else {
                    const text = await response.text();
                    log('Response text: ' + text);
                    updateStatus('✅ Service worker working! Status: ' + response.status, 'success');
                }
                
            } catch (error) {
                log('Test error: ' + error.message);
                updateStatus('Test failed: ' + error.message, 'error');
            }
        }

        async function initialize() {
            try {
                updateStatus('Registering service worker...', 'loading');
                await registerServiceWorker();
                
                updateStatus('Testing service worker...', 'loading');
                await testServiceWorker();
                
                // If we get here and test passed, we're ready
                if (document.getElementById('status').textContent.includes('✅')) {
                    isReady = true;
                    updateStatus('✅ Ready! Enter a URL and click Go', 'success');
                } else {
                    updateStatus('⚠️ Service worker issues detected', 'error');
                }
                
            } catch (error) {
                log('Initialization error: ' + error.message);
                updateStatus('❌ Failed: ' + error.message, 'error');
            }
        }

        function navigate() {
            if (!isReady) {
                updateStatus('❌ Not ready - click Test SW first', 'error');
                return;
            }
            
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                updateStatus('❌ Please enter a URL', 'error');
                return;
            }
            
            // Add protocol if missing
            let fullUrl = url;
            if (!fullUrl.match(/^https?:\/\//)) {
                fullUrl = 'https://' + fullUrl;
            }
            
            try {
                new URL(fullUrl); // Validate
            } catch (e) {
                updateStatus('❌ Invalid URL format', 'error');
                return;
            }
            
            // Encode URL
            const encodedUrl = window.__scramjet$config.encodeUrl(fullUrl);
            const proxyUrl = `/scramjet/${encodedUrl}`;
            
            log('=== NAVIGATING ===');
            log('Original URL: ' + fullUrl);
            log('Encoded URL: ' + encodedUrl);
            log('Proxy URL: ' + proxyUrl);
            
            updateStatus('🔄 Loading: ' + fullUrl, 'loading');
            
            const iframe = document.getElementById('proxyFrame');
            iframe.style.display = 'block';
            iframe.src = proxyUrl;
            
            iframe.onload = () => {
                updateStatus('✅ Loaded: ' + fullUrl, 'success');
                log('Iframe loaded successfully');
            };
            
            iframe.onerror = () => {
                updateStatus('❌ Failed to load: ' + fullUrl, 'error');
                log('Iframe failed to load');
            };
        }

        // Handle Enter key
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate();
        });

        // Initialize when page loads
        window.addEventListener('load', () => {
            log('=== PAGE LOADED ===');
            initialize();
        });
    </script>
</body>
</html>
