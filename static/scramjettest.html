<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Proxy Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .url-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .url-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            background: white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .url-input::placeholder {
            color: #666;
        }

        .go-button {
            padding: 15px 30px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .go-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .go-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            text-align: center;
            padding: 10px;
            color: white;
            font-size: 14px;
            min-height: 20px;
        }

        .status.loading {
            color: #ffd700;
        }

        .status.error {
            color: #ff6b6b;
        }

        .status.success {
            color: #4CAF50;
        }

        .content-frame {
            flex: 1;
            background: white;
            margin: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .proxy-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .welcome-message {
            text-align: center;
            color: white;
            padding: 50px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-message h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .welcome-message p {
            font-size: 1.2em;
            line-height: 1.6;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .back-button, .forward-button, .refresh-button {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-button:hover, .forward-button:hover, .refresh-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .back-button:disabled, .forward-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .url-container {
                flex-direction: column;
            }
            
            .url-input {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .controls {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="url-container">
            <div class="controls">
                <button class="back-button" id="backBtn" disabled>← Back</button>
                <button class="forward-button" id="forwardBtn" disabled>Forward →</button>
                <button class="refresh-button" id="refreshBtn" disabled>↻ Refresh</button>
            </div>
            <input 
                type="url" 
                class="url-input" 
                id="urlInput" 
                placeholder="Enter URL here (e.g., https://example.com)"
                autocomplete="url"
            >
            <button class="go-button" id="goButton">Go</button>
        </div>
    </div>
    
    <div class="status" id="status">Initializing Scramjet...</div>
    
    <div class="welcome-message" id="welcomeMessage">
        <h1>🚀 Scramjet Proxy Browser</h1>
        <p>Enter any URL above to browse the web through the Scramjet proxy. This allows you to access websites while bypassing certain restrictions and maintaining privacy.</p>
    </div>
    
    <div class="content-frame" id="contentFrame">
        <div class="iframe-container">
            <iframe class="proxy-iframe" id="proxyIframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-navigation"></iframe>
        </div>
    </div>

    <!-- Load Scramjet scripts -->
    <script src="/scramjet/scramjet.config.js"></script>
    <script src="/scramjet/scramjet.bundle.js"></script>
    <script src="/scramjet/register.js"></script>

    <script>
        class ScramjetBrowser {
            constructor() {
                this.urlInput = document.getElementById('urlInput');
                this.goButton = document.getElementById('goButton');
                this.status = document.getElementById('status');
                this.welcomeMessage = document.getElementById('welcomeMessage');
                this.contentFrame = document.getElementById('contentFrame');
                this.proxyIframe = document.getElementById('proxyIframe');
                this.backBtn = document.getElementById('backBtn');
                this.forwardBtn = document.getElementById('forwardBtn');
                this.refreshBtn = document.getElementById('refreshBtn');
                
                this.history = [];
                this.currentHistoryIndex = -1;
                
                this.init();
            }
            
            async init() {
                this.setupEventListeners();
                await this.waitForScramjet();
            }
            
            setupEventListeners() {
                this.goButton.addEventListener('click', () => this.navigate());
                this.urlInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.navigate();
                });
                
                this.backBtn.addEventListener('click', () => this.goBack());
                this.forwardBtn.addEventListener('click', () => this.goForward());
                this.refreshBtn.addEventListener('click', () => this.refresh());
                
                // Handle iframe load events
                this.proxyIframe.addEventListener('load', () => {
                    this.updateStatus('Page loaded successfully', 'success');
                    this.updateNavigationButtons();
                });
                
                this.proxyIframe.addEventListener('error', () => {
                    this.updateStatus('Failed to load page', 'error');
                });
            }
            
            async waitForScramjet() {
                try {
                    this.updateStatus('Waiting for Scramjet to initialize...', 'loading');
                    
                    if (typeof window.waitForScramjet === 'function') {
                        await window.waitForScramjet(15000);
                        this.updateStatus('Scramjet ready! Enter a URL to get started.', 'success');
                    } else {
                        // Fallback: wait for service worker registration
                        await this.waitForServiceWorker();
                        this.updateStatus('Scramjet ready! Enter a URL to get started.', 'success');
                    }
                } catch (error) {
                    console.error('Scramjet initialization failed:', error);
                    this.updateStatus('Scramjet initialization failed. Basic proxy functionality available.', 'error');
                }
            }
            
            async waitForServiceWorker() {
                if (!('serviceWorker' in navigator)) {
                    throw new Error('Service workers not supported');
                }
                
                // Wait up to 10 seconds for service worker
                const timeout = 10000;
                const start = Date.now();
                
                while (Date.now() - start < timeout) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    const scramjetSW = registrations.find(reg => 
                        reg.scope.includes('/scramjet/') && reg.active
                    );
                    
                    if (scramjetSW) {
                        return true;
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                throw new Error('Service worker not ready');
            }
            
            updateStatus(message, type = '') {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
            }
            
            async navigate(url = null) {
                try {
                    const targetUrl = url || this.urlInput.value.trim();
                    
                    if (!targetUrl) {
                        this.updateStatus('Please enter a URL', 'error');
                        return;
                    }
                    
                    // Add protocol if missing
                    let fullUrl = targetUrl;
                    if (!fullUrl.match(/^https?:\/\//)) {
                        fullUrl = 'https://' + fullUrl;
                    }
                    
                    // Validate URL
                    try {
                        new URL(fullUrl);
                    } catch (e) {
                        this.updateStatus('Invalid URL format', 'error');
                        return;
                    }
                    
                    this.updateStatus('Loading page...', 'loading');
                    this.goButton.disabled = true;
                    
                    // Encode URL for Scramjet
                    const encodedUrl = this.encodeUrl(fullUrl);
                    if (!encodedUrl) {
                        this.updateStatus('Failed to encode URL', 'error');
                        this.goButton.disabled = false;
                        return;
                    }
                    
                    const proxyUrl = `/scramjet/${encodedUrl}`;
                    console.log('Navigating to:', fullUrl, '→', proxyUrl);
                    
                    // Update history if this is a new navigation
                    if (!url) {
                        this.addToHistory(fullUrl);
                    }
                    
                    // Update URL input
                    this.urlInput.value = fullUrl;
                    
                    // Hide welcome message and show iframe
                    this.welcomeMessage.style.display = 'none';
                    this.contentFrame.style.display = 'block';
                    
                    // Load the page through Scramjet
                    this.proxyIframe.src = proxyUrl;
                    
                } catch (error) {
                    console.error('Navigation error:', error);
                    this.updateStatus(`Navigation failed: ${error.message}`, 'error');
                } finally {
                    this.goButton.disabled = false;
                }
            }
            
            encodeUrl(url) {
                try {
                    if (window.__scramjet$config && window.__scramjet$config.encodeUrl) {
                        return window.__scramjet$config.encodeUrl(url);
                    }
                    
                    // Fallback encoding
                    return btoa(unescape(encodeURIComponent(url)))
                        .replace(/\+/g, "-")
                        .replace(/\//g, "_")
                        .replace(/=/g, "");
                } catch (error) {
                    console.error('URL encoding failed:', error);
                    return null;
                }
            }
            
            addToHistory(url) {
                // Remove any forward history if we're not at the end
                if (this.currentHistoryIndex < this.history.length - 1) {
                    this.history = this.history.slice(0, this.currentHistoryIndex + 1);
                }
                
                // Add new URL
                this.history.push(url);
                this.currentHistoryIndex = this.history.length - 1;
                
                this.updateNavigationButtons();
            }
            
            goBack() {
                if (this.currentHistoryIndex > 0) {
                    this.currentHistoryIndex--;
                    const url = this.history[this.currentHistoryIndex];
                    this.navigate(url);
                }
            }
            
            goForward() {
                if (this.currentHistoryIndex < this.history.length - 1) {
                    this.currentHistoryIndex++;
                    const url = this.history[this.currentHistoryIndex];
                    this.navigate(url);
                }
            }
            
            refresh() {
                if (this.currentHistoryIndex >= 0) {
                    const url = this.history[this.currentHistoryIndex];
                    this.navigate(url);
                }
            }
            
            updateNavigationButtons() {
                this.backBtn.disabled = this.currentHistoryIndex <= 0;
                this.forwardBtn.disabled = this.currentHistoryIndex >= this.history.length - 1;
                this.refreshBtn.disabled = this.currentHistoryIndex < 0;
            }
        }
        
        // Initialize the browser when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ScramjetBrowser();
        });
    </script>
</body>
</html>
