<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin-bottom: 20px; }
        input { width: 400px; padding: 10px; margin-right: 10px; }
        button { padding: 10px 20px; }
        .status { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { background: #ffebee; border-color: #f44336; }
        .success { background: #e8f5e9; border-color: #4caf50; }
        .loading { background: #fff3e0; border-color: #ff9800; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Scramjet Proxy Test</h1>
    
    <div class="controls">
        <input type="url" id="urlInput" placeholder="Enter URL (e.g., https://example.com)" />
        <button id="goButton" onclick="navigate()">Go</button>
        <button onclick="testServiceWorker()">Test SW</button>
    </div>
    
    <div id="status" class="status">Initializing...</div>
    
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation" style="display:none;"></iframe>

    <script>
        let isReady = false;

        // Basic Scramjet config fallback
        if (!window.__scramjet$config) {
            window.__scramjet$config = {
                prefix: '/scramjet/',
                encodeUrl: function(url) {
                    return btoa(unescape(encodeURIComponent(url)))
                        .replace(/\+/g, "-")
                        .replace(/\//g, "_")
                        .replace(/=/g, "");
                },
                decodeUrl: function(encodedUrl) {
                    let paddedUrl = encodedUrl.replace(/-/g, "+").replace(/_/g, "/");
                    while (paddedUrl.length % 4) paddedUrl += '=';
                    return decodeURIComponent(escape(atob(paddedUrl)));
                }
            };
        }

        function updateStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        async function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                throw new Error('Service workers not supported');
            }
            
            try {
                // Unregister existing
                const existing = await navigator.serviceWorker.getRegistrations();
                for (const reg of existing) {
                    if (reg.scope.includes('/scramjet/')) {
                        await reg.unregister();
                    }
                }
                
                // Register new
                const registration = await navigator.serviceWorker.register('/scramjet/scramjet-sw.js', {
                    scope: '/scramjet/'
                });
                
                console.log('Service worker registered:', registration);
                
                // Wait for activation
                if (registration.installing) {
                    await new Promise(resolve => {
                        registration.installing.addEventListener('statechange', () => {
                            if (registration.installing && registration.installing.state === 'activated') {
                                resolve();
                            }
                        });
                    });
                }
                
                return registration;
            } catch (error) {
                console.error('Service worker registration failed:', error);
                throw error;
            }
        }

        async function waitForServiceWorker() {
            const timeout = 15000;
            const start = Date.now();
            
            while (Date.now() - start < timeout) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                const scramjetSW = registrations.find(reg => 
                    reg.scope.includes('/scramjet/') && 
                    reg.active && 
                    reg.active.state === 'activated'
                );
                
                if (scramjetSW) {
                    // Test if it's working
                    try {
                        const testResponse = await fetch('/scramjet/test');
                        if (testResponse.status !== 404) {
                            return true;
                        }
                    } catch (e) {}
                }
                
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            throw new Error('Service worker not ready');
        }

        async function testServiceWorker() {
            updateStatus('Testing service worker...', 'loading');
            
            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                console.log('All registrations:', registrations);
                
                const scramjetRegs = registrations.filter(reg => reg.scope.includes('/scramjet/'));
                console.log('Scramjet registrations:', scramjetRegs);
                
                const testResponse = await fetch('/scramjet/test');
                console.log('Test response:', testResponse.status, testResponse.statusText);
                
                if (testResponse.status === 404) {
                    updateStatus('Service worker NOT intercepting requests (404)', 'error');
                } else {
                    updateStatus('Service worker working! Status: ' + testResponse.status, 'success');
                }
            } catch (error) {
                updateStatus('Service worker test failed: ' + error.message, 'error');
            }
        }

        async function initialize() {
            try {
                updateStatus('Registering service worker...', 'loading');
                await registerServiceWorker();
                
                updateStatus('Waiting for service worker to activate...', 'loading');
                await waitForServiceWorker();
                
                isReady = true;
                updateStatus('Ready! Enter a URL and click Go', 'success');
                
            } catch (error) {
                console.error('Initialization failed:', error);
                updateStatus('Failed to initialize: ' + error.message, 'error');
                isReady = true; // Allow trying anyway
            }
        }

        function navigate() {
            if (!isReady) {
                updateStatus('Not ready yet, please wait...', 'error');
                return;
            }
            
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                updateStatus('Please enter a URL', 'error');
                return;
            }
            
            // Add protocol if missing
            let fullUrl = url;
            if (!fullUrl.match(/^https?:\/\//)) {
                fullUrl = 'https://' + fullUrl;
            }
            
            try {
                new URL(fullUrl); // Validate URL
            } catch (e) {
                updateStatus('Invalid URL format', 'error');
                return;
            }
            
            // Encode URL
            const encodedUrl = window.__scramjet$config.encodeUrl(fullUrl);
            if (!encodedUrl) {
                updateStatus('Failed to encode URL', 'error');
                return;
            }
            
            const proxyUrl = `/scramjet/${encodedUrl}`;
            console.log('Navigating to:', fullUrl, '→', proxyUrl);
            
            updateStatus('Loading: ' + fullUrl, 'loading');
            
            const iframe = document.getElementById('proxyFrame');
            iframe.style.display = 'block';
            iframe.src = proxyUrl;
            
            iframe.onload = () => {
                updateStatus('Loaded: ' + fullUrl, 'success');
            };
            
            iframe.onerror = () => {
                updateStatus('Failed to load: ' + fullUrl, 'error');
            };
        }

        // Handle Enter key
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate();
        });

        // Initialize when page loads
        window.addEventListener('load', initialize);
    </script>
</body>
</html>
