<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classes</title>
    <!-- Load required UV scripts -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <iframe id="frame"></iframe>
    
    <script>
        // Main function to handle the proxy
        async function startProxy() {
            try {
                // Get the URL to proxy from the 'link' query parameter
                let targetUrl = getTargetUrl();
                
                // If no URL is provided, show a placeholder
                if (!targetUrl) {
                    document.body.innerHTML = 'No URL provided. Use: /uv-encode.html?link=https://example.com';
                    return;
                }
                
                // Make sure UV is loaded
                if (!window.__uv$config) {
                    console.error('UV not loaded. Make sure uv.bundle.js and uv.config.js are properly included.');
                    document.body.innerHTML = 'Error: UV proxy not loaded properly.';
                    return;
                }
                
                // Encode URL with UV
                const encodedUrl = __uv$config.encodeUrl(targetUrl);
                const fullProxyUrl = __uv$config.prefix + encodedUrl;
                
                // Set iframe source to the proxied URL
                document.getElementById('frame').src = fullProxyUrl;
            } catch (error) {
                console.error('Proxy error:', error);
                document.body.innerHTML = 'An error occurred while setting up the proxy.';
            }
        }
        
        // Extract target URL from the 'link' query parameter
        function getTargetUrl() {
            // Get URL from the 'link' query parameter
            const urlParams = new URLSearchParams(window.location.search);
            const linkParam = urlParams.get('link');
            
            // Return the URL if it exists
            if (linkParam) {
                // Ensure the URL starts with http:// or https://
                if (linkParam.startsWith('http://') || linkParam.startsWith('https://')) {
                    return linkParam;
                } else {
                    // Add https:// if missing
                    return 'https://' + linkParam;
                }
            }
            
            // Check other common parameter names as fallback
            const otherParams = ['url', 'site', 'target', 'proxy'];
            for (const param of otherParams) {
                const value = urlParams.get(param);
                if (value) {
                    if (value.startsWith('http://') || value.startsWith('https://')) {
                        return value;
                    } else {
                        return 'https://' + value;
                    }
                }
            }
            
            return null;
        }
        
        // Initialize the service worker if needed
        async function registerSW() {
            if (!navigator.serviceWorker) {
                return;
            }
            
            try {
                // Check if service worker is already registered
                const registrations = await navigator.serviceWorker.getRegistrations();
                const uvServiceWorkerActive = registrations.some(reg => 
                    reg.active && (reg.scope.includes('/uv/') || reg.active.scriptURL.includes('uv.sw.js'))
                );
                
                if (!uvServiceWorkerActive) {
                    // Register the UV service worker
                    await navigator.serviceWorker.register('/uv/sw.js', {
                        scope: '/uv/',
                        updateViaCache: 'none'
                    });
                    
                    console.log('UV service worker registered successfully');
                }
            } catch (error) {
                console.error('Failed to register service worker:', error);
            }
        }
        
        // Wait for DOM content to be loaded
        document.addEventListener('DOMContentLoaded', async () => {
            // Register service worker
            await registerSW();
            
            // Start proxy
            startProxy();
        });
        
        // Start proxy immediately if document is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW().then(() => startProxy());
        }
    </script>
</body>
</html>
