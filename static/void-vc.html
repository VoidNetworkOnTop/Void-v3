    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        #header,
        #footer {
            position: relative;
            z-index: 999;
            background-color: #fff;
        }
        
        /* Content wrapper to hold the iframe */
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* Iframe styling that respects header/footer */
        #mainFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

<body>
    <div id="header"></div>
    
    <div class="content-wrapper">
        <iframe id="mainFrame"
                allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; encrypted-media; geolocation; gyroscope; microphone; midi; payment; usb; vr; xr-spatial-tracking"
                frameborder="0"
                allowfullscreen
                sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-pointer-lock allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
        </iframe>
    </div>
    
    <div id="footer"></div>
    
    <script>
        // Load header and footer dynamically
        loadHTML("/assets/html/header.html", "header"),
        loadHTML("/assets/html/footer.html", "footer")
        
        // Load iframe directly without UV proxy
        window.onload = function() {
            // The local file path to embed
            const url = "/assets/components/shadowroot/index.html";
            
            // Get the iframe element
            const mainFrame = document.getElementById('mainFrame');
            
            // Set the src directly
            mainFrame.src = url;
            
            // Adjust content wrapper height based on header/footer presence
            adjustContentHeight();
        };
        
        // Function to adjust content height based on header/footer
        function adjustContentHeight() {
            const header = document.getElementById('header');
            const footer = document.getElementById('footer');
            const contentWrapper = document.querySelector('.content-wrapper');
            
            // Wait for header/footer to load
            setTimeout(() => {
                const headerHeight = header.offsetHeight || 0;
                const footerHeight = footer.offsetHeight || 0;
                
                contentWrapper.style.top = headerHeight + 'px';
                contentWrapper.style.height = `calc(100% - ${headerHeight + footerHeight}px)`;
            }, 100);
        }
    </script>
</body>
