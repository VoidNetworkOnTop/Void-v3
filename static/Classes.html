<body>
    <!-- Minimal header -->
    <header class="header">
        <a href="/"><img src="/img/nav/home.png" class="home_bttn" alt="Home"></a>
        <a href="/learn"><img src="/img/nav/search.png" class="home_bttn" alt="Search"></a>
        <a href="/app"><img src="/img/nav/apps.png" class="home_bttn" alt="Apps"></a>
    </header>

    <!-- Main page content containing both game and suggestions -->
    <div class="page_content">
        <!-- Main game container - completely separate -->
        <div class="game_container">
            <!-- Enhanced loading screen with progress bar -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-spinner"></div>
                <div class="loading-text" id="loadingText">Loading Game...</div>
                <div class="loading-progress" id="loadingProgress">
                    <div class="loading-progress-bar" id="loadingProgressBar"></div>
                </div>
                <button class="show-game-btn" id="showGameBtn">Show Game Now</button>
            </div>
            
            <!-- Game iframe with tabindex -->
            <iframe id="gframe" allowfullscreen="true" allow="autoplay" tabindex="1"></iframe>
            
            <!-- Focus button -->
            <button class="focus-button" id="focusButton">Click to enable keyboard</button>
            
            <!-- Game content warning -->
            <div class="game-content-warning" id="gameContentWarning">
                Game still loading... <button id="reloadBtn" style="background:#4a6ed3;border:none;color:white;padding:5px 10px;border-radius:3px;cursor:pointer;margin-left:10px;">Reload</button>
            </div>
            
            <!-- Reload overlay -->
            <div class="reload-overlay" id="reloadOverlay">
                <div class="reload-message">Game failed to load properly. This may be due to a slow connection or content blocking.</div>
                <button class="reload-button" id="overlayReloadBtn">Reload Game</button>
            </div>
            
            <!-- Footer -->
            <div class="footer">
                <button onclick="reloadGame()" title="Reload">
                    <img src="/img/nav/reload.png" alt="Reload">
                </button>
                <button onclick="toggleFullScreen()" title="Fullscreen">
                    <img src="/img/nav/fullscreenbutton.png" alt="Fullscreen">
                </button>
            </div>
        </div>
        
        <!-- Suggestions container - completely separate -->
        <div class="suggestions_container">
            <div class="suggestions_box">
                <div class="suggestions_header">
                    <h3 class="suggestions_title">More Games To Try</h3>
                </div>
                <div class="suggestions_content" id="gameSuggestions">
                    <!-- Loading state for suggestions -->
                    <div style="text-align:center; padding:20px; width:100%;">
                        <div style="width:40px; height:40px; border:3px solid rgba(100,180,255,0.2); border-top:3px solid #fff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
                        <p style="margin-top:15px; color:#aaa;">Loading game suggestions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- High traffic mode indicator -->
    <div class="traffic-indicator" id="trafficIndicator">
        <span>High Traffic Mode</span>
    </div>

    <!-- Enhanced Game Loading and handling script with high traffic fixes -->
    <script>
        // Define our variables in global scope first
        let iframe;
        let loadingScreen;
        let loadingText;
        let loadingProgressBar;
        let showGameBtn;
        let focusButton;
        let gameContentWarning;
        let reloadOverlay;
        let trafficIndicator;
        let checkVisibilityInterval;
        let contentCheckInterval; // For checking content after loading
        let progressUpdateInterval; // For updating progress bar
        let gameLoaded = false;
        let gameTrueContentLoaded = false;
        let highTrafficMode = false;
        let retryCount = 0;
        let loadStartTime = 0;
        let loadVerificationAttempts = 0;
        let originalGameUrl = null; // Store the original game URL
        const maxRetries = 3;
        const debugMode = true; // Enable console logging
        
        // Debug logging function
        function logDebug(message) {
            if (!debugMode) return;
            console.log(`%c[Game Debug] %c${message}`, 
                'color: #4a6ed3; font-weight: bold;', 
                'color: #333;');
        }
        
        // Setup service worker communication
        function setupServiceWorkerMessaging() {
            if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
                logDebug("⚠️ No service worker controller available");
                return;
            }
            
            // Listen for messages from service worker
            navigator.serviceWorker.addEventListener('message', function(event) {
                if (!event.data) return;
                
                // Handle high traffic mode notifications
                if (event.data.type === 'HIGH_TRAFFIC_MODE') {
                    const isHighTraffic = event.data.enabled;
                    const stats = event.data.stats || {};
                    
                    if (isHighTraffic !== highTrafficMode) {
                        logDebug(`🚦 High traffic mode ${isHighTraffic ? 'enabled' : 'disabled'} - Active connections: ${stats.active || 'unknown'}`);
                        highTrafficMode = isHighTraffic;
                        
                        // Show/hide traffic indicator
                        if (trafficIndicator) {
                            trafficIndicator.style.display = isHighTraffic ? 'block' : 'none';
                        }
                        
                        // Update loading screen behavior
                        updateLoadingUI();
                        
                        // Adjust verification strategy based on traffic
                        adjustVerificationStrategy();
                    }
                }
                
                // Handle status response
                if (event.data.type === 'STATUS_RESPONSE') {
                    const stats = event.data.connectionStats || {};
                    const isHighTraffic = event.data.highTrafficMode;
                    
                    logDebug(`📊 Server status: ${isHighTraffic ? 'High traffic' : 'Normal traffic'}, Connections: ${stats.active || 0}`);
                    
                    // Update state if it's changed
                    if (isHighTraffic !== highTrafficMode) {
                        highTrafficMode = isHighTraffic;
                        
                        // Show/hide traffic indicator
                        if (trafficIndicator) {
                            trafficIndicator.style.display = isHighTraffic ? 'block' : 'none';
                        }
                        
                        // Update loading screen behavior
                        updateLoadingUI();
                        
                        // Adjust verification strategy
                        adjustVerificationStrategy();
                    }
                }
            });
            
            // Request current status from service worker
            try {
                logDebug("🔄 Requesting status from service worker");
                navigator.serviceWorker.controller.postMessage({
                    type: 'STATUS_REQUEST',
                    timestamp: Date.now()
                });
            } catch (e) {
                logDebug(`❌ Error requesting status: ${e.message}`);
            }
            
            // Setup ping to keep service worker connection alive
            setInterval(() => {
                try {
                    if (navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({
                            type: 'PING',
                            timestamp: Date.now()
                        });
                    }
                } catch (e) {
                    // Silent fail - this is just a keepalive
                }
            }, 30000); // Every 30 seconds
        }
        
        // Update loading UI based on traffic state
        function updateLoadingUI() {
            if (!loadingText || !loadingProgressBar) return;
            
            // Update loading text
            if (!gameLoaded) {
                loadingText.textContent = highTrafficMode
                    ? "Loading game during high traffic period..."
                    : "Loading Game...";
            }
            
            // Update progress bar color
            loadingProgressBar.style.background = highTrafficMode
                ? 'linear-gradient(to right, #e6a23c, #f0c066)' // Yellow in high traffic
                : 'linear-gradient(to right, #4a6ed3, #5a7ee5)'; // Blue in normal traffic
                
            // Make Show Game button appear sooner in high traffic mode
            if (showGameBtn && !gameLoaded) {
                if (highTrafficMode) {
                    showGameBtn.style.display = 'block';
                    showGameBtn.textContent = 'Skip Wait & Show Game Now';
                } else if (Date.now() - loadStartTime < 10000) {
                    // Only hide if we're in normal mode and haven't been loading for long
                    showGameBtn.style.display = 'none';
                }
            }
        }
        
        // Adjust verification strategy based on traffic
        function adjustVerificationStrategy() {
            // Clear any existing intervals
            clearInterval(checkVisibilityInterval);
            clearInterval(contentCheckInterval);
            
            if (gameLoaded) return; // Don't change if already loaded
            
            logDebug(`🔄 Adjusting verification strategy for ${highTrafficMode ? 'high traffic' : 'normal'} mode`);
            
            // Set check frequency based on traffic mode
            const checkFrequency = highTrafficMode ? 800 : 300; // Slower checks in high traffic
            
            // Start checking for iframe visibility
            checkVisibilityInterval = setInterval(checkIframeVisibility, checkFrequency);
        }
        
        // Function to focus the game
        function focusGame() {
            if (!iframe) return;
            
            iframe.focus();
            
            // Visual feedback
            const tempHighlight = document.createElement('div');
            tempHighlight.style.position = 'absolute';
            tempHighlight.style.top = '0';
            tempHighlight.style.left = '0';
            tempHighlight.style.width = '100%';
            tempHighlight.style.height = 'calc(100% - 40px)';
            tempHighlight.style.border = '2px solid rgba(100, 180, 255, 0.8)';
            tempHighlight.style.borderRadius = '22px 22px 0 0';
            tempHighlight.style.boxShadow = 'inset 0 0 20px rgba(100, 180, 255, 0.3)';
            tempHighlight.style.pointerEvents = 'none';
            tempHighlight.style.zIndex = '4';
            document.querySelector('.game_container').appendChild(tempHighlight);
            
            // Remove the highlight after a short delay
            setTimeout(function() {
                tempHighlight.style.opacity = '0';
                tempHighlight.style.transition = 'opacity 0.5s ease';
                
                setTimeout(function() {
                    if (document.body.contains(tempHighlight)) {
                        tempHighlight.remove();
                    }
                }, 500);
            }, 300);
        }
        
        // Reload game function with retry reset
        function reloadGame() {
            logDebug("🔄 Manually reloading game...");
            
            gameLoaded = false;
            gameTrueContentLoaded = false;
            
            // Clear any intervals
            clearInterval(checkVisibilityInterval);
            clearInterval(contentCheckInterval);
            clearInterval(progressUpdateInterval);
            
            // Hide any warnings
            if (gameContentWarning) gameContentWarning.style.display = 'none';
            if (reloadOverlay) reloadOverlay.classList.remove('visible');
            
            if (loadingScreen) loadingScreen.style.display = 'flex';
            if (showGameBtn) showGameBtn.style.display = 'none';
            if (loadingText) loadingText.textContent = highTrafficMode ? 
                "Reloading game during high traffic..." : 
                "Reloading Game...";
            if (focusButton) focusButton.style.display = 'none';
            
            // Reset retry counter
            retryCount = 0;
            loadVerificationAttempts = 0;
            
            // Hide retry button if visible
            const retryBtn = document.querySelector('.retry-button');
            if (retryBtn) {
                retryBtn.style.display = 'none';
            }
            
            // Reset iframe
            if (iframe) iframe.src = 'about:blank';
            
            // Record load start time
            loadStartTime = Date.now();
            
            // Reset progress bar
            if (loadingProgressBar) loadingProgressBar.style.width = '0%';
            
            // Load game after short delay
            setTimeout(() => {
                loadGame(originalGameUrl || getGameUrlFromParams());
            }, 300);
        }
        
        // Toggle fullscreen function
        function toggleFullScreen() {
            logDebug("🖥️ Toggling fullscreen mode");
            
            if (!document.fullscreenElement) {
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) {
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) {
                    iframe.msRequestFullscreen();
                }
                
                // Focus the iframe after going fullscreen
                setTimeout(focusGame, 100);
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        // Helper function to get game URL from query parameters
        function getGameUrlFromParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('game');
        }
        
        // Helper function to estimate game size based on URL patterns
        function getEstimatedGameSize(url) {
            // Default to medium if we can't determine
            if (!url) return 'medium';
            
            // Check URL for keywords that might indicate size
            const urlLower = url.toLowerCase();
            
            // URLs containing indicators of large games
            if (urlLower.includes('minecraft') || 
                urlLower.includes('3d') || 
                urlLower.includes('unity') ||
                urlLower.includes('webgl') ||
                urlLower.includes('large')) {
                return 'large';
            }
            
            // URLs containing indicators of small games
            if (urlLower.includes('simple') || 
                urlLower.includes('lite') || 
                urlLower.includes('basic') ||
                urlLower.includes('tiny')) {
                return 'small';
            }
            
            // Default to medium for everything else
            return 'medium';
        }
        
        // Enhanced loading progress calculation
        function updateLoadingProgress() {
            if (!loadingProgressBar) return;
            
            // Calculate elapsed time as percentage of expected load time
            const timeElapsed = Date.now() - loadStartTime;
            
            // Get estimated game size
            const gameUrl = iframe ? iframe.src : originalGameUrl;
            const gameSize = getEstimatedGameSize(gameUrl);
            
            // Base expected load times adjusted for traffic mode
            let expectedLoadTime = highTrafficMode ? 20000 : 12000; // Medium: 12s normal, 20s high traffic
            
            if (gameSize === 'small') {
                expectedLoadTime = highTrafficMode ? 12000 : 6000;
            } else if (gameSize === 'large') {
                expectedLoadTime = highTrafficMode ? 35000 : 25000;
            }
            
            // Adjust for connection and device
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowConnection = connection && 
                                   (connection.effectiveType === 'slow-2g' || 
                                    connection.effectiveType === '2g' ||
                                    connection.effectiveType === '3g');
                                    
            const isSlowDevice = window.navigator.hardwareConcurrency < 4 || 
                             /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // Adjust expected time based on conditions
            const trafficFactor = highTrafficMode ? 2.0 : 1.0;
            const connectionFactor = isSlowConnection ? 2.5 : 1.0;
            const deviceFactor = isSlowDevice ? 1.8 : 1.0;
            
            expectedLoadTime *= trafficFactor * connectionFactor * deviceFactor;
            
            // Calculate progress percentage with non-linear curve
            let progressPercent = Math.min(100, (timeElapsed / expectedLoadTime) * 100);
            
            // Non-linear progress (faster at start, slower near end)
            progressPercent = Math.pow(progressPercent / 100, 0.7) * 100;
            
            // Add small randomness (less in high traffic mode)
            const randomFactor = Math.random() * (highTrafficMode ? 2 : 5) - (highTrafficMode ? 1 : 2.5);
            progressPercent = Math.max(0, Math.min(99, progressPercent + randomFactor));
            
            // Set progress bar width
            loadingProgressBar.style.width = `${progressPercent}%`;
            
            // Show percentage in high traffic mode
            if (highTrafficMode && loadingText) {
                if (progressPercent < 99 && !gameTrueContentLoaded) {
                    loadingText.textContent = `Loading game during high traffic... (${Math.floor(progressPercent)}%)`;
                }
            }
            
            // Never reach 100% until game is actually loaded
            if (progressPercent > 90 && !gameTrueContentLoaded) {
                loadingProgressBar.style.width = '90%';
            }
            
            // If game loaded, set to 100%
            if (gameTrueContentLoaded) {
                loadingProgressBar.style.width = '100%';
            }
        }
        
        // Start progress bar updates
        function startProgressUpdates() {
            // Clear any existing interval
            clearInterval(progressUpdateInterval);
            
            // Update frequency based on traffic mode
            const updateInterval = highTrafficMode ? 200 : 100; // Less frequent in high traffic
            
            progressUpdateInterval = setInterval(() => {
                updateLoadingProgress();
                
                // Stop updating if game loaded
                if (gameTrueContentLoaded) {
                    clearInterval(progressUpdateInterval);
                    // Final update to 100%
                    if (loadingProgressBar) loadingProgressBar.style.width = '100%';
                }
            }, updateInterval);
        }
        
        // Enhanced iframe visibility check with traffic awareness
        function checkIframeVisibility() {
            try {
                // Skip if iframe has no source
                if (!iframe || !iframe.src || iframe.src === 'about:blank') {
                    return;
                }
                
                // Calculate time elapsed since loading started
                const timeElapsed = Date.now() - loadStartTime;
                
                // Method 1: Try to detect content ready state
                try {
                    if (iframe.contentWindow && iframe.contentWindow.document.readyState === 'complete') {
                        logDebug(`✅ Document complete after ${Math.floor(timeElapsed/1000)}s`);
                        
                        // In high traffic mode, need more verification before showing
                        if (highTrafficMode) {
                            loadVerificationAttempts++;
                            
                            // Require multiple successful checks in high traffic mode
                            const requiredAttempts = 3;
                            if (loadVerificationAttempts >= requiredAttempts) {
                                logDebug(`✅ High traffic verification complete (${loadVerificationAttempts} attempts)`);
                                setTimeout(hideLoadingScreen, 500);
                            }
                        } else {
                            // Normal traffic - proceed faster but still verify content
                            setTimeout(hideLoadingScreen, 500);
                        }
                        return;
                    }
                } catch (e) {
                    // CORS error expected - don't log
                }
                
                // Method 2: Adaptive time-based detection with traffic awareness
                // Calculate adaptive wait time
                const baseWaitTime = highTrafficMode ? 15000 : 10000; // Higher base in high traffic
                
                // Adjust for estimated game size
                const gameSize = getEstimatedGameSize(iframe.src);
                let sizeAdjustment = 0;
                if (gameSize === 'large') {
                    sizeAdjustment = highTrafficMode ? 15000 : 8000;
                } else if (gameSize === 'medium') {
                    sizeAdjustment = highTrafficMode ? 8000 : 4000;
                }
                
                // Adjust for device and connection
                const isSlowDevice = window.navigator.hardwareConcurrency < 4 || 
                                    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                const isSlowConnection = connection && 
                                        (connection.effectiveType === 'slow-2g' || 
                                         connection.effectiveType === '2g' ||
                                         connection.effectiveType === '3g');
                
                // Calculate device adjustment
                let deviceAdjustment = 0;
                if (isSlowDevice) deviceAdjustment += highTrafficMode ? 10000 : 5000;
                if (isSlowConnection) deviceAdjustment += highTrafficMode ? 15000 : 8000;
                
                // Calculate total wait time
                const totalWaitTime = baseWaitTime + sizeAdjustment + deviceAdjustment;
                
                // After enough time has passed, move to content verification
                if (timeElapsed > totalWaitTime) {
                    logDebug(`⌛ Adaptive time-based detection triggered after ${Math.floor(timeElapsed/1000)}s`);
                    hideLoadingScreen();
                    return;
                }
                
                // Update loading text with more info in high traffic mode
                if (highTrafficMode && loadingText && timeElapsed > 10000 && !gameLoaded) {
                    loadingText.textContent = `Still loading during high traffic... (${Math.floor(timeElapsed/1000)}s)`;
                } else if (loadingText && timeElapsed > 10000 && !gameLoaded) {
                    loadingText.textContent = `Still loading... (${Math.floor(timeElapsed/1000)}s)`;
                }
            } catch (e) {
                logDebug(`❌ Error checking visibility: ${e.message}`);
            }
        }
        
        // Improved function to hide loading screen with robust content verification
        function hideLoadingScreen() {
            if (gameLoaded) return;
            
            // DON'T HIDE YET - just mark as ready to hide
            gameLoaded = true;
            clearInterval(checkVisibilityInterval);
            
            // IMPORTANT FIX: Don't hide the loading screen immediately
            // Instead, wait for actual content to be verified
            startContentVerification();
            
            // Focus the iframe even while loading screen is still showing
            setTimeout(focusGame, 500);
        }
        
        // Enhanced content verification that controls when loading screen hides
        function startContentVerification() {
            logDebug("🔍 Starting robust content verification");
            
            // Create more thorough verification process
            const verificationAttempts = highTrafficMode ? 20 : 15;
            const verificationInterval = highTrafficMode ? 1000 : 700;
            
            let attempts = 0;
            let contentFound = false;
            
            // Clear any existing interval
            clearInterval(contentCheckInterval);
            
            // Start a new interval
            contentCheckInterval = setInterval(() => {
                attempts++;
                
                try {
                    // Check for ACTUAL game content in several ways
                    if (iframe && iframe.contentWindow) {
                        let hasContent = false;
                        
                        try {
                            // Check if iframe has loaded something
                            if (iframe.contentWindow.document) {
                                const iframeDoc = iframe.contentWindow.document;
                                
                                if (iframeDoc.body) {
                                    // Method 1: Look for interactive elements
                                    const hasInteractiveElements = 
                                        iframeDoc.querySelectorAll('canvas, video, iframe, button, a[href], input, #game, #gameContainer, .game-container').length > 0;
                                        
                                    // Method 2: Check for substantial content
                                    const hasSubstantialDOM = 
                                        iframeDoc.body.innerHTML && 
                                        iframeDoc.body.innerHTML.length > 1000 &&
                                        iframeDoc.querySelectorAll('div, img, svg').length > 15;
                                        
                                    // Method 3: Check for visible pixels (most reliable)
                                    let hasVisibleContent = false;
                                    const visibleElements = Array.from(iframeDoc.querySelectorAll('*')).filter(el => {
                                        const style = window.getComputedStyle(el);
                                        return style.display !== 'none' && 
                                              style.visibility !== 'hidden' && 
                                              style.opacity !== '0' &&
                                              el.offsetWidth > 50 && 
                                              el.offsetHeight > 50;
                                    });
                                    
                                    hasVisibleContent = visibleElements.length > 5;
                                    
                                    hasContent = hasInteractiveElements || hasSubstantialDOM || hasVisibleContent;
                                }
                            }
                        } catch (e) {
                            // Expected CORS error - use more basic detection
                            try {
                                // Fallback for CORS-restricted iframes: check if the iframe has dimensions
                                hasContent = iframe.contentDocument !== null || 
                                            (iframe.clientHeight > 0 && iframe.contentWindow.length > 0);
                            } catch (e2) {
                                // Silent fail
                            }
                        }
                        
                        if (hasContent) {
                            contentFound = true;
                            logDebug('✅ Game content verified!');
                            gameTrueContentLoaded = true;
                            
                            // NOW actually hide the loading screen
                            if (loadingScreen) loadingScreen.style.display = 'none';
                            
                            clearInterval(contentCheckInterval);
                            
                            // Hide any warnings
                            if (gameContentWarning) gameContentWarning.style.display = 'none';
                            return;
                        }
                    }
                } catch (e) {
                    logDebug(`❌ Error in content verification: ${e.message}`);
                }
                
                // Show warning after several failed attempts
                if (!contentFound && attempts >= (highTrafficMode ? 5 : 3)) {
                    if (gameContentWarning) gameContentWarning.style.display = 'block';
                }
                
                // Special fix: After 50% of verification attempts, 
                // check if we should force-hide the loading screen
                if (!contentFound && attempts >= verificationAttempts / 2) {
                    // Look for any signs of activity in the iframe
                    try {
                        if (iframe && iframe.contentWindow) {
                            // If we've loaded something that's not about:blank
                            if (iframe.contentWindow.location.href !== 'about:blank') {
                                // And it's been more than 5 seconds since loading started
                                if (Date.now() - loadStartTime > 5000) {
                                    // Force hide the loading screen
                                    logDebug('⚠️ Forcing loading screen hide after partial verification');
                                    if (loadingScreen) loadingScreen.style.display = 'none';
                                    gameTrueContentLoaded = true;
                                    clearInterval(contentCheckInterval);
                                    return;
                                }
                            }
                        }
                    } catch (e) {
                        // CORS error expected - ignore
                    }
                }
                
                // Show reload overlay after max attempts
                if (!contentFound && attempts >= verificationAttempts) {
                    clearInterval(contentCheckInterval);
                    
                    // Hide warning
                    if (gameContentWarning) gameContentWarning.style.display = 'none';
                    
                    // Show reload overlay
                    if (reloadOverlay) {
                        reloadOverlay.classList.add('visible');
                    }
                    
                    // Last resort: force hide the loading screen
                    if (loadingScreen) loadingScreen.style.display = 'none';
                }
            }, verificationInterval);
        }
        
        // Create retry button function
        function createRetryButton() {
            // Remove any existing retry button
            const existingBtn = document.querySelector('.retry-button');
            if (existingBtn) {
                existingBtn.remove();
            }
            
            // Create new retry button with direct link to original URL
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-button';
            retryBtn.textContent = highTrafficMode ? 
                'Game slow? Click to retry' : 
                'Game not loading? Click to retry';
            retryBtn.style.display = 'block';
            
            // Direct reload with the original URL
            retryBtn.onclick = function() {
                logDebug(`🔄 Retry button clicked - reloading original URL: ${originalGameUrl}`);
                reloadGame();
            };
            
            // Add hover effect
            retryBtn.addEventListener('mouseover', function() {
                this.style.background = 'rgba(100,100,100,0.95)';
                this.style.transform = 'scale(1.05)';
            });
            
            retryBtn.addEventListener('mouseout', function() {
                this.style.background = 'rgba(80,80,80,0.85)';
                this.style.transform = 'scale(1)';
            });
            
            // Add to body
            document.body.appendChild(retryBtn);
            
            // Auto-fade after 20 seconds
            setTimeout(() => {
                if (retryBtn.style.display !== 'none') {
                    retryBtn.style.opacity = '0.6';
                    retryBtn.style.transition = 'opacity 0.5s ease';
                }
            }, 20000);
        }
        
        // Improved game loading function with fallbacks
        function loadGame(gameUrl) {
            if (!gameUrl) {
                logDebug("❌ No game URL provided - checking URL parameters");
                gameUrl = getGameUrlFromParams();
                
                if (!gameUrl) {
                    logDebug("❌ No game URL found - redirecting to home");
                    window.location.href = '/';
                    return;
                }
            }
            
            logDebug(`🎮 Loading game: ${gameUrl}`);
            
            // Store original URL for reloads
            originalGameUrl = gameUrl;
            
            // Record load start time
            loadStartTime = Date.now();
            
            // Initialize fake game database if real one isn't available
            if (!window.GameDB || typeof window.GameDB.getRandomGames !== 'function') {
                logDebug("⚠️ GameDB not available - creating fallback");
                
                // Create a minimal fallback GameDB
                window.GameDB = window.GameDB || {};
                
                // Basic fallback games
                const fallbackGames = [
                    {
                        id: 'fallback1',
                        title: "2048",
                        imgSrc: "/img/gameimg/2048.jpg",
                        link: "/uv/service/aHR0cHM6Ly9wbGF5MjA0OC5jbw=="
                    },
                    {
                        id: 'fallback2',
                        title: "Slope",
                        imgSrc: "/img/gameimg/slope.jpg", 
                        link: "/uv/service/aHR0cHM6Ly9zbG9wZS1nYW1lLmNvbQ=="
                    },
                    {
                        id: 'fallback3',
                        title: "Tetris",
                        imgSrc: "/img/gameimg/tetris.jpg",
                        link: "/uv/service/aHR0cHM6Ly90ZXRyaXMuY29tL3BsYXktdGV0cmlz"
                    }
                ];
                
                // Add fallback functions
                window.GameDB.getRandomGames = function(currentUrl, count = 3) {
                    // Return random games excluding current game
                    return fallbackGames
                        .filter(game => game.link !== currentUrl)
                        .sort(() => Math.random() - 0.5)
                        .slice(0, count);
                };
                
                window.GameDB.getGameByUrl = function(url) {
                    return fallbackGames.find(game => game.link === url);
                };
                
                // Add additional GameDB methods if needed
                window.GameDB.shuffleArray = function(array) {
                    return [...array].sort(() => Math.random() - 0.5);
                };
            }
            
            // Record the game in stats system if available
            if (window.GameDB && window.GlobalGameStats) {
                const gameInfo = window.GameDB.getGameByUrl(gameUrl);
                if (gameInfo) {
                    // Record play and update popularity
                    window.GlobalGameStats.recordUserPlay(gameInfo.id);
                    window.GlobalGameStats.updatePopularityFactor(gameInfo.id, 0.5);
                    logDebug(`ℹ️ Loaded game: ${gameInfo.title} (ID: ${gameInfo.id})`);
                }
            }
            
            // Start progress updates
            startProgressUpdates();
            
            // Set iframe src to load game
            if (iframe) {
                // Make sure the loading screen is visible
                if (loadingScreen) loadingScreen.style.display = 'flex';
                
                // Start with a brief delay to ensure everything is ready
                setTimeout(() => {
                    iframe.src = gameUrl;
                    
                    // Start checking for game visibility
                    adjustVerificationStrategy();
                    
                    // Load game suggestions
                    setTimeout(loadGameSuggestions, 500);
                    
                    // Show "Show Game" button after dynamic time
                    const showButtonDelay = highTrafficMode ? 5000 : 10000;
                    setTimeout(() => {
                        if (showGameBtn && !gameLoaded) {
                            showGameBtn.style.display = 'block';
                        }
                    }, showButtonDelay);
                }, 100);
            }
        }
        
        // Improved game suggestions loading
        function loadGameSuggestions() {
            const suggestionsElement = document.getElementById('gameSuggestions');
            if (!suggestionsElement) return;
            
            try {
                // Get random games for suggestions
                let randomGames;
                
                if (window.GameDB && typeof window.GameDB.getRandomGames === 'function') {
                    randomGames = window.GameDB.getRandomGames(originalGameUrl, 3);
                } else {
                    // Fallback in case getRandomGames is not available
                    randomGames = [
                        {
                            id: 'fallback1',
                            title: "2048",
                            imgSrc: "/img/gameimg/2048.jpg",
                            link: "/uv/service/aHR0cHM6Ly9wbGF5MjA0OC5jbw=="
                        },
                        {
                            id: 'fallback2',
                            title: "Slope",
                            imgSrc: "/img/gameimg/slope.jpg", 
                            link: "/uv/service/aHR0cHM6Ly9zbG9wZS1nYW1lLmNvbQ=="
                        },
                        {
                            id: 'fallback3',
                            title: "Tetris",
                            imgSrc: "/img/gameimg/tetris.jpg",
                            link: "/uv/service/aHR0cHM6Ly90ZXRyaXMuY29tL3BsYXktdGV0cmlz"
                        }
                    ].filter(game => game.link !== originalGameUrl);
                }
                
                // Clear loading state
                suggestionsElement.innerHTML = '';
                
                if (!randomGames || randomGames.length === 0) {
                    suggestionsElement.innerHTML = `
                        <div style="text-align:center; padding:20px; color:#aaa;">
                            No game suggestions available
                        </div>
                    `;
                    return;
                }
                
                // Add each game as a suggestion
                randomGames.forEach(game => {
                    // Create suggestion element
                    const suggestionElement = document.createElement('div');
                    suggestionElement.className = 'suggestion_item';
                    suggestionElement.setAttribute('data-game-id', game.id || 'unknown');
                    
                    suggestionElement.innerHTML = `
                        <div class="suggestion_icon">
                            <img src="${game.imgSrc || '/img/gameimg/default.png'}" alt="${game.title} icon" onerror="this.src='/img/gameimg/default.png'">
                        </div>
                        <div class="suggestion_info">
                            <h4 class="suggestion_title">${game.title || 'Unknown Game'}</h4>
                            <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 5px;">
                                <button class="suggestion_play">
                                    <svg class="suggestion_play_icon" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z" fill="currentColor"/>
                                    </svg>
                                    Play
                                </button>
                            </div>
                        </div>
                    `;
                    
                    // Add click handler to load the game
                    suggestionElement.addEventListener('click', function() {
                        loadSuggestedGame(game);
                    });
                    
                    suggestionsElement.appendChild(suggestionElement);
                });
            } catch (error) {
                logDebug(`❌ Error loading game suggestions: ${error.message}`);
                
                // Show error message in suggestions area
                suggestionsElement.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#aaa;">
                        Unable to load game suggestions
                    </div>
                `;
            }
        }
        
        /**
         * Load a suggested game
         * @param {Object} game Game object with id, title, and link
         */
        function loadSuggestedGame(game) {
            // Skip if the link is invalid
            if (!game.link || game.link === '#') {
                console.warn("Cannot load game with invalid link:", game);
                return;
            }
            
            // Record play and update popularity if GameDB is available
            if (window.GlobalGameStats && game.id) {
                window.GlobalGameStats.recordUserPlay(game.id);
                window.GlobalGameStats.updatePopularityFactor(game.id, 0.5);
            }
            
            logDebug(`🎮 Loading suggested game: ${game.title}`);
            
            // Show loading screen
            gameLoaded = false;
            gameTrueContentLoaded = false;
            
            // Clear any intervals
            clearInterval(checkVisibilityInterval);
            clearInterval(contentCheckInterval);
            clearInterval(progressUpdateInterval);
            
            // Hide any warnings
            if (gameContentWarning) gameContentWarning.style.display = 'none';
            if (reloadOverlay) reloadOverlay.classList.remove('visible');
            
            if (loadingScreen) loadingScreen.style.display = 'flex';
            if (showGameBtn) showGameBtn.style.display = 'none';
            if (loadingText) {
                loadingText.textContent = highTrafficMode ? 
                    "Loading game during high traffic period..." : 
                    "Loading Game...";
            }
            if (focusButton) focusButton.style.display = 'none';
            
            // Reset retry counter
            retryCount = 0;
            loadVerificationAttempts = 0;
            
            // Hide retry button if visible
            const retryBtn = document.querySelector('.retry-button');
            if (retryBtn) {
                retryBtn.style.display = 'none';
            }
            
            // Reset iframe
            if (iframe) iframe.src = 'about:blank';
            
            // Reset progress bar
            if (loadingProgressBar) loadingProgressBar.style.width = '0%';
            
            // Update loading UI based on traffic state
            updateLoadingUI();
            
            // Use setTimeout to ensure the loading screen appears before navigating
            setTimeout(function() {
                // Update original game URL to the new game
                originalGameUrl = game.link;
                
                // In high traffic mode, add a small random delay
                if (highTrafficMode) {
                    const randomDelay = Math.floor(Math.random() * 1000); // 0-1 second random delay
                    
                    setTimeout(() => {
                        if (iframe) iframe.src = game.link;
                        
                        // Update URL without page reload
                        const urlParams = new URLSearchParams(window.location.search);
                        urlParams.set('game', game.link);
                        const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
                        window.history.pushState({ path: newUrl }, '', newUrl);
                        
                        // Record load start time
                        loadStartTime = Date.now();
                        
                        // Start progress updates
                        startProgressUpdates();
                        
                        // Adjust verification strategy
                        adjustVerificationStrategy();
                        
                        // Refresh game suggestions after a delay
                        setTimeout(loadGameSuggestions, 1000);
                    }, randomDelay);
                } else {
                    // Normal mode - load immediately
                    if (iframe) iframe.src = game.link;
                    
                    // Update URL without page reload
                    const urlParams = new URLSearchParams(window.location.search);
                    urlParams.set('game', game.link);
                    const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
                    window.history.pushState({ path: newUrl }, '', newUrl);
                    
                    // Record load start time
                    loadStartTime = Date.now();
                    
                    // Start progress updates
                    startProgressUpdates();
                    
                    // Adjust verification strategy
                    adjustVerificationStrategy();
                    
                    // Refresh game suggestions
                    setTimeout(loadGameSuggestions, 500);
                }
            }, 100);
        }
        
        /**
         * Initialize when DOM is ready
         */
        document.addEventListener('DOMContentLoaded', function() {
            logDebug("🎮 Game loader initializing...");
            
            // Get DOM elements
            iframe = document.getElementById('gframe');
            loadingScreen = document.getElementById('loadingScreen');
            loadingText = document.getElementById('loadingText');
            loadingProgressBar = document.getElementById('loadingProgressBar');
            showGameBtn = document.getElementById('showGameBtn');
            focusButton = document.getElementById('focusButton');
            gameContentWarning = document.getElementById('gameContentWarning');
            reloadOverlay = document.getElementById('reloadOverlay');
            trafficIndicator = document.getElementById('trafficIndicator');
            
            if (!iframe) {
                console.error("Critical element missing: iframe (gframe)");
                return; // Can't continue without an iframe
            }
            
            // Store the original game URL right at initialization
            originalGameUrl = getGameUrlFromParams();
            logDebug(`📝 Original game URL stored at initialization: ${originalGameUrl}`);
            
            // Initialize event listeners
            initializeEventListeners();
            
            // Setup service worker messaging for high traffic detection
            setupServiceWorkerMessaging();
            
            // Start loading the game
            loadGame(originalGameUrl);
        });
        
        /**
         * Set up all event listeners
         */
        function initializeEventListeners() {
            logDebug("🔧 Setting up event listeners");
            
            // Handle iframe load event
            if (iframe) {
                iframe.addEventListener('load', function() {
                    // Store load time
                    iframe.dataset.loadTime = Date.now();
                    logDebug("✅ Iframe load event fired");
                    
                    // Extra wait after load event to give the game more time to render
                    setTimeout(function() {
                        if (!gameLoaded) {
                            if (loadingText) {
                                loadingText.textContent = highTrafficMode ?
                                    "Game content preparing during high traffic..." : 
                                    "Almost ready...";
                            }
                            logDebug("⌛ Post-load waiting period");
                        }
                    }, 1500);
                });
            }
            
            // Show Game button click handler
            if (showGameBtn) {
                showGameBtn.addEventListener('click', function() {
                    logDebug("👆 Show Game button clicked");
                    hideLoadingScreen();
                });
            }
            
            // Focus button click handler
            if (focusButton) {
                focusButton.addEventListener('click', function() {
                    logDebug("👆 Focus button clicked");
                    focusGame();
                });
            }
            
            // Setup reload button handler in content warning
            const reloadBtn = document.getElementById('reloadBtn');
            if (reloadBtn) {
                reloadBtn.addEventListener('click', function() {
                    logDebug("👆 Content warning reload button clicked");
                    reloadGame();
                });
            }
            
            // Setup overlay reload button
            const overlayReloadBtn = document.getElementById('overlayReloadBtn');
            if (overlayReloadBtn) {
                overlayReloadBtn.addEventListener('click', function() {
                    logDebug("👆 Overlay reload button clicked");
                    reloadGame();
                });
            }
            
            // Global event listener for clicks in the game container
            const gameContainer = document.querySelector('.game_container');
            if (gameContainer) {
                gameContainer.addEventListener('click', function(e) {
                    // Don't auto-focus if clicking buttons or other interactive elements
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'IMG') {
                        focusGame();
                    }
                });
            }
            
            // Add keyboard listener to refocus iframe if keyboard used while not focused
            document.addEventListener('keydown', function(e) {
                // If a key is pressed and the iframe is not focused, focus it
                if (iframe && document.activeElement !== iframe) {
                    focusGame();
                }
            });
            
            // Error handling for iframe
            if (iframe) {
                iframe.onerror = function(e) {
                    logDebug(`❌ Iframe error: ${e.message || 'Unknown error'}`);
                };
            }
            
            // Add message event listener for iframe communication
            window.addEventListener('message', function(event) {
                // Check for game ready message
                if (event.data && event.data.type === 'GAME_READY') {
                    logDebug("✅ Received GAME_READY message from iframe");
                    gameTrueContentLoaded = true;
                    
                    // Ensure loading screen is hidden
                    if (loadingScreen) loadingScreen.style.display = 'none';
                }
                
                // Check for high traffic mode updates
                if (event.data && event.data.type === 'HIGH_TRAFFIC_MODE') {
                    const isHighTraffic = event.data.enabled;
                    if (isHighTraffic !== highTrafficMode) {
                        highTrafficMode = isHighTraffic;
                        if (trafficIndicator) {
                            trafficIndicator.style.display = isHighTraffic ? 'block' : 'none';
                        }
                        updateLoadingUI();
                    }
                }
            });
            
            logDebug("✅ Event listeners initialized");
        }
    </script>
