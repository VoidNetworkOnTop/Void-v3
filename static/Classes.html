    <!-- Global Game Stats Script -->
    <script>
        /**
         * GlobalGameStats - A module for tracking and simulating global game play statistics
         * 
         * This module provides a combination of:
         * 1. Real user interaction tracking (stored in localStorage)
         * 2. Simulated global statistics that appear consistent across all users
         * 3. Time-based increments to simulate ongoing play by other users
         */
        const GlobalGameStats = {
            // Storage keys
            USER_PLAYS_KEY: 'user_game_plays',
            LAST_UPDATE_KEY: 'global_stats_last_update',
            
            // Base popularity factors (higher = more popular)
            popularityFactors: {},
            
            // Initial base counts (as of a specific reference date)
            // Reference date: January 1, 2023
            referenceDate: new Date(2023, 0, 1).getTime(),
            baseCounts: {},
            
            /**
             * Initialize the game statistics system
             * Sets default values for any uninitialized games
             * @param {Array} gameList - List of game objects with id properties
             */
            initialize: function(gameList) {
                // Initialize user plays if not present
                let userPlays = this.getUserPlays();
                let updated = false;
                
                // Ensure we have default popularity factors for all games
                if (gameList && gameList.length > 0) {
                    gameList.forEach(game => {
                        const id = game.id || this.createIdFromTitle(game.title);
                        
                        // Set default popularity factor if not present
                        if (!this.popularityFactors[id]) {
                            // Assign a random popularity between 1.0 and 3.5 for new games
                            this.popularityFactors[id] = 1.0 + (Math.random() * 2.5);
                        }
                        
                        // Set default base count if not present
                        if (!this.baseCounts[id]) {
                            // Random base count between 1000 and 4000 for new games
                            this.baseCounts[id] = Math.floor(1000 + (Math.random() * 3000));
                        }
                        
                        // Initialize user plays counter if not present
                        if (userPlays[id] === undefined) {
                            userPlays[id] = 0;
                            updated = true;
                        }
                    });
                }
                
                // Save user plays if updated
                if (updated) {
                    this.saveUserPlays(userPlays);
                }
                
                // Update the last update timestamp if not present
                if (!localStorage.getItem(this.LAST_UPDATE_KEY)) {
                    localStorage.setItem(this.LAST_UPDATE_KEY, Date.now().toString());
                }
                
                console.log('Global game stats initialized');
                
                // Return this for chaining
                return this;
            },
            
            /**
             * Create a simple ID from a game title
             * @param {string} title Game title
             * @returns {string} Simple ID
             */
            createIdFromTitle: function(title) {
                return title.toLowerCase()
                    .replace(/[^a-z0-9]+/g, '') // Remove non-alphanumeric chars
                    .replace(/\s+/g, '');       // Remove spaces
            },
            
            /**
             * Get the user's personal play counts
             * @returns {Object} Object with game IDs as keys and play counts as values
             */
            getUserPlays: function() {
                const stored = localStorage.getItem(this.USER_PLAYS_KEY);
                return stored ? JSON.parse(stored) : {};
            },
            
            /**
             * Save the user's personal play counts
             * @param {Object} plays Object with game IDs as keys and play counts as values
             */
            saveUserPlays: function(plays) {
                localStorage.setItem(this.USER_PLAYS_KEY, JSON.stringify(plays));
            },
            
            /**
             * Record a play by the current user
             * @param {string} gameId ID of the game that was played
             * @returns {number} New user play count for this game
             */
            recordUserPlay: function(gameId) {
                if (!gameId) return 0;
                
                // Get current user plays
                const userPlays = this.getUserPlays();
                
                // Initialize if not present
                if (userPlays[gameId] === undefined) {
                    userPlays[gameId] = 0;
                }
                
                // Increment count
                userPlays[gameId]++;
                
                // Save updated plays
                this.saveUserPlays(userPlays);
                
                console.log(`User played ${gameId}, total user plays: ${userPlays[gameId]}`);
                
                return userPlays[gameId];
            },
            
            /**
             * Get global play count for a specific game
             * @param {string} gameId ID of the game
             * @returns {number} Simulated global play count
             */
            getGlobalPlayCount: function(gameId) {
                if (!gameId) return 0;
                
                // Get user's plays for this game
                const userPlays = this.getUserPlays();
                const userPlayCount = userPlays[gameId] || 0;
                
                // Get simulated global count
                const simulatedCount = this.getSimulatedCount(gameId);
                
                // Return simulated global count plus user's personal plays
                return simulatedCount + userPlayCount;
            },
            
            /**
             * Calculate simulated play count based on time and popularity
             * @param {string} gameId ID of the game
             * @returns {number} Simulated play count (excluding user's plays)
             */
            getSimulatedCount: function(gameId) {
                if (!gameId) return 0;
                
                // Get base count
                const baseCount = this.baseCounts[gameId] || 1000;
                
                // Get popularity factor (plays per day)
                const popularityFactor = this.popularityFactors[gameId] || 1.0;
                
                // Calculate time-based increment
                const now = Date.now();
                const daysSinceReference = (now - this.referenceDate) / (1000 * 60 * 60 * 24);
                
                // Base plays from reference date till now
                // We use a non-linear formula to simulate more realistic growth patterns
                // sqrt(days) gives slower growth over time, multiplied by daily popularity factor
                const baseTimePlays = Math.floor(Math.sqrt(daysSinceReference) * popularityFactor * 20);
                
                // Add daily variance based on day of week (more plays on weekends)
                const date = new Date(now);
                const dayOfWeek = date.getDay(); // 0 is Sunday, 6 is Saturday
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const dayFactor = isWeekend ? 1.2 : 1.0;
                
                // Add time of day variance (more plays during peak hours)
                const hour = date.getHours();
                let hourFactor = 1.0;
                
                // Peak hours: 3-5pm and 7-9pm
                if ((hour >= 15 && hour <= 17) || (hour >= 19 && hour <= 21)) {
                    hourFactor = 1.3;
                }
                // Late night/early morning: reduced activity
                else if (hour >= 1 && hour <= 5) {
                    hourFactor = 0.7;
                }
                
                // Calculate final time-based plays with variance
                const timePlays = Math.floor(baseTimePlays * dayFactor * hourFactor);
                
                // Combine base count with time-based plays
                return baseCount + timePlays;
            },
            
            /**
             * Get all global play counts for all games
             * @returns {Object} Object with game IDs as keys and global play counts as values
             */
            getAllGlobalCounts: function() {
                const counts = {};
                
                // Get all game IDs from popularity factors
                const gameIds = Object.keys(this.popularityFactors);
                
                // Calculate global count for each game
                gameIds.forEach(gameId => {
                    counts[gameId] = this.getGlobalPlayCount(gameId);
                });
                
                return counts;
            },
            
            /**
             * Get the top N most played games
             * @param {number} limit Maximum number of games to return
             * @returns {Array} Array of [gameId, count] pairs sorted by count
             */
            getTopGames: function(limit = 5) {
                // Get all global counts
                const counts = this.getAllGlobalCounts();
                
                // Convert to array of [id, count] pairs
                const countArray = Object.entries(counts);
                
                // Sort by count in descending order
                countArray.sort((a, b) => b[1] - a[1]);
                
                // Return limited number of pairs
                return countArray.slice(0, limit);
            },
            
            /**
             * Get popularity trend for a game (increasing, steady, or decreasing)
             * @param {string} gameId ID of the game
             * @returns {string} Trend: 'rising', 'steady', or 'falling'
             */
            getGameTrend: function(gameId) {
                if (!gameId) return 'steady';
                
                const popularityFactor = this.popularityFactors[gameId] || 1.0;
                
                // Simple trend calculation based on popularity factor
                if (popularityFactor >= 5.0) return 'rising';
                if (popularityFactor <= 2.0) return 'falling';
                return 'steady';
            },
            
            /**
             * Update game's popularity factor based on recent play patterns
             * This would normally use server analytics, but we'll simulate it
             * @param {string} gameId ID of the game
             * @param {number} playDelta Change in plays (positive or negative)
             */
            updatePopularityFactor: function(gameId, playDelta) {
                if (!gameId) return;
                
                const currentFactor = this.popularityFactors[gameId] || 1.0;
                
                // Calculate new factor with limits
                const newFactor = Math.max(0.5, Math.min(12.0, currentFactor + (playDelta * 0.01)));
                
                // Update factor
                this.popularityFactors[gameId] = newFactor;
                
                console.log(`Updated popularity factor for ${gameId}: ${newFactor.toFixed(2)}`);
            }
        };
    </script>

            /**
             * Load game data from external files with fallback
             * @returns {Promise} Promise that resolves when data is loaded
             */
            loadGameData: async function() {
                // Potential paths to try, in order of preference
                const possiblePaths = [
                    // Direct root paths
                    '/assets/json/games.js',
                    '/assets/json/games2.js',
                    // Static prefixed paths
                    '/static/assets/json/games.js',
                    '/static/assets/json/games2.js',
                    // Absolute root paths
                    './assets/json/games.js',
                    './assets/json/games2.js',
                    // Relative to current page
                    '../assets/json/games.js',
                    '../assets/json/games2.js',
                    // Additional potential locations
                    '/games.js',
                    '/games2.js',
                    './games.js',
                    './games2.js'
                ];
                
                // Shuffle the paths to add randomness for variety in suggestions
                const shuffledPaths = this.shuffleArray([...possiblePaths]);
                
                // Try each path until one works
                let fileContent = null;
                let successPath = null;
                
                console.log("Attempting to load game data from various possible paths...");
                
                for (const path of shuffledPaths) {
                    try {
                        console.log(`Trying: ${path}`);
                        const response = await fetch(path);
                        
                        if (response.ok) {
                            fileContent = await response.text();
                            successPath = path;
                            console.log(`✓ Successfully loaded data from: ${path}`);
                            break;
                        } else {
                            console.log(`✗ Failed to load from ${path}: ${response.status}`);
                        }
                    } catch (error) {
                        console.log(`✗ Error fetching ${path}: ${error.message}`);
                    }
                }
                
                // If we got file content, try to extract game data from it
                if (fileContent && successPath) {
                    try {
                        // Determine which pattern to use based on the filename
                        const isGames1 = successPath.includes('games.js') && !successPath.includes('games2.js');
                        const arrayName = isGames1 ? 'gamesData' : 'games2Data';
                        
                        console.log(`Extracting array '${arrayName}' from ${successPath}`);
                        
                        // Try different regex patterns to extract the array
                        // The file might be in different formats, so we try multiple patterns
                        const regexPatterns = [
                            // Standard declaration with export
                            new RegExp(`(?:const|var|let)\\s+${arrayName}\\s*=\\s*(\\[\\s\\S]*?\\])(?:;|export)`),
                            // Standard declaration without export
                            new RegExp(`(?:const|var|let)\\s+${arrayName}\\s*=\\s*(\\[\\s\\S]*?\\]);`),
                            // Alternate with different spacing
                            new RegExp(`${arrayName}\\s*=\\s*(\\[\\s\\S]*?\\]);`),
                            // Very flexible match - find any array
                            new RegExp(`(?:const|var|let)\\s+(?:${arrayName}|\\w+)\\s*=\\s*(\\[\\s\\S]*?\\]);`),
                            // Last resort - just find the first array in the file
                            /\[(\\s\\S)*?\]/
                        ];
                        
                        // Try each pattern until one works
                        let arrayData = null;
                        let matchedPattern = null;
                        
                        for (const pattern of regexPatterns) {
                            const match = fileContent.match(pattern);
                            if (match && match[1]) {
                                arrayData = match[1];
                                matchedPattern = pattern.toString();
                                break;
                            }
                        }
                        
                        if (arrayData) {
                            console.log(`✓ Successfully extracted array data using pattern: ${matchedPattern}`);
                            
                            // If array data starts with [{ and contains imgSrc/link properties, 
                            // it's likely in the right format
                            const isCorrectFormat = arrayData.trim().startsWith('[{') && 
                                                  (arrayData.includes('imgSrc') || arrayData.includes('link'));
                            
                            if (!isCorrectFormat) {
                                console.warn("Array data doesn't match expected game format");
                                console.log("Array data preview:", arrayData.substring(0, 100) + "...");
                            }
                            
                            try {
                                // Use Function constructor to safely evaluate the array
                                const gamesData = new Function('return ' + arrayData)();
                                
                                if (Array.isArray(gamesData) && gamesData.length > 0) {
                                    // Process the game data
                                    this.processGameData(gamesData);
                                    console.log(`✓ Successfully processed ${gamesData.length} games from ${successPath}`);
                                    return;
                                } else {
                                    console.error("Extracted data is not a valid array or is empty");
                                    throw new Error('Invalid array data');
                                }
                            } catch (evalError) {
                                console.error("Error evaluating array data:", evalError);
                                throw new Error('Failed to evaluate array data');
                            }
                        } else {
                            console.error("Could not find game array in file");
                            console.log("File content preview:", fileContent.substring(0, 200) + "...");
                            throw new Error('Game array not found');
                        }
                    } catch (extractError) {
                        console.error("Error extracting game data:", extractError);
                        throw new Error('Game data extraction failed');
                    }
                } else {
                    console.error("Could not load game data from any path");
                    throw new Error('All file loading attempts failed');
                }
            },

            /**
             * Create a simple ID from a game title
             * @param {string} title Game title
             * @returns {string} Simple ID
             */
            createIdFromTitle: function(title) {
                if (!title) return 'unknown-game-' + Math.floor(Math.random() * 1000);
                return title.toLowerCase()
                    .replace(/[^a-z0-9]+/g, '') // Remove non-alphanumeric chars
                    .replace(/\s+/g, '');       // Remove spaces
            },
            
            /**
             * Process game data and populate the database
             * @param {Array} gamesList List of game objects
             */
            processGameData: function(gamesList) {
                if (!gamesList || !gamesList.length) {
                    console.warn("No games list provided to process");
                    return;
                }
                
                console.log(`Processing ${gamesList.length} games...`);
                
                // Clear existing games if any (for fresh load)
                // We'll keep the existing collection if there are already games loaded
                if (Object.keys(this.games).length === 0) {
                    this.games = {};
                    this.urlMap = {};
                }
                
                // Process each game
                let processedCount = 0;
                gamesList.forEach(game => {
                    try {
                        // Skip if no title or link
                        if (!game.title || !game.link) {
                            console.warn("Skipped game with missing title or link:", game);
                            return;
                        }
                        
                        // Create an ID from the title if not present
                        const gameId = game.id || this.createIdFromTitle(game.title);
                        
                        // Store the game with its ID if not already in the collection
                        if (!this.games[gameId]) {
                            this.games[gameId] = {
                                id: gameId,
                                title: game.title,
                                imgSrc: game.imgSrc || '/gameimg/default.png', // Fallback image
                                link: game.link
                            };
                            
                            // Map URL to ID
                            this.urlMap[game.link] = gameId;
                            processedCount++;
                        }
                    } catch (error) {
                        console.error("Error processing game:", error, game);
                    }
                });
                
                console.log(`Successfully processed ${processedCount} new games. Total games: ${Object.keys(this.games).length}`);
            },
            
            /**
             * Initialize the URL map
             */
            initUrlMap: function() {
                // Build URL to ID mapping if not done during initial load
                if (Object.keys(this.urlMap).length === 0) {
                    for (const gameId in this.games) {
                        const game = this.games[gameId];
                        this.urlMap[game.link] = gameId;
                    }
                }
            },
            
            /**
             * Get a game by its URL
             * @param {string} url URL to look up
             * @returns {Object|null} Game object or null if not found
             */
            getGameByUrl: function(url) {
                // Initialize URL map if empty
                if (Object.keys(this.urlMap).length === 0) {
                    this.initUrlMap();
                }
                
                // Look up game ID by URL
                const gameId = this.urlMap[url];
                if (!gameId) return null;
                
                // Return game object
                return this.games[gameId];
            },
            
            /**
             * Get random games, excluding current game
             * @param {string} currentUrl URL of current game to exclude
             * @param {number} count Number of games to return
             * @returns {Array} Array of game objects
             */
            getRandomGames: function(currentUrl, count = 3) {
                // Initialize URL map if empty
                if (Object.keys(this.urlMap).length === 0) {
                    this.initUrlMap();
                }
                
                // Convert games object to array
                const gamesList = Object.values(this.games);
                
                // If we have fewer than 10 games, load more games (5 is our minimum fallback)
                if (gamesList.length < 10 && this.fallbackGames.length > 0) {
                    // Add fallback games that aren't already in the main list
                    for (const fallbackGame of this.fallbackGames) {
                        if (!this.games[fallbackGame.id]) {
                            this.games[fallbackGame.id] = fallbackGame;
                            this.urlMap[fallbackGame.link] = fallbackGame.id;
                        }
                    }
                    console.log(`Added fallback games. Total games now: ${Object.keys(this.games).length}`);
                }
                
                // Filter out current game if specified
                const availableGames = currentUrl
                    ? gamesList.filter(game => game.link !== currentUrl)
                    : gamesList;
                
                // Ensure we have enough games
                if (availableGames.length === 0) {
                    console.warn('No games available for suggestions');
                    return [];
                }
                
                // Get more games than requested to ensure variety
                // We'll shuffle this larger selection and then take what we need
                const gamesToSelect = Math.min(availableGames.length, count * 2);
                const shuffledGames = this.shuffleArray(availableGames);
                
                // Return the requested number of games
                return shuffledGames.slice(0, Math.min(count, shuffledGames.length));
            },
            
            /**
             * Shuffle array randomly
             * @param {Array} array Array to shuffle
             * @returns {Array} New shuffled array
             */
            shuffleArray: function(array) {
                return [...array].sort(() => Math.random() - 0.5);
            }
        };
    </script>

<body>
    <!-- Minimal header -->

    <!-- Main page content containing both game and suggestions -->
    <div class="page_content">

        <div class="game_container">

            <div class="loading-screen" id="loadingScreen">
                <div class="loading-spinner"></div>

            <div class="footer">

                </button>

                </button>

                    <img src="/nav/keyboard.png" alt="Focus Game" onerror="this.src='/nav/reload.png'">
                </button>
            </div>
        </div>
        
        <!-- Suggestions container - completely separate -->
        <div class="suggestions_container">
            <div class="suggestions_box">
                <div class="suggestions_header">
                    <h3 class="suggestions_title">More Games To Try</h3>
                </div>
                <div class="suggestions_content" id="gameSuggestions">
                    <!-- Loading state for suggestions -->
                    <div style="text-align:center; padding:20px; width:100%;">
                        <div style="width:40px; height:40px; border:3px solid rgba(100,180,255,0.2); border-top:3px solid #fff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
                        <p style="margin-top:15px; color:#aaa;">Loading game suggestions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Loading and handling script -->
    <script>
        // Define our functions in global scope first
        let iframe;
        let loadingScreen;
        let loadingText;
        let showGameBtn;
        let focusButton;
        let checkVisibilityInterval;
        let gameLoaded = false;
        
        // Function to focus the game
        function focusGame() {
            if (!iframe) {
                iframe = document.getElementById('gframe');
            }
            
            if (iframe) {
                iframe.focus();
                
                // Visual feedback
                const tempHighlight = document.createElement('div');
                tempHighlight.style.position = 'absolute';
                tempHighlight.style.top = '0';
                tempHighlight.style.left = '0';
                tempHighlight.style.width = '100%';
                tempHighlight.style.height = 'calc(100% - 40px)';
                tempHighlight.style.border = '2px solid rgba(100, 180, 255, 0.8)';
                tempHighlight.style.borderRadius = '22px 22px 0 0';
                tempHighlight.style.boxShadow = 'inset 0 0 20px rgba(100, 180, 255, 0.3)';
                tempHighlight.style.pointerEvents = 'none';
                tempHighlight.style.zIndex = '4';
                document.querySelector('.game_container').appendChild(tempHighlight);
                
                // Remove the highlight after a short delay
                setTimeout(function() {
                    tempHighlight.style.opacity = '0';
                    tempHighlight.style.transition = 'opacity 0.5s ease';
                    
                    setTimeout(function() {
                        tempHighlight.remove();
                    }, 500);
                }, 300);
            }
        }
        
        // Reload game function
        function reloadGame() {
            gameLoaded = false;
            loadingScreen.style.display = 'flex';
            showGameBtn.style.display = 'none';
            loadingText.textContent = "Loading Game...";
            focusButton.style.display = 'none';
            
            // Reset iframe
            iframe.src = 'about:blank';
            
            // Load game after short delay
            setTimeout(loadGame, 100);
        }
        
        // Toggle fullscreen function
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) {
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) {
                    iframe.msRequestFullscreen();
                }
                
                // Focus the iframe after going fullscreen
                setTimeout(focusGame, 100);
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        // Load game function
        function loadGame() {
            const urlParams = new URLSearchParams(window.location.search);
            const gameUrl = urlParams.get('game');
            
            if (!gameUrl) {
                window.location.href = '/';
                return;
            }
            
            // Try to find game info and record play
            const gameInfo = GameDB.getGameByUrl(gameUrl);
            if (gameInfo) {
                // Record play and update popularity
                GlobalGameStats.recordUserPlay(gameInfo.id);
                GlobalGameStats.updatePopularityFactor(gameInfo.id, 0.5);
            }
            
            // Set iframe src to load game
            iframe.src = gameUrl;
            
            // Show "Show Game" button after 5 seconds
            setTimeout(function() {
                showGameBtn.style.display = 'block';
            }, 5000);
            
            // Start checking for visible content
            startVisibilityCheck();
        }
        
        // Start visibility check
        function startVisibilityCheck() {
            // Clear any existing interval
            clearInterval(checkVisibilityInterval);
            
            // Only start checking after an initial delay
            setTimeout(function() {
                loadingText.textContent = "Waiting for game to appear...";
                
                // Set 500ms interval to check for content
                checkVisibilityInterval = setInterval(function() {
                    checkIframeVisibility();
                }, 500);
                
                // Set max wait time - after 15 seconds, show game regardless
                setTimeout(function() {
                    if (!gameLoaded) {
                        hideLoadingScreen();
                        loadingText.textContent = "Game may still be loading...";
                    }
                }, 15000);
            }, 1500);
        }
        
        // Check iframe visibility
        function checkIframeVisibility() {
            try {
                // Check if iframe has source
                if (!iframe.src || iframe.src === 'about:blank') {
                    return;
                }
                
                // Method 1: Check if iframe reported as "complete"
                try {
                    if (iframe.contentWindow && iframe.contentWindow.document.readyState === 'complete') {
                        // Additional wait to let the game render
                        setTimeout(hideLoadingScreen, 1000);
                        return;
                    }
                } catch (e) {
                    // CORS error expected for security
                }
                
                // Method 2: Simple time-based detection
                // If iframe has loaded for 6+ seconds, assume content is there
                if (iframe.dataset.loadTime && new Date().getTime() - parseInt(iframe.dataset.loadTime) > 6000) {
                    hideLoadingScreen();
                }
            } catch (e) {
                console.log('Error checking iframe visibility:', e);
            }
        }
        
        // Hide loading screen
        function hideLoadingScreen() {
            if (gameLoaded) return;
            
            gameLoaded = true;
            loadingScreen.style.display = 'none';
            clearInterval(checkVisibilityInterval);
            
            // Focus the iframe after the game appears
            setTimeout(focusGame, 500);
            
            // Show the focus button briefly
            focusButton.style.display = 'block';
            setTimeout(function() {
                focusButton.style.display = 'none';
            }, 5000);
        }
        
        /**
         * Load game suggestions and display them
         */
        function loadGameSuggestions() {
            const suggestionsElement = document.getElementById('gameSuggestions');
            if (!suggestionsElement) return;
            
            // Get current game URL
            const urlParams = new URLSearchParams(window.location.search);
            const currentGameUrl = urlParams.get('game');
            
            // Check if we have enough games loaded
            const totalGames = Object.keys(GameDB.games).length;
            if (totalGames < 3) {
                console.warn(`Not enough games loaded (${totalGames}). Using fallback games.`);
                // Use fallback games to ensure we have suggestions
                GameDB.processGameData(GameDB.fallbackGames);
            }
            
            // Get random games for suggestions, excluding current game
            const randomGames = GameDB.getRandomGames(currentGameUrl, 3);
            
            // Clear loading state
            suggestionsElement.innerHTML = '';
            
            if (!randomGames || randomGames.length === 0) {
                suggestionsElement.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#aaa;">
                        No game suggestions available
                    </div>
                `;
                return;
            }
            
            // Add each game as a suggestion
            randomGames.forEach(game => {
                // Create suggestion element
                const suggestionElement = document.createElement('div');
                suggestionElement.className = 'suggestion_item';
                suggestionElement.setAttribute('data-game-id', game.id);
                
                // We're removing the trend indicators and player counts,
                // so we'll set trendHTML to an empty string
                let trendHTML = '';
                
                suggestionElement.innerHTML = `
                    ${trendHTML}
                    <div class="suggestion_icon">
                        <img src="${game.imgSrc}" alt="${game.title} icon">
                    </div>
                    <div class="suggestion_info">
                        <h4 class="suggestion_title">${game.title}</h4>
                        <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 5px;">
                            <button class="suggestion_play">
                                <svg class="suggestion_play_icon" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z" fill="currentColor"/>
                                </svg>
                                Play
                            </button>
                        </div>
                    </div>
                `;
                
                // Add click handler to load the game
                suggestionElement.addEventListener('click', function() {
                    loadSuggestedGame(game);
                });
                
                suggestionsElement.appendChild(suggestionElement);
            });
        }
        
        /**
         * Load a suggested game
         * @param {Object} game Game object with id, title, and link
         */
        function loadSuggestedGame(game) {
            // Record play and update popularity
            GlobalGameStats.recordUserPlay(game.id);
            GlobalGameStats.updatePopularityFactor(game.id, 0.5);
            
            // Show loading screen
            gameLoaded = false;
            loadingScreen.style.display = 'flex';
            showGameBtn.style.display = 'none';
            loadingText.textContent = "Loading Game...";
            focusButton.style.display = 'none';
            
            // Set iframe src to new game URL
            iframe.src = 'about:blank';
            
            // Use setTimeout to ensure the loading screen appears before navigating
            setTimeout(function() {
                iframe.src = game.link;
                
                // Update URL without page reload
                const urlParams = new URLSearchParams(window.location.search);
                urlParams.set('game', game.link);
                const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
                window.history.pushState({ path: newUrl }, '', newUrl);
                
                // Refresh game suggestions
                setTimeout(loadGameSuggestions, 500);
                
                // Start checking for visible content
                startVisibilityCheck();
            }, 100);
        }

        // Since we're no longer showing player counts or trends, we can remove the event listener
        
        /**
         * Initialize when DOM is ready
         */
        document.addEventListener('DOMContentLoaded', async function() {
            // Get DOM elements
            iframe = document.getElementById('gframe');
            loadingScreen = document.getElementById('loadingScreen');
            loadingText = document.getElementById('loadingText');
            showGameBtn = document.getElementById('showGameBtn');
            focusButton = document.getElementById('focusButton');
            
            // Initialize UI first for better UX
            initializeEventListeners();
            
            // Show loading message for game data
            const suggestionsElement = document.getElementById('gameSuggestions');
            if (suggestionsElement) {
                suggestionsElement.innerHTML = `
                    <div style="text-align:center; padding:20px; width:100%;">
                        <div style="width:40px; height:40px; border:3px solid rgba(100,180,255,0.2); border-top:3px solid #fff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
                        <p style="margin-top:15px; color:#aaa;">Loading game database...</p>
                    </div>
                `;
            }
            
            try {
                // Set a hard timeout for game data loading to prevent blocking
                const MAX_LOAD_TIME = 5000; // 5 seconds
                
                // Create a race between data loading and timeout
                const dataLoadResult = await Promise.race([
                    // Attempt to load external game data
                    GameDB.loadGameData().then(() => "success"),
                    
                    // Timeout after MAX_LOAD_TIME
                    new Promise(resolve => setTimeout(() => resolve("timeout"), MAX_LOAD_TIME))
                ]);
                
                if (dataLoadResult === "timeout") {
                    console.warn("Game data loading timed out - using fallback games");
                    // Use fallback games if loading times out
                    GameDB.processGameData(GameDB.fallbackGames);
                }
                
                // Initialize game statistics with the loaded games
                const gameList = Object.values(GameDB.games);
                GlobalGameStats.initialize(gameList);
                
                // Load game suggestions
                loadGameSuggestions();
                
                // Load the main game
                loadGame();
            } catch (error) {
                console.error("Failed to initialize game system:", error);
                
                // Use fallback games in case of error
                GameDB.processGameData(GameDB.fallbackGames);
                
                // Show recovery message
                if (suggestionsElement) {
                    suggestionsElement.innerHTML = `
                        <div style="text-align:center; padding:10px; color:#aaa;">
                            <p>Using backup game suggestions</p>
                        </div>
                    `;
                }
                
                // Initialize with fallback games
                const gameList = Object.values(GameDB.games);
                GlobalGameStats.initialize(gameList);
                
                // Still try to load suggestions and the game
                loadGameSuggestions();
                loadGame();
            }
        });
        
        /**
         * Set up all event listeners
         */
        function initializeEventListeners() {
            // Handle iframe load event
            iframe.addEventListener('load', function() {
                // Store load time
                iframe.dataset.loadTime = new Date().getTime();
                
                // Extra wait after load event to give the game more time to render
                setTimeout(function() {
                    if (!gameLoaded) {
                        loadingText.textContent = "Almost ready...";
                    }
                }, 1500);
            });
            
            // Show Game button click handler
            showGameBtn.addEventListener('click', function() {
                hideLoadingScreen();
            });
            
            // Focus button click handler
            focusButton.addEventListener('click', focusGame);
            
            // Global event listener for clicks in the game container
            document.querySelector('.game_container').addEventListener('click', function(e) {
                // Don't auto-focus if clicking buttons or other interactive elements
                if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'IMG') {
                    focusGame();
                }
            });
            
            // Add keyboard listener to refocus iframe if keyboard used while not focused
            document.addEventListener('keydown', function(e) {
                // If a key is pressed and the iframe is not focused, focus it
                if (document.activeElement !== iframe) {
                    focusGame();
                }
            });
        }
    </script>

    <!-- Global JavaScript -->
    <script src="/global.js"></script>
    <script src="/assets/js/favicon-handler.js"></script>
</body>
