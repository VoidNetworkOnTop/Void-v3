        .header a:hover {

        }
        
        .header a:hover .home_bttn {

            max-width: 1600px;

            margin-top: 70px; /* Space for header */

    <!-- Global Game Stats Script -->
    <script>
        /**
         * GlobalGameStats - A module for tracking and simulating global game play statistics
         */
        const GlobalGameStats = {
            // Storage keys
            USER_PLAYS_KEY: 'user_game_plays',
            LAST_UPDATE_KEY: 'global_stats_last_update',
            
            // Base popularity factors (higher = more popular)
            popularityFactors: {},
            
            // Initial base counts
            referenceDate: new Date(2023, 0, 1).getTime(),
            baseCounts: {},
            
            /**
             * Initialize the game statistics system
             */
            initialize: function(gameList) {
                // Initialize user plays if not present
                let userPlays = this.getUserPlays();
                let updated = false;
                
                // Ensure we have default popularity factors for all games
                if (gameList && gameList.length > 0) {
                    gameList.forEach(game => {
                        const id = game.id || this.createIdFromTitle(game.title);
                        
                        // Set default popularity factor if not present
                        if (!this.popularityFactors[id]) {
                            // Assign a random popularity between 1.0 and 3.5 for new games
                            this.popularityFactors[id] = 1.0 + (Math.random() * 2.5);
                        }
                        
                        // Set default base count if not present
                        if (!this.baseCounts[id]) {
                            // Random base count between 1000 and 4000 for new games
                            this.baseCounts[id] = Math.floor(1000 + (Math.random() * 3000));
                        }
                        
                        // Initialize user plays counter if not present
                        if (userPlays[id] === undefined) {
                            userPlays[id] = 0;
                            updated = true;
                        }
                    });
                }
                
                // Save user plays if updated
                if (updated) {
                    this.saveUserPlays(userPlays);
                }
                
                // Update the last update timestamp if not present
                if (!localStorage.getItem(this.LAST_UPDATE_KEY)) {
                    localStorage.setItem(this.LAST_UPDATE_KEY, Date.now().toString());
                }
                
                console.log('Global game stats initialized');
                
                // Return this for chaining
                return this;
            },
            
            /**
             * Create a simple ID from a game title
             */
            createIdFromTitle: function(title) {
                if (!title) return 'unknown-game-' + Math.floor(Math.random() * 1000);
                return title.toLowerCase()
                    .replace(/[^a-z0-9]+/g, '') // Remove non-alphanumeric chars
                    .replace(/\s+/g, '');       // Remove spaces
            },
            
            /**
             * Get the user's personal play counts
             */
            getUserPlays: function() {
                const stored = localStorage.getItem(this.USER_PLAYS_KEY);
                return stored ? JSON.parse(stored) : {};
            },
            
            /**
             * Save the user's personal play counts
             */
            saveUserPlays: function(plays) {
                localStorage.setItem(this.USER_PLAYS_KEY, JSON.stringify(plays));
            },
            
            /**
             * Record a play by the current user
             */
            recordUserPlay: function(gameId) {
                if (!gameId) return 0;
                
                // Get current user plays
                const userPlays = this.getUserPlays();
                
                // Initialize if not present
                if (userPlays[gameId] === undefined) {
                    userPlays[gameId] = 0;
                }
                
                // Increment count
                userPlays[gameId]++;
                
                // Save updated plays
                this.saveUserPlays(userPlays);
                
                console.log(`User played ${gameId}, total user plays: ${userPlays[gameId]}`);
                
                return userPlays[gameId];
            },
            
            /**
             * Get global play count for a specific game
             */
            getGlobalPlayCount: function(gameId) {
                if (!gameId) return 0;
                
                // Get user's plays for this game
                const userPlays = this.getUserPlays();
                const userPlayCount = userPlays[gameId] || 0;
                
                // Get simulated global count
                const simulatedCount = this.getSimulatedCount(gameId);
                
                // Return simulated global count plus user's personal plays
                return simulatedCount + userPlayCount;
            },
            
            /**
             * Calculate simulated play count based on time and popularity
             */
            getSimulatedCount: function(gameId) {
                if (!gameId) return 0;
                
                // Get base count
                const baseCount = this.baseCounts[gameId] || 1000;
                
                // Get popularity factor (plays per day)
                const popularityFactor = this.popularityFactors[gameId] || 1.0;
                
                // Calculate time-based increment
                const now = Date.now();
                const daysSinceReference = (now - this.referenceDate) / (1000 * 60 * 60 * 24);
                
                // Base plays from reference date till now
                // We use a non-linear formula to simulate more realistic growth patterns
                // sqrt(days) gives slower growth over time, multiplied by daily popularity factor
                const baseTimePlays = Math.floor(Math.sqrt(daysSinceReference) * popularityFactor * 20);
                
                // Add daily variance based on day of week (more plays on weekends)
                const date = new Date(now);
                const dayOfWeek = date.getDay(); // 0 is Sunday, 6 is Saturday
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const dayFactor = isWeekend ? 1.2 : 1.0;
                
                // Add time of day variance (more plays during peak hours)
                const hour = date.getHours();
                let hourFactor = 1.0;
                
                // Peak hours: 3-5pm and 7-9pm
                if ((hour >= 15 && hour <= 17) || (hour >= 19 && hour <= 21)) {
                    hourFactor = 1.3;
                }
                // Late night/early morning: reduced activity
                else if (hour >= 1 && hour <= 5) {
                    hourFactor = 0.7;
                }
                
                // Calculate final time-based plays with variance
                const timePlays = Math.floor(baseTimePlays * dayFactor * hourFactor);
                
                // Combine base count with time-based plays
                return baseCount + timePlays;
            },
            
            /**
             * Update game's popularity factor based on recent play patterns
             */
            updatePopularityFactor: function(gameId, playDelta) {
                if (!gameId) return;
                
                const currentFactor = this.popularityFactors[gameId] || 1.0;
                
                // Calculate new factor with limits
                const newFactor = Math.max(0.5, Math.min(12.0, currentFactor + (playDelta * 0.01)));
                
                // Update factor
                this.popularityFactors[gameId] = newFactor;
                
                console.log(`Updated popularity factor for ${gameId}: ${newFactor.toFixed(2)}`);
            }
        };
    </script>

            /**
             * Load game data from external files with fallback
             * This version prioritizes the /assets/json/ folder
             */
            loadGameData: async function() {
                // Prioritize the correct paths first
                const primaryPaths = [
                    // These paths will be tried first
                    '/assets/json/games2.js',
                    '/assets/json/games2.js'
                ];
                
                // Fallback paths to try if the primary paths fail
                const fallbackPaths = [
                    // Static prefixed paths
                    '/static/assets/json/games2.js',
                    '/static/assets/json/games2.js',
                    // Root directory paths (these were being found in the logs)
                    '/games.js',
                    '/games2.js',
                    // Relative paths
                    './assets/json/games2.js',
                    './assets/json/games2.js',
                    './games.js',
                    './games2.js'
                ];
                
                // Try each primary path first
                console.log("Attempting to load game data from primary paths...");
                
                for (const path of primaryPaths) {
                    try {
                        console.log(`Trying primary path: ${path}`);
                        const response = await fetch(path);
                        
                        if (response.ok) {
                            const fileContent = await response.text();
                            console.log(`✓ Successfully loaded data from: ${path}`);
                            
                            // Try to parse the file
                            return this.processFileContent(fileContent, path);
                        } else {
                            console.log(`✗ Failed to load from ${path}: ${response.status}`);
                        }
                    } catch (error) {
                        console.log(`✗ Error fetching ${path}: ${error.message}`);
                    }
                }
                
                // If primary paths fail, try fallback paths (randomized for variety)
                console.log("Primary paths failed. Trying fallback paths...");
                const shuffledFallbackPaths = this.shuffleArray([...fallbackPaths]);
                
                for (const path of shuffledFallbackPaths) {
                    try {
                        console.log(`Trying: ${path}`);
                        const response = await fetch(path);
                        
                        if (response.ok) {
                            const fileContent = await response.text();
                            console.log(`✓ Successfully loaded data from: ${path}`);
                            
                            // Try to parse the file
                            return this.processFileContent(fileContent, path);
                        } else {
                            console.log(`✗ Failed to load from ${path}: ${response.status}`);
                        }
                    } catch (error) {
                        console.log(`✗ Error fetching ${path}: ${error.message}`);
                    }
                }
                
                // If we reach here, all paths failed
                console.error("Could not load game data from any path");
                this.useFallbackGames("All file loading attempts failed");
                return;
            },
            
            /**
             * Process file content after it's loaded
             */
            processFileContent: function(fileContent, filePath) {
                try {
                    // Check if this is a UV config format file
                    const hasUvConfig = fileContent.includes('__uv$config') || 
                                        fileContent.includes('**uv$config');
                    
                    if (hasUvConfig) {
                        // Special handling for UV config format
                        console.log("Detected UV config format - using custom parser");
                        return this.parseUvConfigFormat(fileContent, filePath);
                    }
                    
                    // For standard JS files, debug the content to see what's being loaded
                    console.log(`File content preview: ${fileContent.substring(0, 100)}...`);
                    
                    // Try to parse as a standard JS file
                    return this.parseStandardJsFile(fileContent, filePath);
                } catch (error) {
                    console.error("Error processing file content:", error);
                    this.useFallbackGames("File processing error: " + error.message);
                    return;
                }
            },
            
            /**
             * Parse a file with UV config references
             */
            parseUvConfigFormat: function(fileContent, filePath) {
                console.log("Parsing UV config format file");
                
                try {
                    const games = [];
                    
                    // Find the array declaration and content
                    const arrayStart = fileContent.indexOf('[');
                    if (arrayStart === -1) {
                        throw new Error("No array found in file");
                    }
                    
                    // Find the closing bracket of the array
                    let openBrackets = 1;
                    let arrayEnd = arrayStart + 1;
                    
                    while (openBrackets > 0 && arrayEnd < fileContent.length) {
                        if (fileContent[arrayEnd] === '[') openBrackets++;
                        if (fileContent[arrayEnd] === ']') openBrackets--;
                        arrayEnd++;
                    }
                    
                    // Extract the array content
                    const arrayContent = fileContent.substring(arrayStart, arrayEnd);
                    console.log(`Found array content of length: ${arrayContent.length}`);
                    
                    // Use regex to find all game objects within the array
                    const gameObjectPattern = /\{\s*title:\s*"([^"]+)",\s*imgSrc:\s*"([^"]+)"[^}]*\}/g;
                    const matches = [...arrayContent.matchAll(gameObjectPattern)];
                    
                    console.log(`Found ${matches.length} game objects using pattern`);
                    
                    // Process each match
                    for (const match of matches) {
                        const objectText = match[0];
                        const title = match[1];
                        const imgSrc = match[2];
                        
                        // Extract the link
                        let link = '#';
                        
                        // Look for various link patterns
                        const linkPatterns = [
                            // Direct link pattern
                            /link:\s*"([^"]+)"/,
                            // UV config link pattern with encodeUrl
                            /link:.*?encodeUrl\("([^"]+)"\)/,
                            // Any URL
                            /https?:\/\/[^")\s]+/
                        ];
                        
                        // Try each pattern
                        for (const pattern of linkPatterns) {
                            const linkMatch = objectText.match(pattern);
                            if (linkMatch) {
                                if (pattern.toString().includes('link:\\s*"')) {
                                    // Direct link
                                    link = linkMatch[1];
                                } else if (pattern.toString().includes('encodeUrl')) {
                                    // UV config style link
                                    try {
                                        const originalUrl = linkMatch[1];
                                        const encodedUrl = btoa(originalUrl);
                                        link = `/uv/service/${encodedUrl}`;
                                    } catch (e) {
                                        link = '#';
                                    }
                                } else {
                                    // Raw URL
                                    try {
                                        const originalUrl = linkMatch[0];
                                        const encodedUrl = btoa(originalUrl);
                                        link = `/uv/service/${encodedUrl}`;
                                    } catch (e) {
                                        link = '#';
                                    }
                                }
                                break;
                            }
                        }
                        
                        // Create a unique ID
                        const gameId = this.createIdFromTitle(title);
                        
                        // Add the game
                        games.push({
                            id: gameId,
                            title: title,
                            imgSrc: imgSrc || `/gameimg/${gameId}.png`,
                            link: link
                        });
                    }
                    
                    console.log(`Successfully extracted ${games.length} games from UV format file`);
                    
                    if (games.length > 0) {
                        this.processGameData(games);
                        return;
                    } else {
                        throw new Error("No games could be extracted from UV format file");
                    }
                } catch (error) {
                    console.error("Error in UV config format parsing:", error);
                    return this.extractGamesManually(fileContent);
                }
            },
            
            /**
             * Parse a standard JavaScript file (no UV config references)
             */
            parseStandardJsFile: function(fileContent, filePath) {
                // Determine which array name to look for based on the filename
                const isGames1 = filePath.includes('games.js') && !filePath.includes('games2.js');
                const arrayName = isGames1 ? 'gamesData' : 'games2Data';
                
                console.log(`Attempting to extract '${arrayName}' array from standard JS file`);
                
                // Try different regex patterns to extract the array
                const regexPatterns = [
                    // Standard declaration with export
                    new RegExp(`(?:const|var|let)\\s+${arrayName}\\s*=\\s*(\\[\\s\\S]*?\\])(?:;|export)`),
                    // Standard declaration without export
                    new RegExp(`(?:const|var|let)\\s+${arrayName}\\s*=\\s*(\\[\\s\\S]*?\\]);`),
                    // More flexible patterns
                    new RegExp(`${arrayName}\\s*=\\s*(\\[\\s\\S]*?\\]);`),
                    /(?:const|var|let)\s+(?:\w+)\s*=\s*(\[\s*\{\s*(?:.*?title|.*?imgSrc|.*?link)[\s\S]*?\}\s*\])\s*;/,
                    /(\[\s*\{\s*[\s\S]*?\}\s*\])\s*;/
                ];
                
                // Try each pattern
                for (const pattern of regexPatterns) {
                    const match = fileContent.match(pattern);
                    if (match && match[1]) {
                        const arrayData = match[1];
                        console.log(`✓ Found array data using pattern: ${pattern.toString().substring(0, 30)}...`);
                        
                        try {
                            // Check if array contains UV config references
                            if (arrayData.includes('__uv$config') || arrayData.includes('**uv$config')) {
                                console.log("Array contains UV config references - using manual extraction");
                                return this.extractGamesManually(fileContent);
                            }
                            
                            // Try to evaluate the array
                            const gamesData = new Function('return ' + arrayData)();
                            
                            if (Array.isArray(gamesData) && gamesData.length > 0) {
                                console.log(`✓ Successfully evaluated array with ${gamesData.length} games`);
                                this.processGameData(gamesData);
                                return;
                            } else {
                                console.warn("Extracted data is not a valid array or is empty");
                            }
                        } catch (evalError) {
                            console.warn("Error evaluating array:", evalError);
                            // Try manual extraction as a fallback
                            return this.extractGamesManually(fileContent);
                        }
                    }
                }
                
                // If no patterns worked, try manual extraction
                console.warn("Could not extract game array with standard patterns");
                return this.extractGamesManually(fileContent);
            },
            
            /**
             * Manual extraction of games when other methods fail
             */
            extractGamesManually: function(fileContent) {
                console.log("Attempting manual extraction of games");
                
                try {
                    const games = [];
                    
                    // Look for title, imgSrc, and link patterns throughout the file
                    const titleMatches = fileContent.matchAll(/title:\s*"([^"]+)"/g);
                    const imgSrcMatches = fileContent.matchAll(/imgSrc:\s*"([^"]+)"/g);
                    const linkMatches = fileContent.matchAll(/link:[^\n]+/g);
                    
                    // Collect all titles, image sources, and links
                    const titles = Array.from(titleMatches).map(m => m[1]);
                    const imgSrcs = Array.from(imgSrcMatches).map(m => m[1]);
                    const linkTexts = Array.from(linkMatches).map(m => m[0]);
                    
                    console.log(`Found ${titles.length} titles, ${imgSrcs.length} images, ${linkTexts.length} links`);
                    
                    // Process each title (assume titles are the primary key)
                    for (let i = 0; i < titles.length; i++) {
                        const title = titles[i];
                        const imgSrc = i < imgSrcs.length ? imgSrcs[i] : null;
                        const linkText = i < linkTexts.length ? linkTexts[i] : null;
                        
                        // Create a game ID from the title
                        const gameId = this.createIdFromTitle(title);
                        
                        // Extract the actual link from the link text
                        let link = '#';
                        if (linkText) {
                            // Try different patterns
                            const directLinkMatch = linkText.match(/link:\s*"([^"]+)"/);
                            const uvLinkMatch = linkText.match(/encodeUrl\("([^"]+)"\)/);
                            
                            if (directLinkMatch) {
                                link = directLinkMatch[1];
                            } else if (uvLinkMatch) {
                                try {
                                    const originalUrl = uvLinkMatch[1];
                                    const encodedUrl = btoa(originalUrl);
                                    link = `/uv/service/${encodedUrl}`;
                                } catch (e) {
                                    link = '#';
                                }
                            }
                        }
                        
                        // Only add if we have a title
                        if (title) {
                            games.push({
                                id: gameId,
                                title: title,
                                imgSrc: imgSrc || `/gameimg/${gameId}.png`,
                                link: link
                            });
                        }
                    }
                    
                    console.log(`Manually extracted ${games.length} games`);
                    
                    if (games.length > 0) {
                        this.processGameData(games);
                        return;
                    } else {
                        throw new Error("Manual extraction found no games");
                    }
                } catch (error) {
                    console.error("Manual extraction failed:", error);
                    this.useFallbackGames("Manual extraction failed: " + error.message);
                    return;
                }
            },
            
            /**
             * Use fallback games when all other methods fail
             */
            useFallbackGames: function(reason) {
                console.warn(`Using fallback games: ${reason}`);
                this.processGameData(this.fallbackGames);
            },
            
            /**
             * Create a simple ID from a game title
             */
            createIdFromTitle: function(title) {
                if (!title) return 'unknown-game-' + Math.floor(Math.random() * 1000);
                return title.toLowerCase()
                    .replace(/[^a-z0-9]+/g, '') // Remove non-alphanumeric chars
                    .replace(/\s+/g, '');       // Remove spaces
            },
            
            /**
             * Process game data and populate the database
             */
            processGameData: function(gamesList) {
                if (!gamesList || !gamesList.length) {
                    console.warn("No games list provided to process");
                    return;
                }
                
                console.log(`Processing ${gamesList.length} games...`);
                
                // If we're starting fresh, use the whole list
                // Otherwise, add to the existing collection
                const isFirstLoad = Object.keys(this.games).length === 0;
                
                // Process each game
                let processedCount = 0;
                gamesList.forEach(game => {
                    try {
                        // Skip if no title
                        if (!game.title) {
                            console.warn("Skipped game with missing title:", game);
                            return;
                        }
                        
                        // Create an ID from the title if not present
                        const gameId = game.id || this.createIdFromTitle(game.title);
                        
                        // Only add if:
                        // 1. This is the first load, OR
                        // 2. We don't already have this game
                        if (isFirstLoad || !this.games[gameId]) {
                            this.games[gameId] = {
                                id: gameId,
                                title: game.title,
                                imgSrc: game.imgSrc || '/gameimg/default.png',
                                link: game.link || '#'
                            };
                            
                            // Map URL to ID if there's a valid link
                            if (game.link && game.link !== '#') {
                                this.urlMap[game.link] = gameId;
                            }
                            
                            processedCount++;
                        }
                    } catch (error) {
                        console.error("Error processing game:", error, game);
                    }
                });
                
                console.log(`Successfully processed ${processedCount} new games. Total games: ${Object.keys(this.games).length}`);
            },
            
            /**
             * Initialize the URL map
             */
            initUrlMap: function() {
                // Rebuild URL to ID mapping
                this.urlMap = {};
                for (const gameId in this.games) {
                    const game = this.games[gameId];
                    if (game.link && game.link !== '#') {
                        this.urlMap[game.link] = gameId;
                    }
                }
            },
            
            /**
             * Get a game by its URL
             */
            getGameByUrl: function(url) {
                // Initialize URL map if empty
                if (Object.keys(this.urlMap).length === 0) {
                    this.initUrlMap();
                }
                
                // Look up game ID by URL
                const gameId = this.urlMap[url];
                if (!gameId) return null;
                
                // Return game object
                return this.games[gameId];
            },
            
            /**
             * Get random games, excluding current game
             */
            getRandomGames: function(currentUrl, count = 3) {
                // Initialize URL map if empty
                if (Object.keys(this.urlMap).length === 0) {
                    this.initUrlMap();
                }
                
                // Convert games object to array
                const gamesList = Object.values(this.games);
                
                // If we have fewer than 10 games, add fallback games
                if (gamesList.length < 10) {
                    console.log("Adding fallback games to supplement collection");
                    this.processGameData(this.fallbackGames);
                    // Refresh the games list
                    const updatedGamesList = Object.values(this.games);
                    console.log(`Now have ${updatedGamesList.length} total games`);
                }
                
                // Get the final list of games
                const finalGamesList = Object.values(this.games);
                
                // Filter out current game if specified
                const availableGames = currentUrl
                    ? finalGamesList.filter(game => game.link !== currentUrl)
                    : finalGamesList;
                
                // Ensure we have enough games
                if (availableGames.length === 0) {
                    console.warn('No games available for suggestions');
                    return [];
                }
                
                // Shuffle all available games for randomness
                const shuffledGames = this.shuffleArray(availableGames);
                
                // Return the requested number of games
                return shuffledGames.slice(0, Math.min(count, shuffledGames.length));
            },
            
            /**
             * Shuffle array randomly
             */
            shuffleArray: function(array) {
                return [...array].sort(() => Math.random() - 0.5);
            }
        };
    </script>

        // Helper function to estimate game size based on URL patterns
        function getEstimatedGameSize(url) {
            // Default to medium if we can't determine
            if (!url) return 'medium';
            
            // Check URL for keywords that might indicate size
            const urlLower = url.toLowerCase();
            
            // URLs containing indicators of large games
            if (urlLower.includes('minecraft') || 
                urlLower.includes('3d') || 
                urlLower.includes('unity') ||
                urlLower.includes('webgl') ||
                urlLower.includes('large')) {
                return 'large';
            }
            
            // URLs containing indicators of small games
            if (urlLower.includes('simple') || 
                urlLower.includes('lite') || 
                urlLower.includes('basic') ||
                urlLower.includes('tiny')) {
                return 'small';
            }
            
            // Default to medium for everything else
            return 'medium';
        }

        // Add a connection check to adapt loading strategies
        function checkConnectionSpeed() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let connectionType = 'unknown';
            let isLowBandwidth = false;
            
            if (connection) {
                connectionType = connection.effectiveType || 'unknown';
                isLowBandwidth = connectionType === 'slow-2g' || connectionType === '2g' || connectionType === '3g';
                
                // Listen for connection changes
                connection.addEventListener('change', () => {
                    const newType = connection.effectiveType || 'unknown';
                    logDebug(`🌐 Connection changed from ${connectionType} to ${newType}`);
                    connectionType = newType;
                    isLowBandwidth = connectionType === 'slow-2g' || connectionType === '2g' || connectionType === '3g';
                });
            }
            
            logDebug(`🌐 Connection: ${connectionType}, Low Bandwidth: ${isLowBandwidth}`);
            return { connectionType, isLowBandwidth };
        }
        
        // Update the loading progress bar with simulated or real progress
        function updateLoadingProgress() {
            const progressBar = document.getElementById('loadingProgressBar');
            if (!progressBar) return;
            
            // Calculate elapsed time as percentage of expected load time
            const timeElapsed = Date.now() - loadStartTime;
            
            // Estimate game size for expected load time calculation
            const gameSize = getEstimatedGameSize(iframe.src);
            
            // Base expected load times (in ms) by size - increased for better reliability
            let expectedLoadTime = 12000; // Medium: 12 seconds (increased from 10)
            if (gameSize === 'small') expectedLoadTime = 6000; // Increased from 5
            if (gameSize === 'large') expectedLoadTime = 25000; // Increased from 20
            
            // Adjust for connection and device
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowConnection = connection && 
                                   (connection.effectiveType === 'slow-2g' || 
                                    connection.effectiveType === '2g' ||
                                    connection.effectiveType === '3g');
                                    
            const isSlowDevice = window.navigator.hardwareConcurrency < 4 || 
                                 /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isSlowConnection) expectedLoadTime *= 2.5; // Increased from 2x
            if (isSlowDevice) expectedLoadTime *= 1.8; // Increased from 1.5x
            
            // Calculate progress percentage
            let progressPercent = Math.min(100, (timeElapsed / expectedLoadTime) * 100);
            
            // Make progress non-linear (faster at start, slower near end)
            // This creates a more natural loading feel
            progressPercent = Math.pow(progressPercent / 100, 0.7) * 100;
            
            // Add randomness for more natural feel
            const randomFactor = Math.random() * 5 - 2.5; // -2.5 to +2.5
            progressPercent = Math.max(0, Math.min(99, progressPercent + randomFactor));
            
            // Set progress bar width
            progressBar.style.width = `${progressPercent}%`;
            
            // Never reach 100% until game is actually loaded
            if (progressPercent > 85 && !gameTrueContentLoaded) {
                progressBar.style.width = '85%';
            }
            
            // If game loaded, set to 100%
            if (gameTrueContentLoaded) {
                progressBar.style.width = '100%';
            }
        }
        
        // Start progress bar updates when loading begins
        function startProgressUpdates() {
            // Update every 100ms
            const progressInterval = setInterval(() => {
                updateLoadingProgress();
                
                // Stop updating if game loaded
                if (gameTrueContentLoaded) {
                    clearInterval(progressInterval);
                    // Final update to 100%
                    const progressBar = document.getElementById('loadingProgressBar');
                    if (progressBar) progressBar.style.width = '100%';
                }
            }, 100);
        }
        
        // New function to check for actual game content after loading screen hides
        function verifyGameContent() {
            if (!gameLoaded) return;
            
            logDebug("🔍 Verifying actual game content loaded...");
            
            // Keep track of content check attempts
            let contentCheckAttempts = 0;
            const maxContentCheckAttempts = 10;
            
            // Clear any existing interval
            clearInterval(contentCheckInterval);
            
            // Set up a new interval to check content periodically
            contentCheckInterval = setInterval(() => {
                contentCheckAttempts++;
                
                try {
                    // Check if iframe has visible content
                    const iframeDoc = iframe.contentWindow && 
                                      iframe.contentWindow.document;
                    
                    // Different checks for content                  
                    let hasContent = false;
                    let hasInteractiveElements = false;
                    
                    if (iframeDoc && iframeDoc.body) {
                        // Check for substantial content
                        hasContent = iframeDoc.body.innerHTML && 
                                    iframeDoc.body.innerHTML.length > 1000;
                                    
                        // Check for game-specific elements
                        hasInteractiveElements = 
                            iframeDoc.querySelectorAll('canvas, video, iframe, button, a[href], input, #game, #gameContainer, .game-container, [class*="game"], [id*="game"], [class*="unity"]').length > 0 ||
                            iframeDoc.querySelectorAll('div, img, svg').length > 15;
                    }
                    
                    if (hasContent || hasInteractiveElements) {
                        logDebug(`✅ Game content verified! Content: ${hasContent}, Elements: ${hasInteractiveElements}`);
                        gameTrueContentLoaded = true;
                        clearInterval(contentCheckInterval);
                        
                        // If we have any warning showing, hide it
                        if (gameContentWarning.style.display === 'block') {
                            gameContentWarning.style.display = 'none';
                        }
                    } else if (contentCheckAttempts >= 3 && contentCheckAttempts < maxContentCheckAttempts) {
                        // After 3 attempts, show warning but keep trying
                        if (gameContentWarning.style.display !== 'block') {
                            logDebug("⚠️ No content detected after multiple checks, showing warning");
                            gameContentWarning.style.display = 'block';
                        }
                    } else if (contentCheckAttempts >= maxContentCheckAttempts) {
                        // After max attempts, show reload overlay
                        logDebug("❌ Game content verification failed after max attempts");
                        clearInterval(contentCheckInterval);
                        
                        // Hide warning
                        gameContentWarning.style.display = 'none';
                        
                        // Show reload overlay
                        reloadOverlay.classList.add('visible');
                    }
                } catch (error) {
                    // Expected CORS error
                    logDebug(`⚠️ CORS prevented content check, assuming content loaded: ${error.message}`);
                    
                    // For CORS errors, we assume content is loaded after a certain number of attempts
                    if (contentCheckAttempts >= 5) {
                        gameTrueContentLoaded = true;
                        clearInterval(contentCheckInterval);
                    }
                }
            }, 1000); // Check every 1 second
        }
        
        // Enhanced checkIframeVisibility with better content detection
        function checkIframeVisibility() {
            try {
                // Check if iframe has source
                if (!iframe.src || iframe.src === 'about:blank') {
                    return;
                }
                
                // Calculate time elapsed since loading started
                const timeElapsed = Date.now() - loadStartTime;
                
                // Method 1: Enhanced Content Detection
                try {
                    if (iframe.contentWindow && iframe.contentWindow.document.readyState === 'complete') {
                        logDebug(`✅ Document complete after ${Math.floor(timeElapsed/1000)}s`);
                        
                        // Enhanced content detection - check for actual game content
                        try {
                            const iframeDoc = iframe.contentWindow.document;
                            
                            // More comprehensive content check looking for game-specific elements
                            const hasContent = iframeDoc.body && (
                                // Check for interactive elements - added more game-specific selectors
                                iframeDoc.body.querySelectorAll('canvas, video, iframe, button, a[href], input, #game, #gameContainer, .game-container, [class*="game"], [id*="game"], [class*="unity"]').length > 0 ||
                                // Check for substantial content - increased requirements
                                (iframeDoc.body.innerHTML.length > 1000 && 
                                 iframeDoc.body.querySelectorAll('div, img, svg').length > 10)
                            );
                            
                            // Check for visible pixels if possible
                            let hasVisualContent = false;
                            try {
                                // This will likely fail with CORS, but we try anyway
                                if (iframeDoc.body) {
                                    // Look for background colors, images or styles that indicate content
                                    const hasBgColor = iframeDoc.body.style.backgroundColor || 
                                                       getComputedStyle(iframeDoc.body).backgroundColor !== 'rgba(0, 0, 0, 0)';
                                    
                                    const hasBgImage = iframeDoc.body.style.backgroundImage || 
                                                       getComputedStyle(iframeDoc.body).backgroundImage !== 'none';
                                                       
                                    hasVisualContent = hasBgColor || hasBgImage;
                                    
                                    if (hasVisualContent) {
                                        logDebug("✅ Visual content detected");
                                    }
                                }
                            } catch(e) {
                                // Expected CORS error
                            }
                            
                            if (hasContent || hasVisualContent) {
                                logDebug("✅ Game content detected");
                                
                                // Additional check: wait for resource loading to complete
                                if (iframeDoc.readyState === 'complete') {
                                    const resources = Array.from(iframeDoc.querySelectorAll('img, script, link[rel="stylesheet"]'));
                                    const loadedResources = resources.filter(resource => {
                                        if (resource.tagName === 'IMG') return resource.complete;
                                        if (resource.tagName === 'SCRIPT') return resource.readyState === 'complete' || resource.readyState === undefined;
                                        if (resource.tagName === 'LINK') return resource.sheet;
                                        return true;
                                    });
                                    
                                    const resourcesLoaded = resources.length === 0 || 
                                                           (loadedResources.length / resources.length) > 0.85; // 85% resources loaded
                                    
                                    if (resourcesLoaded) {
                                        logDebug("✅ Most resources loaded");
                                        gameTrueContentLoaded = true;
                                        setTimeout(hideLoadingScreen, 500);
                                        return;
                                    } else {
                                        logDebug(`⚠️ Waiting for resources: ${loadedResources.length}/${resources.length}`);
                                    }
                                }
                            } else {
                                logDebug("⚠️ Document complete but no interactive content yet");
                            }
                        } catch (contentError) {
                            // CORS error on content check - fallback to other methods
                            logDebug("⚠️ Could not check content (CORS): " + contentError.message);
                        }
                        
                        // Progressive loading determination
                        // For CORS-protected content that we can't directly inspect
                        const minWaitAfterComplete = Math.max(2000, 6000 - timeElapsed);
                        if (timeElapsed > 10000) { // Increased threshold from 8s to 10s
                            logDebug(`⌛ Document complete and sufficient time elapsed (${Math.floor(timeElapsed/1000)}s)`);
                            setTimeout(hideLoadingScreen, minWaitAfterComplete);
                            return;
                        }
                    }
                } catch (e) {
                    // CORS error expected for security - don't log
                }
                
                // Method 2: Enhanced time-based detection with progressive timeouts
                // Use mutation observer to detect DOM changes in the iframe (if possible)
                try {
                    if (!iframe.observer && iframe.contentWindow) {
                        // Try to set up mutation observer for direct detection of content changes
                        iframe.observer = new MutationObserver(() => {
                            iframe.lastMutation = Date.now();
                        });
                        
                        try {
                            iframe.observer.observe(iframe.contentWindow.document.body, {
                                childList: true,
                                subtree: true
                            });
                            logDebug("✅ MutationObserver attached to iframe");
                        } catch (corsError) {
                            // Expected CORS error
                        }
                    }
                    
                    // Check if we've detected mutations and they have recently stopped
                    // (indicating the game has finished rendering)
                    if (iframe.lastMutation) {
                        const timeSinceLastMutation = Date.now() - iframe.lastMutation;
                        if (timeSinceLastMutation > 2000 && timeElapsed > 5000) {
                            logDebug(`✅ Content stabilized (no mutations for ${Math.floor(timeSinceLastMutation/1000)}s)`);
                            hideLoadingScreen();
                            return;
                        }
                    }
                } catch (mutationError) {
                    // Silent fail for CORS issues
                }
                
                // Method 3: Improved adaptive loading detection
                // More intelligent time-based approach based on device, connection, and game size
                
                // Get estimated game size from URL if possible
                const gameSize = getEstimatedGameSize(iframe.src);
                
                // Detect connection speed
                const connectionSpeed = navigator.connection ? 
                    navigator.connection.effectiveType : '4g'; // Default to 4g if not available
                
                // Calculate adaptive wait time based on all factors
                const isSlowDevice = window.navigator.hardwareConcurrency < 4 || 
                                    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // Base wait time affected by device speed, connection, and game size
                // INCREASED for more reliability
                let baseWaitTime = 10000; // Default 10 seconds (increased from 8)
                
                // Adjust for device speed
                if (isSlowDevice) baseWaitTime += 8000; // Increased from 5 seconds
                
                // Adjust for connection type
                if (connectionSpeed === 'slow-2g' || connectionSpeed === '2g') baseWaitTime += 12000; // Increased from 8 seconds
                else if (connectionSpeed === '3g') baseWaitTime += 6000; // Increased from 3 seconds
                else baseWaitTime += 2000; // Added for even 4g connections
                
                // Adjust for estimated game size
                if (gameSize === 'large') baseWaitTime += 8000; // Increased from 5 seconds
                else if (gameSize === 'medium') baseWaitTime += 4000; // Increased from 2 seconds
                
                // Adjust for retry count
                baseWaitTime += (retryCount * 2000);
                
                // Progressive timeout: starts with longer wait, shortens over time
                // as user frustration with waiting increases
                const adjustedTimeout = Math.max(
                    5000, // Minimum 5 seconds
                    baseWaitTime - (timeElapsed / 1000) * 400 // Reduced factor for more conservative timeout reduction
                );
                
                // After enough time has passed, show the game
                if (timeElapsed > adjustedTimeout) {
                    logDebug(`⌛ Adaptive time-based detection triggered after ${Math.floor(timeElapsed/1000)}s`);
                    logDebug(`   (baseWaitTime: ${Math.floor(baseWaitTime/1000)}s, adjustedTimeout: ${Math.floor(adjustedTimeout/1000)}s)`);
                    hideLoadingScreen();
                    return;
                }
                
                // Update loading text with more meaningful information
                if (timeElapsed > 10000 && !gameLoaded) {
                    loadingText.textContent = `Still loading (${Math.floor(timeElapsed/1000)}s)...`;
                }
                
                // Show the game button after a certain amount of time
                if (timeElapsed > 15000 && !gameLoaded && showGameBtn.style.display !== 'block') {
                    showGameBtn.style.display = 'block';
                }
                
            } catch (e) {
                logDebug(`❌ Error checking visibility: ${e.message}`);
            }
        }
        
        // Improved start visibility check with adaptive intervals
        function startVisibilityCheck() {
            // Clear any existing interval
            clearInterval(checkVisibilityInterval);
            
            logDebug("👁️ Starting visibility checks");
            
            // Only start checking after an initial delay
            setTimeout(function() {
                loadingText.textContent = "Waiting for game to appear...";
                logDebug("⏱️ Initial delay complete, actively checking visibility");
                
                // Start with fast checks, then gradually reduce frequency
                let checkInterval = 300; // Start with 300ms checks
                let checksPerformed = 0;
                
                // Set adaptive interval that changes frequency over time
                checkVisibilityInterval = setInterval(function() {
                    checksPerformed++;
                    checkIframeVisibility();
                    
                    // After 10 checks, slow down to 500ms
                    if (checksPerformed === 10 && checkInterval === 300) {
                        clearInterval(checkVisibilityInterval);
                        checkInterval = 500;
                        checkVisibilityInterval = setInterval(checkIframeVisibility, checkInterval);
                        logDebug("⏱️ Reduced check frequency to 500ms");
                    }
                    // After 20 more checks, slow down to 1000ms
                    else if (checksPerformed === 30 && checkInterval === 500) {
                        clearInterval(checkVisibilityInterval);
                        checkInterval = 1000;
                        checkVisibilityInterval = setInterval(checkIframeVisibility, checkInterval);
                        logDebug("⏱️ Reduced check frequency to 1000ms");
                    }
                }, checkInterval);
                
                // Set max wait time - after adaptive time, show game regardless
                // Base value depends on device and connection - INCREASED for reliability
                const isSlowDevice = window.navigator.hardwareConcurrency < 4 || 
                                    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                const isSlowConnection = connection && 
                                        (connection.effectiveType === 'slow-2g' || 
                                         connection.effectiveType === '2g' ||
                                         connection.effectiveType === '3g');
                
                // Calculate max wait time - increased from previous values
                const maxWaitTime = 20000 + // Increased base from 15s to 20s
                                  (retryCount * 5000) + 
                                  (isSlowDevice ? 15000 : 0) + // Increased from 10s to 15s
                                  (isSlowConnection ? 15000 : 0); // Increased from 10s to 15s
                
                setTimeout(function() {
                    if (!gameLoaded) {
                        logDebug(`⏱️ Max wait time (${maxWaitTime}ms) reached - forcing game display`);
                        hideLoadingScreen();
                        loadingText.textContent = "Game may still be loading...";
                    }
                }, maxWaitTime);
            }, 1500);
        }
        
        // Setup Service Worker ping mechanism
        function setupServiceWorkerPing() {
            // Check if service worker is active
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                logDebug("🔄 Setting up Service Worker health check");
                
                // Ping the service worker every 10 seconds
                setInterval(() => {
                    try {
                        navigator.serviceWorker.controller.postMessage({
                            type: 'PING',
                            timestamp: Date.now()
                        });
                    } catch (e) {
                        logDebug(`❌ Error pinging Service Worker: ${e.message}`);
                    }
                }, 10000);
                
                // Listen for pong responses
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'PONG') {
                        const roundtripTime = Date.now() - event.data.timestamp;
                        logDebug(`✅ Service Worker responded in ${roundtripTime}ms`);
                    }
                });
            }
        }

        // Optimize load game function to use all improvements
        function loadGame() {
            logDebug("🎮 Loading game...");
            
            const urlParams = new URLSearchParams(window.location.search);
            const gameUrl = urlParams.get('game');
            
            if (!gameUrl) {
                logDebug("❌ No game URL found - redirecting to home");
                window.location.href = '/';
                return;
            }
            
            // Store the original game URL
            originalGameUrl = gameUrl;
            logDebug(`📝 Original game URL stored: ${originalGameUrl}`);
            
            // Check connection speed and adapt loading strategy
            const { connectionType, isLowBandwidth } = checkConnectionSpeed();
            
            // Estimate game size
            const gameSize = getEstimatedGameSize(gameUrl);
            logDebug(`📊 Estimated game size: ${gameSize}`);
            
            // Update loading text based on conditions
            if (isLowBandwidth && gameSize === 'large') {
                loadingText.textContent = "Loading large game on slow connection...";
            } else if (isLowBandwidth) {
                loadingText.textContent = "Loading on slow connection...";
            } else if (gameSize === 'large') {
                loadingText.textContent = "Loading large game...";
            }
            
            // Record load start time
            loadStartTime = Date.now();
            logDebug(`⏱️ Load start time: ${new Date(loadStartTime).toLocaleTimeString()}`);
            logDebug(`🔗 Game URL: ${gameUrl}`);
            
            // Try to find game info and record play
            if (window.GameDB && window.GlobalGameStats) {
                const gameInfo = GameDB.getGameByUrl(gameUrl);
                if (gameInfo) {
                    // Record play and update popularity
                    GlobalGameStats.recordUserPlay(gameInfo.id);
                    GlobalGameStats.updatePopularityFactor(gameInfo.id, 0.5);
                    logDebug(`ℹ️ Loaded game: ${gameInfo.title}`);
                } else {
                    logDebug("⚠️ Game not found in GameDB");
                }
            } else {
                logDebug("⚠️ GameDB or GlobalGameStats not available");
            }
            
            // Ping service worker to ensure it's ready
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                try {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'PING',
                        timestamp: Date.now()
                    });
                    logDebug("✅ Service worker pinged before game load");
                } catch (e) {
                    logDebug(`⚠️ Could not ping service worker: ${e.message}`);
                }
            }
            
            // Prefetch common resources to speed up loading
            prefetchCommonResources();
            
            // Set iframe src to load game
            iframe.src = gameUrl;
            
            // Start progress updates
            startProgressUpdates();
            
            // Show "Show Game" button after a dynamic time based on connection
            const showButtonDelay = isLowBandwidth ? 6000 : 10000; // Increased from 3s/5s
            setTimeout(function() {
                if (!gameLoaded) {
                    showGameBtn.style.display = 'block';
                }
            }, showButtonDelay);
            
            // Start checking for visible content
            startVisibilityCheck();
            
            // Intelligent preloading of game suggestions while main game loads
            setTimeout(() => {
                if (window.GameDB) {
                    const suggestions = GameDB.getRandomGames(gameUrl, 3);
                    if (suggestions && suggestions.length > 0) {
                        // Preload the first suggestion after a delay
                        setTimeout(() => {
                            if (!gameLoaded && suggestions[0] && suggestions[0].link) {
                                preloadGame(suggestions[0].link);
                            }
                        }, 8000);
                    }
                }
            }, 2000);
        }
        
        /**
         * Load game suggestions and display them
         */
        function loadGameSuggestions() {
            const suggestionsElement = document.getElementById('gameSuggestions');
            if (!suggestionsElement) return;
            
            // Get current game URL
            const urlParams = new URLSearchParams(window.location.search);
            const currentGameUrl = urlParams.get('game');
            
            // Check if we have enough games loaded
            const totalGames = Object.keys(GameDB.games).length;
            if (totalGames < 3) {
                console.warn(`Not enough games loaded (${totalGames}). Using fallback games.`);
                // Use fallback games to ensure we have suggestions
                GameDB.processGameData(GameDB.fallbackGames);
            }
            
            // Get random games for suggestions, excluding current game
            const randomGames = GameDB.getRandomGames(currentGameUrl, 3);
            
            // Clear loading state
            suggestionsElement.innerHTML = '';
            
            if (!randomGames || randomGames.length === 0) {
                suggestionsElement.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#aaa;">
                        No game suggestions available
                    </div>
                `;
                return;
            }
            
            // Add each game as a suggestion
            randomGames.forEach(game => {
                // Create suggestion element
                const suggestionElement = document.createElement('div');
                suggestionElement.className = 'suggestion_item';
                suggestionElement.setAttribute('data-game-id', game.id);
                
                suggestionElement.innerHTML = `
                    <div class="suggestion_icon">
                        <img src="${game.imgSrc}" alt="${game.title} icon" onerror="this.src='/gameimg/default.png'">
                    </div>
                    <div class="suggestion_info">
                        <h4 class="suggestion_title">${game.title}</h4>
                        <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 5px;">
                            <button class="suggestion_play">
                                <svg class="suggestion_play_icon" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z" fill="currentColor"/>
                                </svg>
                                Play
                            </button>
                        </div>
                    </div>
                `;
                
                // Add click handler to load the game
                suggestionElement.addEventListener('click', function() {
                    loadSuggestedGame(game);
                });
                
                suggestionsElement.appendChild(suggestionElement);
            });
        }
        
        /**
         * Load a suggested game
         * @param {Object} game Game object with id, title, and link
         */
        function loadSuggestedGame(game) {
            // Skip if the link is invalid
            if (!game.link || game.link === '#') {
                console.warn("Cannot load game with invalid link:", game);
                return;
            }
            
            // Record play and update popularity
            GlobalGameStats.recordUserPlay(game.id);
            GlobalGameStats.updatePopularityFactor(game.id, 0.5);
            
            // Show loading screen
            gameLoaded = false;
            gameTrueContentLoaded = false;
            
            // Clear any intervals
            clearInterval(checkVisibilityInterval);
            clearInterval(contentCheckInterval);
            
            // Hide any warnings
            gameContentWarning.style.display = 'none';
            reloadOverlay.classList.remove('visible');
            
            loadingScreen.style.display = 'flex';
            showGameBtn.style.display = 'none';
            loadingText.textContent = "Loading Game...";
            focusButton.style.display = 'none';
            
            // Reset retry counter
            retryCount = 0;
            
            // Hide retry button if visible
            const retryBtn = document.querySelector('.retry-button');
            if (retryBtn) {
                retryBtn.style.display = 'none';
            }
            
            // Reset iframe
            iframe.src = 'about:blank';
            
            // Use setTimeout to ensure the loading screen appears before navigating
            setTimeout(function() {
                // Update original game URL to the new game
                originalGameUrl = game.link;
                
                iframe.src = game.link;
                
                // Update URL without page reload
                const urlParams = new URLSearchParams(window.location.search);
                urlParams.set('game', game.link);
                const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
                window.history.pushState({ path: newUrl }, '', newUrl);
                
                // Record load start time
                loadStartTime = Date.now();
                
                // Start progress updates
                startProgressUpdates();
                
                // Refresh game suggestions
                setTimeout(loadGameSuggestions, 500);
                
                // Start checking for visible content
                startVisibilityCheck();
            }, 100);
        }
        
        /**
         * Initialize when DOM is ready
         */
        document.addEventListener('DOMContentLoaded', async function() {
            logDebug("🎮 Game loader initializing...");
            
            // Get DOM elements
            iframe = document.getElementById('gframe');
            loadingScreen = document.getElementById('loadingScreen');
            loadingText = document.getElementById('loadingText');
            showGameBtn = document.getElementById('showGameBtn');
            focusButton = document.getElementById('focusButton');
            gameContentWarning = document.getElementById('gameContentWarning');
            reloadOverlay = document.getElementById('reloadOverlay');
            
            if (!iframe) {
                console.error("Critical element missing: iframe (gframe)");
                return; // Can't continue without an iframe
            }
            
            // Store the original game URL right at initialization
            const urlParams = new URLSearchParams(window.location.search);
            originalGameUrl = urlParams.get('game');
            logDebug(`📝 Original game URL stored at initialization: ${originalGameUrl}`);
            
            logDebug("✅ Found critical page elements");
            logDebug(`📱 Device: ${navigator.userAgent.substring(0, 50)}...`);
            
            // Initialize UI first for better UX
            initializeEventListeners();
            
            // Setup service worker ping
            setupServiceWorkerPing();
            
            // Record load start time
            loadStartTime = Date.now();
            
            try {
                // Set a hard timeout for game data loading to prevent blocking
                const MAX_LOAD_TIME = 5000; // 5 seconds
                
                // Create a race between data loading and timeout
                const dataLoadResult = await Promise.race([
                    // Attempt to load external game data
                    GameDB.loadGameData().then(() => "success"),
                    
                    // Timeout after MAX_LOAD_TIME
                    new Promise(resolve => setTimeout(() => resolve("timeout"), MAX_LOAD_TIME))
                ]);
                
                if (dataLoadResult === "timeout") {
                    console.warn("Game data loading timed out - using fallback games");
                    // Use fallback games if loading times out
                    GameDB.processGameData(GameDB.fallbackGames);
                }
                
                // Initialize game statistics with the loaded games
                const gameList = Object.values(GameDB.games);
                GlobalGameStats.initialize(gameList);
                
                // Load game suggestions
                loadGameSuggestions();
                
                // Start progress updates for loading bar
                startProgressUpdates();
                
                // Load the main game
                loadGame();
            } catch (error) {
                logDebug(`❌ Failed to initialize game system: ${error.message}`);
                
                // Use fallback games in case of error
                GameDB.processGameData(GameDB.fallbackGames);
                
                // Initialize with fallback games
                const gameList = Object.values(GameDB.games);
                GlobalGameStats.initialize(gameList);
                
                // Still try to load suggestions and the game
                loadGameSuggestions();
                startProgressUpdates();
                loadGame();
            }
        });
        
        /**
         * Set up all event listeners
         */
        function initializeEventListeners() {
            logDebug("🔧 Setting up event listeners");
            
            // Handle iframe load event
            iframe.addEventListener('load', function() {
                // Store load time
                iframe.dataset.loadTime = Date.now();
                logDebug("✅ Iframe load event fired");
                
                // Extra wait after load event to give the game more time to render
                setTimeout(function() {
                    if (!gameLoaded) {
                        loadingText.textContent = "Almost ready...";
                        logDebug("⌛ Post-load waiting period");
                    }
                }, 1500);
            });
            
            // Show Game button click handler
            showGameBtn.addEventListener('click', function() {
                logDebug("👆 Show Game button clicked");
                hideLoadingScreen();
            });
            
            // Focus button click handler
            focusButton.addEventListener('click', function() {
                logDebug("👆 Focus button clicked");
                focusGame();
            });
            
            // Setup reload button handler in content warning
            document.getElementById('reloadBtn').addEventListener('click', function() {
                logDebug("👆 Content warning reload button clicked");
                reloadGame();
            });
            
            // Setup overlay reload button
            document.getElementById('overlayReloadBtn').addEventListener('click', function() {
                logDebug("👆 Overlay reload button clicked");
                reloadGame();
            });
            
            // Global event listener for clicks in the game container
            document.querySelector('.game_container').addEventListener('click', function(e) {
                // Don't auto-focus if clicking buttons or other interactive elements
                if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'IMG') {
                    focusGame();
                }
            });
            
            // Add keyboard listener to refocus iframe if keyboard used while not focused
            document.addEventListener('keydown', function(e) {
                // If a key is pressed and the iframe is not focused, focus it
                if (document.activeElement !== iframe) {
                    focusGame();
                }
            });
            
            // Error handling for iframe
            iframe.onerror = function(e) {
                logDebug(`❌ Iframe error: ${e.message || 'Unknown error'}`);
            };
            
            // Add message event listener for iframe communication
            window.addEventListener('message', function(event) {
                // Check for game ready message
                if (event.data && event.data.type === 'GAME_READY') {
                    logDebug("✅ Received GAME_READY message from iframe");
                    gameTrueContentLoaded = true;
                }
            });
            
            logDebug("✅ Event listeners initialized");
        }
    </script>

    <!-- Global JavaScript -->
    <script src="/global.js"></script>
    <script src="/assets/js/favicon-handler.js"></script>
