<!-- Loading Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        
        // Progress animation
        function animateProgress() {
            let progress = 0;
            const maxProgress = 100;
            const speed = 0.5;

            function updateProgress() {
                if (progress < maxProgress) {
                    progress += speed;
                    progressFill.style.width = `${Math.min(progress, maxProgress)}%`;
                    
                    if (progress < maxProgress) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        // Final checks and removal
                        setTimeout(() => {
                            loadingOverlay.classList.add('fade-out');
                            loadingOverlay.addEventListener('transitionend', () => {
                                loadingOverlay.remove();
                            });
                        }, 500);
                    }
                }
            }

            // Ensure initial visibility
            progressFill.style.width = '1%';
            requestAnimationFrame(updateProgress);
        }

        // Ensure all critical resources are loaded
        function waitForCriticalResources() {
            const criticalChecks = [
                () => window.CONFIG !== undefined,
                () => window.loadHTML !== undefined,
                () => window.__uv$config !== undefined,
                () => {
                    try {
                        return window.gamesData && window.games2Data;
                    } catch {
                        return false;
                    }
                }
            ];

            function checkResources() {
                const allLoaded = criticalChecks.every(check => check());
                
                if (allLoaded) {
                    animateProgress();
                } else {
                    // If not loaded, check again after a short delay
                    setTimeout(checkResources, 100);
                }
            }

            // Start initial check with a timeout fallback
            checkResources();
            
            // Fallback timeout to prevent indefinite waiting
            setTimeout(() => {
                animateProgress();
            }, 10000);
        }

        // Kick off the loading process
        waitForCriticalResources();

        // Ensure loading bar is visible even if resources are cached
        window.addEventListener('load', () => {
            if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                animateProgress();
            }
        });
    });
</script>

<!-- IMPROVED Service Worker Registration with Auto-Healing -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const AUTO_HEALING = {
            MAX_RETRIES: 3,
            RETRY_DELAY: 3000,
            HEALTH_CHECK_INTERVAL: 30000,
            retryCount: parseInt(sessionStorage.getItem('sw-retry-count') || '0'),
            lastHealthCheck: Date.now()
        };

        // Function to register service worker with improved error handling and retries
        async function registerServiceWorker(retryOnFailure = true) {
            if (!('serviceWorker' in navigator)) {
                console.error("Service workers are not supported in this browser");
                return false;
            }
            
            try {
                // Use the correct scope
                const swScope = "/uv/";
                console.log('Registering UV service worker with scope:', swScope);
                
                // Register the service worker with proper scope settings
                const registration = await navigator.serviceWorker.register("/uv/sw.js", { 
                    scope: swScope,
                    updateViaCache: 'none'
                });
                
                // Wait for it to be ready
                await navigator.serviceWorker.ready;
                
                // If we have an active service worker, send it a message to skip waiting
                if (registration.active) {
                    registration.active.postMessage({ type: 'SKIP_WAITING' });
                }
                
                console.log('UV service worker successfully registered with scope:', registration.scope);
                
                // Reset retry count on success
                sessionStorage.setItem('sw-retry-count', '0');
                AUTO_HEALING.retryCount = 0;
                
                return true;
            } catch (error) {
                console.error('UV service worker registration failed:', error);
                
                // Implement retry logic
                if (retryOnFailure && AUTO_HEALING.retryCount < AUTO_HEALING.MAX_RETRIES) {
                    AUTO_HEALING.retryCount++;
                    sessionStorage.setItem('sw-retry-count', AUTO_HEALING.retryCount.toString());
                    
                    console.log(`Retrying service worker registration in ${AUTO_HEALING.RETRY_DELAY}ms (attempt ${AUTO_HEALING.retryCount}/${AUTO_HEALING.MAX_RETRIES})`);
                    
                    // Retry after delay
                    setTimeout(() => {
                        registerServiceWorker(true);
                    }, AUTO_HEALING.RETRY_DELAY);
                }
                
                return false;
            }
        }

        // Check service worker health periodically
        function startHealthChecks() {
            setInterval(async () => {
                try {
                    // Check if service worker is registered and active
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    const uvWorker = registrations.find(r => 
                        r.scope.includes('/uv/') || 
                        (r.active && r.active.scriptURL.includes('sw.js'))
                    );
                    
                    if (!uvWorker) {
                        console.log('Health check: UV service worker missing, reregistering');
                        registerServiceWorker();
                        return;
                    }
                    
                    // Check if service worker is responding to pings
                    if (navigator.serviceWorker.controller) {
                        // Send ping message
                        navigator.serviceWorker.controller.postMessage({
                            type: 'PING',
                            timestamp: Date.now()
                        });
                        
                        // Record when we last sent a ping
                        AUTO_HEALING.lastPingSent = Date.now();
                    }
                } catch (error) {
                    console.error('Service worker health check failed:', error);
                }
            }, AUTO_HEALING.HEALTH_CHECK_INTERVAL);
            
            // Listen for pong responses from service worker
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data && event.data.type === 'PONG') {
                    // Update health check timestamp
                    AUTO_HEALING.lastHealthCheck = Date.now();
                    
                    // Check response time (roundtrip)
                    const responseTime = Date.now() - event.data.timestamp;
                    console.log(`Service worker responded in ${responseTime}ms`);
                    
                    // If response time is too slow, consider reregistering
                    if (responseTime > 5000) {
                        console.log('Service worker response time is slow, considering reregistration');
                    }
                }
            });
            
            // Force heal if no response for too long
            setInterval(() => {
                const timeSinceLastCheck = Date.now() - AUTO_HEALING.lastHealthCheck;
                // If no response for 2 minutes, force heal
                if (timeSinceLastCheck > 120000) {
                    console.log('No service worker health check response for 2 minutes, forcing healing');
                    forceHealServiceWorker();
                }
            }, 60000); // Check every minute
        }

        // Force heal service worker
        async function forceHealServiceWorker() {
            try {
                // Unregister existing service workers
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const registration of registrations) {
                    if (registration.scope.includes('/uv/') || 
                        (registration.active && registration.active.scriptURL.includes('sw.js'))) {
                        await registration.unregister();
                        console.log('Force-unregistered service worker');
                    }
                }
                
                // Clear caches
                const cacheNames = await caches.keys();
                for (const cacheName of cacheNames) {
                    if (cacheName.includes('uv-') || cacheName.includes('uv_')) {
                        await caches.delete(cacheName);
                        console.log('Deleted cache:', cacheName);
                    }
                }
                
                // Re-register service worker
                await registerServiceWorker(false);

            // Listen for connection changes
            connection.addEventListener('change', () => {
                const newType = connection.effectiveType || 'unknown';

        let progressPercent = Math.min(100, (timeElapsed / expectedLoadTime) * 100);
        
        // Make progress non-linear (faster at start, slower near end)
        // This creates a more natural loading feel
        progressPercent = Math.pow(progressPercent / 100, 0.7) * 100;

        // Clear any existing interval
        clearInterval(checkVisibilityInterval);
        
        logDebug("👁️ Starting visibility checks");
        
        // Only start checking after an initial delay
        setTimeout(function() {
            loadingText.textContent = "Waiting for game to appear...";
            logDebug("⏱️ Initial delay complete, actively checking visibility");
            
            // Start with fast checks, then gradually reduce frequency
            let checkInterval = 300; // Start with 300ms checks
            let checksPerformed = 0;
            
            // Set adaptive interval that changes frequency over time
            checkVisibilityInterval = setInterval(function() {
                checksPerformed++;
                checkIframeVisibility();
                
                // After 10 checks, slow down to 500ms
                if (checksPerformed === 10 && checkInterval === 300) {
                    clearInterval(checkVisibilityInterval);
                    checkInterval = 500;
                    checkVisibilityInterval = setInterval(checkIframeVisibility, checkInterval);
                    logDebug("⏱️ Reduced check frequency to 500ms");
                }
                // After 20 more checks, slow down to 1000ms
                else if (checksPerformed === 30 && checkInterval === 500) {
                    clearInterval(checkVisibilityInterval);
                    checkInterval = 1000;
                    checkVisibilityInterval = setInterval(checkIframeVisibility, checkInterval);
                    logDebug("⏱️ Reduced check frequency to 1000ms");
                }
            }, checkInterval);
            
            // Set max wait time - after adaptive time, show game regardless
            // Base value depends on device and connection - INCREASED for reliability
            const isSlowDevice = window.navigator.hardwareConcurrency < 4 || 
                                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowConnection = connection && 
                                    (connection.effectiveType === 'slow-2g' || 
                                     connection.effectiveType === '2g' ||
                                     connection.effectiveType === '3g');
            
            // Calculate max wait time - increased from previous values
            const maxWaitTime = 20000 + // Increased base from 15s to 20s
                              (retryCount * 5000) + 
                              (isSlowDevice ? 15000 : 0) + // Increased from 10s to 15s
                              (isSlowConnection ? 15000 : 0); // Increased from 10s to 15s
            
            setTimeout(function() {
                if (!gameLoaded) {
                    logDebug(`⏱️ Max wait time (${maxWaitTime}ms) reached - forcing game display`);
                    hideLoadingScreen();
                    loadingText.textContent = "Game may still be loading...";
                }
            }, maxWaitTime);
        }, 1500);
    }
    
    // Setup Service Worker ping mechanism
    function setupServiceWorkerPing() {
        // Check if service worker is active
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            logDebug("🔄 Setting up Service Worker health check");
            
            // Ping the service worker every 10 seconds
            setInterval(() => {
                try {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'PING',
                        timestamp: Date.now()
                    });
                } catch (e) {
                    logDebug(`❌ Error pinging Service Worker: ${e.message}`);
                }
            }, 10000);
            
            // Listen for pong responses
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'PONG') {
                    const roundtripTime = Date.now() - event.data.timestamp;
                    logDebug(`✅ Service Worker responded in ${roundtripTime}ms`);
                }
            });
        }
    }
    
    // Improved function to hide loading screen
    function hideLoadingScreen() {
        if (gameLoaded) return;
        
        logDebug("🎉 Hiding loading screen");
        
        gameLoaded = true;
        clearInterval(checkVisibilityInterval);
        
        // Fade out loading screen for smoother transition
        loadingScreen.style.display = 'none';
        
        // Verify actual game content in a separate process
        setTimeout(verifyGameContent, 2000);
        
        // Focus the iframe after the game appears
        setTimeout(focusGame, 500);
        
        // Show the focus button briefly
        focusButton.style.display = 'block';
        
        // Create or show retry button after a delay
        setTimeout(() => {
            // Remove any existing retry button
            const existingBtn = document.querySelector('.retry-button');
            if (existingBtn) {
                existingBtn.remove();
            }
            
            // Create new retry button with direct link to original URL
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-button';
            retryBtn.textContent = 'Game not loading? Click to retry';
            retryBtn.style.display = 'block';
            
            // Direct reload with the original URL
            retryBtn.onclick = function() {
                logDebug(`🔄 Retry button clicked - reloading original URL: ${originalGameUrl}`);
                
                // Show loading screen
                loadingScreen.style.display = 'flex';
                showGameBtn.style.display = 'none';
                loadingText.textContent = "Reloading Game...";
                gameLoaded = false;
                gameTrueContentLoaded = false;
                
                // Hide any warnings
                gameContentWarning.style.display = 'none';
                reloadOverlay.classList.remove('visible');
                
                // Clear any intervals
                clearInterval(contentCheckInterval);
                
                // Clear and reload iframe with original URL
                iframe.src = 'about:blank';
                
                // Hide this retry button
                retryBtn.style.display = 'none';
                
                // Use setTimeout to ensure the blank page loads first
                setTimeout(() => {
                    iframe.src = originalGameUrl;
                    startVisibilityCheck();
                    startProgressUpdates();
                }, 500);
            };
            
            // Add hover effect
            retryBtn.addEventListener('mouseover', function() {
                this.style.background = 'rgba(100,100,100,0.95)';
                this.style.transform = 'scale(1.05)';
            });
            
            retryBtn.addEventListener('mouseout', function() {
                this.style.background = 'rgba(80,80,80,0.85)';
                this.style.transform = 'scale(1)';
            });
            
            // Add to body
            document.body.appendChild(retryBtn);
            logDebug("ℹ️ Added fixed retry button (uses original URL)");
            
            // Auto-fade after 20 seconds
            setTimeout(() => {
                if (retryBtn.style.display !== 'none') {
                    retryBtn.style.opacity = '0.6';
                    retryBtn.style.transition = 'opacity 0.5s ease';
                }
            }, 20000);
        }, 3000);
        
        // Hide focus button after delay
        setTimeout(function() {
            focusButton.style.display = 'none';
        }, 5000);
    }
    
    // AUTO-HEALING: Add recovery from blank screens
    function recoverFromBlankScreen() {
        const iframe = document.getElementById('gframe');
        if (!iframe) return;
        
        const url = iframe.src;
        if (!url || url === 'about:blank') return;
        
        logDebug('Setting up blank screen recovery for: ' + url);
        
        // Store the current URL in localStorage in case we need to recover
        localStorage.setItem('last_game_url', url);
        
        // Check for blank content after load
        iframe.addEventListener('load', function() {
            // Detect if iframe content is available (may fail due to CORS)
            setTimeout(() => {
                try {
                    const iframeDoc = iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.body) {
                        // Check if the body is empty
                        if (iframeDoc.body.innerHTML.trim() === '') {
                            logDebug('Detected blank screen, attempting to reload');
                            reloadGame();
                        }
                    }
                } catch (e) {
                    // Expected CORS error, try alternative detection
                    // Create a special message listener to detect if game is blank
                    window.addEventListener('message', function(event) {
                        if (event.data && event.data.type === 'BLANK_SCREEN') {
                            logDebug('Received blank screen notification from iframe');
                            reloadGame();
                        }
                    });
                }
            }, 6000); // Check 6 seconds after load
        });
        
        // Add last resort recovery - check if the game seems frozen
        let lastActivityTime = Date.now();
        
        // Record user activity
        function updateActivity() {
            lastActivityTime = Date.now();
        }
        
        // Listen for user activity
        document.addEventListener('click', updateActivity);
        document.addEventListener('keydown', updateActivity);
        document.addEventListener('mousemove', updateActivity);
        
        // Check for inactivity that might indicate a frozen game
        setInterval(() => {
            const timeSinceActivity = Date.now() - lastActivityTime;
            const loadingScreenVisible = document.getElementById('loadingScreen').style.display !== 'none';
            
            // If loading screen is visible for too long (30+ seconds) and user is active
            if (loadingScreenVisible && timeSinceActivity < 10000 && 
                Date.now() - loadStartTime > 30000) {
                logDebug('Loading screen stuck for too long, forcing game to show');
                hideLoadingScreen();
            }
        }, 5000);
    }
    
    // Optimize load game function to use all improvements
    function loadGame() {
        logDebug("🎮 Loading game...");
        
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game');
        
        if (!gameUrl) {
            logDebug("❌ No game URL found - redirecting to home");
            window.location.href = '/';
            return;
        }
        
        // Store the original game URL
        originalGameUrl = gameUrl;
        logDebug(`📝 Original game URL stored: ${originalGameUrl}`);
        
        // Check connection speed and adapt loading strategy
        const { connectionType, isLowBandwidth } = checkConnectionSpeed();
        
        // Estimate game size
        const gameSize = getEstimatedGameSize(gameUrl);
        logDebug(`📊 Estimated game size: ${gameSize}`);
        
        // Update loading text based on conditions
        if (isLowBandwidth && gameSize === 'large') {
            loadingText.textContent = "Loading large game on slow connection...";
        } else if (isLowBandwidth) {
            loadingText.textContent = "Loading on slow connection...";
        } else if (gameSize === 'large') {
            loadingText.textContent = "Loading large game...";
        }
        
        // Record load start time
        loadStartTime = Date.now();
        logDebug(`⏱️ Load start time: ${new Date(loadStartTime).toLocaleTimeString()}`);
        logDebug(`🔗 Game URL: ${gameUrl}`);
        
        // Try to find game info and record play
        if (window.GameDB && window.GlobalGameStats) {
            const gameInfo = GameDB.getGameByUrl(gameUrl);
            if (gameInfo) {
                // Record play and update popularity
                GlobalGameStats.recordUserPlay(gameInfo.id);
                GlobalGameStats.updatePopularityFactor(gameInfo.id, 0.5);
                logDebug(`ℹ️ Loaded game: ${gameInfo.title}`);
            } else {
                logDebug("⚠️ Game not found in GameDB");
            }
        } else {
            logDebug("⚠️ GameDB or GlobalGameStats not available");
        }
        
        // Ping service worker to ensure it's ready
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            try {
                navigator.serviceWorker.controller.postMessage({
                    type: 'PING',
                    timestamp: Date.now()
                });
                logDebug("✅ Service worker pinged before game load");
            } catch (e) {
                logDebug(`⚠️ Could not ping service worker: ${e.message}`);
            }
        }
        
        // Prefetch common resources to speed up loading
        prefetchCommonResources();
        
        // Set iframe src to load game
        iframe.src = gameUrl;
        
        // Start progress updates
        startProgressUpdates();
        
        // Show "Show Game" button after a dynamic time based on connection
        const showButtonDelay = isLowBandwidth ? 6000 : 10000; // Increased from 3s/5s
        setTimeout(function() {
            if (!gameLoaded) {
                showGameBtn.style.display = 'block';
            }
        }, showButtonDelay);
        
        // Start checking for visible content
        startVisibilityCheck();
        
        // Intelligent preloading of game suggestions while main game loads
        setTimeout(() => {
            if (window.GameDB) {
                const suggestions = GameDB.getRandomGames(gameUrl, 3);
                if (suggestions && suggestions.length > 0) {
                    // Preload the first suggestion after a delay
                    setTimeout(() => {
                        if (!gameLoaded && suggestions[0] && suggestions[0].link) {
                            preloadGame(suggestions[0].link);
                        }
                    }, 8000);
                }
            }
        }, 2000);
        
        // Setup automatic recovery from blank screens
        setupAutoHealing();
        recoverFromBlankScreen();
        
        // Add special message to notify service worker this is a game
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            try {
                navigator.serviceWorker.controller.postMessage({
                    type: 'LOADING_GAME',
                    url: gameUrl,
                    timestamp: Date.now()
                });
            } catch (e) {
                console.error('Error sending message to service worker:', e);
            }
        }
    }
    
    /**
     * Load game suggestions and display them
     */
    function loadGameSuggestions() {
        const suggestionsElement = document.getElementById('gameSuggestions');
        if (!suggestionsElement) return;
        
        // Get current game URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentGameUrl = urlParams.get('game');
        
        // Check if we have enough games loaded
        const totalGames = Object.keys(GameDB.games).length;
        if (totalGames < 3) {
            console.warn(`Not enough games loaded (${totalGames}). Using fallback games.`);
            // Use fallback games to ensure we have suggestions
            GameDB.processGameData(GameDB.fallbackGames);
        }
        
        // Get random games for suggestions, excluding current game
        const randomGames = GameDB.getRandomGames(currentGameUrl, 3);
        
        // Clear loading state
        suggestionsElement.innerHTML = '';
        
        if (!randomGames || randomGames.length === 0) {
            suggestionsElement.innerHTML = `
                <div style="text-align:center; padding:20px; color:#aaa;">
                    No game suggestions available
                </div>
            `;
            return;
        }
        
        // Add each game as a suggestion
        randomGames.forEach(game => {
            // Create suggestion element
            const suggestionElement = document.createElement('div');
            suggestionElement.className = 'suggestion_item';
            suggestionElement.setAttribute('data-game-id', game.id);
            
            suggestionElement.innerHTML = `
                <div class="suggestion_icon">
                    <img src="${game.imgSrc}" alt="${game.title} icon" onerror="this.src='/gameimg/default.png'">
                </div>
                <div class="suggestion_info">
                    <h4 class="suggestion_title">${game.title}</h4>
                    <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 5px;">
                        <button class="suggestion_play">
                            <svg class="suggestion_play_icon" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" fill="currentColor"/>
                            </svg>
                            Play
                        </button>
                    </div>
                </div>
            `;
            
            // Add click handler to load the game
            suggestionElement.addEventListener('click', function() {
                loadSuggestedGame(game);
            });
            
            suggestionsElement.appendChild(suggestionElement);
        });
    }
    
    /**
     * Load a suggested game
     * @param {Object} game Game object with id, title, and link
     */
    function loadSuggestedGame(game) {
        // Skip if the link is invalid
        if (!game.link || game.link === '#') {
            console.warn("Cannot load game with invalid link:", game);
            return;
        }
        
        // Record play and update popularity
        GlobalGameStats.recordUserPlay(game.id);
        GlobalGameStats.updatePopularityFactor(game.id, 0.5);
        
        // Show loading screen
        gameLoaded = false;
        gameTrueContentLoaded = false;
        
        // Clear any intervals
        clearInterval(checkVisibilityInterval);
        clearInterval(contentCheckInterval);
        
        // Hide any warnings
        gameContentWarning.style.display = 'none';
        reloadOverlay.classList.remove('visible');
        
        loadingScreen.style.display = 'flex';
        showGameBtn.style.display = 'none';
        loadingText.textContent = "Loading Game...";
        focusButton.style.display = 'none';
        
        // Reset retry counter
        retryCount = 0;
        
        // Hide retry button if visible
        const retryBtn = document.querySelector('.retry-button');
        if (retryBtn) {
            retryBtn.style.display = 'none';
        }
        
        // Reset iframe
        iframe.src = 'about:blank';
        
        // Use setTimeout to ensure the loading screen appears before navigating
        setTimeout(function() {
            // Update original game URL to the new game
            originalGameUrl = game.link;
            
            iframe.src = game.link;
            
            // Update URL without page reload
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('game', game.link);
            const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
            
            // Record load start time
            loadStartTime = Date.now();
            
            // Start progress updates
            startProgressUpdates();
            
            // Refresh game suggestions
            setTimeout(loadGameSuggestions, 500);
            
            // Start checking for visible content
            startVisibilityCheck();
            
            // Setup auto-healing for the new game
            setupAutoHealing();
            recoverFromBlankScreen();
        }, 100);
    }
    
    /**
     * Initialize when DOM is ready
     */
    document.addEventListener('DOMContentLoaded', async function() {
        logDebug("🎮 Game loader initializing...");
        
        // Get DOM elements
        iframe = document.getElementById('gframe');
        loadingScreen = document.getElementById('loadingScreen');
        loadingText = document.getElementById('loadingText');
        showGameBtn = document.getElementById('showGameBtn');
        focusButton = document.getElementById('focusButton');
        gameContentWarning = document.getElementById('gameContentWarning');
        reloadOverlay = document.getElementById('reloadOverlay');
        
        if (!iframe) {
            console.error("Critical element missing: iframe (gframe)");
            return; // Can't continue without an iframe
        }
        
        // Store the original game URL right at initialization
        const urlParams = new URLSearchParams(window.location.search);
        originalGameUrl = urlParams.get('game');
        logDebug(`📝 Original game URL stored at initialization: ${originalGameUrl}`);
        
        logDebug("✅ Found critical page elements");
        logDebug(`📱 Device: ${navigator.userAgent.substring(0, 50)}...`);
        
        // Initialize UI first for better UX
        initializeEventListeners();
        
        // Setup service worker ping
        setupServiceWorkerPing();
        
        // Record load start time
        loadStartTime = Date.now();
        
        try {
            // Set a hard timeout for game data loading to prevent blocking
            const MAX_LOAD_TIME = 5000; // 5 seconds
            
            // Create a race between data loading and timeout
            const dataLoadResult = await Promise.race([
                // Attempt to load external game data
                GameDB.loadGameData().then(() => "success"),
                
                // Timeout after MAX_LOAD_TIME
                new Promise(resolve => setTimeout(() => resolve("timeout"), MAX_LOAD_TIME))
            ]);
            
            if (dataLoadResult === "timeout") {
                console.warn("Game data loading timed out - using fallback games");
                // Use fallback games if loading times out
                GameDB.processGameData(GameDB.fallbackGames);
            }
            
            // Initialize game statistics with the loaded games
            const gameList = Object.values(GameDB.games);
            GlobalGameStats.initialize(gameList);
            
            // Load game suggestions
            loadGameSuggestions();
            
            // Start progress updates for loading bar
            startProgressUpdates();
            
            // Load the main game
            loadGame();
        } catch (error) {
            logDebug(`❌ Failed to initialize game system: ${error.message}`);
            
            // Use fallback games in case of error
            GameDB.processGameData(GameDB.fallbackGames);
            
            // Initialize with fallback games
            const gameList = Object.values(GameDB.games);
            GlobalGameStats.initialize(gameList);
            
            // Still try to load suggestions and the game
            loadGameSuggestions();
            startProgressUpdates();
            loadGame();
        }
    });
    
    /**
     * Set up all event listeners
     */
    function initializeEventListeners() {
        logDebug("🔧 Setting up event listeners");
        
        // Handle iframe load event
        iframe.addEventListener('load', function() {
            // Store load time
            iframe.dataset.loadTime = Date.now();
            logDebug("✅ Iframe load event fired");
            
            // Try to inject self-healing code into the iframe
            try {
                const iframeDoc = iframe.contentWindow.document;
                if (iframeDoc) {
                    // Create a new script element
                    const script = iframeDoc.createElement('script');
                    script.textContent = `
                        // Auto-healing script for blank pages
                        (function() {
                            // Check if page is blank after loading
                            setTimeout(function() {
                                const bodyContent = document.body.innerText.trim();
                                const elementCount = document.querySelectorAll('*').length;
                                
                                // If page is blank or has minimal content, notify parent
                                if ((bodyContent === '' || bodyContent.length < 10) && elementCount < 5) {
                                    try {
                                        window.parent.postMessage({ type: 'BLANK_SCREEN', url: location.href }, '*');
                                    } catch(e) {}
                                }
                            }, 2000);
                            
                            // Send ready message when interactive content is found
                            function checkForGameContent() {
                                const hasInteractiveElements = 
                                    document.querySelectorAll('canvas, video, iframe, button, a[href], input').length > 0;
                                    
                                if (hasInteractiveElements) {
                                    try {
                                        window.parent.postMessage({ type: 'GAME_READY' }, '*');
                                    } catch(e) {}
                                    return true;
                                }
                                return false;
                            }
                            
                            // Run check immediately
                            if (!checkForGameContent()) {
                                // Then keep checking every second for up to 10 seconds
                                let checkCount = 0;
                                const interval = setInterval(function() {
                                    if (checkForGameContent() || ++checkCount > 10) {
                                        clearInterval(interval);
                                    }
                                }, 1000);
                            }
                        })();
                    `;
                    
                    // Try to add to document head
                    if (iframeDoc.head) {
                        iframeDoc.head.appendChild(script);
                    } else if (iframeDoc.body) {
                        iframeDoc.body.appendChild(script);
                    }
                }
            } catch (e) {
                // Expected CORS error
            }
            
            // Extra wait after load event to give the game more time to render
            setTimeout(function() {
                if (!gameLoaded) {
                    loadingText.textContent = "Almost ready...";
                    logDebug("⌛ Post-load waiting period");
                }
            }, 1500);
        });
        
        // Show Game button click handler
        showGameBtn.addEventListener('click', function() {
            logDebug("👆 Show Game button clicked");
            hideLoadingScreen();
        });
        
        // Focus button click handler
        focusButton.addEventListener('click', function() {
            logDebug("👆 Focus button clicked");
            focusGame();
        });
        
        // Setup reload button handler in content warning
        document.getElementById('reloadBtn').addEventListener('click', function() {
            logDebug("👆 Content warning reload button clicked");
            reloadGame();
        });
        
        // Setup overlay reload button
        document.getElementById('overlayReloadBtn').addEventListener('click', function() {
            logDebug("👆 Overlay reload button clicked");
            reloadGame();
        });
        
        // Global event listener for clicks in the game container
        document.querySelector('.game_container').addEventListener('click', function(e) {
            // Don't auto-focus if clicking buttons or other interactive elements
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'IMG') {
                focusGame();
            }
        });
        
        // Add keyboard listener to refocus iframe if keyboard used while not focused
        document.addEventListener('keydown', function(e) {
            // If a key is pressed and the iframe is not focused, focus it
            if (document.activeElement !== iframe) {
                focusGame();
            }
        });
        
        // Error handling for iframe
        iframe.onerror = function(e) {
            logDebug(`❌ Iframe error: ${e.message || 'Unknown error'}`);
        };
        
        // Add message event listener for iframe communication
        window.addEventListener('message', function(event) {
            // Check for game ready message
            if (event.data && event.data.type === 'GAME_READY') {
                logDebug("✅ Received GAME_READY message from iframe");
                gameTrueContentLoaded = true;
                
                // If loading screen is still visible, hide it
                if (loadingScreen && loadingScreen.style.display !== 'none') {
                    hideLoadingScreen();
                }
            }
            
            // Check for blank screen message
            if (event.data && event.data.type === 'BLANK_SCREEN') {
                logDebug("⚠️ Received BLANK_SCREEN message from iframe");
                
                // Get reload count from session
                const reloadCount = parseInt(sessionStorage.getItem('blank-reload-count') || '0');
                
                // Only reload if we haven't reloaded too many times
                if (reloadCount < 3) {
                    sessionStorage.setItem('blank-reload-count', (reloadCount + 1).toString());
                    reloadGame();
                }
            }
        });
        
        logDebug("✅ Event listeners initialized");
    }
