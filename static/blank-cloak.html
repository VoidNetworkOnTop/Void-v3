<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <script>
        // Get the current URL
        const currentUrl = window.location.href;
        
        // Extract protocol and hostname to get the root domain
        const rootUrl = window.location.origin;
        
        // Open about:blank and write the iframe to it
        const newWindow = window.open('about:blank', '_self');
        
        // Write the iframe HTML to the about:blank window
        newWindow.document.write(`
            <html>
                <head></head>
                <body style="margin: 0px; height: 100vh;">
                    <iframe src="${rootUrl}" style="border: none; width: 100%; height: 100%; margin: 0px;"></iframe>
                </body>
            </html>
        `);
        
        newWindow.document.close();
    </script>
</body>
</html>
