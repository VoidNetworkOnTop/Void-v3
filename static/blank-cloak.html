<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <script>
        // Get the current URL
        const currentUrl = window.location.href;
        
        // Extract protocol and hostname to get the root domain
        const rootUrl = window.location.origin;
        
        // Create a blob URL for the iframe page
        const iframeContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <title></title>
                <style>
                    html, body, iframe {
                        height: 100%;
                        width: 100%;
                        margin: 0;
                        padding: 0;
                        border: none;
                        overflow: hidden;
                    }
                </style>
            </head>
            <body>
                <iframe src="${rootUrl}" frameborder="0"></iframe>
            </body>
            </html>
        `;
        
        const blob = new Blob([iframeContent], {type: 'text/html'});
        const blobUrl = URL.createObjectURL(blob);
        
        // Replace current page with the blob URL
        window.location.href = blobUrl;
    </script>
</body>
</html>
