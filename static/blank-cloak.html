<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <script>
        // Get the current URL
        const currentUrl = window.location.href;
        
        // Extract protocol and hostname to get the root domain
        const rootUrl = window.location.origin;
        
        // Create an about:blank window with an iframe
        const blankWindow = window.open('about:blank', '_self');
        
        // Write iframe to the about:blank page
        blankWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title></title>
                <style>
                    html, body, iframe {
                        height: 100%;
                        width: 100%;
                        margin: 0;
                        padding: 0;
                        border: none;
                        overflow: hidden;
                    }
                </style>
            </head>
            <body>
                <iframe src="${rootUrl}" frameborder="0"></iframe>
            </body>
            </html>
        `);
        blankWindow.document.close();
    </script>
</body>
</html>
