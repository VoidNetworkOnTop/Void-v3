<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>The Void Games - Russian Roulette</title>
   
   <!-- Favicon -->
   <link rel="shortcut icon" href="./assets/favicon.png" type="image/png">
   
   <style>
       body, html {
           margin: 0;
           padding: 0;
           width: 100%;
           height: 100%;
           background: #000;
           color: #fff;
           font-family: Arial, sans-serif;
           overflow: hidden;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
       }

       .game-container {
           background: #000;
           border-radius: 10px;
           width: 90%;
           max-width: 800px;
           height: 90vh;
           max-height: 800px;
           display: flex;
           flex-direction: column;
           position: relative;
           padding: 1rem;
           box-shadow: 
               0 0 2px #fff,
               0 0 4px #fff,
               0 0 6px #fff,
               0 0 8px #fff,
               inset 0 0 2px rgba(255, 255, 255, 0.2);
           z-index: 3;
       }

       .game-container::before {
           content: '';
           position: absolute;
           inset: -1px;
           background: transparent;
           border-radius: 10px;
           z-index: -1;
           box-shadow: 
               0 0 15px #fff,
               0 0 30px rgba(255, 255, 255, 0.8),
               0 0 40px rgba(255, 255, 255, 0.6),
               0 0 50px rgba(255, 255, 255, 0.4);
           opacity: 0.5;
       }

       .game-header {
           text-align: center;
           padding-bottom: 0.5rem;
           border-bottom: 1px solid rgba(255, 255, 255, 0.2);
           position: relative;
           flex-shrink: 0;
       }

       .game-title {
           font-size: 2rem;
           margin: 0 0 0.5rem 0;
           background: linear-gradient(45deg, #fff, #a0a0a0);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           font-weight: bold;
           text-transform: uppercase;
           letter-spacing: 2px;
       }

       .game-subtitle {
           font-size: 1rem;
           color: #888;
           margin: 0;
       }

       .coin-tracker {
           position: absolute;
           top: 0;
           right: 0;
           background: linear-gradient(135deg, #333, #222);
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 30px;
           padding: 0.5rem 1rem;
           display: flex;
           align-items: center;
           gap: 0.5rem;
           box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
           animation: glow 2s infinite;
       }

       .coin-icon {
           width: 20px;
           height: 20px;
           background: linear-gradient(135deg, #FFD700, #FFA500);
           border-radius: 50%;
           box-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
       }

       .coin-amount {
           font-weight: bold;
           font-size: 1.1rem;
           color: #FFD700;
       }

       .game-board {
           flex-grow: 1;
           position: relative;
           overflow: hidden;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           background-color: rgba(0, 0, 0, 0.5);
           border-radius: 8px;
           margin: 0.5rem 0;
           min-height: 300px;
           padding: 20px;
       }

       .status-display {
           text-align: center;
           font-size: 1.5rem;
           font-weight: bold;
           margin: 0.5rem 0;
           color: #fff;
           text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
           min-height: 2.5rem;
       }

       .score-display {
           text-align: center;
           margin-top: 0.5rem;
           font-size: 1.2rem;
           min-height: 1.5rem;
           flex-shrink: 0;
       }

       .win-amount {
           font-weight: bold;
           font-size: 1.4rem;
           color: #4caf50;
       }

       .lose-amount {
           font-weight: bold;
           font-size: 1.4rem;
           color: #f44336;
       }

       .controls {
           display: flex;
           justify-content: center;
           align-items: center;
           padding: 0.5rem 0;
           gap: 1rem;
           flex-shrink: 0;
           flex-wrap: wrap;
       }

       .play-btn {
           padding: 0.75rem 2rem;
           font-size: 1.2rem;
           background: linear-gradient(135deg, #333, #222);
           color: #fff;
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 30px;
           cursor: pointer;
           box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
           transition: all 0.3s ease;
           text-transform: uppercase;
           letter-spacing: 2px;
           font-weight: bold;
       }

       .play-btn:hover:not(:disabled) {
           background: linear-gradient(135deg, #444, #333);
           transform: translateY(-2px);
           box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
       }

       .play-btn:active:not(:disabled) {
           transform: translateY(1px);
       }

       .play-btn:disabled {
           opacity: 0.5;
           cursor: not-allowed;
           background: linear-gradient(135deg, #444, #333);
       }
       
       .play-btn.insufficient {
           background: linear-gradient(135deg, #800, #600);
           color: #ffcccc;
       }

       .reset-btn {
           padding: 0.75rem 1.5rem;
           font-size: 1rem;
           background: linear-gradient(135deg, #222, #111);
           color: #888;
           border: 1px solid rgba(255, 255, 255, 0.1);
           border-radius: 30px;
           cursor: pointer;
           transition: all 0.3s ease;
           text-transform: uppercase;
           letter-spacing: 1px;
       }

       .reset-btn:hover {
           color: #fff;
           border-color: rgba(255, 255, 255, 0.3);
       }

       /* Gun visualization - completely redesigned */
       .gun-scene {
           position: relative;
           width: 400px;
           height: 250px;
           margin: 20px auto;
           perspective: 600px;
       }

       .revolver {
           position: relative;
           width: 300px;
           height: 180px;
           margin: 0 auto;
       }

       .gun-body {
           position: absolute;
           width: 160px;
           height: 50px;
           background: linear-gradient(to bottom, #444, #222);
           border-radius: 8px;
           top: 70px;
           left: 120px;
           transform: rotate(0deg);
           box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
       }

       .gun-body::after {
           content: '';
           position: absolute;
           width: 120px;
           height: 40px;
           background: linear-gradient(to right, #333, #222);
           border-radius: 5px;
           right: -110px;
           top: 5px;
           box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
       }

       .gun-barrel {
           position: absolute;
           width: 150px;
           height: 16px;
           background: linear-gradient(to bottom, #333, #111);
           border-radius: 8px;
           top: 88px;
           left: 270px;
           box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
       }

       .gun-barrel::after {
           content: '';
           position: absolute;
           width: 14px;
           height: 14px;
           background: #000;
           border-radius: 50%;
           right: 0;
           top: 1px;
           box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.3);
       }

       .gun-handle {
           position: absolute;
           width: 40px;
           height: 100px;
           background: linear-gradient(135deg, #654321, #3a2a13);
           border-radius: 5px;
           top: 110px;
           left: 140px;
           transform: rotate(10deg);
           box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
       }

       .gun-trigger {
           position: absolute;
           width: 10px;
           height: 20px;
           background: #999;
           border-radius: 2px;
           top: 110px;
           left: 190px;
           box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
       }

       .gun-cylinder {
           position: absolute;
           width: 80px;
           height: 80px;
           background: linear-gradient(135deg, #555, #333);
           border-radius: 50%;
           top: 55px;
           left: 190px;
           transform-style: preserve-3d;
           transform: rotate(0deg);
           transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1);
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 5px rgba(255, 255, 255, 0.1);
       }

       .gun-cylinder::before {
           content: '';
           position: absolute;
           width: 20px;
           height: 20px;
           background: #111;
           border-radius: 50%;
           top: 30px;
           left: 30px;
           box-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
       }

       .chamber {
           position: absolute;
           width: 16px;
           height: 16px;
           background: #111;
           border-radius: 50%;
           box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.8);
       }

       .chamber:nth-child(1) { top: 15px; left: 32px; }
       .chamber:nth-child(2) { top: 32px; left: 60px; }
       .chamber:nth-child(3) { top: 60px; left: 48px; }
       .chamber:nth-child(4) { top: 60px; left: 16px; }
       .chamber:nth-child(5) { top: 32px; left: 4px; }
       .chamber:nth-child(6) { top: 6px; left: 32px; }

       .chamber.loaded {
           background: #b22222;
           box-shadow: inset 0 0 5px rgba(255, 0, 0, 0.5);
       }

       .muzzle-flash {
           position: absolute;
           width: 0;
           height: 0;
           right: -40px;
           top: 89px;
           background: radial-gradient(circle, rgba(255,255,0,1) 0%, rgba(255,165,0,0.8) 50%, rgba(255,0,0,0) 100%);
           border-radius: 50%;
           opacity: 0;
           transition: all 0.1s ease;
           z-index: 10;
       }

       .muzzle-flash.active {
           width: 80px;
           height: 80px;
           opacity: 1;
           right: -80px;
           animation: flash-animation 0.4s forwards;
       }

       @keyframes flash-animation {
           0% { opacity: 0.9; width: 20px; height: 20px; }
           20% { opacity: 1; width: 100px; height: 100px; }
           100% { opacity: 0; width: 120px; height: 120px; }
       }

       .game-result {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           display: flex;
           justify-content: center;
           align-items: center;
           background: rgba(0, 0, 0, 0.7);
           opacity: 0;
           pointer-events: none;
           transition: opacity 0.5s ease;
           z-index: 100;
           font-size: 3rem;
           font-weight: bold;
           text-transform: uppercase;
           text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
       }

       .game-result.win {
           background: rgba(0, 100, 0, 0.3);
           color: #4caf50;
           opacity: 1;
           animation: fade-in 0.5s forwards;
       }

       .game-result.lose {
           background: rgba(100, 0, 0, 0.3);
           color: #f44336;
           opacity: 1;
           animation: fade-in 0.5s forwards;
       }

       @keyframes fade-in {
           from { opacity: 0; }
           to { opacity: 1; }
       }

       .odds-display {
           text-align: center;
           margin-top: 10px;
           font-size: 1.2rem;
           font-weight: bold;
           color: #aaa;
           text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
       }

       .bet-display {
           text-align: center;
           margin-top: 5px;
           font-size: 1.1rem;
           color: gold;
           text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
       }

       .opponent-display {
           margin-bottom: 20px;
           display: flex;
           flex-direction: column;
           align-items: center;
       }

       .opponent-avatar {
           width: 60px;
           height: 60px;
           background: #333;
           border-radius: 50%;
           margin-bottom: 10px;
           background-image: linear-gradient(135deg, #444, #222);
           border: 2px solid #555;
           display: flex;
           justify-content: center;
           align-items: center;
           font-size: 30px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
       }

       .opponent-name {
           font-size: 1.2rem;
           color: #ccc;
           text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
       }

       /* Player selection for 2-player mode */
       .player-selection {
           display: flex;
           gap: 20px;
           margin: 20px 0;
           justify-content: center;
       }

       .player-option {
           width: 140px;
           height: 140px;
           background: linear-gradient(135deg, #333, #222);
           border: 2px solid rgba(255, 255, 255, 0.2);
           border-radius: 10px;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           cursor: pointer;
           transition: all 0.3s ease;
           position: relative;
           z-index: 5;
           overflow: visible;
           user-select: none;
           touch-action: manipulation;
       }

       .player-option:hover {
           transform: translateY(-5px);
           border-color: rgba(255, 255, 255, 0.5);
           box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
       }

       .player-option.selected {
           border-color: #4caf50;
           box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
       }

       .player-icon {
           font-size: 50px;
           margin-bottom: 15px;
       }

       .player-label {
           font-size: 1rem;
           color: #ccc;
       }

       .shooting-options {
           display: flex;
           gap: 20px;
           margin-top: 20px;
           justify-content: center;
       }

       .shoot-btn {
           padding: 0.5rem 1.5rem;
           font-size: 1rem;
           background: linear-gradient(135deg, #333, #222);
           color: #fff;
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 20px;
           cursor: pointer;
           transition: all 0.3s ease;
       }

       .shoot-btn:hover:not(:disabled) {
           background: linear-gradient(135deg, #444, #333);
           transform: translateY(-2px);
           box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
       }

       .shoot-btn.self {
           background: linear-gradient(135deg, #b71c1c, #7f0000);
       }

       .shoot-btn.opponent {
           background: linear-gradient(135deg, #0d47a1, #002171);
       }

       .back-link {
           margin-top: 0.5rem;
           color: rgba(255, 255, 255, 0.7);
           text-decoration: none;
           font-size: 0.9rem;
           transition: color 0.3s ease;
       }

       .back-link:hover {
           color: #fff;
           text-decoration: underline;
       }

       /* Mobile Responsive Styles */
       @media (max-width: 768px) {
           .game-container {
               width: 95%;
               height: 85vh;
               padding: 0.5rem;
           }
           
           .game-title {
               font-size: 1.5rem;
           }
           
           .game-subtitle {
               font-size: 0.8rem;
           }
           
           .gun-scene {
               width: 320px;
               height: 200px;
               transform: scale(0.8);
           }
           
           .player-selection {
               gap: 10px;
           }
           
           .player-option {
               width: 120px;
               height: 120px;
           }
           
           .coin-tracker {
               padding: 0.3rem 0.8rem;
           }

           .coin-icon {
               width: 16px;
               height: 16px;
           }

           .coin-amount {
               font-size: 0.9rem;
           }
           
           .status-display {
               font-size: 1.2rem;
           }
           
           .score-display {
               font-size: 1rem;
           }
           
           .win-amount, .lose-amount {
               font-size: 1.2rem;
           }
           
           .play-btn, .reset-btn {
               padding: 0.5rem 1rem;
               font-size: 0.9rem;
           }
           
           .odds-display {
               font-size: 1rem;
           }
           
           .bet-display {
               font-size: 0.9rem;
           }
           
           .game-result {
               font-size: 2rem;
           }
           
           .shooting-options {
               flex-direction: column;
               align-items: center;
               gap: 10px;
           }
           
           .shoot-btn {
               width: 180px;
           }
       }

       /* Special Effects */
       @keyframes glow {
           0% { filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)); }
           50% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)); }
           100% { filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)); }
       }

       @keyframes shake {
           0% { transform: translate(0, 0) rotate(0); }
           20% { transform: translate(-5px, 0) rotate(-2deg); }
           40% { transform: translate(5px, 0) rotate(2deg); }
           60% { transform: translate(-5px, 0) rotate(-2deg); }
           80% { transform: translate(5px, 0) rotate(2deg); }
           100% { transform: translate(0, 0) rotate(0); }
       }
   </style>
</head>

<body>
   <div class="game-container">
       <div class="game-header">
           <h1 class="game-title">Russian Roulette</h1>
           <p class="game-subtitle">Test your luck... if you dare</p>
           <div class="coin-tracker">
               <div class="coin-icon"></div>
               <span class="coin-amount" id="coinDisplay">0</span>
           </div>
       </div>
       
       <div id="menuSection">
           <div class="status-display">Choose Game Mode</div>
           
           <div class="player-selection">
               <button class="player-option" id="singlePlayerOption">
                   <div class="player-icon">👤</div>
                   <div class="player-label">Solo Mode</div>
               </button>
               <button class="player-option" id="multiPlayerOption">
                   <div class="player-icon">👥</div>
                   <div class="player-label">VS Opponent</div>
               </button>
           </div>
           
           <div id="startBtnContainer" style="text-align: center; margin-top: 20px; display: none;">
               <button id="startButton" class="play-btn">Start Game (100 coins)</button>
           </div>
           
           <div class="controls" style="margin-top: 30px;">
               <button id="backButton" class="reset-btn">Back to The Void Games</button>
           </div>
       </div>
       
       <div id="gameSection" style="display: none;">
           <div class="status-display" id="statusDisplay">Spinning the cylinder...</div>
           
           <div class="game-board">
               <div id="gameResult" class="game-result"></div>
               
               <div id="opponentDisplay" class="opponent-display" style="display: none;">
                   <div class="opponent-avatar">🤖</div>
                   <div class="opponent-name">AI Opponent</div>
               </div>
               
               <div class="gun-scene">
                   <div class="revolver" id="revolverContainer">
                       <div class="gun-body"></div>
                       <div class="gun-barrel"></div>
                       <div class="gun-handle"></div>
                       <div class="gun-trigger"></div>
                       <div class="gun-cylinder" id="cylinder">
                           <div class="chamber" id="chamber1"></div>
                           <div class="chamber" id="chamber2"></div>
                           <div class="chamber" id="chamber3"></div>
                           <div class="chamber" id="chamber4"></div>
                           <div class="chamber" id="chamber5"></div>
                           <div class="chamber" id="chamber6"></div>
                       </div>
                       <div class="muzzle-flash" id="flash"></div>
                   </div>
               </div>
               
               <div class="odds-display" id="oddsDisplay">Chamber 1 of 6</div>
               <div class="bet-display" id="betDisplay">Survive this round: +200 coins</div>
               
               <div class="shooting-options" id="shootingOptions" style="display: none;">
                   <button id="shootSelfBtn" class="shoot-btn self">Shoot Yourself</button>
                   <button id="shootOpponentBtn" class="shoot-btn opponent">Shoot Opponent</button>
               </div>
           </div>
           
           <div class="score-display" id="scoreDisplay"></div>
       </div>
       
       <div id="gameEndControls" class="controls" style="display: none;">
           <button id="playAgainButton" class="play-btn">Play Again (100 coins)</button>
           <button id="resetButton" class="reset-btn">Back to Menu</button>
       </div>
   </div>
   
   <a href="index.html" class="back-link"> </a>

   <!-- Firebase SDK -->

       // Firebase Configuration - UPDATED
       const firebaseConfig = {

       // Initialize Firebase
       const app = initializeApp(firebaseConfig);
       const auth = getAuth(app);

       // SECURITY: Wrap everything in an IIFE to prevent global access
       (function() {
           // Security measures
           const securityToken = generateSecurityToken();
           let lastServerBalance = 0;
           let pendingTransactions = new Set();
           
           // Generate a random security token for this session
           function generateSecurityToken() {
               return Array.from(window.crypto.getRandomValues(new Uint8Array(16)))
                   .map(b => b.toString(16).padStart(2, "0"))
                   .join('');
           }
           
           // Authentication and Coin Management
           let currentUser = null;
           let firebaseCoinBalance = 0;

           // Secure game state with private variables
           let _gameActive = false;
           let _gameComplete = false;
           let _coinBalance = 0;
           
           // Secure DOM references
           const startButton = document.getElementById('startButton');
           const playAgainButton = document.getElementById('playAgainButton');
           const resetButton = document.getElementById('resetButton');
           const backButton = document.getElementById('backButton');
           const statusDisplay = document.getElementById('statusDisplay');
           const scoreDisplay = document.getElementById('scoreDisplay');
           const coinDisplay = document.getElementById('coinDisplay');
           const menuSection = document.getElementById('menuSection');
           const gameSection = document.getElementById('gameSection');
           const gameEndControls = document.getElementById('gameEndControls');
           const revolverContainer = document.getElementById('revolverContainer');
           const cylinder = document.getElementById('cylinder');
           const flash = document.getElementById('flash');
           const gameResult = document.getElementById('gameResult');
           const oddsDisplay = document.getElementById('oddsDisplay');
           const betDisplay = document.getElementById('betDisplay');
           const singlePlayerOption = document.getElementById('singlePlayerOption');
           const multiPlayerOption = document.getElementById('multiPlayerOption');
           const opponentDisplay = document.getElementById('opponentDisplay');
           const shootingOptions = document.getElementById('shootingOptions');
           const shootSelfBtn = document.getElementById('shootSelfBtn');
           const shootOpponentBtn = document.getElementById('shootOpponentBtn');
           
           // Game configuration
           const config = {
               playCost: 100,       // Cost to play a game
               baseWinReward: 200,  // Base reward for winning a round
               rewardMultiplier: 2, // Multiplier for each survived round
               maxRounds: 5,        // Maximum number of rounds
               loseAmount: -500,    // Loss amount if you get the bullet
               opponentLoseAmount: -300, // When opponent gets the bullet
               opponentSurviveReward: 150 // Reward when opponent survives a round
           };
           
           // Game state variables
           let currentChamber = 0;   // Current chamber (0-5)
           let bulletChamber = 0;    // Chamber with the bullet
           let roundNumber = 1;      // Current round
           let gameSpinning = false; // Is the cylinder spinning
           let isProcessingMove = false; // Lock to prevent multiple rapid clicks
           let gameMode = 'solo';    // solo or vs
           let currentTurn = 'player'; // player or opponent
           let modeSelected = false; // Has the player selected a game mode
           
           // Authentication State Listener
           onAuthStateChanged(auth, async (user) => {
               if (user) {
                   // User is signed in
                   currentUser = user;
                   console.log("User signed in:", user.uid);
                   await loadFirebaseCoinBalance();
               } else {
                   // No user is signed in
                   currentUser = null;
                   console.log("No user signed in");
                   
                   // Check if Firebase is still initializing
                   setTimeout(() => {
                       // Only show login prompt if we still don't have a user after a delay
                       if (!currentUser && _coinBalance <= 0) {
                           showLoginPrompt();
                       }
                   }, 2000); // Give Firebase some time to authenticate
               }
           });

           // SECURITY: Server-side balance verification
           async function verifyBalance() {
               if (!currentUser) return false;
               
               try {
                   const userRef = doc(db, 'users', currentUser.uid);
                   const userDoc = await getDoc(userRef, { source: 'server' });
                   
                   if (userDoc.exists()) {
                       const serverBalance = userDoc.data().accountBalance || 0;
                       
                       // If local balance doesn't match server (possible tampering)
                       if (Math.abs(_coinBalance - serverBalance) > 1) { // Allow small floating point differences
                           console.log("Balance verification failed. Resetting to server value.");
                           _coinBalance = serverBalance;
                           updateCoinDisplay();
                           return false;
                       }
                       return true;
                   }
                   return false;
               } catch (error) {
                   console.error("Error verifying balance:", error);
                   return false;
               }
           }

           // SECURITY: Use Firestore transactions for safer balance updates
           async function loadFirebaseCoinBalance() {
               if (!currentUser) {
                   console.log("No user available to load balance");
                   return;
               }

               try {
                   console.log("Loading balance for user:", currentUser.uid);
                   
                   const userRef = doc(db, 'users', currentUser.uid);
                   
                   // Use a transaction to get the latest data
                   const result = await runTransaction(db, async (transaction) => {
                       const userDoc = await transaction.get(userRef);
                       
                       if (userDoc.exists()) {
                           // Get coin balance from Firestore
                           const userData = userDoc.data();
                           const serverBalance = userData.accountBalance || 0;
                           
                           // Store the verified server balance
                           lastServerBalance = serverBalance;
                           
                           return { 
                               balance: serverBalance,
                               isNew: false
                           };
                       } else {
                           // Create initial balance if no document exists
                           const initialBalance = 1000;
                           
                           // We'll create the document outside the transaction
                           return {
                               balance: initialBalance,
                               isNew: true
                           };
                       }
                   });
                   
                   // If new user, create the document
                   if (result.isNew) {
                       await setDoc(userRef, { 
                           accountBalance: result.balance,
                           username: currentUser.displayName || "Player",
                           email: currentUser.email,
                           createdAt: serverTimestamp(),
                           totalGamesPlayed: 0,
                           totalMoneySpent: 0,
                           totalMoneyEarned: 0,
                           securityToken: securityToken // Store security token for verification
                       });
                   }
                   
                   // Update local balances safely
                   firebaseCoinBalance = result.balance;
                   _coinBalance = result.balance;
                   
                   // Update UI and game state
                   updateCoinDisplay();
                   
                   return result.balance;
               } catch (error) {
                   console.error("Error loading coin balance:", error);
                   showLoginPrompt();
                   return 0;
               }
           }

           // SECURITY: Secure transaction recording with server verification
           async function recordGameTransaction(gameId, amount, transactionType) {
               if (!currentUser) return null;
               
               // Validate the security token
               if (!await verifyBalance()) {
                   console.error("Balance verification failed, transaction canceled");
                   return null;
               }

               try {
                   console.log(`Recording transaction: ${transactionType} for ${Math.abs(amount)} coins`);
                   
                   // Create a unique transaction ID
                   const transactionId = crypto.randomUUID();
                   
                   // Add to pending set to prevent duplicates
                   if (pendingTransactions.has(transactionId)) {
                       console.log("Duplicate transaction detected, skipping");
                       return null;
                   }
                   
                   pendingTransactions.add(transactionId);
                   
                   // Set a transaction lock to prevent duplicate updates
                   if (transactionInProgress) {
                       console.log("Transaction already in progress, waiting...");
                       await new Promise(resolve => setTimeout(resolve, 300));
                   }
                   
                   transactionInProgress = true;
                   
                   try {
                       // Use a Firestore transaction for atomicity
                       const result = await runTransaction(db, async (transaction) => {
                           // Get user document with fresh server data
                           const userRef = doc(db, 'users', currentUser.uid);
                           const userDoc = await transaction.get(userRef);
                           
                           if (!userDoc.exists()) {
                               throw new Error("User document not found");
                           }
                           
                           const userData = userDoc.data();
                           const currentServerBalance = userData.accountBalance || 0;
                           
                           // Perform a security check of the last known balance
                           if (Math.abs(currentServerBalance - lastServerBalance) > 1) {
                               console.error("Possible balance tampering detected");
                               return { error: "Security verification failed" };
                           }
                           
                           // Calculate new balance
                           let updatedBalance = currentServerBalance;
                           
                           if (amount > 0) {
                               updatedBalance += amount;
                               userData.totalMoneyEarned = (userData.totalMoneyEarned || 0) + Math.abs(amount);
                           } else if (amount < 0) {
                               updatedBalance -= Math.abs(amount);
                               userData.totalMoneySpent = (userData.totalMoneySpent || 0) + Math.abs(amount);
                           }
                           
                           if (transactionType === 'game_start') {
                               userData.totalGamesPlayed = (userData.totalGamesPlayed || 0) + 1;
                           }
                           
                           // Create the transaction record
                           const transactionRef = doc(collection(db, 'transactions'), transactionId);
                           
                           // Update user document with new balance and stats
                           transaction.update(userRef, {
                               accountBalance: updatedBalance,
                               totalGamesPlayed: userData.totalGamesPlayed || 0,
                               totalMoneySpent: userData.totalMoneySpent || 0,
                               totalMoneyEarned: userData.totalMoneyEarned || 0,
                               lastUpdated: serverTimestamp()
                           });
                           
                           // Set transaction data
                           transaction.set(transactionRef, {
                               userId: currentUser.uid,
                               gameId: gameId,
                               transactionId: transactionId,
                               transactionType: transactionType,
                               amount: Math.abs(amount),
                               balanceBefore: currentServerBalance,
                               balanceAfter: updatedBalance,
                               securityToken: securityToken, // Add security token for verification
                               timestamp: serverTimestamp()
                           });
                           
                           return {
                               newBalance: updatedBalance,
                               transactionId: transactionId
                           };
                       });
                       
                       // Update local state with the server-verified balance
                       if (!result.error) {
                           lastServerBalance = result.newBalance;
                           firebaseCoinBalance = result.newBalance;
                           _coinBalance = result.newBalance;
                           
                           // Update UI
                           updateCoinDisplay();
                           
                           return result;
                       } else {
                           console.error("Transaction error:", result.error);
                           return null;
                       }
                   } finally {
                       // Always release locks and clean up
                       transactionInProgress = false;
                       pendingTransactions.delete(transactionId);
                   }
               } catch (error) {
                   console.error("Transaction Error:", error);
                   pendingTransactions.clear();
                   transactionInProgress = false;
                   return null;
               }
           }

           // Spin the cylinder

                           setTimeout(makeOpponentDecision, 1500);

                   }

           // Update odds display
           function updateOddsDisplay() {
               // Calculate winning odds
               const remainingChambers = 6 - roundNumber + 1;
               const winChance = ((remainingChambers - 1) / remainingChambers * 100).toFixed(1);
               
               // Calculate current round reward
               const roundReward = config.baseWinReward * Math.pow(config.rewardMultiplier, roundNumber - 1);
               
               oddsDisplay.textContent = `Chamber ${roundNumber} of 6 (${winChance}% chance to survive)`;
               
               if (gameMode === 'solo') {
                   betDisplay.textContent = `Survive this round: +${roundReward} coins`;
               } else {
                   if (currentTurn === 'player') {
                       betDisplay.textContent = `Shoot self: +${roundReward} if you survive | Shoot opponent: +${config.opponentSurviveReward} if opponent survives`;
                   } else {
                       betDisplay.textContent = `Opponent is deciding...`;
                   }
               }
           }

               isProcessingMove = true;

               revolverContainer.style.animation = 'shake 0.3s forwards';

                       await updateCoins(roundReward, 'game_win');

                       // Reset animation

                   }, 500);
               }
           }

           // Make opponent's decision
           function makeOpponentDecision() {
               if (!_gameActive || currentTurn !== 'opponent') return;
               
               // AI decides whether to shoot self or player
               // Higher chance to shoot player as rounds progress (bullet more likely)
               const roundProgressFactor = roundNumber / 6; // 0.17 to 1.0
               const shootPlayerChance = 0.3 + (roundProgressFactor * 0.5); // 0.3 to 0.8
               
               const shootPlayer = Math.random() < shootPlayerChance;
               
               if (shootPlayer) {
                   statusDisplay.textContent = "Opponent is shooting at you...";
                   setTimeout(() => {
                       processShot('opponent');
                   }, 1000);
               } else {
                   statusDisplay.textContent = "Opponent is shooting at themselves...";
                   setTimeout(() => {
                       processShot('self');
                   }, 1000);
               }
           }
           
           // Shoot self button handler
           function shootSelf() {
               if (!_gameActive || gameSpinning || isProcessingMove || currentTurn !== 'player') return;
               processShot('self');
           }
           
           // Shoot opponent button handler
           function shootOpponent() {
               if (!_gameActive || gameSpinning || isProcessingMove || currentTurn !== 'player') return;
               processShot('opponent');
           }
           
           // Start a new game
           async function startNewGame() {
               // Verify balance first
               if (!await verifyBalance()) {
                   console.error("Balance verification failed, game start canceled");
                   return;
               }
               
               // Make sure mode is selected
               if (!modeSelected) {
                   alert("Please select a game mode first");
                   return;
               }
               
               // Deduct the play cost
               await updateCoins(-config.playCost, 'game_start');
               
               // Initialize the game
               initializeGame();
           }
           
           // Reset game and return to menu
           function resetGame() {
               // Clear game state
               _gameActive = false;
               _gameComplete = false;
               
               // Return to menu
               showMenuMode();
           }

           // SECURITY: Add anti-debugging measures
           // This makes it harder to manipulate the game via console
           const antiDebugInterval = setInterval(() => {
               const startTime = performance.now();
               debugger; // This statement gets triggered when DevTools is open
               const endTime = performance.now();
               
               // If debugger statement takes too long to execute, DevTools is likely open
               if (endTime - startTime > 100) {
                   console.log("Developer tools detected");
                   // Optional: Force a verification when developer tools detected
                   verifyBalance();
               }
           }, 2000);

           // Override console methods to detect manipulation attempts
           const originalConsoleLog = console.log;
           const originalConsoleError = console.error;
           const originalConsoleWarn = console.warn;
           
           console.log = function(...args) {
               // Check for attempts to manipulate coins
               const message = args.join(' ').toLowerCase();
               if (message.includes('coin') || message.includes('balance') || message.includes('firebase')) {
                   // Log attempt but continue
                   originalConsoleLog.apply(console, ["Security: Possible manipulation attempt detected"]);
               }
               return originalConsoleLog.apply(console, args);
           };
           
           // Anti-tampering code to detect global property modifications
           Object.defineProperty(window, 'coinBalance', {
               get: function() {
                   console.warn("Attempt to access protected property detected");
                   return 0; // Return false value
               },
               set: function() {
                   console.warn("Attempt to modify protected property detected");
                   return false;
               },
               configurable: false
           });
           
           // Prevent direct manipulation of Firebase references
           ["firebase", "db", "auth", "firestore"].forEach(prop => {
               Object.defineProperty(window, prop, {
                   get: function() {
                       console.warn(`Attempt to access ${prop} detected`);
                       return null;
                   },
                   configurable: false
               });
           });

           // Event listeners 
           startButton.addEventListener('click', startNewGame);
           playAgainButton.addEventListener('click', startNewGame);
           resetButton.addEventListener('click', resetGame);
           backButton.addEventListener('click', () => {
               window.location.href = 'index.html';
           });
           
           // Game mode selection
           singlePlayerOption.addEventListener('click', () => setGameMode('solo'));
           multiPlayerOption.addEventListener('click', () => setGameMode('vs'));
           
           // Shooting options
           shootSelfBtn.addEventListener('click', shootSelf);
           shootOpponentBtn.addEventListener('click', shootOpponent);
           
           // Solo mode gun click
           revolverContainer.addEventListener('click', pullTrigger);

           // SECURITY: Monitor for attempts to override protections
           const securityMonitor = setInterval(() => {
               try {
                   // Verify critical function integrity
                   if (updateCoins.toString().length !== updateCoins.toString().length) {
                       console.error("Function tampering detected");
                       window.location.reload(); // Force reload on tampering
                   }
                   
                   // Periodically verify balance with server (every 30 seconds)
                   if (currentUser) {
                       verifyBalance();
                   }
               } catch (e) {
                   console.error("Security monitor error:", e);
               }
           }, 30000);

           // Initialize the game
           window.addEventListener('load', () => {
               console.log("Game loading...");
               
               // Set an initial check for auth state
               if (auth && auth.currentUser) {
                   console.log("User already authenticated on page load");
                   currentUser = auth.currentUser;
               }
               
               // Check if game mode buttons are working
               console.log("Checking menu event listeners...");
               singlePlayerOption.onclick = function() {
                   console.log("Solo mode clicked");
                   setGameMode('solo');
               };
               
               multiPlayerOption.onclick = function() {
                   console.log("VS mode clicked");
                   setGameMode('vs');
               };
               
               // Properly initialize the game based on authentication state
               const initializeGame = async () => {
                   if (currentUser) {
                       console.log("Initializing game with authenticated user");
                       // Load balance securely
                       await loadFirebaseCoinBalance();
                   } else {
                       console.log("Initializing game with no user");
                       _coinBalance = 0;
                       updateCoinDisplay();
                   }
                   
                   // Start in menu mode
                   showMenuMode();
                   
                   console.log("Game initialization complete");
               };
               
               // Call the initialization function
               initializeGame();
           });
           
           // Cleanup function to prevent memory leaks
           window.addEventListener('unload', () => {
               if (antiDebugInterval) clearInterval(antiDebugInterval);
               if (securityMonitor) clearInterval(securityMonitor);
           });
       })(); // End of IIFE to protect variables
   </script>
</body>
</html>
