    <script>
        var game = {
            title: "Moto X3M 2 Origins",

            enDescription: "In a crazy landscape of snowy hills, under-the-sea tunnels and hovering helicopters, navigate your way through each level, doing stunts wherever you can. Those rotors are ouchy. Probably.",

            arDescription: "في منظر طبيعي مجنون من التلال الثلجية والأنفاق تحت الماء والهليكوبتر الطائرة، ابحر عبر كل مستوى، وقم بالحركات المثيرة أينما استطعت. تلك الشفرات مؤلمة. ربما.",
            azDescription: "Qarlı təpələr, dənizaltı tunellər və uçan helikopterlərin dəli mənzərəsində hər səviyyədə yolunu tap və hər yerdə trik et. Bu rotorlar ağrılıdır. Bəlkə də.",
            bgDescription: "В луда пейзаж от снежни хълмове, подводни тунели и висящи хеликоптери, навигирайте през всяко ниво, правейки каскади където и да е. Тези ротори болят. Вероятно.",
            bsDescription: "U ludom pejzažu sniježnih brda, podvodnih tunela i lebdećih helikoptera, pronađite svoj put kroz svaki nivo, izvodeći što više akrobacija. Ti rotori bole. Vjerovatno.",
            caDescription: "En un boig paisatge de turons nevats, túnels submarins i helicòpters que suren, navega a través de cada nivell, fent acrobàcies sempre que puguis. Aquests rotors fan mal. Probablement.",
            csDescription: "V šílené krajině zasněžených kopců, podmořských tunelů a vznášejících se vrtulníků si proplouvejte každou úrovní a dělejte co nejvíce kaskadérských kousků. Ty rotory bolí. Pravděpodobně.",
            daDescription: "I et vanvittigt landskab med sneklædte bakker, underjordiske tunneller og svævende helikoptere, navigerer du dig gennem hvert niveau og laver så mange stunts som muligt. De rotorer gør ondt. Sandsynligt.",
            deDescription: "In einer verrückten Landschaft aus schneebedeckten Hügeln, Unterwassertunneln und schwebenden Hubschraubern navigierst du dich durch jedes Level und machst so viele Stunts wie möglich. Diese Rotoren tun weh. Wahrscheinlich.",
            elDescription: "Σε ένα τρελό τοπίο με χιονισμένους λόφους, υποθαλάσσιες σήραγγες και αιωρούμενα ελικόπτερα, πλοηγήσου σε κάθε επίπεδο, κάνοντας όσο το δυνατόν περισσότερα stunts. Αυτοί οι έλικες πονάνε. Πιθανώς.",
            esDescription: "En un loco paisaje de colinas nevadas, túneles submarinos y helicópteros flotantes, navega a través de cada nivel, haciendo acrobacias siempre que puedas. Esos rotores duelen. Probablemente.",
            etDescription: "Hullume lumemaastikul lumega kaetud mägedest, veealustest tunnelitest ja hõljuvatest helikopteritest, navigeeri iga taseme läbi ja tee võimalikult palju trikke. Need rootarid teevad valu. Võib-olla.",

            faDescription: "در یک چشم انداز دیوانه وار از تپه های برفی، تونل های زیر دریایی و هلیکوپترهای معلق، راه خود را از طریق هر سطح پیدا کنید و هر جا که می توانید شیرین کاری انجام دهید. آن روتورها دردناک هستند. احتمالا.",
            fiDescription: "Hullu lumisten kukkuloiden, vedenalaisten tunnelien ja leijuvien helikopterien maailmassa navigoit tason läpi ja teet temppuja aina kun voit. Nuo roottorit satuttavat. Luultavasti.",
            frDescription: "Dans un paysage fou de collines enneigées, de tunnels sous-marins et d'hélicoptères volants, naviguez à travers chaque niveau en faisant des cascades autant que possible. Ces rotors font mal. Probablement.",
            heDescription: "בנוף מטורף של גבעות מושלגות, מנהרות תת-מימיות ומסוקים מרחפים, נווט את דרכך דרך כל רמה, תעשה פעלולים בכל מקום שאתה יכול. הרוטורים האלה כואבים. כנראה.",
            hiDescription: "बर्फीली पहाड़ियों, पानी के नीचे की सुरंगों और मंडराते हेलीकॉप्टरों के एक पागल परिदृश्य में, हर स्तर के माध्यम से अपना रास्ता नेविगेट करें, जहां भी आप कर सकते हैं स्टंट करें। वे रोटर चोट पहुँचाते हैं। शायद।",
            hrDescription: "U ludom pejzažu snježnih brda, podvodnih tunela i lebdećih helikoptera, pronađite svoj put kroz svaki nivo i radite što više trikova. Ti rotori bole. Vjerojatno.",
            huDescription: "Egy őrült tájban, hófödte dombokkal, víz alatti alagutakkal és lebegő helikopterekkel navigálj át minden szinten, és csinálj akrobatikát, ahol csak tudsz. Ezek a rotorok fájnak. Valószínűleg.",
            hyDescription: "Ձյան լեռներով, ջրասուզական թունելներով և օդում պտտվող ուղղաթիռներով հրաշքային բնապատկերում նավարկիր յուրաքանչյուր մակարդակով և կատարիր հնարքներ, որտեղ կարող ես: Այդ պտուտակները ցավոտ են: Ինչ-որ տեղ.",
            idDescription: "Dalam lanskap gila dari bukit bersalju, terowongan bawah laut, dan helikopter melayang, navigasikan jalan Anda melalui setiap level, melakukan aksi sedapat mungkin. Rotor-rotor itu sakit. Mungkin.",
            itDescription: "In un folle paesaggio di colline innevate, tunnel sottomarini ed elicotteri sospesi, naviga attraverso ogni livello, facendo acrobazie ovunque puoi. Quelle pale del rotore fanno male. Probabilmente.",
            jaDescription: "雪山と海底トンネル、ホバリングヘリコプターの狂った風景の中で、各レベルをナビゲートし、可能な限りスタントを行ってください。それらのローターは痛いです。おそらく。",

            kaDescription: "თოვლიანი ბორცვების გიჟურ ლანდშაფტში, ზღვის ქვეშ გვირაბებში და მცურავი ვერტმფრენებით, გაიარეთ თქვენი გზა თითოეულ დონეზე, გააკეთეთ ტრიუკები სადაც კი შეგიძლიათ. ეს როტორები უხეშია. ალბათ.",

            koDescription: "눈 덮인 언덕과 바닷속 터널, 그리고 공중에 떠 있는 헬리콥터가 있는 미친 풍경 속에서 각 레벨을 탐험하고 가능한 한 많은 스턴트를 하세요. 프로펠러는 아플 거예요. 아마도.",
            ltDescription: "Keistuose kraštovaizdyje su sniegu padengtais kalnais, povandeniniais tuneliais ir skraidančiais sraigtasparniais, naršykite kiekviename lygmenyje ir atlikite kuo daugiau triukų. Tie sraigtai skaudžiai. Tikriausiai.",
            lvDescription: "Trakajā ainavā ar sniegotiem kalniem, zemūdens tuneļiem un lidojošiem helikopteriem, navigējiet cauri katram līmenim, izpildot pēc iespējas vairāk triku. Tie rotori sāp. Droši vien.",
            mkDescription: "Волу луда пејзаж со снежни ридови, подводни тунели и летачки хеликоптери, навигирајте низ секое ниво, правејќи што повеќе тркачи. Тие ротори болат. Веројатно.",
            msDescription: "Dalam landskap yang gila dengan bukit bersalji, terowong bawah laut dan helikopter terapung, navigasi jalan anda melalui setiap tahap, melakukan aksi sebanyak mungkin. Rotor itu menyakitkan. Mungkin.",
            nbDescription: "I et galen landskap med snødekte åser, underjordiske tunneler og svevende helikoptre, naviger gjennom hvert nivå og gjør så mange stunts som mulig. De rotorene er vonde. Sannsynligvis.",
            nlDescription: "In een gek landschap met besneeuwde heuvels, onderwatertunnels en zwevende helikopters, navigeer je door elk level en voer zoveel mogelijk stunts uit. Die rotors doen pijn. Waarschijnlijk.",
            plDescription: "W szalonym krajobrazie ze śnieżnymi wzgórzami, podwodnymi tunelami i latającymi helikopterami, nawiguj przez każdy poziom, wykonując jak najwięcej sztuczek. Te rotory bolą. Prawdopodobnie.",
            ptDescription: "Em uma paisagem maluca com colinas nevadas, túneis submarinos e helicópteros flutuantes, navegue por cada nível, fazendo o máximo de acrobacias possível. Esses rotores doem. Provavelmente.",
            roDescription: "Într-un peisaj nebun cu dealuri înzăpezite, tuneluri subacvatice și elicoptere plutitoare, navighează prin fiecare nivel, făcând cât mai multe cascadorii. Rotorii ăia dor. Probabil.",
            ruDescription: "В сумасшедшем пейзаже со снежными холмами, подводными туннелями и летающими вертолетами, прокладывайте свой путь через каждый уровень, выполняя как можно больше трюков. Эти роторы больно. Наверное.",

            skDescription: "V bláznivej krajine zasnežených kopcov, podmorských tunelov a vznášajúcich sa vrtuľníkov si predierajte cestu každou úrovňou a robte všade, kde sa dá, kaskadérske kúsky. Tie rotory asi bolí.",
            slDescription: "V norobem svetu zasneženih hribov, podvodnih tunelov in lebdečih helikopterjev se prebijajte skozi vsako stopnjo, kjerkoli pa lahko izvajajte akrobacije. Ti rotorji verjetno bolijo.",
            sqDescription: "Në një peizazh të çmendur me kodra të mbuluara me dëborë, tunele nën det dhe helikopterë fluturues, navigoni rrugën tuaj përmes çdo niveli, duke bërë stunt kudo që mundeni. Ato rotorët ndoshta lëndojnë.",
            srDescription: "У лудом пејзажу снежних брда, подморских тунела и лебдећих хеликоптера, пронађите свој пут кроз сваки ниво, радећи акробације где год можете. Ти ротори вероватно боле.",
            svDescription: "I ett galet landskap med snöiga kullar, undervattentunnlar och svävande helikoptrar, navigera dig genom varje nivå och gör stunts var du kan. De rotorerna gör nog ont.",
            thDescription: "ในภูมิประเทศบ้าบิ่นของเนินหิมะ อุโมงค์ใต้น้ำ และเฮลิคอปเตอร์ลอยฟ้า ให้นำทางตัวเองผ่านแต่ละเลเวล ทำสตั๊นท์ทุกที่ที่ทำได้ ใบพัดเหล่านั้นอาจเจ็บนะ",
            trDescription: "Kardaştan tepeler, deniz altı tünelleri ve havada asılı helikopterlerin bulunduğu çılgın bir manzarada her seviyeyi geçerek mümkün olduğunca stunts yapın. O rotorlar muhtemelen acıtır.",
            ukDescription: "У божевільному ландшафті снігових пагорбів, підводних тунелів і завислих вертольотів прокладай свій шлях через кожен рівень, виконуючи трюки, де тільки зможеш. Ці ротори, мабуть, болять.",
            urDescription: "برفیل پہاڑیوں، سمندر کے نیچے سرنگوں اور ہلکے ہیلی کاپٹروں کی ایک پاگل زمین میں، ہر سطح کے ذریعے اپنا راستہ تلاش کریں، جہاں بھی آپ کر سکتے ہیں اسٹنٹ کریں۔ وہ روٹر شاید تکلیف دہ ہوں۔",
            viDescription: "Trong một cảnh quan điên rồ với những ngọn đồi tuyết, đường hầm dưới biển và trực thăng lơ lửng, điều hướng con đường của bạn qua từng cấp độ, thực hiện các pha nguy hiểm bất cứ nơi nào bạn có thể. Những cánh quạt đó có thể đau đấy.",
            zhDescription: "在疯狂的雪山、海底隧道和悬浮直升机景观中，导航通过每个关卡，尽可能表演特技。那些旋翼可能会疼。",
