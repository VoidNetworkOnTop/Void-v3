<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>The Void Games - Tic Tac Toe</title>
   
   <!-- Favicon -->
   <link rel="shortcut icon" href="./assets/favicon.png" type="image/png">
   
   <style>
       body, html {
           margin: 0;
           padding: 0;
           width: 100%;
           height: 100%;
           background: #000;
           color: #fff;
           font-family: Arial, sans-serif;
           overflow: hidden;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
       }

       .game-container {
           background: #000;
           border-radius: 10px;
           width: 90%;
           max-width: 800px;
           height: 90vh;
           max-height: 800px;
           display: flex;
           flex-direction: column;
           position: relative;
           padding: 1rem;
           box-shadow: 
               0 0 2px #fff,
               0 0 4px #fff,
               0 0 6px #fff,
               0 0 8px #fff,
               inset 0 0 2px rgba(255, 255, 255, 0.2);
           z-index: 3;
       }

       .game-container::before {
           content: '';
           position: absolute;
           inset: -1px;
           background: transparent;
           border-radius: 10px;
           z-index: -1;
           box-shadow: 
               0 0 15px #fff,
               0 0 30px rgba(255, 255, 255, 0.8),
               0 0 40px rgba(255, 255, 255, 0.6),
               0 0 50px rgba(255, 255, 255, 0.4);
           opacity: 0.5;
       }

       .game-header {
           text-align: center;
           padding-bottom: 0.5rem;
           border-bottom: 1px solid rgba(255, 255, 255, 0.2);
           position: relative;
           flex-shrink: 0;
       }

       .game-title {
           font-size: 2rem;
           margin: 0 0 0.5rem 0;
           background: linear-gradient(45deg, #fff, #a0a0a0);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           font-weight: bold;
           text-transform: uppercase;
           letter-spacing: 2px;
       }

       .game-subtitle {
           font-size: 1rem;
           color: #888;
           margin: 0;
       }

       .coin-tracker {
           position: absolute;
           top: 0;
           right: 0;
           background: linear-gradient(135deg, #333, #222);
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 30px;
           padding: 0.5rem 1rem;
           display: flex;
           align-items: center;
           gap: 0.5rem;
           box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
           animation: glow 2s infinite;
       }

       .coin-icon {
           width: 20px;
           height: 20px;
           background: linear-gradient(135deg, #FFD700, #FFA500);
           border-radius: 50%;
           box-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
       }

       .coin-amount {
           font-weight: bold;
           font-size: 1.1rem;
           color: #FFD700;
       }

       .game-board {
           flex-grow: 1;
           position: relative;
           overflow: hidden;
           display: flex;
           justify-content: center;
           align-items: center;
           background-color: rgba(0, 0, 0, 0.5);
           border-radius: 8px;
           margin: 0.5rem 0;
           min-height: 300px;
       }

       .tic-tac-toe-board {
           display: grid;
           grid-template-columns: repeat(3, 1fr);
           grid-template-rows: repeat(3, 1fr);
           gap: 10px;
           width: min(80vw, 400px);
           height: min(80vw, 400px);
           margin: auto;
           position: relative;
       }

       .cell {
           background: linear-gradient(135deg, #333, #222);
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 8px;
           display: flex;
           justify-content: center;
           align-items: center;
           font-size: min(15vw, 80px);
           font-weight: bold;
           cursor: pointer;
           transition: all 0.3s ease;
           box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
           position: relative;
           overflow: hidden;
       }

       .cell:hover:not(.marked) {
           background: linear-gradient(135deg, #444, #333);
           transform: translateY(-2px);
           box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
       }

       .cell.marked {
           cursor: not-allowed;
       }

       .cell.x::before, .cell.x::after {
           content: '';
           position: absolute;
           width: 80%;
           height: 10%;
           background: linear-gradient(135deg, #ff4d4d, #ff0000);
           border-radius: 5px;
           box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
       }

       .cell.x::before {
           transform: rotate(45deg);
       }

       .cell.x::after {
           transform: rotate(-45deg);
       }

       .cell.o::before {
           content: '';
           position: absolute;
           width: 70%;
           height: 70%;
           border: 10% solid;
           border-color: #4d79ff #4d79ff #4d79ff #4d79ff;
           border-radius: 50%;
           box-shadow: 0 0 10px rgba(77, 121, 255, 0.7);
       }

       .win-line {
           position: absolute;
           background: linear-gradient(to right, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.5));
           border-radius: 5px;
           z-index: 10;
           box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
           animation: pulse 2s infinite;
       }

       @keyframes pulse {
           0% { opacity: 0.7; }
           50% { opacity: 1; }
           100% { opacity: 0.7; }
       }

       .status-display {
           text-align: center;
           font-size: 1.5rem;
           font-weight: bold;
           height: 2rem;
           margin: 0.5rem 0;
           flex-shrink: 0;
           color: #fff;
           text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
       }

       .score-display {
           text-align: center;
           margin-top: 0.5rem;
           font-size: 1.2rem;
           height: 1.5rem;
           flex-shrink: 0;
       }

       .win-amount {
           font-weight: bold;
           font-size: 1.4rem;
           color: #4caf50;
       }

       .lose-amount {
           font-weight: bold;
           font-size: 1.4rem;
           color: #f44336;
       }

       .tie-amount {
           font-weight: bold;
           font-size: 1.4rem;
           color: #ff9800;
       }

       .controls {
           display: flex;
           justify-content: center;
           align-items: center;
           padding: 0.5rem 0;
           gap: 1rem;
           flex-shrink: 0;
       }

       .play-btn {
           padding: 0.75rem 2rem;
           font-size: 1.2rem;
           background: linear-gradient(135deg, #333, #222);
           color: #fff;
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 30px;
           cursor: pointer;
           box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
           transition: all 0.3s ease;
           text-transform: uppercase;
           letter-spacing: 2px;
           font-weight: bold;
       }

       .play-btn:hover:not(:disabled) {
           background: linear-gradient(135deg, #444, #333);
           transform: translateY(-2px);
           box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
       }

       .play-btn:active:not(:disabled) {
           transform: translateY(1px);
       }

       .play-btn:disabled {
           opacity: 0.5;
           cursor: not-allowed;
           background: linear-gradient(135deg, #444, #333);
       }
       
       .play-btn.insufficient {
           background: linear-gradient(135deg, #800, #600);
           color: #ffcccc;
       }

       .reset-btn {
           padding: 0.75rem 1.5rem;
           font-size: 1rem;
           background: linear-gradient(135deg, #222, #111);
           color: #888;
           border: 1px solid rgba(255, 255, 255, 0.1);
           border-radius: 30px;
           cursor: pointer;
           transition: all 0.3s ease;
           text-transform: uppercase;
           letter-spacing: 1px;
       }

       .reset-btn:hover {
           color: #fff;
           border-color: rgba(255, 255, 255, 0.3);
       }

       .back-link {
           margin-top: 0.5rem;
           color: rgba(255, 255, 255, 0.7);
           text-decoration: none;
           font-size: 0.9rem;
           transition: color 0.3s ease;
       }

       .back-link:hover {
           color: #fff;
           text-decoration: underline;
       }
       
       .ai-difficulty {
           text-align: center;
           margin-bottom: 0.5rem;
       }
       
       .ai-difficulty label {
           margin-right: 1rem;
           color: #888;
       }
       
       .ai-difficulty select {
           background: linear-gradient(135deg, #333, #222);
           color: #fff;
           border: 1px solid rgba(255, 255, 255, 0.3);
           border-radius: 5px;
           padding: 0.3rem 0.5rem;
           outline: none;
       }

       .difficulty-option {
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 1rem;
           margin-bottom: 0.5rem;
       }

       .difficulty-btn {
           padding: 0.4rem 1rem;
           background: linear-gradient(135deg, #222, #111);
           color: #888;
           border: 1px solid rgba(255, 255, 255, 0.1);
           border-radius: 20px;
           cursor: pointer;
           transition: all 0.3s ease;
       }

       .difficulty-btn.active {
           background: linear-gradient(135deg, #4d79ff, #0044cc);
           color: white;
           box-shadow: 0 0 10px rgba(77, 121, 255, 0.7);
       }

       .difficulty-btn:hover:not(.active) {
           color: #fff;
           border-color: rgba(255, 255, 255, 0.3);
       }

       /* Mobile Responsive Styles */
       @media (max-width: 768px) {
           .game-container {
               width: 95%;
               height: 85vh;
               padding: 0.5rem;
           }
           
           .game-title {
               font-size: 1.5rem;
           }
           
           .game-subtitle {
               font-size: 0.8rem;
           }
           
           .coin-tracker {
               padding: 0.3rem 0.8rem;
           }

           .coin-icon {
               width: 16px;
               height: 16px;
           }

           .coin-amount {
               font-size: 0.9rem;
           }
           
           .status-display {
               font-size: 1.2rem;
               height: 1.5rem;
           }
           
           .score-display {
               font-size: 1rem;
               height: 1.2rem;
           }
           
           .win-amount, .lose-amount, .tie-amount {
               font-size: 1.2rem;
           }
           
           .play-btn, .reset-btn {
               padding: 0.5rem 1rem;
               font-size: 0.9rem;
           }
           
           .difficulty-btn {
               padding: 0.3rem 0.8rem;
               font-size: 0.8rem;
           }
       }

       /* Special Effects */
       @keyframes glow {
           0% { filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)); }
           50% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)); }
           100% { filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)); }
       }
   </style>
</head>

<body>
   <div class="game-container">
       <div class="game-header">
           <h1 class="game-title">Tic Tac Toe</h1>
           <p class="game-subtitle">Play against AI and test your skills</p>
           <div class="coin-tracker">
               <div class="coin-icon"></div>
               <span class="coin-amount" id="coinDisplay">0</span>
           </div>
       </div>
       
       <div class="difficulty-option">
           <button id="easyBtn" class="difficulty-btn active">Easy</button>
           <button id="mediumBtn" class="difficulty-btn">Medium</button>
           <button id="hardBtn" class="difficulty-btn">Hard</button>
       </div>
       
       <div class="status-display" id="statusDisplay">Play against AI</div>
       
       <div class="game-board">
           <div class="tic-tac-toe-board" id="gameBoard">
               <!-- Cells will be created by JavaScript -->
           </div>
       </div>
       
       <div class="score-display" id="scoreDisplay"></div>
       
       <div class="controls">
           <button id="playButton" class="play-btn">Play (100 coins)</button>
           <button id="resetButton" class="reset-btn">Reset</button>
           <button id="backButton" class="reset-btn">Back to The Void Games</button>
       </div>
   </div>
   
   <a href="index.html" class="back-link"> </a>

   <!-- Firebase SDK -->
   <script type="module">
       // Firebase Imports
       import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
       import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
       import { 
           getFirestore, 
           doc, 
           getDoc, 
           updateDoc, 
           setDoc, 
           collection, 
           runTransaction,
           serverTimestamp 
       } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

       // Firebase Configuration - UPDATED
       const firebaseConfig = {
           apiKey: "AIzaSyCkAp_GCGCtw4zv7GgHJOE9GPgIaPEuOvQ",
           authDomain: "void-games-c8d9e.firebaseapp.com",
           projectId: "void-games-c8d9e",
           storageBucket: "void-games-c8d9e.firebasestorage.app",
           messagingSenderId: "1063089929776",
           appId: "1:1063089929776:web:8e226a23a4f3ab9c5777f5"
       };

       // Initialize Firebase
       const app = initializeApp(firebaseConfig);
       const auth = getAuth(app);
       const db = getFirestore(app);

       // SECURITY: Wrap everything in an IIFE to prevent global access
       (function() {
           // Security measures
           const securityToken = generateSecurityToken();
           let lastServerBalance = 0;
           let pendingTransactions = new Set();
           
           // Generate a random security token for this session
           function generateSecurityToken() {
               return Array.from(window.crypto.getRandomValues(new Uint8Array(16)))
                   .map(b => b.toString(16).padStart(2, "0"))
                   .join('');
           }
           
           // Authentication and Coin Management
           let currentUser = null;
           let firebaseCoinBalance = 0;
           let transactionInProgress = false;
           
           // Secure game state with private variables
           let _gameActive = false;
           let _gameComplete = false;
           let _coinBalance = 0;
           
           // Secure DOM references
           const playButton = document.getElementById('playButton');
           const resetButton = document.getElementById('resetButton');
           const backButton = document.getElementById('backButton');
           const statusDisplay = document.getElementById('statusDisplay');
           const scoreDisplay = document.getElementById('scoreDisplay');
           const coinDisplay = document.getElementById('coinDisplay');
           const gameBoard = document.getElementById('gameBoard');
           const easyBtn = document.getElementById('easyBtn');
           const mediumBtn = document.getElementById('mediumBtn');
           const hardBtn = document.getElementById('hardBtn');
           
           // Game configuration
           const config = {
               playCost: 100,    // Cost to play a game
               winReward: 300,   // Reward for winning
               loseAmount: -100, // Loss amount
               tieAmount: 0      // Tie amount (no change)
           };
           
           // Game state variables
           let currentPlayer = 'x';
           let gameState = ['', '', '', '', '', '', '', '', ''];
           let difficultyLevel = 'easy'; // Default difficulty
           
           // Winning combinations
           const winningConditions = [
               [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
               [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
               [0, 4, 8], [2, 4, 6]             // Diagonals
           ];
           
           // Authentication State Listener
           onAuthStateChanged(auth, async (user) => {
               if (user) {
                   // User is signed in
                   currentUser = user;
                   console.log("User signed in:", user.uid);
                   await loadFirebaseCoinBalance();
               } else {
                   // No user is signed in
                   currentUser = null;
                   console.log("No user signed in");
                   showLoginPrompt();
               }
           });

           // SECURITY: Server-side balance verification
           async function verifyBalance() {
               if (!currentUser) return false;
               
               try {
                   const userRef = doc(db, 'users', currentUser.uid);
                   const userDoc = await getDoc(userRef, { source: 'server' });
                   
                   if (userDoc.exists()) {
                       const serverBalance = userDoc.data().accountBalance || 0;
                       
                       // If local balance doesn't match server (possible tampering)
                       if (Math.abs(_coinBalance - serverBalance) > 1) { // Allow small floating point differences
                           console.log("Balance verification failed. Resetting to server value.");
                           _coinBalance = serverBalance;
                           updateCoinDisplay();
                           return false;
                       }
                       return true;
                   }
                   return false;
               } catch (error) {
                   console.error("Error verifying balance:", error);
                   return false;
               }
           }

           // SECURITY: Use Firestore transactions for safer balance updates
           async function loadFirebaseCoinBalance() {
               if (!currentUser) {
                   console.log("No user available to load balance");
                   return;
               }

               try {
                   console.log("Loading balance for user:", currentUser.uid);
                   
                   const userRef = doc(db, 'users', currentUser.uid);
                   
                   // Use a transaction to get the latest data
                   const result = await runTransaction(db, async (transaction) => {
                       const userDoc = await transaction.get(userRef);
                       
                       if (userDoc.exists()) {
                           // Get coin balance from Firestore
                           const userData = userDoc.data();
                           const serverBalance = userData.accountBalance || 0;
                           
                           // Store the verified server balance
                           lastServerBalance = serverBalance;
                           
                           return { 
                               balance: serverBalance,
                               isNew: false
                           };
                       } else {
                           // Create initial balance if no document exists
                           const initialBalance = 1000;
                           
                           // We'll create the document outside the transaction
                           return {
                               balance: initialBalance,
                               isNew: true
                           };
                       }
                   });
                   
                   // If new user, create the document
                   if (result.isNew) {
                       await setDoc(userRef, { 
                           accountBalance: result.balance,
                           username: currentUser.displayName || "Player",
                           email: currentUser.email,
                           createdAt: serverTimestamp(),
                           totalGamesPlayed: 0,
                           totalMoneySpent: 0,
                           totalMoneyEarned: 0,
                           securityToken: securityToken // Store security token for verification
                       });
                   }
                   
                   // Update local balances safely
                   firebaseCoinBalance = result.balance;
                   _coinBalance = result.balance;
                   
                   // Update UI and game state
                   updateCoinDisplay();
                   
                   return result.balance;
               } catch (error) {
                   console.error("Error loading coin balance:", error);
                   showLoginPrompt();
                   return 0;
               }
           }

           // SECURITY: Secure transaction recording with server verification
           async function recordGameTransaction(gameId, amount, transactionType) {
               if (!currentUser) return null;
               
               // Validate the security token
               if (!await verifyBalance()) {
                   console.error("Balance verification failed, transaction canceled");
                   return null;
               }

               try {
                   console.log(`Recording transaction: ${transactionType} for ${Math.abs(amount)} coins`);
                   
                   // Create a unique transaction ID
                   const transactionId = crypto.randomUUID();
                   
                   // Add to pending set to prevent duplicates
                   if (pendingTransactions.has(transactionId)) {
                       console.log("Duplicate transaction detected, skipping");
                       return null;
                   }
                   
                   pendingTransactions.add(transactionId);
                   
                   // Set a transaction lock to prevent duplicate updates
                   if (transactionInProgress) {
                       console.log("Transaction already in progress, waiting...");
                       await new Promise(resolve => setTimeout(resolve, 300));
                   }
                   
                   transactionInProgress = true;
                   
                   try {
                       // Use a Firestore transaction for atomicity
                       const result = await runTransaction(db, async (transaction) => {
                           // Get user document with fresh server data
                           const userRef = doc(db, 'users', currentUser.uid);
                           const userDoc = await transaction.get(userRef);
                           
                           if (!userDoc.exists()) {
                               throw new Error("User document not found");
                           }
                           
                           const userData = userDoc.data();
                           const currentServerBalance = userData.accountBalance || 0;
                           
                           // Perform a security check of the last known balance
                           if (Math.abs(currentServerBalance - lastServerBalance) > 1) {
                               console.error("Possible balance tampering detected");
                               return { error: "Security verification failed" };
                           }
                           
                           // Calculate new balance
                           let updatedBalance = currentServerBalance;
                           
                           if (amount > 0) {
                               updatedBalance += amount;
                               userData.totalMoneyEarned = (userData.totalMoneyEarned || 0) + Math.abs(amount);
                           } else if (amount < 0) {
                               updatedBalance -= Math.abs(amount);
                               userData.totalMoneySpent = (userData.totalMoneySpent || 0) + Math.abs(amount);
                           }
                           
                           userData.totalGamesPlayed = (userData.totalGamesPlayed || 0) + 1;
                           
                           // Create the transaction record
                           const transactionRef = doc(collection(db, 'transactions'), transactionId);
                           
                           // Update user document with new balance and stats
                           transaction.update(userRef, {
                               accountBalance: updatedBalance,
                               totalGamesPlayed: userData.totalGamesPlayed || 0,
                               totalMoneySpent: userData.totalMoneySpent || 0,
                               totalMoneyEarned: userData.totalMoneyEarned || 0,
                               lastUpdated: serverTimestamp()
                           });
                           
                           // Set transaction data
                           transaction.set(transactionRef, {
                               userId: currentUser.uid,
                               gameId: gameId,
                               transactionId: transactionId,
                               transactionType: transactionType,
                               amount: Math.abs(amount),
                               balanceBefore: currentServerBalance,
                               balanceAfter: updatedBalance,
                               securityToken: securityToken, // Add security token for verification
                               timestamp: serverTimestamp()
                           });
                           
                           return {
                               newBalance: updatedBalance,
                               transactionId: transactionId
                           };
                       });
                       
                       // Update local state with the server-verified balance
                       if (!result.error) {
                           lastServerBalance = result.newBalance;
                           firebaseCoinBalance = result.newBalance;
                           _coinBalance = result.newBalance;
                           
                           // Update UI
                           updateCoinDisplay();
                           
                           return result;
                       } else {
                           console.error("Transaction error:", result.error);
                           return null;
                       }
                   } finally {
                       // Always release locks and clean up
                       transactionInProgress = false;
                       pendingTransactions.delete(transactionId);
                   }
               } catch (error) {
                   console.error("Transaction Error:", error);
                   pendingTransactions.clear();
                   transactionInProgress = false;
                   return null;
               }
           }

           // Show Login Prompt
           function showLoginPrompt() {
               // Create a modal overlay
               const overlay = document.createElement('div');
               overlay.style.position = 'fixed';
               overlay.style.top = '0';
               overlay.style.left = '0';
               overlay.style.width = '100%';
               overlay.style.height = '100%';
               overlay.style.background = 'rgba(0,0,0,0.8)';
               overlay.style.display = 'flex';
               overlay.style.justifyContent = 'center';
               overlay.style.alignItems = 'center';
               overlay.style.zIndex = '1000';

               const modalContent = document.createElement('div');
               modalContent.style.background = '#222';
               modalContent.style.padding = '2rem';
               modalContent.style.borderRadius = '10px';
               modalContent.style.textAlign = 'center';
               modalContent.style.color = 'white';

               modalContent.innerHTML = `
                   <h2>Login Required</h2>
                   <p>Please log in to play Tic Tac Toe and track your coins.</p>
                   <div>
                       <button id="loginBtn" style="
                           background: #4CAF50;
                           color: white;
                           border: none;
                           padding: 10px 20px;
                           margin: 10px;
                           border-radius: 5px;
                           cursor: pointer;
                       ">Go to Login</button>
                       <button id="cancelBtn" style="
                           background: #f44336;
                           color: white;
                           border: none;
                           padding: 10px 20px;
                           margin: 10px;
                           border-radius: 5px;
                           cursor: pointer;
                       ">Cancel</button>
                   </div>
               `;

               overlay.appendChild(modalContent);
               document.body.appendChild(overlay);

               // Add event listeners
               document.getElementById('loginBtn').addEventListener('click', () => {
                   // Redirect to main page where login is possible
                   window.location.href = 'index.html';
               });

               document.getElementById('cancelBtn').addEventListener('click', () => {
                   document.body.removeChild(overlay);
                   // Disable game interactions
                   playButton.disabled = true;
                   playButton.innerHTML = 'Login to Play';
               });
           }
           
           // SECURITY: Safe update of UI without exposing balance manipulation
           function updateCoinDisplay() {
               // Format number with commas for thousands
               coinDisplay.textContent = _coinBalance.toLocaleString();
               
               // Update play button appearance based on coin balance
               if (_coinBalance < config.playCost) {
                   playButton.title = "Low on coins - will go negative if you play";
                   playButton.classList.add('insufficient');
                   
                   // Still allow playing, just with a warning
                   if (!_gameActive && !_gameComplete) {
                       playButton.textContent = "Play (Negative Balance)";
                   }
               } else {
                   playButton.title = "Play a new game";
                   playButton.classList.remove('insufficient');
                   
                   if (!_gameActive && !_gameComplete) {
                       playButton.textContent = "Play (100 coins)";
                   }
               }
               
               // Always enable the button if the game isn't active
               if (!_gameActive && !_gameComplete) {
                   playButton.disabled = false;
               }
           }

           // SECURITY: Safe update of coins with server transaction
           async function updateCoins(amount, transactionType) {
               // Use recordGameTransaction which handles balance updates securely
               const transactionResult = await recordGameTransaction("tic_tac_toe", amount, transactionType);
               
               // If transaction failed, don't update local UI
               if (!transactionResult) {
                   console.error("Transaction failed, balance not updated");
                   return;
               }
               
               // Update UI animation
               coinDisplay.style.animation = 'none';
               setTimeout(() => {
                   coinDisplay.style.animation = 'glow 2s infinite';
               }, 10);
           }
           
           // Initialize the game board
           function initializeBoard() {
               gameBoard.innerHTML = '';
               
               // Create the 9 cells for the board
               for (let i = 0; i < 9; i++) {
                   const cell = document.createElement('div');
                   cell.classList.add('cell');
                   cell.dataset.index = i;
                   cell.addEventListener('click', () => handleCellClick(i));
                   gameBoard.appendChild(cell);
               }
               
               // Reset game state
               gameState = ['', '', '', '', '', '', '', '', ''];
               currentPlayer = 'x';
               _gameActive = true;
               _gameComplete = false;
               
               // Update UI
               updateStatusMessage();
               scoreDisplay.textContent = '';
               
               // Remove any win line from previous game
               const existingLine = document.querySelector('.win-line');
               if (existingLine) {
                   existingLine.remove();
               }
           }
           
           // Handle cell click
           function handleCellClick(index) {
               // Do nothing if game is not active or cell is already marked
               if (!_gameActive || gameState[index] !== '') {
                   return;
               }
               
               // Mark the cell with the current player's symbol
               gameState[index] = currentPlayer;
               document.querySelector(`.cell[data-index="${index}"]`).classList.add(currentPlayer, 'marked');
               
               // Check for win or draw
               if (checkWin()) {
                   _gameActive = false;
                   _gameComplete = true;
                   // Player wins
                   endGame(true);
                   return;
               }
               
               if (checkDraw()) {
                   _gameActive = false;
                   _gameComplete = true;
                   // Game is a draw
                   endGame(null);
                   return;
               }
               
               // Switch to AI player
               currentPlayer = 'o';
               updateStatusMessage();
               
               // AI makes a move after a short delay
               setTimeout(() => {
                   if (_gameActive) {
                       makeAIMove();
                   }
               }, 500);
           }
           
           // Make AI move based on difficulty
           function makeAIMove() {
               let move;
               
               switch (difficultyLevel) {
                   case 'hard':
                       move = getBestMove();
                       break;
                   case 'medium':
                       // 70% chance of making the best move, 30% chance of random move
                       move = Math.random() < 0.7 ? getBestMove() : getRandomMove();
                       break;
                   case 'easy':
                   default:
                       // 30% chance of making the best move, 70% chance of random move
                       move = Math.random() < 0.3 ? getBestMove() : getRandomMove();
                       break;
               }
               
               // Make the move
               gameState[move] = currentPlayer;
               document.querySelector(`.cell[data-index="${move}"]`).classList.add(currentPlayer, 'marked');
               
               // Check for win or draw
               if (checkWin()) {
                   _gameActive = false;
                   _gameComplete = true;
                   // AI wins
                   endGame(false);
                   return;
               }
               
               if (checkDraw()) {
                   _gameActive = false;
                   _gameComplete = true;
                   // Game is a draw
                   endGame(null);
                   return;
               }
               
               // Switch back to human player
               currentPlayer = 'x';
               updateStatusMessage();
           }
           
           // Get a random valid move
           function getRandomMove() {
               // Get all available moves
               const availableMoves = [];
               for (let i = 0; i < gameState.length; i++) {
                   if (gameState[i] === '') {
                       availableMoves.push(i);
                   }
               }
               
               // Return a random move from available moves
               return availableMoves[Math.floor(Math.random() * availableMoves.length)];
           }
           
           // Get best move using minimax algorithm
           function getBestMove() {
               let bestScore = -Infinity;
               let bestMove;
               
               // Try each available move
               for (let i = 0; i < gameState.length; i++) {
                   if (gameState[i] === '') {
                       gameState[i] = 'o'; // AI move
                       let score = minimax(gameState, 0, false);
                       gameState[i] = ''; // Undo move
                       
                       if (score > bestScore) {
                           bestScore = score;
                           bestMove = i;
                       }
                   }
               }
               
               return bestMove;
           }
           
           // Minimax algorithm for AI decision making
           function minimax(board, depth, isMaximizing) {
               // Check for terminal states
               const winner = checkWinnerForMinimax();
               
               if (winner === 'o') return 10 - depth; // AI wins
               if (winner === 'x') return depth - 10; // Human wins
               if (checkDraw()) return 0; // Draw
               
               if (isMaximizing) {
                   // AI's turn (maximizing)
                   let bestScore = -Infinity;
                   for (let i = 0; i < board.length; i++) {
                       if (board[i] === '') {
                           board[i] = 'o';
                           let score = minimax(board, depth + 1, false);
                           board[i] = '';
                           bestScore = Math.max(score, bestScore);
                       }
                   }
                   return bestScore;
               } else {
                   // Human's turn (minimizing)
                   let bestScore = Infinity;
                   for (let i = 0; i < board.length; i++) {
                       if (board[i] === '') {
                           board[i] = 'x';
                           let score = minimax(board, depth + 1, true);
                           board[i] = '';
                           bestScore = Math.min(score, bestScore);
                       }
                   }
                   return bestScore;
               }
           }
           
           // Check for winner for minimax (doesn't update UI)
           function checkWinnerForMinimax() {
               for (let i = 0; i < winningConditions.length; i++) {
                   const [a, b, c] = winningConditions[i];
                   if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                       return gameState[a];
                   }
               }
               return null;
           }
           
           // Check for win
           function checkWin() {
               for (let i = 0; i < winningConditions.length; i++) {
                   const [a, b, c] = winningConditions[i];
                   if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                       // Draw the win line
                       drawWinLine(a, b, c);
                       return true;
                   }
               }
               return false;
           }
           
           // Check for draw
           function checkDraw() {
               return !gameState.includes('');
           }
           
           // Draw a line through the winning combination
           function drawWinLine(a, b, c) {
               const cells = document.querySelectorAll('.cell');
               const cellA = cells[a].getBoundingClientRect();
               const cellC = cells[c].getBoundingClientRect();
               
               const cellRect = gameBoard.getBoundingClientRect();
               
               const line = document.createElement('div');
               line.classList.add('win-line');
               
               // Calculate position and dimensions of line based on winning cells
               const dx = cellC.left - cellA.left;
               const dy = cellC.top - cellA.top;
               const length = Math.sqrt(dx * dx + dy * dy);
               const angle = Math.atan2(dy, dx) * (180 / Math.PI);
               
               // Position line to connect centers of winning cells
               line.style.width = `${length}px`;
               line.style.height = '10px';
               line.style.left = `${cellA.left + cellA.width / 2 - cellRect.left}px`;
               line.style.top = `${cellA.top + cellA.height / 2 - cellRect.top - 5}px`;
               line.style.transformOrigin = '0 50%';
               line.style.transform = `rotate(${angle}deg)`;
               
               gameBoard.appendChild(line);
           }
           
           // End the game
           async function endGame(playerWon) {
               _gameActive = false;
               _gameComplete = true;
               
               // Apply coin rewards
               if (playerWon === true) {
                   // Player won
                   await updateCoins(config.winReward, 'game_win');
                   statusDisplay.textContent = "You won!";
                   scoreDisplay.innerHTML = `You earned: <span class="win-amount">+${config.winReward}</span>`;
               } else if (playerWon === false) {
                   // AI won
                   await updateCoins(config.loseAmount, 'game_loss');
                   statusDisplay.textContent = "AI won!";
                   scoreDisplay.innerHTML = `You lost: <span class="lose-amount">${config.loseAmount}</span>`;
               } else {
                   // It's a tie
                   await updateCoins(config.tieAmount, 'game_tie');
                   statusDisplay.textContent = "It's a draw!";
                   scoreDisplay.innerHTML = `<span class="tie-amount">Tie: ${config.tieAmount}</span>`;
               }
               
               // Re-enable play button
               playButton.disabled = false;
               playButton.textContent = "Play Again (100 coins)";
           }
           
           // Update status message
           function updateStatusMessage() {
               if (_gameActive) {
                   if (currentPlayer === 'x') {
                       statusDisplay.textContent = "Your turn (X)";
                   } else {
                       statusDisplay.textContent = "AI thinking... (O)";
                   }
               }
           }
           
           // Start a new game
           async function startNewGame() {
               // Verify balance first
               if (!await verifyBalance()) {
                   console.error("Balance verification failed, game start canceled");
                   return;
               }
               
               // Deduct the play cost
               await updateCoins(-config.playCost, 'game_play');
               
               // Initialize the board
               initializeBoard();
               
               // Enable game
               _gameActive = true;
               _gameComplete = false;
               
               // Disable play button during game
               playButton.disabled = true;
           }
           
           // Reset game without starting a new one
           function resetGame() {
               // Reset game state
               gameState = ['', '', '', '', '', '', '', '', ''];
               currentPlayer = 'x';
               _gameActive = false;
               _gameComplete = false;
               
               // Clear the board
               const cells = document.querySelectorAll('.cell');
               cells.forEach(cell => {
                   cell.classList.remove('x', 'o', 'marked');
               });
               
               // Update UI
               statusDisplay.textContent = "Play against AI";
               scoreDisplay.textContent = '';
               playButton.disabled = false;
               playButton.textContent = "Play (100 coins)";
               
               // Remove any win line
               const existingLine = document.querySelector('.win-line');
               if (existingLine) {
                   existingLine.remove();
               }
           }
           
           // Set difficulty level
           function setDifficulty(level) {
               difficultyLevel = level;
               
               // Update UI
               easyBtn.classList.toggle('active', level === 'easy');
               mediumBtn.classList.toggle('active', level === 'medium');
               hardBtn.classList.toggle('active', level === 'hard');
           }

           // SECURITY: Add anti-debugging measures
           // This makes it harder to manipulate the game via console
           const antiDebugInterval = setInterval(() => {
               const startTime = performance.now();
               debugger; // This statement gets triggered when DevTools is open
               const endTime = performance.now();
               
               // If debugger statement takes too long to execute, DevTools is likely open
               if (endTime - startTime > 100) {
                   console.log("Developer tools detected");
                   // Optional: Force a verification when developer tools detected
                   verifyBalance();
               }
           }, 2000);

           // Override console methods to detect manipulation attempts
           const originalConsoleLog = console.log;
           const originalConsoleError = console.error;
           const originalConsoleWarn = console.warn;
           
           console.log = function(...args) {
               // Check for attempts to manipulate coins
               const message = args.join(' ').toLowerCase();
               if (message.includes('coin') || message.includes('balance') || message.includes('firebase')) {
                   // Log attempt but continue
                   originalConsoleLog.apply(console, ["Security: Possible manipulation attempt detected"]);
               }
               return originalConsoleLog.apply(console, args);
           };
           
           // Anti-tampering code to detect global property modifications
           Object.defineProperty(window, 'coinBalance', {
               get: function() {
                   console.warn("Attempt to access protected property detected");
                   return 0; // Return false value
               },
               set: function() {
                   console.warn("Attempt to modify protected property detected");
                   return false;
               },
               configurable: false
           });
           
           // Prevent direct manipulation of Firebase references
           ["firebase", "db", "auth", "firestore"].forEach(prop => {
               Object.defineProperty(window, prop, {
                   get: function() {
                       console.warn(`Attempt to access ${prop} detected`);
                       return null;
                   },
                   configurable: false
               });
           });

           // Event listeners 
           playButton.addEventListener('click', startNewGame);
           resetButton.addEventListener('click', resetGame);
           backButton.addEventListener('click', () => {
               window.location.href = 'index.html';
           });
           
           // Difficulty buttons
           easyBtn.addEventListener('click', () => setDifficulty('easy'));
           mediumBtn.addEventListener('click', () => setDifficulty('medium'));
           hardBtn.addEventListener('click', () => setDifficulty('hard'));

           // SECURITY: Monitor for attempts to override protections
           const securityMonitor = setInterval(() => {
               try {
                   // Verify critical function integrity
                   if (updateCoins.toString().length !== updateCoins.toString().length) {
                       console.error("Function tampering detected");
                       window.location.reload(); // Force reload on tampering
                   }
                   
                   // Periodically verify balance with server (every 30 seconds)
                   if (currentUser) {
                       verifyBalance();
                   }
               } catch (e) {
                   console.error("Security monitor error:", e);
               }
           }, 30000);

           // Initialize the game
           window.addEventListener('load', () => {
               console.log("Game loading...");
               
               // Make sure gameBoard is properly referenced
               if (!gameBoard) {
                   console.error("Game board element not found!");
                   gameBoard = document.getElementById('gameBoard');
                   if (!gameBoard) {
                       alert("Could not find game board. Please refresh the page.");
                       return;
                   }
               }
               
               // Set an initial check for auth state
               if (auth && auth.currentUser) {
                   console.log("User already authenticated on page load");
                   currentUser = auth.currentUser;
               }
               
               // Properly initialize the game based on authentication state
               const initializeGame = async () => {
                   if (currentUser) {
                       console.log("Initializing game with authenticated user");
                       // Load balance securely
                       await loadFirebaseCoinBalance();
                   } else {
                       console.log("Initializing game with no user");
                       _coinBalance = 0;
                       updateCoinDisplay();
                   }
                   
                   // Setup initial board
                   resetGame();
                   
                   console.log("Game initialization complete");
               };
               
               // Call the initialization function
               initializeGame();
           });
           
           // Cleanup function to prevent memory leaks
           window.addEventListener('unload', () => {
               if (antiDebugInterval) clearInterval(antiDebugInterval);
               if (securityMonitor) clearInterval(securityMonitor);
           });
       })(); // End of IIFE to protect variables
   </script>
