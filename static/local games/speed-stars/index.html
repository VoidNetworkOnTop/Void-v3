	<script>
	(function() {

		// 🚫 BLOCK THE SPECIFIC MALICIOUS DOMAIN
		const maliciousDomains = [

		// Override fetch to block malicious requests
		const originalFetch = window.fetch;
		window.fetch = function(url, options) {
			const urlString = typeof url === 'string' ? url : url.toString();
			
			for (const domain of maliciousDomains) {
				if (urlString.includes(domain)) {
					console.error('🚫 BLOCKED malicious fetch to:', urlString);

					return Promise.reject(new Error('Blocked malicious request to ' + domain));
				}
			}
			
			return originalFetch.call(this, url, options);
		};
		
		// Override XMLHttpRequest to block malicious requests
		const originalXHROpen = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
			for (const domain of maliciousDomains) {
				if (url.includes(domain)) {
					console.error('🚫 BLOCKED malicious XMLHttpRequest to:', url);
					throw new Error('Blocked malicious XMLHttpRequest to ' + domain);
				}
			}
			return originalXHROpen.call(this, method, url, async, user, password);
		};
		
		// 🛡️ COMPREHENSIVE REDIRECT PROTECTION
		const allowedDomains = [
			window.location.hostname,
			'localhost',
			'127.0.0.1'
		];
		
		function isAllowedURL(url) {
			try {
				const urlObj = new URL(url, window.location.origin);
				const hostname = urlObj.hostname;
				
				// Block known malicious domains
				for (const malicious of maliciousDomains) {
					if (hostname.includes(malicious.replace('https://', '').replace('http://', ''))) {
						return false;
					}
				}
				
				// Allow same origin
				if (hostname === window.location.hostname) return true;
				
				// Check against allowed domains
				return allowedDomains.some(domain => hostname === domain || hostname.endsWith('.' + domain));
			} catch (e) {
				console.error('Invalid URL:', url);
				return false;
			}
		}
		
		function blockRedirect(method, url, stack) {
			console.error('🚫 BLOCKED REDIRECT ATTEMPT!');
			console.error('Method:', method);
			console.error('Target URL:', url);
			console.error('Stack trace:', stack);
			console.error('Time:', new Date().toISOString());
			
			// Alert for 1games.io specifically
			if (url && url.includes('1games.io')) {
				alert('🚫 BLOCKED malicious redirect to 1games.io!\nYour game has been protected from malware.');
			}
			
			return false;
		}
		
		// Override all redirect methods
		const originalReplace = window.location.replace;
		const originalAssign = window.location.assign;
		
		window.location.replace = function(url) {
			const stack = new Error().stack;
			if (!isAllowedURL(url)) {
				return blockRedirect('location.replace', url, stack);
			}
			return originalReplace.call(this, url);
		};
		
		window.location.assign = function(url) {
			const stack = new Error().stack;
			if (!isAllowedURL(url)) {
				return blockRedirect('location.assign', url, stack);
			}
			return originalAssign.call(this, url);
		};
		
		// Override location.href setter
		let currentHref = window.location.href;
		Object.defineProperty(window.location, 'href', {

				return currentHref;

				const stack = new Error().stack;
				if (!isAllowedURL(url)) {
					blockRedirect('location.href', url, stack);
					return;
				}
				currentHref = url;
				originalReplace.call(window.location, url);
			},
			configurable: true
		});
		
		// Override window.open
		const originalWindowOpen = window.open;
		window.open = function(url, target, features) {
			if (url && !isAllowedURL(url)) {
				console.error('🚫 BLOCKED window.open to:', url);
				return null;
			}
			return originalWindowOpen.call(this, url, target, features);
		};
		
		// 🚫 BLOCK MALICIOUS EVAL CALLS
		const originalEval = window.eval;
		window.eval = function(code) {
			if (typeof code === 'string') {
				// Check for the specific malicious patterns
				const maliciousPatterns = [
					'bitlife.bitlog.workers.dev',
					'1games.io',
					'logGame',
					'sendDeviceInfo',
					'getOS',
					'device.*info.*send',
					'screenWidth.*screenHeight'
				];
				
				const codeToCheck = code.toLowerCase();
				for (const pattern of maliciousPatterns) {
					if (codeToCheck.includes(pattern.toLowerCase()) || 
						new RegExp(pattern, 'i').test(code)) {
						console.error('🚫 BLOCKED malicious eval code containing:', pattern);
						console.error('Blocked code preview:', code.substring(0, 200) + '...');
						console.error('Stack trace:', new Error().stack);
						return; // Block execution
					}
				}
			}
			return originalEval.call(this, code);
		};
		
		// 🔍 MONITOR FOR MALICIOUS FUNCTIONS
		const checkForMaliciousFunctions = () => {
			const maliciousFunctions = ['logGame', 'sendDeviceInfo', 'getOS'];
			const foundMalicious = [];
			
			maliciousFunctions.forEach(funcName => {
				if (window[funcName] && typeof window[funcName] === 'function') {
					foundMalicious.push(funcName);
				}
			});
			
			if (foundMalicious.length > 0) {
				console.error('🚨 MALICIOUS FUNCTIONS DETECTED:', foundMalicious);
				console.error('⚠️ These functions attempt to steal your data!');
				
				// Disable the malicious functions
				foundMalicious.forEach(funcName => {
					window[funcName] = function() {
						console.error('🚫 BLOCKED call to malicious function:', funcName);
					};
				});
			}
		};
		
		// Check immediately and periodically
		checkForMaliciousFunctions();
		setInterval(checkForMaliciousFunctions, 1000);
		
		// 📡 MONITOR NETWORK REQUESTS
		const originalCreateElement = document.createElement;
		document.createElement = function(tagName) {
			const element = originalCreateElement.call(this, tagName);
			
			if (tagName && tagName.toLowerCase() === 'script') {
				console.log('📜 Script element created');
				
				// Monitor src changes
				Object.defineProperty(element, 'src', {

						return this.getAttribute('src');

						this.setAttribute('src', src);
					}
				});
			}
			
			return element;
		};
