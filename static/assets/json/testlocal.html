<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Website Renderer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        h1, h2, h3 {
            color: #2c3e50;
        }
        
        input, button, select {
            font-size: 16px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-right: 8px;
        }
        
        button {
            background-color: #4285f4;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #3367d6;
        }
        
        .url-input-container {
            display: flex;
            margin-bottom: 20px;
            width: 100%;
        }
        
        .url-input-container input {
            flex-grow: 1;
        }
        
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .render-container {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 500px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .resource-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .resource-item {
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #eee;
            word-break: break-all;
        }
        
        .resource-success {
            color: #28a745;
        }
        
        .resource-error {
            color: #dc3545;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        
        .action-buttons {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        
        .tab-button {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            padding: 8px 15px;
            cursor: pointer;
        }
        
        .tab-button.active {
            background-color: white;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
            background-color: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 0 4px 4px 4px;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Website Renderer</h1>
        <p>Enter a URL to download and render websites locally in your browser.</p>
        
        <div class="url-input-container">
            <input type="url" id="url-input" placeholder="https://example.com" required>
            <button id="fetch-btn">Download Site</button>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <input type="checkbox" id="enable-js" checked>
                <label for="enable-js">Run JavaScript</label>
            </div>
            
            <div class="control-group">
                <input type="checkbox" id="enable-images" checked>
                <label for="enable-images">Load Images</label>
            </div>
            
            <div class="control-group">
                <input type="checkbox" id="enable-css" checked>
                <label for="enable-css">Apply CSS</label>
            </div>
            
            <div class="control-group">
                <input type="checkbox" id="handle-redirects" checked>
                <label for="handle-redirects">Follow Redirects</label>
            </div>
        </div>
        
        <div class="loader" id="loader"></div>
        <div id="status" class="info">Enter a URL and click "Download Site" to begin.</div>
    </div>
    
    <div class="container">
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="render">Rendered Site</button>
                <button class="tab-button" data-tab="html">HTML Source</button>
                <button class="tab-button" data-tab="resources">Resources</button>
                <button class="tab-button" data-tab="logs">Logs</button>
            </div>
            
            <div class="tab-content active" id="render-tab">
                <div class="render-container" id="render-container"></div>
            </div>
            
            <div class="tab-content" id="html-tab">
                <pre id="html-source" style="white-space: pre-wrap; overflow-x: auto;"></pre>
            </div>
            
            <div class="tab-content" id="resources-tab">
                <div class="resource-list" id="resource-list"></div>
            </div>
            
            <div class="tab-content" id="logs-tab">
                <div class="resource-list" id="log-list"></div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="save-btn">Save Locally</button>
            <button id="clear-btn">Clear Cache</button>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM elements
            const urlInput = document.getElementById('url-input');
            const fetchBtn = document.getElementById('fetch-btn');
            const statusDiv = document.getElementById('status');
            const loader = document.getElementById('loader');
            const renderContainer = document.getElementById('render-container');
            const htmlSource = document.getElementById('html-source');
            const resourceList = document.getElementById('resource-list');
            const logList = document.getElementById('log-list');
            const saveBtn = document.getElementById('save-btn');
            const clearBtn = document.getElementById('clear-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const enableJsCheckbox = document.getElementById('enable-js');
            const enableImagesCheckbox = document.getElementById('enable-images');
            const enableCssCheckbox = document.getElementById('enable-css');
            const handleRedirectsCheckbox = document.getElementById('handle-redirects');
            
            // Tab functionality
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons and contents
                    tabButtons.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    // Add active class to clicked button and corresponding content
                    button.classList.add('active');
                    document.getElementById(`${button.dataset.tab}-tab`).classList.add('active');
                });
            });
            
            // Site data storage
            const siteCache = {
                mainHtml: null,
                baseUrl: null,
                resources: {},
                logs: []
            };
            
            // Event listeners
            fetchBtn.addEventListener('click', () => {
                downloadSite(urlInput.value);
            });
            
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    downloadSite(urlInput.value);
                }
            });
            
            saveBtn.addEventListener('click', () => {
                saveSiteLocally();
            });
            
            clearBtn.addEventListener('click', () => {
                clearCache();
            });
            
            fullscreenBtn.addEventListener('click', () => {
                if (renderContainer.requestFullscreen) {
                    renderContainer.requestFullscreen();
                } else if (renderContainer.webkitRequestFullscreen) {
                    renderContainer.webkitRequestFullscreen();
                } else if (renderContainer.msRequestFullscreen) {
                    renderContainer.msRequestFullscreen();
                }
            });
            
            // Main functions
            async function downloadSite(url) {
                // Basic URL validation
                if (!url || (!url.startsWith('http://') && !url.startsWith('https://'))) {
                    updateStatus('Please enter a valid URL starting with http:// or https://', 'error');
                    return;
                }
                
                // Reset state
                siteCache.mainHtml = null;
                siteCache.baseUrl = url;
                siteCache.resources = {};
                siteCache.logs = [];
                
                resourceList.innerHTML = '';
                logList.innerHTML = '';
                renderContainer.innerHTML = '';
                htmlSource.textContent = '';
                
                // Show loading state
                loader.style.display = 'block';
                updateStatus(`Downloading content from ${url}...`, 'info');
                
                try {
                    // Add to logs
                    addLog(`Starting download of ${url}`);
                    
                    // Create the fetch request
                    const response = await fetch(url, {
                        // Using no-cors mode might help with some sites, but will limit access to the response
                        // mode: 'no-cors', 
                        redirect: handleRedirectsCheckbox.checked ? 'follow' : 'manual',
                        credentials: 'omit' // Don't send cookies
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    
                    // Get content type to ensure we're dealing with HTML
                    const contentType = response.headers.get('Content-Type') || '';
                    if (!contentType.includes('text/html')) {
                        addLog(`Warning: Content type is ${contentType}, not HTML`, 'warning');
                    }
                    
                    // Get the HTML content
                    const html = await response.text();
                    siteCache.mainHtml = html;
                    
                    // Update HTML source view
                    htmlSource.textContent = html;
                    
                    // Display the site locally
                    await renderSiteLocally(html, url);
                    
                    // Download resources if needed
                    if (enableImagesCheckbox.checked || enableCssCheckbox.checked) {
                        await downloadResources(html, url);
                    }
                    
                    updateStatus(`Successfully downloaded and rendered ${url}`, 'success');
                } catch (error) {
                    updateStatus(`Error: ${error.message}`, 'error');
                    addLog(`Error: ${error.message}`, 'error');
                    console.error('Download error:', error);
                    
                    // Try to load from cache if available
                    tryLoadFromCache(url);
                } finally {
                    loader.style.display = 'none';
                }
            }
            
            async function renderSiteLocally(html, baseUrl) {
                try {
                    // Create a base URL for resolving relative URLs
                    const base = new URL(baseUrl);
                    addLog(`Base URL set to: ${base.href}`);
                    
                    // Create a container for the content
                    const sandbox = document.createElement('div');
                    sandbox.style.width = '100%';
                    sandbox.style.height = '100%';
                    renderContainer.appendChild(sandbox);
                    
                    // Modify HTML to fix relative URLs
                    let modifiedHtml = html;
                    
                    // Add a base tag if it doesn't exist
                    if (!modifiedHtml.includes('<base')) {
                        modifiedHtml = modifiedHtml.replace(/<head[^>]*>/i, `$&<base href="${base.href}">`);
                    }
                    
                    // Remove scripts if JavaScript is disabled
                    if (!enableJsCheckbox.checked) {
                        modifiedHtml = modifiedHtml.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
                    }
                    
                    // Remove stylesheets if CSS is disabled
                    if (!enableCssCheckbox.checked) {
                        modifiedHtml = modifiedHtml.replace(/<link[^>]*rel=["']stylesheet["'][^>]*>/gi, '');
                        modifiedHtml = modifiedHtml.replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '');
                    }
                    
                    // Use a sandboxed iframe for better isolation
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    
                    // Set sandbox attributes
                    if (enableJsCheckbox.checked) {
                        iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-presentation allow-modals';
                    } else {
                        iframe.sandbox = 'allow-same-origin allow-forms';
                    }
                    
                    renderContainer.innerHTML = '';
                    renderContainer.appendChild(iframe);
                    
                    // Write the content to the iframe
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    iframeDoc.open();
                    iframeDoc.write(modifiedHtml);
                    iframeDoc.close();
                    
                    // Fix up the content after it's loaded
                    iframe.onload = () => {
                        try {
                            // Fix relative URLs for various elements
                            fixRelativeUrls(iframeDoc, base, enableImagesCheckbox.checked);
                            
                            // Overwrite any problematic scripts with custom behavior if needed
                            if (enableJsCheckbox.checked) {
                                injectCustomScripts(iframeDoc);
                            }
                            
                            addLog('Content successfully rendered in local container');
                        } catch (e) {
                            addLog(`Error in post-processing: ${e.message}`, 'error');
                        }
                    };
                    
                } catch (error) {
                    addLog(`Error rendering content: ${error.message}`, 'error');
                    throw error;
                }
            }
            
            async function downloadResources(html, baseUrl) {
                try {
                    // Parse the HTML to extract resources
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const base = new URL(baseUrl);
                    
                    // Extract image URLs if enabled
                    if (enableImagesCheckbox.checked) {
                        const images = doc.querySelectorAll('img');
                        for (const img of images) {
                            try {
                                if (img.src) {
                                    const imgUrl = new URL(img.src, base).href;
                                    await downloadResource(imgUrl, 'image');
                                }
                            } catch (e) {
                                addLog(`Error processing image ${img.src}: ${e.message}`, 'error');
                            }
                        }
                    }
                    
                    // Extract CSS URLs if enabled
                    if (enableCssCheckbox.checked) {
                        const styleLinks = doc.querySelectorAll('link[rel="stylesheet"]');
                        for (const link of styleLinks) {
                            try {
                                if (link.href) {
                                    const cssUrl = new URL(link.href, base).href;
                                    await downloadResource(cssUrl, 'css');
                                }
                            } catch (e) {
                                addLog(`Error processing stylesheet ${link.href}: ${e.message}`, 'error');
                            }
                        }
                    }
                    
                    addLog(`Resource download completed. ${Object.keys(siteCache.resources).length} resources processed.`);
                    
                } catch (error) {
                    addLog(`Error downloading resources: ${error.message}`, 'error');
                }
            }
            
            async function downloadResource(url, type) {
                try {
                    // Skip if already downloaded
                    if (siteCache.resources[url]) {
                        return;
                    }
                    
                    addLog(`Downloading ${type}: ${url}`);
                    
                    const response = await fetch(url, {
                        mode: 'no-cors', // This might help with some resources but will limit access
                        credentials: 'omit' // Don't send cookies
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    
                    // Store based on the content type
                    const contentType = response.headers.get('Content-Type') || '';
                    
                    if (contentType.includes('image/')) {
                        // For images, convert to data URL
                        const blob = await response.blob();
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        
                        await new Promise((resolve) => {
                            reader.onloadend = () => {
                                siteCache.resources[url] = {
                                    type: 'image',
                                    dataUrl: reader.result,
                                    contentType
                                };
                                resolve();
                            };
                        });
                        
                        addResourceItem(url, 'success');
                    } else if (contentType.includes('text/css')) {
                        // For CSS, store the text
                        const css = await response.text();
                        siteCache.resources[url] = {
                            type: 'css',
                            content: css,
                            contentType
                        };
                        addResourceItem(url, 'success');
                    } else {
                        // For other resources, store as blob URL for temporary use
                        const blob = await response.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        siteCache.resources[url] = {
                            type: 'other',
                            blobUrl,
                            contentType
                        };
                        addResourceItem(url, 'success');
                    }
                    
                } catch (error) {
                    addLog(`Failed to download resource: ${url} - ${error.message}`, 'error');
                    addResourceItem(url, 'error', error.message);
                    
                    // Still add to cache to avoid retrying
                    siteCache.resources[url] = {
                        type: 'error',
                        error: error.message
                    };
                }
            }
            
            function fixRelativeUrls(doc, baseUrl, processImages) {
                try {
                    // Fix images
                    if (processImages) {
                        const images = doc.querySelectorAll('img');
                        images.forEach(img => {
                            if (img.src) {
                                try {
                                    // Create absolute URL
                                    const absoluteUrl = new URL(img.getAttribute('src'), baseUrl).href;
                                    
                                    // Check if we have this image cached
                                    if (siteCache.resources[absoluteUrl] && siteCache.resources[absoluteUrl].type === 'image') {
                                        img.src = siteCache.resources[absoluteUrl].dataUrl;
                                    } else {
                                        img.src = absoluteUrl;
                                    }
                                } catch (e) {
                                    addLog(`Error fixing image URL ${img.src}: ${e.message}`, 'error');
                                }
                            }
                        });
                    }
                    
                    // Fix links
                    const links = doc.querySelectorAll('a');
                    links.forEach(link => {
                        if (link.href) {
                            try {
                                const absoluteUrl = new URL(link.getAttribute('href'), baseUrl).href;
                                link.href = absoluteUrl;
                                
                                // Make links open in new tab to prevent breaking out of our renderer
                                link.setAttribute('target', '_blank');
                            } catch (e) {
                                addLog(`Error fixing link URL ${link.href}: ${e.message}`, 'error');
                            }
                        }
                    });
                    
                    // Fix CSS URLs
                    const styleElements = doc.querySelectorAll('link[rel="stylesheet"]');
                    styleElements.forEach(styleElement => {
                        if (styleElement.href) {
                            try {
                                const absoluteUrl = new URL(styleElement.getAttribute('href'), baseUrl).href;
                                
                                // Check if we have this CSS cached
                                if (siteCache.resources[absoluteUrl] && siteCache.resources[absoluteUrl].type === 'css') {
                                    // Replace the external stylesheet with an inline one
                                    const style = doc.createElement('style');
                                    style.textContent = siteCache.resources[absoluteUrl].content;
                                    styleElement.parentNode.replaceChild(style, styleElement);
                                } else {
                                    styleElement.href = absoluteUrl;
                                }
                            } catch (e) {
                                addLog(`Error fixing CSS URL ${styleElement.href}: ${e.message}`, 'error');
                            }
                        }
                    });
                    
                } catch (error) {
                    addLog(`Error fixing relative URLs: ${error.message}`, 'error');
                }
            }
            
            function injectCustomScripts(doc) {
                try {
                    // Create a script element
                    const script = doc.createElement('script');
                    
                    // Add custom behavior to handle certain APIs or fix issues
                    script.textContent = `
                        // Intercept and log console messages
                        const originalConsole = console;
                        console = {
                            log: function(...args) {
                                originalConsole.log(...args);
                                window.parent.postMessage({type: 'console', level: 'log', args: JSON.stringify(args)}, '*');
                            },
                            warn: function(...args) {
                                originalConsole.warn(...args);
                                window.parent.postMessage({type: 'console', level: 'warn', args: JSON.stringify(args)}, '*');
                            },
                            error: function(...args) {
                                originalConsole.error(...args);
                                window.parent.postMessage({type: 'console', level: 'error', args: JSON.stringify(args)}, '*');
                            }
                        };
                        
                        // Add error handler
                        window.onerror = function(message, source, lineno, colno, error) {
                            window.parent.postMessage({
                                type: 'error', 
                                message: message,
                                source: source,
                                lineno: lineno,
                                colno: colno
                            }, '*');
                            return true; // Prevent default error handling
                        };
                        
                        // Intercept fetch and XMLHttpRequest to handle CORS issues
                        const originalFetch = window.fetch;
                        window.fetch = function(resource, init) {
                            try {
                                // Log the fetch attempt
                                console.log('fetch called:', resource);
                                
                                // Try the original fetch
                                return originalFetch(resource, init)
                                    .catch(error => {
                                        console.error('fetch error:', error.message);
                                        throw error;
                                    });
                            } catch (e) {
                                console.error('fetch exception:', e.message);
                                throw e;
                            }
                        };
                        
                        // Intercept XMLHttpRequest
                        const originalXHR = window.XMLHttpRequest;
                        window.XMLHttpRequest = function() {
                            const xhr = new originalXHR();
                            const originalOpen = xhr.open;
                            
                            xhr.open = function(method, url, async, user, password) {
                                console.log('XMLHttpRequest opened:', url);
                                return originalOpen.apply(this, arguments);
                            };
                            
                            return xhr;
                        };
                        
                        console.log('Custom scripts initialized');
                    `;
                    
                    // Add the script to the document
                    doc.head.appendChild(script);
                    
                    // Set up message listener for communication from the iframe
                    window.addEventListener('message', (event) => {
                        if (event.data && event.data.type) {
                            switch (event.data.type) {
                                case 'console':
                                    addLog(`Console ${event.data.level}: ${event.data.args}`, event.data.level);
                                    break;
                                case 'error':
                                    addLog(`JavaScript Error: ${event.data.message} at ${event.data.source} (${event.data.lineno}:${event.data.colno})`, 'error');
                                    break;
                            }
                        }
                    });
                    
                } catch (error) {
                    addLog(`Error injecting scripts: ${error.message}`, 'error');
                }
            }
            
            function saveSiteLocally() {
                try {
                    if (!siteCache.mainHtml || !siteCache.baseUrl) {
                        updateStatus('No site loaded to save', 'warning');
                        return;
                    }
                    
                    // Get domain for filename
                    const url = new URL(siteCache.baseUrl);
                    const domain = url.hostname;
                    
                    // Create a Blob containing the HTML
                    const blob = new Blob([siteCache.mainHtml], { type: 'text/html' });
                    
                    // Create a download link
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${domain}-snapshot.html`;
                    a.style.display = 'none';
                    
                    // Add to document, click, and remove
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    // Clean up
                    URL.revokeObjectURL(a.href);
                    
                    updateStatus('Site saved locally as HTML file', 'success');
                } catch (error) {
                    updateStatus(`Error saving site: ${error.message}`, 'error');
                }
            }
            
            function tryLoadFromCache(url) {
                try {
                    const cachedHtml = localStorage.getItem(`site_${btoa(url)}`);
                    if (cachedHtml) {
                        addLog('Found cached version, attempting to load...');
                        renderSiteLocally(cachedHtml, url);
                        updateStatus(`Loaded cached version of ${url}`, 'info');
                        
                        // Update cache variables
                        siteCache.mainHtml = cachedHtml;
                        siteCache.baseUrl = url;
                        
                        // Update HTML source view
                        htmlSource.textContent = cachedHtml;
                        
                        return true;
                    }
                } catch (e) {
                    addLog(`Error loading from cache: ${e.message}`, 'error');
                }
                return false;
            }
            
            function clearCache() {
                try {
                    // Clear localStorage
                    const siteKeys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key.startsWith('site_')) {
                            siteKeys.push(key);
                        }
                    }
                    
                    siteKeys.forEach(key => localStorage.removeItem(key));
                    
                    // Clear in-memory cache
                    siteCache.mainHtml = null;
                    siteCache.baseUrl = null;
                    siteCache.resources = {};
                    siteCache.logs = [];
                    
                    // Clear UI
                    resourceList.innerHTML = '';
                    logList.innerHTML = '';
                    renderContainer.innerHTML = '';
                    htmlSource.textContent = '';
                    
                    updateStatus('Cache cleared successfully', 'success');
                } catch (error) {
                    updateStatus(`Error clearing cache: ${error.message}`, 'error');
                }
            }
            
            // Helper functions
            function updateStatus(message, type = 'info') {
                statusDiv.textContent = message;
                statusDiv.className = type;
                
                // Also add to logs
                addLog(message, type);
            }
            
            function addLog(message, type = 'info') {
                // Add to in-memory logs
                siteCache.logs.push({
                    timestamp: new Date(),
                    message,
                    type
                });
                
                // Add to UI
                const logItem = document.createElement('div');
                logItem.className = `resource-item resource-${type}`;
                logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                logList.appendChild(logItem);
                
                // Scroll to bottom
                logList.scrollTop = logList.scrollHeight;
                
                // Limit the number of visible logs
                while (logList.children.length > 100) {
                    logList.removeChild(logList.firstChild);
                }
            }
            
            function addResourceItem(url, status, error = '') {
                const item = document.createElement('div');
                item.className = `resource-item resource-${status}`;
                
                if (status === 'success') {
                    item.textContent = `✓ ${url}`;
                } else {
                    item.textContent = `✗ ${url} - ${error}`;
                }
                
                resourceList.appendChild(item);
                
                // Scroll to bottom
                resourceList.scrollTop = resourceList.scrollHeight;
            }
        });
    </script>
</body>
</html>
