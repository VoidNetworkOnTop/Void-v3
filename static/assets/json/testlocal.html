<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Local Website Renderer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        h1, h2, h3 {
            color: #2c3e50;
        }
        
        .url-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input[type="url"] {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #3367d6;
        }
        
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            background-color: #f8f9fa;
            border-left: 4px solid #6c757d;
        }
        
        .success {
            border-left-color: #28a745;
        }
        
        .error {
            border-left-color: #dc3545;
        }
        
        .warning {
            border-left-color: #ffc107;
        }
        
        #preview {
            width: 100%;
            min-height: 500px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 10px 0;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tabs {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            margin-bottom: -1px;
            border-radius: 4px 4px 0 0;
        }
        
        .tab.active {
            background-color: white;
            border-color: #ddd;
            border-bottom-color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        #html-source {
            width: 100%;
            height: 400px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow: auto;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Local Website Renderer</h1>
        <p>Enter a URL to fetch and display website content locally in your browser.</p>
        
        <div class="url-form">
            <input type="url" id="url-input" placeholder="https://example.com" value="https://example.com">
            <button id="fetch-button">Fetch Website</button>
        </div>
        
        <div class="options">
            <div class="option">
                <input type="checkbox" id="download-resources" checked>
                <label for="download-resources">Attempt to download resources</label>
            </div>
            
            <div class="option">
                <input type="checkbox" id="display-mode-toggle">
                <label for="display-mode-toggle">Direct DOM display (instead of iframe)</label>
            </div>
            
            <div class="option">
                <input type="checkbox" id="show-errors" checked>
                <label for="show-errors">Show CORS and resource errors</label>
            </div>
        </div>
        
        <div class="loader" id="loader"></div>
        <div id="status">Enter a URL and click "Fetch Website" to begin</div>
    </div>
    
    <div class="container">
        <div class="tabs">
            <div class="tab active" data-tab="preview">Website Preview</div>
            <div class="tab" data-tab="source">HTML Source</div>
        </div>
        
        <div class="tab-content active" id="preview-tab">
            <div id="preview"></div>
        </div>
        
        <div class="tab-content" id="source-tab">
            <div id="html-source"></div>
        </div>
        
        <div class="action-buttons" style="margin-top: 15px;">
            <button id="save-button">Save HTML</button>
            <button id="fullscreen-button">Fullscreen</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const urlInput = document.getElementById('url-input');
            const fetchButton = document.getElementById('fetch-button');
            const status = document.getElementById('status');
            const loader = document.getElementById('loader');
            const preview = document.getElementById('preview');
            const htmlSource = document.getElementById('html-source');
            const saveButton = document.getElementById('save-button');
            const fullscreenButton = document.getElementById('fullscreen-button');
            const downloadResourcesCheckbox = document.getElementById('download-resources');
            const displayModeToggle = document.getElementById('display-mode-toggle');
            const showErrorsCheckbox = document.getElementById('show-errors');
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            
            // Site data
            let currentSite = {
                url: '',
                html: '',
                resources: {},
                title: ''
            };
            
            // Tab handling
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(tc => tc.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                });
            });
            
            // Event listeners
            fetchButton.addEventListener('click', () => {
                fetchWebsite(urlInput.value);
            });
            
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    fetchWebsite(urlInput.value);
                }
            });
            
            saveButton.addEventListener('click', saveHtml);
            
            fullscreenButton.addEventListener('click', () => {
                if (preview.requestFullscreen) {
                    preview.requestFullscreen();
                } else if (preview.webkitRequestFullscreen) {
                    preview.webkitRequestFullscreen();
                } else if (preview.msRequestFullscreen) {
                    preview.msRequestFullscreen();
                }
            });
            
            // Main function to fetch website
            async function fetchWebsite(url) {
                // Basic URL validation
                if (!url || (!url.startsWith('http://') && !url.startsWith('https://'))) {
                    updateStatus('Please enter a valid URL starting with http:// or https://', 'error');
                    return;
                }
                
                try {
                    // Reset and show loading state
                    resetPreview();
                    loader.style.display = 'block';
                    updateStatus(`Fetching ${url}...`);
                    
                    // Store current site info
                    currentSite = {
                        url: url,
                        html: '',
                        resources: {},
                        title: ''
                    };
                    
                    // Fetch HTML content
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    
                    const html = await response.text();
                    currentSite.html = html;
                    
                    // Extract title
                    const titleMatch = html.match(/<title>(.*?)<\/title>/i);
                    currentSite.title = titleMatch ? titleMatch[1] : url;
                    
                    // Update HTML source view
                    htmlSource.textContent = html;
                    
                    // Render the content
                    const baseUrl = new URL(url);
                    displayWebsite(html, baseUrl.href);
                    
                    updateStatus(`Successfully loaded ${url}`, 'success');
                } catch (error) {
                    updateStatus(`Error: ${error.message}`, 'error');
                    console.error('Fetch error:', error);
                } finally {
                    loader.style.display = 'none';
                }
            }
            
            // Display website content
            function displayWebsite(html, baseUrl) {
                try {
                    // Add base tag and fix relative URLs
                    let modifiedHtml = html;
                    
                    // Add base tag for relative URLs
                    if (!modifiedHtml.includes('<base')) {
                        modifiedHtml = modifiedHtml.replace(/<head[^>]*>/i, `$&<base href="${baseUrl}">`);
                    }
                    
                    // Choose display method based on toggle
                    if (displayModeToggle.checked) {
                        displayDirect(modifiedHtml, baseUrl);
                    } else {
                        displayInIframe(modifiedHtml, baseUrl);
                    }
                    
                    // Optionally download resources
                    if (downloadResourcesCheckbox.checked) {
                        setTimeout(() => {
                            prefetchResources(html, baseUrl);
                        }, 100);
                    }
                } catch (error) {
                    updateStatus(`Display error: ${error.message}`, 'error');
                    console.error('Display error:', error);
                }
            }
            
            // Display in iframe (more compatible approach)
            function displayInIframe(html, baseUrl) {
                // Create a new iframe
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '500px';
                iframe.style.border = 'none';
                
                // Set sandbox attributes - we're not using allow-same-origin for security
                iframe.sandbox = 'allow-forms allow-popups';
                
                // Clear container and add iframe
                preview.innerHTML = '';
                preview.appendChild(iframe);
                
                // Method 1: Use srcdoc attribute (works in modern browsers)
                iframe.srcdoc = html;
                
                // Add message to help with CORS issues
                const corsMessage = document.createElement('div');
                corsMessage.style.padding = '10px';
                corsMessage.style.marginTop = '10px';
                corsMessage.style.backgroundColor = '#fff3cd';
                corsMessage.style.border = '1px solid #ffeeba';
                corsMessage.style.borderRadius = '4px';
                corsMessage.innerHTML = '<strong>Note:</strong> Some content may not display properly due to browser security restrictions. This is expected behavior with local rendering.';
                preview.appendChild(corsMessage);
            }
            
            // Display directly in DOM (for simpler content)
            function displayDirect(html, baseUrl) {
                try {
                    // Parse the HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Clear the preview container
                    preview.innerHTML = '';
                    
                    // Create a wrapper for the content
                    const wrapper = document.createElement('div');
                    wrapper.style.width = '100%';
                    wrapper.style.maxWidth = '100%';
                    wrapper.style.overflow = 'auto';
                    
                    // Process stylesheets from the head
                    const styles = doc.querySelectorAll('style, link[rel="stylesheet"]');
                    styles.forEach(style => {
                        try {
                            const clonedStyle = document.importNode(style, true);
                            if (clonedStyle.tagName === 'LINK' && clonedStyle.getAttribute('href')) {
                                // Fix relative URLs in stylesheets
                                const href = clonedStyle.getAttribute('href');
                                if (!href.startsWith('http')) {
                                    clonedStyle.setAttribute('href', new URL(href, baseUrl).href);
                                }
                            }
                            preview.appendChild(clonedStyle);
                        } catch (e) {
                            if (showErrorsCheckbox.checked) {
                                console.error('Style error:', e);
                            }
                        }
                    });
                    
                    // Add body content
                    Array.from(doc.body.children).forEach(child => {
                        try {
                            const clone = document.importNode(child, true);
                            fixRelativeUrls(clone, baseUrl);
                            wrapper.appendChild(clone);
                        } catch (e) {
                            if (showErrorsCheckbox.checked) {
                                console.error('Content error:', e);
                            }
                        }
                    });
                    
                    // Add the wrapper to the preview
                    preview.appendChild(wrapper);
                    
                } catch (error) {
                    updateStatus(`DOM display error: ${error.message}`, 'error');
                    if (showErrorsCheckbox.checked) {
                        console.error('DOM display error:', error);
                    }
                }
            }
            
            // Fix relative URLs in elements
            function fixRelativeUrls(element, baseUrl) {
                try {
                    // Process all elements that might have URLs
                    const elements = element.querySelectorAll('img, a, link, script, source');
                    elements.forEach(el => {
                        try {
                            // Fix img src
                            if (el.tagName === 'IMG' && el.getAttribute('src')) {
                                const src = el.getAttribute('src');
                                if (!src.startsWith('http') && !src.startsWith('data:')) {
                                    el.src = new URL(src, baseUrl).href;
                                }
                            }
                            
                            // Fix a href
                            if (el.tagName === 'A' && el.getAttribute('href')) {
                                const href = el.getAttribute('href');
                                if (!href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('mailto:')) {
                                    el.href = new URL(href, baseUrl).href;
                                    // Open links in new tab
                                    el.target = '_blank';
                                    el.rel = 'noopener noreferrer';
                                }
                            }
                            
                            // Fix other elements with src/href
                            ['src', 'href'].forEach(attr => {
                                if (el.getAttribute(attr) && !['A', 'IMG'].includes(el.tagName)) {
                                    const url = el.getAttribute(attr);
                                    if (!url.startsWith('http') && !url.startsWith('data:')) {
                                        el.setAttribute(attr, new URL(url, baseUrl).href);
                                    }
                                }
                            });
                        } catch (e) {
                            if (showErrorsCheckbox.checked) {
                                console.error(`Error fixing URL in ${el.tagName}:`, e);
                            }
                        }
                    });
                } catch (error) {
                    if (showErrorsCheckbox.checked) {
                        console.error('URL fixing error:', error);
                    }
                }
            }
            
            // Prefetch resources to improve loading
            async function prefetchResources(html, baseUrl) {
                try {
                    // Parse the HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Get image URLs
                    const images = doc.querySelectorAll('img');
                    for (const img of images) {
                        if (img.src && !img.src.startsWith('data:')) {
                            try {
                                const imgUrl = new URL(img.src, baseUrl).href;
                                await prefetchImage(imgUrl);
                            } catch (e) {
                                if (showErrorsCheckbox.checked) {
                                    console.error(`Failed to prefetch image ${img.src}:`, e);
                                }
                            }
                        }
                    }
                    
                    // Get CSS URLs
                    const styleLinks = doc.querySelectorAll('link[rel="stylesheet"]');
                    for (const link of styleLinks) {
                        if (link.href) {
                            try {
                                const cssUrl = new URL(link.href, baseUrl).href;
                                await prefetchCSS(cssUrl);
                            } catch (e) {
                                if (showErrorsCheckbox.checked) {
                                    console.error(`Failed to prefetch CSS ${link.href}:`, e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    if (showErrorsCheckbox.checked) {
                        console.error('Resource prefetch error:', error);
                    }
                }
            }
            
            // Prefetch and cache an image
            async function prefetchImage(url) {
                try {
                    if (currentSite.resources[url]) {
                        return; // Already cached
                    }
                    
                    const response = await fetch(url);
                    if (!response.ok) return;
                    
                    const blob = await response.blob();
                    
                    // Convert to data URL
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onload = function() {
                        currentSite.resources[url] = {
                            type: 'image',
                            dataUrl: reader.result
                        };
                        
                        // If we're using direct DOM display, update any images
                        if (displayModeToggle.checked) {
                            const images = preview.querySelectorAll('img[src="' + url + '"]');
                            images.forEach(img => {
                                img.src = reader.result;
                            });
                        }
                    };
                } catch (error) {
                    if (showErrorsCheckbox.checked) {
                        console.error(`Image prefetch error for ${url}:`, error);
                    }
                }
            }
            
            // Prefetch and cache CSS
            async function prefetchCSS(url) {
                try {
                    if (currentSite.resources[url]) {
                        return; // Already cached
                    }
                    
                    const response = await fetch(url);
                    if (!response.ok) return;
                    
                    const css = await response.text();
                    
                    currentSite.resources[url] = {
                        type: 'css',
                        content: css
                    };
                    
                    // If we're using direct DOM display, replace link with style
                    if (displayModeToggle.checked) {
                        const links = preview.querySelectorAll('link[href="' + url + '"]');
                        links.forEach(link => {
                            const style = document.createElement('style');
                            style.textContent = css;
                            if (link.parentNode) {
                                link.parentNode.replaceChild(style, link);
                            }
                        });
                    }
                } catch (error) {
                    if (showErrorsCheckbox.checked) {
                        console.error(`CSS prefetch error for ${url}:`, error);
                    }
                }
            }
            
            // Save HTML file locally
            function saveHtml() {
                try {
                    if (!currentSite.html) {
                        updateStatus('No content to save', 'warning');
                        return;
                    }
                    
                    // Create a Blob containing the HTML
                    const blob = new Blob([currentSite.html], { type: 'text/html' });
                    
                    // Create a URL for the Blob
                    const url = URL.createObjectURL(blob);
                    
                    // Create a link element to trigger the download
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${new URL(currentSite.url).hostname}.html`;
                    a.style.display = 'none';
                    
                    // Add to document, click, and remove
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    // Clean up
                    URL.revokeObjectURL(url);
                    
                    updateStatus('Website HTML saved successfully', 'success');
                } catch (error) {
                    updateStatus(`Save error: ${error.message}`, 'error');
                    console.error('Save error:', error);
                }
            }
            
            // Reset the preview
            function resetPreview() {
                preview.innerHTML = '';
                htmlSource.textContent = '';
            }
            
            // Update status message
            function updateStatus(message, type = '') {
                status.textContent = message;
                status.className = '';
                if (type) {
                    status.classList.add(type);
                }
            }
            
            // Load example.com by default
            setTimeout(() => {
                fetchWebsite('https://example.com');
            }, 500);
        });
    </script>
</body>
</html>
