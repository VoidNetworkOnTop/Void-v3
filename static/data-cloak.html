<!DOCTYPE html>
<html>
<head>
    <title>Iframe via Data URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>
    <button id="openIframe">Click to Open Iframed Website</button>

    <script>
        document.getElementById('openIframe').addEventListener('click', function() {
            try {
                // Get the root domain
                const rootUrl = window.location.origin;
                
                // Create HTML for the iframe page with proper DOCTYPE and meta tags
                const iframeHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iframed Content</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="${rootUrl}" allowfullscreen></iframe>
</body>
</html>`;
                
                // Create a blob with the HTML content
                const blob = new Blob([iframeHtml], {type: 'text/html'});
                
                // Create an object URL for the blob
                const blobUrl = URL.createObjectURL(blob);
                
                // Open the blob URL in a new window
                const newWindow = window.open(blobUrl);
                
                if (!newWindow) {
                    alert("Pop-up blocker might be preventing the window from opening. Please allow pop-ups for this site.");
                    return;
                }
                
                // Close the current window after the new one is opened
                setTimeout(function() {
                    window.close();
                }, 500);
                
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred: " + error.message);
            }
        });
    </script>
</body>
</html>
