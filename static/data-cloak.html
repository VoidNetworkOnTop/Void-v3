<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            color: #666;
        }
        #errorMessage {
            color: #e74c3c;
            margin-top: 20px;
            display: none;
        }
        #manualButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Loading website...</p>
    <div id="errorMessage">An error occurred. Please try again.</div>
    <button id="manualButton">Click here to continue</button>

    <script>
        // Function to create and load the cloaked page
        function loadCloakedPage() {
            try {
                // Get the root domain
                const rootUrl = window.location.origin;
                
                // Get the page title from the original site (if possible)
                const originalTitle = document.title;
                
                // Create HTML for the iframe page with proper DOCTYPE and meta tags
                const iframeHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${originalTitle}</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="${rootUrl}" allowfullscreen></iframe>
</body>
</html>`;
                
                // Create a blob with the HTML content
                const blob = new Blob([iframeHtml], {type: 'text/html'});
                
                // Create an object URL for the blob
                const blobUrl = URL.createObjectURL(blob);
                
                // Replace the current window with the blob URL
                window.location.replace(blobUrl);
                
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'Error: ' + error.message;
                document.getElementById('manualButton').style.display = 'block';
            }
        }

        // Try to load automatically on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Adding a small delay can help with some browsers
            setTimeout(loadCloakedPage, 300);
        });

        // Provide a fallback button in case automatic loading fails
        document.getElementById('manualButton').addEventListener('click', loadCloakedPage);
    </script>
</body>
</html>
