<!DOCTYPE html>
<html>
<head>
    <title>Iframe via Data URL</title>
</head>
<body>
    <script>
        // Get the current URL
        const currentUrl = window.location.href;
        
        // Extract protocol and hostname to get the root domain
        const rootUrl = window.location.origin;
        
        // Create HTML for the iframe page
        const iframeHtml = `
            <html>
                <head>
                    <title>Iframed Content</title>
                </head>
                <body style="margin: 0px; height: 100vh;">
                    <iframe src="${rootUrl}" style="border: none; width: 100%; height: 100%; margin: 0px;"></iframe>
                </body>
            </html>
        `;
        
        // Encode the HTML content for the data URI
        const encodedHtml = encodeURIComponent(iframeHtml);
        
        // Create a new window with the encoded HTML as a data URI
        const newWindow = window.open('data:text/html;charset=utf-8,' + encodedHtml);
        
        // Close the current window after a short delay
        setTimeout(function() {
            window.close();
        }, 100);
    </script>
</body>
</html>
