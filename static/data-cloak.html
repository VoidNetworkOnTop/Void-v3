<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <script>
        // Get the current URL
        const currentUrl = window.location.href;
        
        // Extract protocol and hostname to get the root domain
        const rootUrl = window.location.origin;
        
        // Create HTML for the iframe page
        const iframeHtml = `
            <html>
                <head></head>
                <body style="margin: 0px; height: 100vh;">
                    <iframe src="${rootUrl}" style="border: none; width: 100%; height: 100%; margin: 0px;"></iframe>
                </body>
            </html>
        `;
        
        // Create a data URI from the HTML content
        const dataUri = 'data:text/html;charset=utf-8,' + encodeURIComponent(iframeHtml);
        
        // Create a new window with the data URI
        const newWindow = window.open(dataUri, '_blank');
        setTimeout(function() {
            // Close the current window
            window.close();
        }, 100);
    </script>
</body>
</html>
