<!DOCTYPE html>
<html>
<head>
    <title>Auto-Generate Iframe Creator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        input {
            padding: 10px;
            width: 80%;
            max-width: 500px;
            margin: 10px 0;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 4px;
        }
        
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .info {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <h1>Fullscreen Iframe Generator</h1>
    
    <p>Enter a URL (e.g., example.com/something.html):</p>
    <input type="text" id="urlInput" placeholder="Enter URL" value="">
    
    <div>
        <button onclick="generateFromInput()">Generate from Input</button>
        <button onclick="generateFromCurrentURL()">Use Current URL</button>
    </div>
    
    <p class="info">This tool extracts the root domain from the URL and creates an HTML file with a fullscreen iframe pointing to that domain.</p>
    
    <script>
        // Function to extract root domain from a URL
        function extractRootDomain(url) {
            // Add protocol if missing
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            try {
                // Parse the URL
                const urlObj = new URL(url);
                // Return just the origin (protocol + hostname + port)
                return urlObj.origin;
            } catch (e) {
                // If URL parsing fails, return the original input
                console.error("Error parsing URL:", e);
                return url;
            }
        }
        
        // Function to generate HTML content
        function generateHTML(rootUrl) {
            return `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${rootUrl}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="${rootUrl}" allowfullscreen></iframe>
</body>
</html>`;
        }
        
        // Function to download HTML file
        function downloadHTML(htmlContent, filename) {
            // Create a blob with the HTML content
            const blob = new Blob([htmlContent], { type: 'text/html' });
            
            // Create a download link
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename || 'iframe-page.html';
            
            // Append to body, click, and remove
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Generate and download from input field
        function generateFromInput() {
            const inputUrl = document.getElementById('urlInput').value.trim();
            
            if (!inputUrl) {
                alert("Please enter a URL");
                return;
            }
            
            const rootUrl = extractRootDomain(inputUrl);
            const htmlContent = generateHTML(rootUrl);
            
            // Extract domain name for the filename
            let domain = rootUrl.replace(/https?:\/\//, '').replace(/[\/\\:*?"<>|]/g, '');
            downloadHTML(htmlContent, `${domain}-iframe.html`);
        }
        
        // Generate and download from current URL
        function generateFromCurrentURL() {
            const currentUrl = window.location.href;
            document.getElementById('urlInput').value = currentUrl;
            
            const rootUrl = extractRootDomain(currentUrl);
            const htmlContent = generateHTML(rootUrl);
            
            // Extract domain name for the filename
            let domain = rootUrl.replace(/https?:\/\//, '').replace(/[\/\\:*?"<>|]/g, '');
            downloadHTML(htmlContent, `${domain}-iframe.html`);
        }
        
        // Set current URL as default if input is empty
        window.onload = function() {
            if (document.getElementById('urlInput').value === '') {
                document.getElementById('urlInput').value = window.location.href;
            }
        };
    </script>
</body>
</html>
