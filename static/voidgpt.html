<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classroom.com</title>
    
    <!-- Scripts for loading HTML -->
    <script src="/global.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        #header,
        #footer {
            position: relative;
            z-index: 999;
        }
        
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="header"></div>
    
    <div class="content-wrapper">
        <iframe src="https://voidgpt-v3.vercel.app" 
                allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; encrypted-media; geolocation; gyroscope; microphone; midi; payment; usb; vr; xr-spatial-tracking" 
                frameborder="0"
                allowfullscreen>
        </iframe>
    </div>
    
    <div id="footer"></div>
    
    <script>
        // Load header and footer dynamically
        loadHTML("/assets/html/header.html", "header"),
        loadHTML("/assets/html/footer.html", "footer")
    </script>
</body>
</html>
