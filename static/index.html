<!-- Inject this script to modify all links to include cache-busting -->
<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    try {
      // Generate a unique timestamp for this page load
      const timestamp = Date.now();
      
      // Add cache-busting parameter to all links to internal pages
      document.querySelectorAll('a').forEach(link => {
        try {
          // Only modify internal links
          if (link.href && link.href.startsWith(window.location.origin)) {
            // Add cache-busting parameter
            const url = new URL(link.href);
            url.searchParams.set('cb', timestamp);
            link.href = url.toString();
          }
        } catch (e) {
          console.warn('Failed to add cache-busting to link:', link.href, e);
        }
      });
      
      // Override fetch to add cache-busting parameter
      const originalFetch = window.fetch;
      window.fetch = function(resource, init) {
        if (typeof resource === 'string' && resource.startsWith(window.location.origin)) {
          try {
            // Add cache-busting parameter to internal requests
            const url = new URL(resource, window.location.origin);
            url.searchParams.set('cb', timestamp);
            resource = url.toString();
          } catch (e) {
            console.warn('Failed to add cache-busting to fetch:', resource, e);
          }
        }
        return originalFetch.call(this, resource, init);
      };
      
      // Override XMLHttpRequest to add cache-busting parameter
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        if (typeof url === 'string' && url.startsWith(window.location.origin)) {
          try {
            // Add cache-busting parameter to internal requests
            const urlObj = new URL(url, window.location.origin);
            urlObj.searchParams.set('cb', timestamp);
            url = urlObj.toString();
          } catch (e) {
            console.warn('Failed to add cache-busting to XHR:', url, e);
          }
        }
        return originalOpen.call(this, method, url, ...rest);
      };
      
      console.log(`Cache buster active for this session: ${timestamp}`);
    } catch (error) {
      console.error('Cache-busting script error:', error);
    }
  });
</script>

<script>
(function() {
    // Mobile detection function
    function isMobileDevice() {
        // Check user agent for mobile indicators
        const userAgent = navigator.userAgent.toLowerCase();
        const mobileKeywords = [
            'android', 'webos', 'iphone', 'ipad', 'ipod', 'blackberry', 
            'windows phone', 'opera mini', 'iemobile', 'mobile'
        ];
        
        const isMobileUA = mobileKeywords.some(keyword => userAgent.includes(keyword));
        
        // Also check screen size as backup
        const isSmallScreen = window.innerWidth <= 768 || window.screen.width <= 768;
        
        // Check for touch capability
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        return isMobileUA || (isSmallScreen && isTouchDevice);
    }
    
    // Create and show mobile blocking overlay
    function showMobileBlocker() {
        // Create overlay element
        const overlay = document.createElement('div');
        overlay.id = 'mobile-blocker-overlay';
        
        // Styles for the overlay
        overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);

            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        `;
        
        // Create content container
        const content = document.createElement('div');
        content.style.cssText = `
            max-width: 400px;
            padding: 40px 30px;
            border: 2px solid #333333;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 0.6s ease-out;
        `;
        
        // Add animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInScale {
                from {
                    opacity: 0;
                    transform: scale(0.9) translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }
            
            .mobile-icon {
                width: 60px;
                height: 60px;
                margin: 0 auto 25px;
                border: 3px solid #666666;
                border-radius: 12px;
                position: relative;
                background: #222222;
            }
            
            .mobile-icon::before {
                content: '';
                position: absolute;
                top: 8px;
                left: 50%;
                transform: translateX(-50%);
                width: 20px;
                height: 2px;
                background: #666666;
                border-radius: 1px;
            }
            
            .mobile-icon::after {
                content: '';
                position: absolute;
                bottom: 8px;
                left: 50%;
                transform: translateX(-50%);
                width: 8px;
                height: 8px;
                background: #666666;
                border-radius: 50%;
            }
        `;
        
        document.head.appendChild(style);
        
        // Create mobile icon
        const icon = document.createElement('div');
        icon.className = 'mobile-icon';
        
        // Create title
        const title = document.createElement('h1');
        title.style.cssText = `
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        `;
        title.textContent = 'Mobile Access Temporarily Unavailable';
        
        // Create message
        const message = document.createElement('p');
        message.style.cssText = `
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 25px 0;
            color: #cccccc;
            font-weight: 400;
        `;
        message.innerHTML = `
            We're currently optimizing <strong style="color: #ffffff;">Void Network</strong> for mobile devices. 
            Our development team is working diligently to bring you the best mobile experience possible.
        `;
        
        // Create status message
        const status = document.createElement('p');
        status.style.cssText = `
            font-size: 14px;
            color: #999999;
            margin: 0 0 30px 0;
            font-style: italic;
        `;
        status.textContent = 'Expected to be available within the next few days';
        
        // Create suggestion
        const suggestion = document.createElement('p');
        suggestion.style.cssText = `
            font-size: 14px;
            color: #bbbbbb;
            margin: 0;
            padding: 20px 0 0 0;
            border-top: 1px solid #333333;
        `;
        suggestion.innerHTML = `
            For the best experience, please visit <strong style="color: #ffffff;">Void Network</strong> on a desktop or laptop computer.
        `;
        
        // Assemble the content
        content.appendChild(icon);
        content.appendChild(title);
        content.appendChild(message);
        content.appendChild(status);
        content.appendChild(suggestion);
        
        overlay.appendChild(content);
        
        // Add to page
        document.body.appendChild(overlay);
        
        // Prevent scrolling on the background
        document.body.style.overflow = 'hidden';
    }
    
    // Run detection when DOM is ready
    function init() {
        if (isMobileDevice()) {
            showMobileBlocker();
        }
    }
    
    // Execute immediately if DOM is already loaded, otherwise wait
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    
    // Also check on window resize in case of device rotation or responsive design testing
    window.addEventListener('resize', function() {
        if (isMobileDevice() && !document.getElementById('mobile-blocker-overlay')) {
            showMobileBlocker();
        }
    });
})();
</script>

<!-- Enhanced Loading Script with better error handling -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        
        // Progress animation with better error handling
        function animateProgress() {
            let progress = 0;
            const maxProgress = 100;
            const speed = 0.5;

            function updateProgress() {
                try {
                    if (progress < maxProgress) {
                        progress += speed;
                        progressFill.style.width = `${Math.min(progress, maxProgress)}%`;
                        
                        if (progress < maxProgress) {
                            requestAnimationFrame(updateProgress);
                        } else {
                            // Final checks and removal
                            setTimeout(() => {
                                loadingOverlay.classList.add('fade-out');
                                loadingOverlay.addEventListener('transitionend', () => {
                                    if (loadingOverlay.parentNode) {
                                        loadingOverlay.remove();
                                    }
                                });
                            }, 500);
                        }
                    }
                } catch (error) {
                    console.error('Progress animation error:', error);
                    // Force completion on error
                    loadingOverlay.classList.add('fade-out');
                }
            }

            // Ensure initial visibility
            progressFill.style.width = '1%';
            requestAnimationFrame(updateProgress);
        }

        // Ensure all critical resources are loaded with timeout
        function waitForCriticalResources() {
            const startTime = Date.now();
            const timeout = 10000; // 10 second timeout
            
            const criticalChecks = [
                () => window.CONFIG !== undefined,
                () => window.loadHTML !== undefined,
                () => window.__uv$config !== undefined,
                () => {
                    try {
                        return window.gamesData || window.games2Data;
                    } catch {
                        return false;
                    }
                }
            ];

            function checkResources() {
                try {
                    const allLoaded = criticalChecks.every(check => {
                        try {
                            return check();
                        } catch {
                            return false;
                        }
                    });
                    
                    if (allLoaded || Date.now() - startTime > timeout) {
                        animateProgress();
                    } else {
                        // If not loaded, check again after a short delay
                        setTimeout(checkResources, 100);
                    }
                } catch (error) {
                    console.error('Resource checking error:', error);
                    animateProgress();
                }
            }

            // Start initial check
            checkResources();
        }

        // Kick off the loading process
        waitForCriticalResources();

        // Ensure loading bar is visible even if resources are cached
        window.addEventListener('load', () => {
            try {
                if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                    animateProgress();
                }
            } catch (error) {
                console.error('Window load error:', error);
            }
        });
        
        // Safety timeout to prevent infinite loading
        setTimeout(() => {
            try {
                if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                    console.warn('Loading timeout reached, forcing completion');
                    loadingOverlay.classList.add('fade-out');
                }
            } catch (error) {
                console.error('Safety timeout error:', error);
            }
        }, 15000);
    });
</script>

<!-- Enhanced Service Worker Registration with timeout and retry -->
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const stockSW = "/uv/sw.js";
        const swScope = "/uv/"; 
        const swAllowedHostnames = ["localhost", "127.0.0.1"];
        
        // Function to preload and register the service worker with timeout and retry
        async function preloadServiceWorker(retries = 3) {
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    // Check if service workers are supported
                    if (!('serviceWorker' in navigator)) {
                        console.error("Service workers are not supported in this browser");
                        return false;
                    }
                    
                    // Check if we're on HTTPS or allowed development hostnames
                    if (location.protocol !== 'https:' && !swAllowedHostnames.includes(location.hostname)) {
                        console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                        return false;
                    }
                    
                    console.log(`Attempt ${attempt}/${retries}: Registering UV service worker with scope:`, swScope);
                    
                    // Register the service worker with timeout
                    const registration = await Promise.race([
                        navigator.serviceWorker.register(stockSW, { 
                            scope: swScope,
                            updateViaCache: 'none'
                        }),
                        new Promise((_, reject) => 
                            setTimeout(() => reject(new Error('Service worker registration timeout')), 5000)
                        )
                    ]);
                    
                    // Wait for the service worker to be ready with timeout
                    await Promise.race([
                        navigator.serviceWorker.ready,
                        new Promise((_, reject) => 
                            setTimeout(() => reject(new Error('Service worker ready timeout')), 5000)
                        )
                    ]);
                    
                    // If we have an active service worker, send it a message to skip waiting
                    if (registration.active) {
                        registration.active.postMessage({ type: 'SKIP_WAITING' });
                    }
                    
                    console.log('UV service worker successfully registered with scope:', registration.scope);
                    window.__uv$serviceWorkerRegistered = true;
                    markStage('SERVICE_WORKER_READY');
                    
                    return true;
                } catch (error) {
                    console.error(`Service worker registration attempt ${attempt}/${retries} failed:`, error);
                    
                    if (attempt < retries) {
                        // Wait before retry with exponential backoff
                        await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                    }
                }
            }
            
            // All attempts failed, but don't block the page
            console.error('All service worker registration attempts failed');
            markStage('SERVICE_WORKER_ERROR');
            
            // Continue without service worker
            return false;
        }
        
        // Start preloading the service worker
        preloadServiceWorker();
    });
</script>

                    await new Promise(resolve => setTimeout(resolve, 1000 * attempt));

                    </button>
                </div>
            `;
        }
        
        // Still try to load header/footer
        try {
            loadHTML("/assets/html/header.html", "header");
            loadHTML("/assets/html/footer.html", "footer");
        } catch (headerFooterError) {
            console.error('Failed to load header/footer after critical error:', headerFooterError);
        }
    }
</script>
