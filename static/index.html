<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        
        // Progress animation
        function animateProgress() {
            let progress = 0;
            const maxProgress = 100;
            const speed = 0.5;

            function updateProgress() {
                if (progress < maxProgress) {
                    progress += speed;
                    progressFill.style.width = `${Math.min(progress, maxProgress)}%`;
                    
                    if (progress < maxProgress) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        // Final checks and removal
                        setTimeout(() => {
                            loadingOverlay.classList.add('fade-out');
                            loadingOverlay.addEventListener('transitionend', () => {
                                loadingOverlay.remove();
                            });
                        }, 500);
                    }
                }
            }

            // Ensure initial visibility
            progressFill.style.width = '1%';
            requestAnimationFrame(updateProgress);
        }

        // Ensure all critical resources are loaded
        function waitForCriticalResources() {
            const criticalChecks = [
                () => window.CONFIG !== undefined,
                () => window.loadHTML !== undefined,
                () => window.__uv$config !== undefined,
                () => {
                    try {
                        return window.gamesData && window.games2Data;
                    } catch {
                        return false;
                    }
                }
            ];

            function checkResources() {
                const allLoaded = criticalChecks.every(check => check());
                
                if (allLoaded) {
                    animateProgress();
                } else {
                    // If not loaded, check again after a short delay
                    setTimeout(checkResources, 100);
                }
            }

            // Start initial check with a timeout fallback
            checkResources();
            
            // Fallback timeout to prevent indefinite waiting
            setTimeout(() => {
                animateProgress();
            }, 10000);
        }

        // Kick off the loading process
        waitForCriticalResources();

        // Ensure loading bar is visible even if resources are cached
        window.addEventListener('load', () => {
            if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                animateProgress();
            }
        });
    });
</script>

<!-- FIXED Service Worker Registration -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const stockSW = "/uv/sw.js";
        // IMPORTANT: Use the allowed scope instead of root scope
        const swScope = "/uv/"; 
        const swAllowedHostnames = ["localhost", "127.0.0.1"];
        
        // Function to preload and register the service worker with correct scope
        async function preloadServiceWorker() {
            // Check if service workers are supported
            if (!('serviceWorker' in navigator)) {
                console.error("Service workers are not supported in this browser");
                return false;
            }
            
            // Check if we're on HTTPS or allowed development hostnames
            if (location.protocol !== 'https:' && !swAllowedHostnames.includes(location.hostname)) {
                console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                return false;
            }
            
            try {
                console.log('Registering UV service worker with scope:', swScope);
                
                // Register the service worker with the CORRECT scope
                const registration = await navigator.serviceWorker.register(stockSW, { 
                    scope: swScope,
                    updateViaCache: 'none'
                });
                
                // Wait for the service worker to be ready
                await navigator.serviceWorker.ready;
                
                // If we have an active service worker, send it a message to skip waiting
                if (registration.active) {
                    registration.active.postMessage({ type: 'SKIP_WAITING' });
                }
                
                console.log('UV service worker successfully registered with scope:', registration.scope);
                window.__uv$serviceWorkerRegistered = true;
                return true;
            } catch (error) {
                console.error('UV service worker registration failed:', error);
                return false;
            }
        }
        
        // Start preloading the service worker immediately
        preloadServiceWorker();
    });
</script>

                    }, 100);
                    
                    // Timeout after 5 seconds
                    setTimeout(() => {
                        clearInterval(checkInterval);
                        console.warn("UV config load timeout - continuing anyway");
                        resolve();
                    }, 5000);
                });
            }
            
            // Fetch both game data files
            const [gamesResponse, games2Response] = await Promise.all([
                fetch('/assets/json/games.js'),
                fetch('/assets/json/games2.js')
            ]);
            
            if (!gamesResponse.ok || !games2Response.ok) {
                throw new Error('Failed to fetch game data files');
            }
            
            const gamesText = await gamesResponse.text();
            const games2Text = await games2Response.text();
            
            // Extract array data using a safer method than eval
            const extractArrayData = (text) => {
                // Find the array definition between brackets
                const match = text.match(/const\s+\w+\s*=\s*(\[[\s\S]*?\]);/);
                if (match && match[1]) {
                    // Use Function constructor instead of eval for better safety
                    // Still has security implications but safer than eval in this context
                    try {
                        return new Function(`return ${match[1]}`)();
                    } catch (e) {
                        console.error("Error parsing game data:", e);
                        return [];
                    }
                }
                return [];
            };
            
            const gamesData = extractArrayData(gamesText);
            const games2Data = extractArrayData(games2Text);
            
            console.log(`Loaded ${gamesData.length} games from games.js`);
            console.log(`Loaded ${games2Data.length} games from games2.js`);
            
            // Combine all games
            const allGames = [...gamesData, ...games2Data];
            console.log(`Total games loaded: ${allGames.length}`);
            
            return allGames;
        } catch (error) {
            console.error("Error loading games data:", error);
            const gamesElement = document.getElementById('gamesList');
            if (gamesElement) {
                gamesElement.innerHTML = `
                    <div style="color: white; text-align: center; grid-column: 1 / -1; padding: 20px; background: rgba(255,0,0,0.1); border-radius: 8px;">
                        Error loading games: ${error.message}
                        <button onclick="window.location.reload()" style="margin-top:10px; background:#333; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">
                            Reload Page
                        </button>
                    </div>
                `;
            }
            
            const popularGamesElement = document.getElementById('popularGamesList');
            const loadingElement = document.getElementById('popularGamesLoading');
            
            if (popularGamesElement && loadingElement) {
                loadingElement.style.display = 'none';
                popularGamesElement.innerHTML = `
                    <div style="color: #ffcc00; text-align: center; width: 100%;">
                        Could not load popular games. Please try again later.
                    </div>
                `;
            }
            
            return [];
        }
    }
    
    // Game clicks tracking system - both local and simulated global
    function getGameClickCounts() {
        const storedData = localStorage.getItem(GAME_CLICKS_KEY);
        return storedData ? JSON.parse(storedData) : {};
    }
    
    function saveGameClickCounts(clickCounts) {
        localStorage.setItem(GAME_CLICKS_KEY, JSON.stringify(clickCounts));
    }
    
    // Simulated "global" click counts (would be server-side in production)
    function getGlobalClickCounts() {
        let storedData = localStorage.getItem(GLOBAL_CLICKS_KEY);
        if (!storedData) {
            // Initialize with some random counts if not present
            const globalCounts = {};
            for (const game of allGames) {
                // Random number between 10 and 1000
                globalCounts[game.title] = Math.floor(Math.random() * 990) + 10;
            }
            localStorage.setItem(GLOBAL_CLICKS_KEY, JSON.stringify(globalCounts));
            storedData = localStorage.getItem(GLOBAL_CLICKS_KEY);
        }
        return JSON.parse(storedData);
    }
    
    function saveGlobalClickCounts(clickCounts) {
        localStorage.setItem(GLOBAL_CLICKS_KEY, JSON.stringify(clickCounts));
    }
    
    // Increment click count for a game (both local and global)
    function incrementGameClickCount(gameTitle) {
        if (!gameTitle) return;
        
        // Update local clicks
        const clickCounts = getGameClickCounts();
        clickCounts[gameTitle] = (clickCounts[gameTitle] || 0) + 1;
        saveGameClickCounts(clickCounts);
        
        // Update "global" clicks (simulated)
        const globalCounts = getGlobalClickCounts();
        globalCounts[gameTitle] = (globalCounts[gameTitle] || 0) + 1;
        saveGlobalClickCounts(globalCounts);
        
        console.log(`Incremented click count for ${gameTitle} - now at ${globalCounts[gameTitle]} global plays`);
    }
    
    // Get the most popular games based on global click counts
    function getPopularGames(count = 5) {
        // Get the global click counts
        const globalCounts = getGlobalClickCounts();
        
        // Convert to array for sorting
        const gameClicksArray = Object.entries(globalCounts).map(([title, count]) => ({
            title,
            count
        }));
        
        // Sort by click count in descending order
        gameClicksArray.sort((a, b) => b.count - a.count);
        
        // Take only the top games
        return gameClicksArray.slice(0, count);
    }
    
    // Update the popular games section
    function updatePopularGames() {
        const popularGamesList = document.getElementById('popularGamesList');
        if (!popularGamesList) return;
        
        // Remove loading indicator
        const loadingElement = document.getElementById('popularGamesLoading');
        if (loadingElement) {
            loadingElement.remove();
        }
        
        // Get top games
        const topGames = getPopularGames(5);
        
        if (topGames.length === 0) {
            popularGamesList.innerHTML = '<div style="color: #ffcc00; text-align: center; width: 100%;">No game data available</div>';
            return;
        }
        
        // Clear container
        popularGamesList.innerHTML = '';
        
        // Add each popular game with trophy icons for top 3
        topGames.forEach((gameData, index) => {
            const gameInfo = allGames.find(g => g.title === gameData.title);
            if (!gameInfo) return;
            
            const gameElement = document.createElement("div");
            gameElement.className = "popular-game-item";
            
            // Add trophy for top 3
            let trophyHTML = '';
            if (index < 3) {
                trophyHTML = `
                    <div class="trophy-icon trophy-${index + 1}">
                        <span class="trophy-badge">${index + 1}</span>
                    </div>
                `;
            }
            
            gameElement.innerHTML = `
                ${trophyHTML}
                <div class="popular-game-icon">
                    <img src="${gameInfo.imgSrc}" alt="${gameInfo.title} icon">
                </div>
                <h3 class="popular-game-title">${gameInfo.title}</h3>
                <span class="play-count">${gameData.count.toLocaleString()} plays</span>
            `;
            
            // Add click handler
            gameElement.onclick = async () => {
                // Track the click
                incrementGameClickCount(gameInfo.title);
                
                // Show loading overlay
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                    loadingOverlay.classList.remove('fade-out');
                    document.getElementById('loadingText').textContent = 'Preparing game...';
                    document.getElementById('progressFill').style.width = '0%';
                }
                
                try {
                    // Progress animation
                    const progressFill = document.getElementById('progressFill');
                    if (progressFill) {
                        progressFill.style.width = '30%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '60%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '100%';
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                } catch (error) {
                    console.error('Error in loading animation:', error);
                } finally {
                    // Navigate to the game
                    window.location.href = `/Classes.html?game=${encodeURIComponent(gameInfo.link)}`;
                }
            };
            
            popularGamesList.appendChild(gameElement);
        });
    }
    
    // Function to load a game item
    function loadGameItem(game) {
        const gamesList = document.getElementById("gamesList");
        if (!gamesList) return;
        
        // Get global play count
        const globalCounts = getGlobalClickCounts();
        const playCount = globalCounts[game.title] || 0;
        
        const gameElement = document.createElement("div");
        gameElement.className = "game-item";
        gameElement.innerHTML = `
            <div class="game-icon">
                <img src="${game.imgSrc}" alt="${game.title} icon">
            </div>
            <h3 class="game-title">${game.title}</h3>
            <span class="play-count-badge">${playCount.toLocaleString()}</span>
        `;
        
        // Add click handler
        gameElement.onclick = async () => {
            // Track the click
            incrementGameClickCount(game.title);
            
            // Update popular games section
            updatePopularGames();
            
            // Show loading overlay
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                loadingOverlay.classList.remove('fade-out');
                document.getElementById('loadingText').textContent = 'Preparing game...';
                document.getElementById('progressFill').style.width = '0%';
            }
            
            try {
                // Progress animation
                const progressFill = document.getElementById('progressFill');
                if (progressFill) {
                    progressFill.style.width = '30%';
                    await new Promise(resolve => setTimeout(resolve, 100));
                    progressFill.style.width = '60%';
                    await new Promise(resolve => setTimeout(resolve, 100));
                    progressFill.style.width = '100%';
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
            } catch (error) {
                console.error('Error in loading animation:', error);
            } finally {
                // Navigate to the game
                window.location.href = `/Classes.html?game=${encodeURIComponent(game.link)}`;
            }
        };
        
        gamesList.appendChild(gameElement);
    }

    // Initialize the page
    let allGames = [];
    
    async function initPage() {
        try {
            // Load games data
            allGames = await loadGamesData();
            
            // Update popular games
            updatePopularGames();
            
            // Load all games
            const gamesList = document.getElementById("gamesList");
            if (gamesList && Array.isArray(allGames)) {
                allGames.forEach(game => {
                    loadGameItem(game);
                });
            }
            
            // Set up search functionality
            const searchGames = document.getElementById("searchGames");
            if (searchGames) {
                searchGames.addEventListener("keyup", function(e) {
                    const gamesList = document.getElementById("gamesList");
                    if (!gamesList) return;
                    
                    gamesList.innerHTML = '';
                    const searchTerm = this.value.toLowerCase();
                    
                    for (const game of allGames) {
                        if (game.title.toLowerCase().includes(searchTerm)) {
                            loadGameItem(game);
                        }
                    }
                });
            }
        } catch (error) {
            console.error("Error initializing page:", error);
        }
    }
    
    // Set up page initialization
    document.addEventListener('DOMContentLoaded', () => {
        initPage();
        loadHTML("/assets/html/header.html", "header");
        loadHTML("/assets/html/footer.html", "footer");
    });
</script>
