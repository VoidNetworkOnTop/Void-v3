    <!-- Void Network Popup Script with better error handling -->
    <script>
    // Void Network Popup Script - Limited to 2 shows per user
    (function() {
      // Function to check if we should show the popup
      function shouldShowPopup() {
        try {
          // Get current show count from localStorage (default to 0 if not set)
          var showCount = localStorage.getItem('voidNetworkPopupShown') || 0;
          
          // Convert to number
          showCount = parseInt(showCount, 10);
          
          // Only show if less than 2 times
          return showCount < 2;
        } catch (e) {
          // If localStorage is not available (private browsing mode, etc.)
          // Use a session variable as fallback
          if (typeof window.voidNetworkPopupShown === 'undefined') {
            window.voidNetworkPopupShown = 0;
          }
          return window.voidNetworkPopupShown < 2;
        }
      }
      
      // Function to increment the show counter
      function incrementShowCount() {
        try {
          // Get current count
          var showCount = localStorage.getItem('voidNetworkPopupShown') || 0;
          showCount = parseInt(showCount, 10);
          
          // Increment and save
          showCount++;
          localStorage.setItem('voidNetworkPopupShown', showCount);
        } catch (e) {
          // Fallback to session variable
          if (typeof window.voidNetworkPopupShown === 'undefined') {
            window.voidNetworkPopupShown = 0;
          }
          window.voidNetworkPopupShown++;
        }
      }
      
      // Create the popup when the DOM is fully loaded
      function createVoidNetworkPopup() {
        // Check if we should show the popup
        if (!shouldShowPopup()) {
          return; // Exit if we've already shown it twice
        }
        
        // Increment the show counter
        incrementShowCount();
        
        // Create elements
        var overlay = document.createElement('div');
        var popup = document.createElement('div');
        var closeBtn = document.createElement('div');
        var title = document.createElement('h1');
        var message = document.createElement('p');
        var list = document.createElement('ul');
        
        // Set styles for overlay (blurred background)
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0,0,0,0.7)';
        overlay.style.backdropFilter = 'blur(8px)';
        overlay.style.zIndex = '100000';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.5s ease';
        
        // Set styles for popup
        popup.style.position = 'relative';
        popup.style.width = '90%';
        popup.style.maxWidth = '500px';
        popup.style.backgroundColor = '#000';
        popup.style.color = '#fff';
        popup.style.borderRadius = '12px';
        popup.style.padding = '30px';
        popup.style.boxShadow = '0 0 0 1px rgba(255,255,255,0.1), 0 0 15px rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.2)';
        popup.style.transform = 'scale(0.8)';
        popup.style.opacity = '0';
        popup.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
        popup.style.overflow = 'hidden';
        popup.style.fontFamily = 'Arial, sans-serif';
        popup.id = 'void-network-popup';
        
        // Add glow animation
        var style = document.createElement('style');
        style.textContent = '@keyframes pulse-glow { 0% { box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 15px rgba(255,255,255,0.2), 0 0 30px rgba(255,255,255,0.1); } 50% { box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 0 20px rgba(255,255,255,0.4), 0 0 40px rgba(255,255,255,0.3); } 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 15px rgba(255,255,255,0.2), 0 0 30px rgba(255,255,255,0.1); } } #void-network-popup { animation: pulse-glow 3s infinite ease-in-out; }';
        document.head.appendChild(style);
        
        // Set styles for close button
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '15px';
        closeBtn.style.right = '15px';
        closeBtn.style.width = '24px';
        closeBtn.style.height = '24px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.display = 'flex';
        closeBtn.style.alignItems = 'center';
        closeBtn.style.justifyContent = 'center';
        closeBtn.style.borderRadius = '50%';
        closeBtn.style.backgroundColor = 'rgba(255,255,255,0.1)';
        closeBtn.style.transition = 'background-color 0.3s ease';
        closeBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 1L1 13" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M1 1L13 13" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>';
        
        // Hover effect for close button
        closeBtn.onmouseover = function() {
          this.style.backgroundColor = 'rgba(255,255,255,0.2)';
        };
        closeBtn.onmouseout = function() {
          this.style.backgroundColor = 'rgba(255,255,255,0.1)';
        };
        
        // Set styles for title
        title.style.fontSize = '28px';
        title.style.fontWeight = 'bold';
        title.style.margin = '0 0 20px 0';
        title.style.paddingBottom = '15px';
        title.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
        title.style.textAlign = 'center';
        title.style.letterSpacing = '1px';
        title.style.color = '#fff';
        title.style.textShadow = '0 0 10px rgba(255,255,255,0.5)';
        title.textContent = 'VOID NETWORK IS BACK!';
        
        // Set styles for message
        message.style.fontSize = '16px';
        message.style.marginBottom = '20px';
        message.style.lineHeight = '1.5';
        message.style.opacity = '0.9';
        message.style.textAlign = 'center';
        message.textContent = 'We\'ve made significant improvements to enhance your experience:';
        
        // Set styles for feature list
        list.style.listStyleType = 'none';
        list.style.padding = '0';
        list.style.margin = '0';
        
        // Create features with enhanced descriptions
        var features = [
          'Enhanced VPS infrastructure for lightning-fast game loading times',
          'Completely rebuilt UV configuration to eliminate all 404 errors',
          'Upgraded VoidGPT with improved response accuracy and speed',
          'Modernized server hardware for better reliability and performance'
        ];
        
        // Add features to list
        features.forEach(function(feature) {
          var item = document.createElement('li');
          item.style.padding = '10px 0';
          item.style.marginBottom = '8px';
          item.style.display = 'flex';
          item.style.alignItems = 'flex-start';
          item.style.opacity = '0';
          item.style.transform = 'translateY(10px)';
          item.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
          
          // Add checkmark icon
          item.innerHTML = '<div style="min-width: 24px; height: 24px; margin-right: 10px; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.3332 4L5.99984 11.3333L2.6665 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>' + feature + '</span>';
          
          list.appendChild(item);
        });
        
        // Assemble the popup
        popup.appendChild(closeBtn);
        popup.appendChild(title);
        popup.appendChild(message);
        popup.appendChild(list);
        overlay.appendChild(popup);
        document.body.appendChild(overlay);
        
        // Animation timing
        setTimeout(function() {
          overlay.style.opacity = '1';
          popup.style.opacity = '1';
          popup.style.transform = 'scale(1)';
          
          // Animate list items sequentially
          var items = list.querySelectorAll('li');
          for(var i = 0; i < items.length; i++) {
            (function(index) {
              setTimeout(function() {
                items[index].style.opacity = '1';
                items[index].style.transform = 'translateY(0)';
              }, 200 + (index * 100));
            })(i);
          }
        }, 300);
        
        // Close popup function
        function closePopup() {
          popup.style.transform = 'scale(0.8)';
          popup.style.opacity = '0';
          overlay.style.opacity = '0';
          
          setTimeout(function() {
            if (document.body.contains(overlay)) {
              document.body.removeChild(overlay);
            }
          }, 500);
        }
        
        // Close on X button click
        closeBtn.addEventListener('click', closePopup);
        
        // Close on overlay click
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            closePopup();
          }
        });
      }
      
      // Execute when DOM is loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createVoidNetworkPopup);
      } else {
        createVoidNetworkPopup();
      }
    })();
    </script>

    <!-- Cache-busting script with better error handling -->
    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function() {
        try {
          // Generate a unique timestamp for this page load
          const timestamp = Date.now();
          
          // Add cache-busting parameter to all links to internal pages
          document.querySelectorAll('a').forEach(link => {
            try {
              // Only modify internal links
              if (link.href && link.href.startsWith(window.location.origin)) {
                // Add cache-busting parameter
                const url = new URL(link.href);
                url.searchParams.set('cb', timestamp);
                link.href = url.toString();
              }
            } catch (e) {
              console.warn('Failed to add cache-busting to link:', link.href, e);
            }
          });
          
          // Override fetch to add cache-busting parameter
          const originalFetch = window.fetch;
          window.fetch = function(resource, init) {
            if (typeof resource === 'string' && resource.startsWith(window.location.origin)) {
              try {
                // Add cache-busting parameter to internal requests
                const url = new URL(resource, window.location.origin);
                url.searchParams.set('cb', timestamp);
                resource = url.toString();
              } catch (e) {
                console.warn('Failed to add cache-busting to fetch:', resource, e);
              }
            }
            return originalFetch.call(this, resource, init);
          };
          
          // Override XMLHttpRequest to add cache-busting parameter
          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (typeof url === 'string' && url.startsWith(window.location.origin)) {
              try {
                // Add cache-busting parameter to internal requests
                const urlObj = new URL(url, window.location.origin);
                urlObj.searchParams.set('cb', timestamp);
                url = urlObj.toString();
              } catch (e) {
                console.warn('Failed to add cache-busting to XHR:', url, e);
              }
            }
            return originalOpen.call(this, method, url, ...rest);
          };
          
          console.log(`Cache buster active for this session: ${timestamp}`);
        } catch (error) {
          console.error('Cache-busting script error:', error);
        }
      });
    </script>

                <img src="https://lh7-us.googleusercontent.com/5Fbqj024fM1jyET0B-xC-r_j93ktHdB5dYlB80U7oxpfzefa3nFPjxwdbgE9LgwVN6URIpbowiYLJg376qRm2cPd3eD8h0ot8aeosM6xb2uZaWLIATnAah--MUM1RNliv8znm8Yv2VTfPR5n_1JpwzarFulfpQ" alt="Logo">

    <!-- Enhanced Loading Script with better error handling -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const debugInfo = document.getElementById('debugInfo');
        const loadingStage = document.getElementById('loadingStage');
        const loadingTime = document.getElementById('loadingTime');
        const deviceInfoEl = document.getElementById('deviceInfo');
        
        // Show debug info on slower devices or ChromeOS
        if (window.deviceInfo.isSlowDevice || window.deviceInfo.isChromeOS || window.deviceInfo.isLowMemory) {
            debugInfo.style.display = 'block';
            deviceInfoEl.textContent = `${window.deviceInfo.isChromeOS ? 'ChromeOS' : ''} ${window.deviceInfo.connection}`;
        }
        
        let progress = 0;
        let loadingStarted = false;
        
        function updateProgress(stage) {
            if (!loadingStage || !loadingTime) return;
            
            markStage(stage);
            loadingStage.textContent = stage;
            loadingTime.textContent = `${Date.now() - window.loadingDebugInfo.started}ms`;
            
            // Progressive loading stages with better timing
            switch(stage) {
                case 'DOM_LOADED': progress = 10; break;
                case 'SCRIPTS_LOADED': progress = 30; break;
                case 'SERVICE_WORKER_READY': progress = 50; break;
                case 'HEADER_FOOTER_LOADED': progress = 70; break;
                case 'GAMES_LOADED': progress = 90; break;
                case 'COMPLETE': progress = 100; break;
                case 'ERROR': 
                    progress = 100;
                    loadingText.textContent = 'Error occurred - continuing...';
                    break;
            }
            
            progressFill.style.width = `${progress}%`;
            
            if (progress >= 100) {
                setTimeout(() => {
                    loadingOverlay.classList.add('fade-out');
                    setTimeout(() => {
                        if (loadingOverlay.parentNode) {
                            loadingOverlay.remove();
                        }
                    }, 1000);
                }, 500);
            }
        }
        
        // Start the loading process
        updateProgress('DOM_LOADED');
        
        // Timeout fallback to ensure loading screen doesn't hang
        setTimeout(() => {
            if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                console.warn('Loading timeout reached, forcing completion');
                updateProgress('COMPLETE');
            }
        }, 15000); // 15 second timeout for very slow connections
    });
    </script>

    <!-- Enhanced Service Worker Registration with Proper Error Handling -->
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            markStage('SERVICE_WORKER_START');
            
            const stockSW = "/uv/sw.js";
            const swScope = "/uv/"; 
            const swAllowedHostnames = ["localhost", "127.0.0.1"];
            
            // Function to register service worker with timeout and retry
            async function registerServiceWorkerWithRetry(retries = 3) {
                for (let attempt = 1; attempt <= retries; attempt++) {
                    try {
                        // Check if service workers are supported
                        if (!('serviceWorker' in navigator)) {
                            console.error("Service workers are not supported in this browser");
                            return false;
                        }
                        
                        // Check if we're on HTTPS or allowed development hostnames
                        if (location.protocol !== 'https:' && !swAllowedHostnames.includes(location.hostname)) {
                            console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                            return false;
                        }
                        
                        console.log(`Attempt ${attempt}/${retries}: Registering UV service worker with scope:`, swScope);
                        
                        // Register the service worker with timeout
                        const registration = await Promise.race([
                            navigator.serviceWorker.register(stockSW, { 
                                scope: swScope,
                                updateViaCache: 'none'
                            }),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('Service worker registration timeout')), 5000))
                        ]);
                        
                        // Wait for the service worker to be ready with timeout
                        await Promise.race([
                            navigator.serviceWorker.ready,
                            new Promise((_, reject) => setTimeout(() => reject(new Error('Service worker ready timeout')), 5000))
                        ]);
                        
                        // If we have an active service worker, send it a message to skip waiting
                        if (registration.active) {
                            registration.active.postMessage({ type: 'SKIP_WAITING' });
                        }
                        
                        console.log('UV service worker successfully registered with scope:', registration.scope);
                        window.__uv$serviceWorkerRegistered = true;
                        markStage('SERVICE_WORKER_READY');
                        
                        return true;
                    } catch (error) {
                        console.warn(`Attempt ${attempt}/${retries} failed:`, error);
                        
                        if (attempt < retries) {
                            // Wait before retry with exponential backoff
                            await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                        }
                    }
                }
                
                // All attempts failed, but don't block the page
                console.error('All service worker registration attempts failed');
                markStage('SERVICE_WORKER_ERROR');
                
                // Continue without service worker
                return false;
            }
            
            // Start service worker registration
            await registerServiceWorkerWithRetry();
            
        } catch (error) {
            console.error('Critical error in service worker registration:', error);
            markStage('SERVICE_WORKER_ERROR');
        }
    });
    </script>

    <!-- Enhanced Games Loading and Header/Footer Inclusion with Maximum Error Handling -->
    <script type="module">
    (async function() {
        const gamesList = document.getElementById("gamesList");
        let headerLoaded = false;
        let footerLoaded = false;
        let gamesLoaded = false;
        let attempts = 0;
        const maxAttempts = 3;
        
        // Helper function to load external HTML with retries and timeouts
        async function safeLoadHTML(url, elementId, retries = 3) {
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    console.log(`Attempt ${attempt}/${retries}: Loading ${url} into #${elementId}`);
                    
                    // Add timeout and retry logic
                    const fetchPromise = fetch(url, {
                        cache: 'no-cache',
                        headers: {
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache'
                        }
                    });
                    
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error(`Timeout loading ${url} (attempt ${attempt})`)), 5000)
                    );
                    
                    const response = await Promise.race([fetchPromise, timeoutPromise]);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status} for ${url}`);
                    }
                    
                    const html = await response.text();
                    const element = document.getElementById(elementId);
                    
                    if (element) {
                        element.innerHTML = html;
                        console.log(`Successfully loaded ${url} into #${elementId}`);
                        return true;
                    } else {
                        console.error(`Element #${elementId} not found`);
                        return false;
                    }
                } catch (error) {
                    console.error(`Attempt ${attempt}/${retries} failed loading ${url}:`, error);
                    
                    if (attempt < retries) {
                        // Wait before retry with exponential backoff
                        await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                    }
                }
            }
            
            // All attempts failed, show fallback content
            const element = document.getElementById(elementId);
            if (element) {
                element.innerHTML = elementId === 'header' ? 
                    '<div style="text-align: center; color: #888; padding: 1rem;">Header temporarily unavailable</div>' :
                    '<div style="text-align: center; color: #888; padding: 1rem;">Footer temporarily unavailable</div>';
            }
            return false;
        }
        
        // Helper function to load game data with extensive retries
        async function loadGameData(retries = 3) {
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    console.log(`Attempt ${attempt}/${retries}: Loading game data`);
                    
                    // Try to wait for UV config if needed
                    let uvConfigReady = false;
                    if (typeof window.__uv$config === 'undefined') {
                        uvConfigReady = await new Promise(resolve => {
                            let attempts = 0;
                            const checkUV = setInterval(() => {
                                if (window.__uv$config || attempts > 30) {
                                    clearInterval(checkUV);
                                    resolve(!!window.__uv$config);
                                }
                                attempts++;
                            }, 100);
                        });
                    } else {
                        uvConfigReady = true;
                    }
                    
                    if (!uvConfigReady) {
                        console.warn('UV config not loaded, continuing anyway...');
                    }
                    
                    // Dynamic import with timeout
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error(`Import timeout (attempt ${attempt})`)), 8000)
                    );
                    
                    const [gamesModule, games2Module] = await Promise.race([
                        Promise.all([
                            import('/assets/json/games.js').catch(err => {
                                console.warn('Failed to load games.js:', err);
                                return { gamesData: [] };
                            }),
                            import('/assets/json/games2.js').catch(err => {
                                console.warn('Failed to load games2.js:', err);
                                return { games2Data: [] };
                            })
                        ]),
                        timeoutPromise
                    ]);
                    
                    const games = [
                        ...(gamesModule.gamesData || []),
                        ...(games2Module.games2Data || [])
                    ];
                    
                    if (games.length === 0 && attempt < retries) {
                        throw new Error('No games loaded, retrying...');
                    }
                    
                    console.log(`Successfully loaded ${games.length} games`);
                    return games;
                } catch (error) {
                    console.error(`Game data attempt ${attempt}/${retries} failed:`, error);
                    
                    if (attempt < retries) {
                        // Wait before retry with exponential backoff
                        await new Promise(resolve => setTimeout(resolve, 1500 * attempt));
                    }
                }
            }
            
            // All attempts failed, return minimal fallback data
            console.error('All game data loading attempts failed, using fallback');
            return [
                {
                    title: 'Games temporarily unavailable',
                    imgSrc: '/assets/images/placeholder.png',
                    link: '#'
                },
                {
                    title: 'Please refresh the page',
                    imgSrc: '/assets/images/placeholder.png',
                    link: 'javascript:window.location.reload()'
                }
            ];
        }
        
        // Function to create game element with error handling
        function createGameElement(game) {
            const gameElement = document.createElement("div");
            gameElement.className = "game-item";
            
            // Handle missing image with fallback
            const imgSrc = game.imgSrc || '/assets/images/game-placeholder.png';
            
            gameElement.innerHTML = `
                <div class="game-icon">
                    <img src="${imgSrc}" 
                         alt="${game.title || 'Game'} icon" 
                         loading="lazy"
                         onerror="this.src='/assets/images/game-placeholder.png'">
                </div>
                <h3 class="game-title">${game.title || 'Unnamed Game'}</h3>
            `;
            
            // Enhanced click handler with loading state and error handling
            gameElement.onclick = async () => {
                if (game.link === '#' || game.link === 'javascript:window.location.reload()') {
                    if (game.link === 'javascript:window.location.reload()') {
                        window.location.reload();
                    }
                    return;
                }
                
                try {
                    // Show loading state
                    const loadingOverlay = document.getElementById('loadingOverlay');
                    if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                        loadingOverlay.classList.remove('fade-out');
                        document.getElementById('loadingText').textContent = 'Preparing game...';
                        const progressFill = document.getElementById('progressFill');
                        if (progressFill) {
                            progressFill.style.width = '0%';
                            
                            // Animate progress
                            await new Promise(resolve => {
                                let progress = 0;
                                const interval = setInterval(() => {
                                    progress += 5;
                                    progressFill.style.width = `${Math.min(progress, 90)}%`;
                                    if (progress >= 90) {
                                        clearInterval(interval);
                                        resolve();
                                    }
                                }, 50);
                            });
                        }
                    }
                    
                    const targetUrl = `/Classes.html?game=${encodeURIComponent(game.link)}&t=${Date.now()}`;
                    
                    // Preload the target page
                    const link = document.createElement('link');
                    link.rel = 'prefetch';
                    link.href = targetUrl;
                    document.head.appendChild(link);
                    
                    // Navigate to game
                    window.location.href = targetUrl;
                } catch (error) {
                    console.error('Error navigating to game:', error);
                    
                    // Hide loading overlay on error
                    const loadingOverlay = document.getElementById('loadingOverlay');
                    if (loadingOverlay) {
                        loadingOverlay.classList.add('fade-out');
                    }
                }
            };
            
            return gameElement;
        }
        
        // Function to render games with search functionality
        function renderGames(games, searchTerm = '') {
            gamesList.innerHTML = '';
            
            try {
                const filteredGames = games.filter(game => 
                    game.title && game.title.toLowerCase().includes(searchTerm.toLowerCase())
                );
                
                if (filteredGames.length === 0) {
                    gamesList.innerHTML = '<div style="color: #888; text-align: center; padding: 2rem;">No games found</div>';
                    return;
                }
                
                filteredGames.forEach(game => {
                    try {
                        gamesList.appendChild(createGameElement(game));
                    } catch (error) {
                        console.error('Error creating game element:', error);
                    }
                });
            } catch (error) {
                console.error('Error rendering games:', error);
                gamesList.innerHTML = '<div class="error-message">Error displaying games</div>';
            }
        }
        
        // Main loading sequence with comprehensive error handling
        try {
            markStage('SCRIPTS_LOADED');
            
            // Load header and footer in parallel with retries
            const headerPromise = safeLoadHTML("/assets/html/header.html", "header", 3)
                .then(success => {
                    headerLoaded = true;
                    markStage('HEADER_LOADED');
                    return success;
                })
                .catch(error => {
                    console.error('Header loading failed completely:', error);
                    return false;
                });
                
            const footerPromise = safeLoadHTML("/assets/html/footer.html", "footer", 3)
                .then(success => {
                    footerLoaded = true;
                    markStage('FOOTER_LOADED');
                    return success;
                })
                .catch(error => {
                    console.error('Footer loading failed completely:', error);
                    return false;
                });
            
            // Load games data in parallel
            const gamesPromise = loadGameData(3);
            
            // Wait for header and footer (don't block on games)
            await Promise.all([headerPromise, footerPromise]);
            markStage('HEADER_FOOTER_LOADED');
            
            // Update loading progress
            const loadingStageEl = document.querySelector('#debugInfo #loadingStage');
            if (loadingStageEl) loadingStageEl.textContent = 'HEADER_FOOTER_LOADED';
            
            // Load and render games
            const gamesData = await gamesPromise;
            markStage('GAMES_LOADED');
            gamesLoaded = true;
            
            // Render games
            renderGames(gamesData);
            
            // Setup search functionality with debounce
            const searchInput = document.getElementById("searchGames");
            if (searchInput) {
                let searchTimeout;
                searchInput.addEventListener("input", function(e) {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        try {
                            renderGames(gamesData, this.value);
                        } catch (error) {
                            console.error('Search error:', error);
                        }
                    }, 300);
                });
            }
            
            markStage('COMPLETE');
            const loadingStageEl2 = document.querySelector('#debugInfo #loadingStage');
            if (loadingStageEl2) loadingStageEl2.textContent = 'COMPLETE';
            
        } catch (error) {
            console.error("Critical error during page load:", error);
            
            // Display error message to user
            gamesList.innerHTML = `
                <div class="error-message">
                    <h3>Sorry, there was an error loading the page.</h3>
                    <p>Please refresh the page or try again later.</p>
                    <button onclick="window.location.reload()" 
                            style="padding: 8px 16px; background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
                        Refresh Page
                    </button>
                    ${window.deviceInfo.isChromeOS ? '<p style="margin-top: 10px; font-size: 0.9em;">ChromeOS users: This is a known issue. Please try refreshing or clearing your browser cache.</p>' : ''}
                </div>
            `;
            
            // Still try to show header/footer if they haven't loaded
            if (!headerLoaded) {
                safeLoadHTML("/assets/html/header.html", "header", 1).catch(() => {});
            }
            if (!footerLoaded) {
                safeLoadHTML("/assets/html/footer.html", "footer", 1).catch(() => {});
            }
            
            markStage('ERROR');
        }
    })();
    </script>
