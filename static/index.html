    // Check if popup has been shown in the last 5 minutes
    function shouldShowPopup() {
      const lastClosedTime = localStorage.getItem("voidTicketsPopupClosed");
      if (!lastClosedTime) return true;
      
      const now = new Date().getTime();
      const timeSinceClosed = now - parseInt(lastClosedTime);
      const fiveMinutesInMs = 5 * 60 * 1000;
      
      return timeSinceClosed > fiveMinutesInMs;
    }

    // If it's been shown recently, exit early
    if (!shouldShowPopup()) return;

    const i = document.createElement("div");
    i.className = "void-popup-container";

    // Create particles
    (function() {
      // Adjust particle count based on screen size
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const particleCount = screenWidth < 600 || screenHeight < 500 ? 8 : 15;
      
      for (let e = 0; e < particleCount; e++) {
        const t = document.createElement("div");
        t.classList.add("void-particle");
        
        // Scale particle size based on screen size
        const sizeFactor = Math.min(screenWidth, screenHeight) < 400 ? 0.6 : 1;
        const o = (5 * Math.random() + 2) * sizeFactor;
        
        t.style.width = `${o}px`;
        t.style.height = `${o}px`;
        
        const n = 100 * Math.random();
        const a = 100 * Math.random();
        t.style.left = `${n}%`;
        t.style.top = `${a}%`;
        t.style.opacity = (6 * Math.random() + 2) / 10;
        
        // Adjust animation speed based on screen size
        const speedFactor = Math.min(screenWidth, screenHeight) < 500 ? 0.7 : 1;
        const r = (25 * Math.random() + 15) * speedFactor;
        const s = 5 * Math.random();
        
        // Create animation with limited travel distance on small screens
        const distanceFactor = Math.min(screenWidth, screenHeight) < 500 ? 0.4 : 0.8;
        t.animate([{
          transform: "translate(0, 0) rotate(0deg)"
        }, {
          transform: `translate(${(80 * Math.random() - 40) * distanceFactor}px, ${(80 * Math.random() - 40) * distanceFactor}px) rotate(90deg)`
        }, {
          transform: `translate(${(80 * Math.random() - 40) * distanceFactor}px, ${(80 * Math.random() - 40) * distanceFactor}px) rotate(180deg)`
        }, {
          transform: `translate(${(80 * Math.random() - 40) * distanceFactor}px, ${(80 * Math.random() - 40) * distanceFactor}px) rotate(270deg)`
        }, {
          transform: "translate(0, 0) rotate(360deg)"
        }], {
          duration: 1e3 * r,
          delay: 1e3 * s,
          iterations: Infinity
        });
        d.appendChild(t);
      }
    })();
    
    // Function to check if popup fits within viewport and scale if needed
    function ensurePopupFits() {
      // Reset any previously applied scaling
      popup.style.transform = 'scale(1)';
      
      // Get dimensions after any CSS layout is applied
      setTimeout(() => {
        const rect = popup.getBoundingClientRect();
        const viewportHeight = window.innerHeight;
        const viewportWidth = window.innerWidth;
        
        // Calculate available space with some margin
        const availableHeight = viewportHeight * 0.9;
        const availableWidth = viewportWidth * 0.9;
        
        // Determine if scaling is needed and by how much
        let scaleFactor = 1;
        
        if (rect.height > availableHeight) {
          scaleFactor = Math.min(scaleFactor, availableHeight / rect.height);
        }
        
        if (rect.width > availableWidth) {
          scaleFactor = Math.min(scaleFactor, availableWidth / rect.width);
        }
        
        // Apply scaling if needed
        if (scaleFactor < 1) {
          popup.style.transform = `scale(${scaleFactor})`;
        }
        
        // Special handling for extreme landscape mode (very short height)
        if (window.innerHeight < 450 && window.innerWidth > window.innerHeight) {
          popup.classList.add('landscape-layout');
        } else {
          popup.classList.remove('landscape-layout');
        }
      }, 50);
    }

    // Show popup with a slight delay to ensure it appears after page loads
    setTimeout(() => {
      i.classList.add("active");
      
      // Ensure popup fits within viewport
      ensurePopupFits();
      
      let t = 10;
      const e = setInterval(() => {
        t--;
        n.textContent = t;
        t <= 3 && r.classList.add("closing-soon");
        t <= 0 && (clearInterval(e), o.classList.add("enabled"), r.textContent = "Close enabled", r.style.opacity = "0.7", setTimeout(() => {
          r.style.opacity = "0";
        }, 2e3));
      }, 1000);
      
      setTimeout(() => {
        a.classList.add("void-show-content");
      }, 2000);
    }, 200);

    // Close button handler - only save to localStorage when clicked
    o.addEventListener("click", function() {
      if (o.classList.contains("enabled")) {
        // Save timestamp to localStorage ONLY when X is clicked
        localStorage.setItem("voidTicketsPopupClosed", new Date().getTime().toString());
        i.remove();
      }
    });
    
    // Handle resize and orientation changes
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        ensurePopupFits();
      }, 250);
    });
    
    // Also handle orientation changes explicitly
    window.addEventListener('orientationchange', function() {
      setTimeout(ensurePopupFits, 100);
    });
  })();
});

<!-- Loading Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        
        // Progress animation
        function animateProgress() {
            let progress = 0;
            const maxProgress = 100;
            const speed = 0.5;

            function updateProgress() {
                if (progress < maxProgress) {
                    progress += speed;
                    progressFill.style.width = `${Math.min(progress, maxProgress)}%`;
                    
                    if (progress < maxProgress) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        // Final checks and removal
                        setTimeout(() => {
                            loadingOverlay.classList.add('fade-out');
                            loadingOverlay.addEventListener('transitionend', () => {
                                loadingOverlay.remove();
                            });
                        }, 500);
                    }
                }
            }

            // Ensure initial visibility
            progressFill.style.width = '1%';
            requestAnimationFrame(updateProgress);
        }

        // Ensure all critical resources are loaded
        function waitForCriticalResources() {
            const criticalChecks = [
                () => window.CONFIG !== undefined,
                () => window.loadHTML !== undefined,
                () => window.__uv$config !== undefined,
                () => {
                    try {
                        return window.gamesData && window.games2Data;
                    } catch {
                        return false;
                    }
                }
            ];

            function checkResources() {
                const allLoaded = criticalChecks.every(check => check());
                
                if (allLoaded) {
                    animateProgress();
                } else {
                    // If not loaded, check again after a short delay
                    setTimeout(checkResources, 100);
                }
            }

            // Start initial check with a timeout fallback
            checkResources();
            
            // Fallback timeout to prevent indefinite waiting
            setTimeout(() => {
                animateProgress();
            }, 10000);
        }

        // Kick off the loading process
        waitForCriticalResources();

        // Ensure loading bar is visible even if resources are cached
        window.addEventListener('load', () => {
            if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                animateProgress();
            }
        });
    });
</script>

<!-- FIXED Service Worker Registration -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const stockSW = "/uv/sw.js";
        // IMPORTANT: Use the allowed scope instead of root scope
        const swScope = "/uv/"; 
        const swAllowedHostnames = ["localhost", "127.0.0.1"];
        
        // Function to preload and register the service worker with correct scope
        async function preloadServiceWorker() {
            // Check if service workers are supported
            if (!('serviceWorker' in navigator)) {
                console.error("Service workers are not supported in this browser");
                return false;
            }
            
            // Check if we're on HTTPS or allowed development hostnames
            if (location.protocol !== 'https:' && !swAllowedHostnames.includes(location.hostname)) {
                console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                return false;
            }
            
            try {
                console.log('Registering UV service worker with scope:', swScope);
                
                // Register the service worker with the CORRECT scope
                const registration = await navigator.serviceWorker.register(stockSW, { 
                    scope: swScope,
                    updateViaCache: 'none'
                });
                
                // Wait for the service worker to be ready
                await navigator.serviceWorker.ready;
                
                // If we have an active service worker, send it a message to skip waiting
                if (registration.active) {
                    registration.active.postMessage({ type: 'SKIP_WAITING' });
                }
                
                console.log('UV service worker successfully registered with scope:', registration.scope);
                window.__uv$serviceWorkerRegistered = true;
                return true;
            } catch (error) {
                console.error('UV service worker registration failed:', error);
                return false;
            }
        }
        
        // Start preloading the service worker immediately
        preloadServiceWorker();
    });
</script>

<script type="module">
    try {
        const gamesList = document.getElementById("gamesList");
        
        await new Promise(resolve => {
            if (window.__uv$config) {
                resolve();
            } else {
                const checkUV = setInterval(() => {
                    if (window.__uv$config) {
                        clearInterval(checkUV);
                        resolve();
                    }
                }, 100);
            }
        });

        const { gamesData } = await import("/assets/json/games.js");
        const { games2Data } = await import("/assets/json/games2.js");
        
        const games = [...gamesData, ...games2Data];

        function loadGame(game) {
            const gameElement = document.createElement("div");
            gameElement.className = "game-item";
            gameElement.innerHTML = `<div class="game-icon">
                    <img src="${game.imgSrc}" alt="${game.title} icon">
                </div>
                <h3 class="game-title">${game.title}</h3>
            `;
            
            // Update click handler
            gameElement.onclick = async () => {
                // Show loading overlay
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                    loadingOverlay.classList.remove('fade-out');
                    document.getElementById('loadingText').textContent = 'Preparing game...';
                    document.getElementById('progressFill').style.width = '0%';
                }
                
                try {
                    // Progress animation
                    const progressFill = document.getElementById('progressFill');
                    if (progressFill) {
                        progressFill.style.width = '30%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '60%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '100%';
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                } catch (error) {
                    console.error('Error in loading animation:', error);
                } finally {
                    // Navigate to the game
                    window.location.href = `/Classes.html?game=${encodeURIComponent(game.link)}`;
                }
            };
            
            gamesList.appendChild(gameElement);
        }

        if (Array.isArray(games)) {
            games.forEach(game => {
                loadGame(game);
            });
        } else {
            console.error("Games is not an array:", games);
            gamesList.innerHTML = '<div style="color: white;">Error: Games data is not in the correct format</div>';
        }

        document.getElementById("searchGames").addEventListener("keyup", function(e) {
            gamesList.innerHTML = '';
            const searchTerm = this.value.toLowerCase();
            for (const game of games) {
                if (game.title.toLowerCase().includes(searchTerm)) {
                    loadGame(game);
                }
            }
        });
    } catch (error) {
        console.error("Error loading games:", error);
        gamesList.innerHTML = `<div style="color: white;">Error loading games: ${error.message}</div>`;
    }
