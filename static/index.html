    <!-- Global Game Stats Script -->
    <script>
        /**
         * GlobalGameStats - A module for tracking and simulating global game play statistics
         * 
         * This module provides a combination of:
         * 1. Real user interaction tracking (stored in localStorage)
         * 2. Simulated global statistics that appear consistent across all users
         * 3. Time-based increments to simulate ongoing play by other users
         */
        const GlobalGameStats = {
            // Storage keys
            USER_PLAYS_KEY: 'user_game_plays',
            LAST_UPDATE_KEY: 'global_stats_last_update',
            
            // Base popularity factors (higher = more popular)
            popularityFactors: {
                'minecraft': 10.0,
                'slope': 8.5,
                '1v1lol': 7.8,
                'amoungus': 7.2, 
                'fnaf': 6.9,
                'retrobowl': 6.5,
                'subwaysurfers': 6.3,
                'cookieclicker': 5.8,
                'gunmayhem': 5.5,
                'tanukisunset': 5.2,
                'ducklife': 5.0,
                'drivemad': 4.7,
                'tunnel': 4.5,
                'paperio': 4.2,
                'flappybird': 4.0,
                // Many other games with lower factors (3.5 to 1.0)
            },
            
            // Initial base counts (as of a specific reference date)
            // Reference date: January 1, 2023
            referenceDate: new Date(2023, 0, 1).getTime(),
            baseCounts: {
                'minecraft': 25842,
                'slope': 21461,
                '1v1lol': 18593,
                'amoungus': 15742,
                'fnaf': 14983,
                'retrobowl': 13742,
                'subwaysurfers': 12523,
                'cookieclicker': 11864,
                'gunmayhem': 10582,
                'tanukisunset': 9423,
                'ducklife': 8752,
                'drivemad': 7941,
                'tunnel': 6845,
                'paperio': 5723,
                'flappybird': 4912
            },
            
            /**
             * Initialize the game statistics system
             * Sets default values for any uninitialized games
             * @param {Array} gameList - List of game objects with id properties
             */
            initialize: function(gameList) {
                // Initialize user plays if not present
                let userPlays = this.getUserPlays();
                let updated = false;
                
                // Ensure we have default popularity factors for all games
                if (gameList && gameList.length > 0) {
                    gameList.forEach(game => {
                        const id = game.id || this.createIdFromTitle(game.title);
                        
                        // Set default popularity factor if not present
                        if (!this.popularityFactors[id]) {
                            // Assign a random popularity between 1.0 and 3.5 for new games
                            this.popularityFactors[id] = 1.0 + (Math.random() * 2.5);
                        }
                        
                        // Set default base count if not present
                        if (!this.baseCounts[id]) {
                            // Random base count between 1000 and 4000 for new games
                            this.baseCounts[id] = Math.floor(1000 + (Math.random() * 3000));
                        }
                        
                        // Initialize user plays counter if not present
                        if (userPlays[id] === undefined) {
                            userPlays[id] = 0;
                            updated = true;
                        }
                    });
                }
                
                // Save user plays if updated
                if (updated) {
                    this.saveUserPlays(userPlays);
                }
                
                // Update the last update timestamp if not present
                if (!localStorage.getItem(this.LAST_UPDATE_KEY)) {
                    localStorage.setItem(this.LAST_UPDATE_KEY, Date.now().toString());
                }
                
                console.log('Global game stats initialized');
                
                // Return this for chaining
                return this;
            },
            
            /**
             * Create a simple ID from a game title
             * @param {string} title Game title
             * @returns {string} Simple ID
             */
            createIdFromTitle: function(title) {
                return title.toLowerCase()
                    .replace(/[^a-z0-9]+/g, '') // Remove non-alphanumeric chars
                    .replace(/\s+/g, '');       // Remove spaces
            },
            
            /**
             * Get the user's personal play counts
             * @returns {Object} Object with game IDs as keys and play counts as values
             */
            getUserPlays: function() {
                const stored = localStorage.getItem(this.USER_PLAYS_KEY);
                return stored ? JSON.parse(stored) : {};
            },
            
            /**
             * Save the user's personal play counts
             * @param {Object} plays Object with game IDs as keys and play counts as values
             */
            saveUserPlays: function(plays) {
                localStorage.setItem(this.USER_PLAYS_KEY, JSON.stringify(plays));
            },
            
            /**
             * Record a play by the current user
             * @param {string} gameId ID of the game that was played
             * @returns {number} New user play count for this game
             */
            recordUserPlay: function(gameId) {
                if (!gameId) return 0;
                
                // Get current user plays
                const userPlays = this.getUserPlays();
                
                // Initialize if not present
                if (userPlays[gameId] === undefined) {
                    userPlays[gameId] = 0;
                }
                
                // Increment count
                userPlays[gameId]++;
                
                // Save updated plays
                this.saveUserPlays(userPlays);
                
                console.log(`User played ${gameId}, total user plays: ${userPlays[gameId]}`);
                
                return userPlays[gameId];
            },
            
            /**
             * Get global play count for a specific game
             * @param {string} gameId ID of the game
             * @returns {number} Simulated global play count
             */
            getGlobalPlayCount: function(gameId) {
                if (!gameId) return 0;
                
                // Get user's plays for this game
                const userPlays = this.getUserPlays();
                const userPlayCount = userPlays[gameId] || 0;
                
                // Get simulated global count
                const simulatedCount = this.getSimulatedCount(gameId);
                
                // Return simulated global count plus user's personal plays
                return simulatedCount + userPlayCount;
            },
            
            /**
             * Calculate simulated play count based on time and popularity
             * @param {string} gameId ID of the game
             * @returns {number} Simulated play count (excluding user's plays)
             */
            getSimulatedCount: function(gameId) {
                if (!gameId) return 0;
                
                // Get base count
                const baseCount = this.baseCounts[gameId] || 1000;
                
                // Get popularity factor (plays per day)
                const popularityFactor = this.popularityFactors[gameId] || 1.0;
                
                // Calculate time-based increment
                const now = Date.now();
                const daysSinceReference = (now - this.referenceDate) / (1000 * 60 * 60 * 24);
                
                // Base plays from reference date till now
                // We use a non-linear formula to simulate more realistic growth patterns
                // sqrt(days) gives slower growth over time, multiplied by daily popularity factor
                const baseTimePlays = Math.floor(Math.sqrt(daysSinceReference) * popularityFactor * 20);
                
                // Add daily variance based on day of week (more plays on weekends)
                const date = new Date(now);
                const dayOfWeek = date.getDay(); // 0 is Sunday, 6 is Saturday
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const dayFactor = isWeekend ? 1.2 : 1.0;
                
                // Add time of day variance (more plays during peak hours)
                const hour = date.getHours();
                let hourFactor = 1.0;
                
                // Peak hours: 3-5pm and 7-9pm
                if ((hour >= 15 && hour <= 17) || (hour >= 19 && hour <= 21)) {
                    hourFactor = 1.3;
                }
                // Late night/early morning: reduced activity
                else if (hour >= 1 && hour <= 5) {
                    hourFactor = 0.7;
                }
                
                // Calculate final time-based plays with variance
                const timePlays = Math.floor(baseTimePlays * dayFactor * hourFactor);
                
                // Combine base count with time-based plays
                return baseCount + timePlays;
            },
            
            /**
             * Get all global play counts for all games
             * @returns {Object} Object with game IDs as keys and global play counts as values
             */
            getAllGlobalCounts: function() {
                const counts = {};
                
                // Get all game IDs from popularity factors
                const gameIds = Object.keys(this.popularityFactors);
                
                // Calculate global count for each game
                gameIds.forEach(gameId => {
                    counts[gameId] = this.getGlobalPlayCount(gameId);
                });
                
                return counts;
            },
            
            /**
             * Get the top N most played games
             * @param {number} limit Maximum number of games to return
             * @returns {Array} Array of [gameId, count] pairs sorted by count
             */
            getTopGames: function(limit = 5) {
                // Get all global counts
                const counts = this.getAllGlobalCounts();
                
                // Convert to array of [id, count] pairs
                const countArray = Object.entries(counts);
                
                // Sort by count in descending order
                countArray.sort((a, b) => b[1] - a[1]);
                
                // Return limited number of pairs
                return countArray.slice(0, limit);
            },
            
            /**
             * Get popularity trend for a game (increasing, steady, or decreasing)
             * @param {string} gameId ID of the game
             * @returns {string} Trend: 'rising', 'steady', or 'falling'
             */
            getGameTrend: function(gameId) {
                if (!gameId) return 'steady';
                
                const popularityFactor = this.popularityFactors[gameId] || 1.0;
                
                // Simple trend calculation based on popularity factor
                if (popularityFactor >= 5.0) return 'rising';
                if (popularityFactor <= 2.0) return 'falling';
                return 'steady';
            },
            
            /**
             * Update game's popularity factor based on recent play patterns
             * This would normally use server analytics, but we'll simulate it
             * @param {string} gameId ID of the game
             * @param {number} playDelta Change in plays (positive or negative)
             */
            updatePopularityFactor: function(gameId, playDelta) {
                if (!gameId) return;
                
                const currentFactor = this.popularityFactors[gameId] || 1.0;
                
                // Calculate new factor with limits
                const newFactor = Math.max(0.5, Math.min(12.0, currentFactor + (playDelta * 0.01)));
                
                // Update factor
                this.popularityFactors[gameId] = newFactor;
                
                console.log(`Updated popularity factor for ${gameId}: ${newFactor.toFixed(2)}`);
            }
        };
    </script>

<!-- Loading Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        
        // Progress animation
        function animateProgress() {
            let progress = 0;
            const maxProgress = 100;
            const speed = 0.5;

            function updateProgress() {
                if (progress < maxProgress) {
                    progress += speed;
                    progressFill.style.width = `${Math.min(progress, maxProgress)}%`;
                    
                    if (progress < maxProgress) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        // Final checks and removal
                        setTimeout(() => {
                            loadingOverlay.classList.add('fade-out');
                            loadingOverlay.addEventListener('transitionend', () => {
                                loadingOverlay.remove();
                            });
                        }, 500);
                    }
                }
            }

            // Ensure initial visibility
            progressFill.style.width = '1%';
            requestAnimationFrame(updateProgress);
        }

        // Ensure all critical resources are loaded
        function waitForCriticalResources() {
            const criticalChecks = [
                () => window.CONFIG !== undefined,
                () => window.loadHTML !== undefined,
                () => window.__uv$config !== undefined,
                () => {
                    try {
                        return window.gamesData && window.games2Data;
                    } catch {
                        return false;
                    }
                }
            ];

            function checkResources() {
                const allLoaded = criticalChecks.every(check => check());
                
                if (allLoaded) {
                    animateProgress();
                } else {
                    // If not loaded, check again after a short delay
                    setTimeout(checkResources, 100);
                }
            }

            // Start initial check with a timeout fallback
            checkResources();
            
            // Fallback timeout to prevent indefinite waiting
            setTimeout(() => {
                animateProgress();
            }, 10000);
        }

        // Kick off the loading process
        waitForCriticalResources();

        // Ensure loading bar is visible even if resources are cached
        window.addEventListener('load', () => {
            if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                animateProgress();
            }
        });
    });
</script>

<!-- FIXED Service Worker Registration -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const stockSW = "/uv/sw.js";
        // IMPORTANT: Use the allowed scope instead of root scope
        const swScope = "/uv/"; 
        const swAllowedHostnames = ["localhost", "127.0.0.1"];
        
        // Function to preload and register the service worker with correct scope
        async function preloadServiceWorker() {
            // Check if service workers are supported
            if (!('serviceWorker' in navigator)) {
                console.error("Service workers are not supported in this browser");
                return false;
            }
            
            // Check if we're on HTTPS or allowed development hostnames
            if (location.protocol !== 'https:' && !swAllowedHostnames.includes(location.hostname)) {
                console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                return false;
            }
            
            try {
                console.log('Registering UV service worker with scope:', swScope);
                
                // Register the service worker with the CORRECT scope
                const registration = await navigator.serviceWorker.register(stockSW, { 
                    scope: swScope,
                    updateViaCache: 'none'
                });
                
                // Wait for the service worker to be ready
                await navigator.serviceWorker.ready;
                
                // If we have an active service worker, send it a message to skip waiting
                if (registration.active) {
                    registration.active.postMessage({ type: 'SKIP_WAITING' });
                }
                
                console.log('UV service worker successfully registered with scope:', registration.scope);
                window.__uv$serviceWorkerRegistered = true;
                return true;
            } catch (error) {
                console.error('UV service worker registration failed:', error);
                return false;
            }
        }
        
        // Start preloading the service worker immediately
        preloadServiceWorker();
    });
</script>

<!-- Games Loading and Header/Footer Inclusion with Game Click Tracking -->
<script type="module">
    try {
        const gamesList = document.getElementById("gamesList");
        const popularGamesList = document.getElementById("popularGamesList");
        
        // Wait for UV config to be available
        await new Promise(resolve => {
            if (window.__uv$config) {
                resolve();
            } else {
                const checkUV = setInterval(() => {
                    if (window.__uv$config) {
                        clearInterval(checkUV);
                        resolve();
                    }
                }, 100);
                
                // Timeout after 5 seconds
                setTimeout(() => {
                    clearInterval(checkUV);
                    console.warn("UV config load timeout - continuing anyway");
                    resolve();
                }, 5000);
            }
        });

        const { gamesData } = await import("/assets/json/games.js");
        const { games2Data } = await import("/assets/json/games2.js");
        
        // Combine game data
        const games = [...gamesData, ...games2Data];
        
        // Process games to add IDs
        const processedGames = games.map(game => {
            const id = GlobalGameStats.createIdFromTitle(game.title);
            return {
                ...game,
                id
            };
        });
        
        // Initialize global stats with games
        GlobalGameStats.initialize(processedGames);

        /**
         * Update the popular games section
         */
        function updatePopularGames() {
            if (!popularGamesList) return;
            
            // Remove loading indicator
            const loadingElement = document.getElementById('popularGamesLoading');
            if (loadingElement) {
                loadingElement.remove();
            }
            
            // Get the top 5 games by play count
            const topGames = GlobalGameStats.getTopGames(5);
            
            if (topGames.length === 0) {
                popularGamesList.innerHTML = '<div style="color: #ffcc00; text-align: center; width: 100%;">No popular games data available</div>';
                return;
            }
            
            // Clear container
            popularGamesList.innerHTML = '';
            
            // Add each popular game
            topGames.forEach(([gameId, playCount], index) => {
                // Find game info from processed games
                const gameInfo = processedGames.find(g => g.id === gameId);
                if (!gameInfo) return;
                
                const gameElement = document.createElement("div");
                gameElement.className = "popular-game-item";
                
                // Add trophy for top 3
                let trophyHTML = '';
                if (index < 3) {
                    trophyHTML = `
                        <div class="trophy-icon trophy-${index + 1}">
                            <span class="trophy-badge">${index + 1}</span>
                        </div>
                    `;
                }
                
                // Get trend for this game
                const trend = GlobalGameStats.getGameTrend(gameId);
                let trendHTML = '';
                
                if (trend === 'rising') {
                    trendHTML = `
                        <div class="trend-indicator trend-rising">
                            <svg width="10" height="10" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M7 14l5-5 5 5z"/>
                            </svg>
                        </div>
                    `;
                } else if (trend === 'falling') {
                    trendHTML = `
                        <div class="trend-indicator trend-falling">
                            <svg width="10" height="10" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M7 10l5 5 5-5z"/>
                            </svg>
                        </div>
                    `;
                }
                
                gameElement.innerHTML = `
                    ${trophyHTML}
                    ${trendHTML}
                    <div class="popular-game-icon">
                        <img src="${gameInfo.imgSrc}" alt="${gameInfo.title} icon">
                    </div>
                    <h3 class="popular-game-title">${gameInfo.title}</h3>
                    <div class="play-count">
                        <svg class="play-count-icon" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4z"/>
                        </svg>
                        ${playCount.toLocaleString()}
                    </div>
                `;
                
                // Add click handler
                gameElement.onclick = async () => {
                    // Record play and update popularity
                    GlobalGameStats.recordUserPlay(gameId);
                    GlobalGameStats.updatePopularityFactor(gameId, 0.5);
                    
                    // Show loading overlay
                    const loadingOverlay = document.getElementById('loadingOverlay');
                    if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                        loadingOverlay.classList.remove('fade-out');
                        document.getElementById('loadingText').textContent = 'Preparing game...';
                        document.getElementById('progressFill').style.width = '0%';
                    }
                    
                    try {
                        // Progress animation
                        const progressFill = document.getElementById('progressFill');
                        if (progressFill) {
                            progressFill.style.width = '30%';
                            await new Promise(resolve => setTimeout(resolve, 100));
                            progressFill.style.width = '60%';
                            await new Promise(resolve => setTimeout(resolve, 100));
                            progressFill.style.width = '100%';
                            await new Promise(resolve => setTimeout(resolve, 200));
                        }
                    } catch (error) {
                        console.error('Error in loading animation:', error);
                    } finally {
                        // Navigate to the game
                        window.location.href = `/Classes.html?game=${encodeURIComponent(gameInfo.link)}`;
                    }
                };
                
                popularGamesList.appendChild(gameElement);
            });
        }

        /**
         * Load a game item into the grid
         * @param {Object} game Game object with title, imgSrc, and link
         */
        function loadGameItem(game) {
            if (!gamesList) return;
            
            // Get game ID
            const gameId = game.id || GlobalGameStats.createIdFromTitle(game.title);
            
            // Get play count and trend
            const playCount = GlobalGameStats.getGlobalPlayCount(gameId);
            const trend = GlobalGameStats.getGameTrend(gameId);
            
            const gameElement = document.createElement("div");
            gameElement.className = "game-item";
            
            // Build trend indicator HTML
            let trendHTML = '';
            if (trend === 'rising') {
                trendHTML = `
                    <div class="trend-indicator trend-rising">
                        <svg width="10" height="10" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M7 14l5-5 5 5z"/>
                        </svg>
                    </div>
                `;
            } else if (trend === 'falling') {
                trendHTML = `
                    <div class="trend-indicator trend-falling">
                        <svg width="10" height="10" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M7 10l5 5 5-5z"/>
                        </svg>
                    </div>
                `;
            }
            
            gameElement.innerHTML = `
                ${trendHTML}
                <div class="game-icon">
                    <img src="${game.imgSrc}" alt="${game.title} icon">
                </div>
                <h3 class="game-title">${game.title}</h3>
                <div class="play-count-badge">
                    <svg class="play-count-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4z"/>
                    </svg>
                    ${playCount.toLocaleString()}
                </div>
            `;
            
            // Add click handler
            gameElement.onclick = async () => {
                // Record play and update popularity
                GlobalGameStats.recordUserPlay(gameId);
                GlobalGameStats.updatePopularityFactor(gameId, 0.5);
                
                // Update popular games section
                updatePopularGames();
                
                // Show loading overlay
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                    loadingOverlay.classList.remove('fade-out');
                    document.getElementById('loadingText').textContent = 'Preparing game...';
                    document.getElementById('progressFill').style.width = '0%';
                }
                
                try {
                    // Progress animation
                    const progressFill = document.getElementById('progressFill');
                    if (progressFill) {
                        progressFill.style.width = '30%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '60%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '100%';
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                } catch (error) {
                    console.error('Error in loading animation:', error);
                } finally {
                    // Navigate to the game
                    window.location.href = `/Classes.html?game=${encodeURIComponent(game.link)}`;
                }
            };
            
            gamesList.appendChild(gameElement);
        }

        // Load all games
        if (Array.isArray(processedGames)) {
            processedGames.forEach(game => {
                loadGameItem(game);
            });
            
            // Initialize the popular games section
            updatePopularGames();
            
            // Periodically update popularity factors to simulate other users
            setInterval(() => {
                // Randomly boost popularity for some games
                const randomGameIndex = Math.floor(Math.random() * processedGames.length);
                const randomGame = processedGames[randomGameIndex];
                if (randomGame && randomGame.id) {
                    // Small random boost
                    const randomBoost = Math.random() * 0.1;
                    GlobalGameStats.updatePopularityFactor(randomGame.id, randomBoost);
                }
                
                // Update UI if needed
                updatePopularGames();
            }, 60000); // Every minute
        } else {
            console.error("Games is not an array:", processedGames);
            if (gamesList) {
                gamesList.innerHTML = '<div style="color: white;">Error: Games data is not in the correct format</div>';
            }
        }

        // Set up search functionality
        const searchGames = document.getElementById("searchGames");
        if (searchGames) {
            searchGames.addEventListener("keyup", function(e) {
                if (!gamesList) return;
                
                gamesList.innerHTML = '';
                const searchTerm = this.value.toLowerCase();
                
                for (const game of processedGames) {
                    if (game.title.toLowerCase().includes(searchTerm)) {
                        loadGameItem(game);
                    }
                }
            });
        }
    } catch (error) {
        console.error("Error loading games:", error);
        if (gamesList) {
            gamesList.innerHTML = `<div style="color: white;">Error loading games: ${error.message}</div>`;
        }
    }
    
    // Load header and footer
    loadHTML("/assets/html/header.html", "header");
    loadHTML("/assets/html/footer.html", "footer");
</script>
