    <!-- ENHANCED Service Worker Registration -->
    <script>
    (function() {
        // Global reference to track service worker status
        window.__uv$serviceWorkerRegistered = false;
        window.__uv$serviceWorkerErrors = 0;
        
        /**
         * Show status message
         * @param {string} message - Message to display
         * @param {string} type - Message type (error, success, info)
         * @param {number} duration - How long to show message in ms
         */
        function showStatus(message, type = 'info', duration = 3000) {
            const statusElement = document.getElementById('swStatus');
            if (!statusElement) return;
            
            // Clear existing classes and add new type
            statusElement.className = '';
            if (type) statusElement.classList.add(type);
            
            statusElement.textContent = message;
            statusElement.style.display = 'block';
            
            // Auto hide after duration
            setTimeout(() => {
                statusElement.style.opacity = '0';
                setTimeout(() => {
                    statusElement.style.display = 'none';
                    statusElement.style.opacity = '1';
                }, 300);
            }, duration);
        }
        
        /**
         * Register the UV service worker with enhanced error handling
         */
        async function registerServiceWorker() {
            // Check if service workers are supported
            if (!('serviceWorker' in navigator)) {
                console.error("Service workers are not supported in this browser");
                showStatus("Service workers not supported", "error");
                return false;
            }
            
            const swScope = "/uv/";
            const stockSW = "/uv/sw.js";
            const swAllowedHostnames = ["localhost", "127.0.0.1"];
            
            // Check if we're on HTTPS or allowed development hostnames
            const isSecureContext = location.protocol === 'https:' || 
                                   swAllowedHostnames.includes(location.hostname);
            
            if (!isSecureContext) {
                console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                showStatus("HTTPS required for service worker", "error");
                return false;
            }
            
            try {
                // First check if there's a controlling service worker
                if (navigator.serviceWorker.controller) {
                    const registration = await navigator.serviceWorker.getRegistration(swScope);
                    if (registration) {
                        console.log('UV service worker already registered:', registration);
                        
                        // Check if it's the expected one by sending a ping
                        try {
                            // Send a ping to check if the service worker is responsive
                            navigator.serviceWorker.controller.postMessage({
                                type: 'PING',
                                timestamp: Date.now()
                            });
                            
                            // Wait for response (with timeout)
                            const pongPromise = new Promise((resolve) => {
                                const messageHandler = (event) => {
                                    if (event.data && event.data.type === 'PONG') {
                                        navigator.serviceWorker.removeEventListener('message', messageHandler);
                                        resolve(true);
                                    }
                                };
                                navigator.serviceWorker.addEventListener('message', messageHandler);
                                
                                // Auto-resolve after timeout
                                setTimeout(() => {
                                    navigator.serviceWorker.removeEventListener('message', messageHandler);
                                    resolve(false);
                                }, 1000);
                            });
                            
                            const receivedPong = await pongPromise;
                            if (receivedPong) {
                                console.log('Service worker responded to ping');
                                window.__uv$serviceWorkerRegistered = true;
                                return true;
                            } else {
                                console.warn('Service worker did not respond to ping, will register a new one');
                                // Continue to registration
                            }
                        } catch (pingError) {
                            console.error('Error pinging service worker:', pingError);
                            // Continue to registration
                        }
                    }
                }
                
                console.log('Registering UV service worker with scope:', swScope);
                
                // Register the service worker with the CORRECT scope
                const registration = await navigator.serviceWorker.register(stockSW, { 
                    scope: swScope,
                    updateViaCache: 'none'
                });
                
                // Wait for the service worker to be ready
                await navigator.serviceWorker.ready;
                
                // If we have an active service worker, send it a message to skip waiting
                if (registration.active) {
                    registration.active.postMessage({ type: 'SKIP_WAITING' });
                }
                
                console.log('UV service worker successfully registered with scope:', registration.scope);
                window.__uv$serviceWorkerRegistered = true;
                showStatus("Service worker loaded", "success", 2000);
                
                // Add update handler for future updates
                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            console.log('New service worker installed, notifying to skip waiting');
                            newWorker.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });
                
                return true;
            } catch (error) {
                window.__uv$serviceWorkerErrors++;
                console.error('UV service worker registration failed:', error);
                
                // Show error notification if multiple failures
                if (window.__uv$serviceWorkerErrors > 2) {
                    showStatus("Service worker error: " + error.message, "error", 5000);
                }
                
                // Try again after a delay, with increasing backoff
                const delay = Math.min(2000 * window.__uv$serviceWorkerErrors, 10000);
                setTimeout(registerServiceWorker, delay);
                return false;
            }
        }
        
        // Add event listener for service worker updates
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('Service worker controller changed');
        });
        
        // Add error recovery mechanism
        let heartbeatInterval;
        function startServiceWorkerHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            
            heartbeatInterval = setInterval(() => {
                if (navigator.serviceWorker.controller) {
                    try {
                        // Send a ping to the service worker
                        navigator.serviceWorker.controller.postMessage({
                            type: 'PING',
                            timestamp: Date.now()
                        });
                    } catch (e) {
                        console.error('Error sending heartbeat to service worker:', e);
                        // If we can't send a message, service worker might be dead
                        registerServiceWorker();
                    }
                } else if (window.__uv$serviceWorkerRegistered) {
                    // If we should have a controller but don't, try to register again
                    console.warn('Lost service worker controller, attempting to re-register');
                    registerServiceWorker();
                }
            }, 30000); // Check every 30 seconds
        }
        
        // Register immediately
        registerServiceWorker().then(success => {
            if (success) {
                startServiceWorkerHeartbeat();
            }
        });
        
        // Also register when page becomes visible
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !window.__uv$serviceWorkerRegistered) {
                registerServiceWorker();
            }
        });
        
        // Register a handler for offline/online events
        window.addEventListener('online', () => {
            if (!window.__uv$serviceWorkerRegistered) {
                console.log('Network connection restored, attempting to register service worker');
                registerServiceWorker();
            }
        });
        
        // Expose registration function to window for manual trigger
        window.registerUVServiceWorker = registerServiceWorker;
    })();
    </script>

    <!-- Loading Script with Improved Error Handling -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const loadingText = document.getElementById('loadingText');
        const errorNotification = document.getElementById('errorNotification');
        
        // Track loading status
        let resourcesLoaded = {
            config: false,
            uv: false,
            games: false
        };
        
        // Update loading text and progress based on what's loading
        function updateLoadingStatus() {
            const loadedCount = Object.values(resourcesLoaded).filter(Boolean).length;
            const totalCount = Object.keys(resourcesLoaded).length;
            const progress = (loadedCount / totalCount) * 100;
            
            // Update progress bar
            progressFill.style.width = `${Math.min(progress, 100)}%`;
            
            // Update loading text based on what's still loading
            if (!resourcesLoaded.uv) {
                loadingText.innerHTML = "Loading proxy<span class='dots'></span>";
            } else if (!resourcesLoaded.games) {
                loadingText.innerHTML = "Loading games<span class='dots'></span>";
            } else {
                loadingText.innerHTML = "Finishing up<span class='dots'></span>";
            }
            
            // Check if everything is loaded
            if (loadedCount === totalCount) {
                finishLoading();
            }
        }
        
        // Progress animation
        function animateProgress() {
            // Start with initial check
            checkResourceLoading();
            
            // Set up interval to continue checking
            const progressInterval = setInterval(() => {
                checkResourceLoading();
                
                // If everything is loaded, stop checking
                if (Object.values(resourcesLoaded).every(Boolean)) {
                    clearInterval(progressInterval);
                }
            }, 500);
            
            // Fallback timeout to prevent indefinite waiting
            setTimeout(() => {
                clearInterval(progressInterval);
                finishLoading();
            }, 10000);
        }
        
        // Check if required resources are loaded
        function checkResourceLoading() {
            // Check for CONFIG
            if (!resourcesLoaded.config && window.CONFIG !== undefined) {
                resourcesLoaded.config = true;
                updateLoadingStatus();
            }
            
            // Check for UV
            if (!resourcesLoaded.uv && window.__uv$config !== undefined) {
                resourcesLoaded.uv = true;
                updateLoadingStatus();
            }
            
            // Check for games data
            if (!resourcesLoaded.games) {
                try {
                    const hasGamesData = window.gamesData || 
                                       (typeof window.gamesDataPromise !== 'undefined') ||
                                       document.getElementById('gamesList').children.length > 0;
                    
                    if (hasGamesData) {
                        resourcesLoaded.games = true;
                        updateLoadingStatus();
                    }
                } catch (e) {
                    console.warn('Error checking games data:', e);
                }
            }
        }
        
        // Finish loading and hide overlay
        function finishLoading() {
            // Make sure progress bar is at 100%
            progressFill.style.width = '100%';
            
            // Wait a bit before hiding
            setTimeout(() => {
                loadingOverlay.classList.add('fade-out');
                loadingOverlay.addEventListener('transitionend', () => {
                    loadingOverlay.style.display = 'none';
                });
            }, 500);
        }
        
        // Handle errors in game loading
        function handleGameLoadError(error) {
            console.error('Error loading games:', error);
            
            // Show error message in games list
            const gamesList = document.getElementById('gamesList');
            if (gamesList) {
                gamesList.innerHTML = `
                    <div style="grid-column: 1 / -1; padding: 20px; text-align: center; color: white;">
                        <h3>Error loading games</h3>
                        <p>${error.message || 'Unknown error'}</p>
                        <button onclick="location.reload(true)" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; margin-top: 10px; border-radius: 4px; cursor: pointer;">Retry</button>
                    </div>
                `;
            }
            
            // Also show notification
            errorNotification.style.display = 'block';
            
            // Hide loading overlay
            finishLoading();
        }
        
        // Start loading process
        animateProgress();
        
        // Add global error handler for critical errors
        window.addEventListener('error', function(event) {
            // Check if error is related to game loading
            if (event.message && (
                event.message.includes('games.js') || 
                event.message.includes('games2.js') ||
                event.message.includes('JSON')
            )) {
                handleGameLoadError(event.error || new Error(event.message));
            }
        });
        
        // Handle unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
            // Check if rejection is related to game loading
            if (event.reason && event.reason.message && (
                event.reason.message.includes('games.js') || 
                event.reason.message.includes('games2.js') ||
                event.reason.message.includes('JSON')
            )) {
                handleGameLoadError(event.reason);
            }
        });
    });
    </script>

    <!-- Enhanced Games Loading -->
    <script type="module">
    try {
        const gamesList = document.getElementById("gamesList");
        
        // Function to safely load modules with retry
        async function loadModuleWithRetry(url, retries = 3) {
            let lastError;
            
            for (let attempt = 0; attempt < retries; attempt++) {
                try {
                    const module = await import(url);
                    return module;
                } catch (error) {
                    console.warn(`Failed to load module ${url} (attempt ${attempt + 1}/${retries}):`, error);
                    lastError = error;
                    
                    // Wait before retry with exponential backoff
                    if (attempt < retries - 1) {
                        await new Promise(resolve => setTimeout(resolve, 500 * Math.pow(2, attempt)));
                    }
                }
            }
            
            // If all retries failed, throw the last error
            throw lastError;
        }
        
        // Wait for UV config to be available
        await new Promise(resolve => {
            if (window.__uv$config) {
                resolve();
            } else {
                const checkUV = setInterval(() => {
                    if (window.__uv$config) {
                        clearInterval(checkUV);
                        resolve();
                    }
                }, 100);
                
                // Timeout after 5 seconds
                setTimeout(() => {
                    clearInterval(checkUV);
                    resolve();
                }, 5000);
            }
        });

        // Create promises for both game data modules
        const gamesDataPromise = loadModuleWithRetry("/assets/json/games.js");
        const games2DataPromise = loadModuleWithRetry("/assets/json/games2.js");
        
        // Store these promises globally so the loading screen can detect them
        window.gamesDataPromise = gamesDataPromise;
        window.games2DataPromise = games2DataPromise;
        
        // Wait for both to complete
        const [gamesModule, games2Module] = await Promise.all([gamesDataPromise, games2DataPromise]);
        
        // Extract the game data
        const { gamesData } = gamesModule;
        const { games2Data } = games2Module;
        
        // Combine and deduplicate games
        const combinedGames = [...gamesData];
        
        // Add games from games2Data, skipping duplicates
        const existingTitles = new Set(combinedGames.map(game => game.title.toLowerCase()));
        
        for (const game of games2Data) {
            if (!game.title || existingTitles.has(game.title.toLowerCase())) {
                continue;
            }
            
            combinedGames.push(game);
            existingTitles.add(game.title.toLowerCase());
        }
        
        // Sort games alphabetically
        combinedGames.sort((a, b) => a.title.localeCompare(b.title));
        
        function loadGame(game) {
            // Validate game data
            if (!game.title || !game.link) {
                console.warn('Skipping invalid game:', game);
                return;
            }
            
            const gameElement = document.createElement("div");
            gameElement.className = "game-item";
            
            // Use default image if none provided or if image fails to load
            const imgSrc = game.imgSrc || '/gameimg/default.png';
            
            gameElement.innerHTML = `<div class="game-icon">
                    <img src="${imgSrc}" alt="${game.title} icon" onerror="this.src='/gameimg/default.png'">
                </div>
                <h3 class="game-title">${game.title}</h3>
            `;
            
            // Update click handler with improved loading
            gameElement.onclick = async () => {
                // Show loading overlay
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.remove('fade-out');
                    loadingOverlay.style.display = 'flex';
                    document.getElementById('loadingText').textContent = 'Preparing game...';
                    document.getElementById('progressFill').style.width = '0%';
                }
                
                try {
                    // First check if service worker is ready
                    if (!window.__uv$serviceWorkerRegistered) {
                        document.getElementById('loadingText').textContent = 'Setting up proxy...';
                        await window.registerUVServiceWorker();
                    }
                    
                    // Animate progress
                    const progressFill = document.getElementById('progressFill');
                    if (progressFill) {
                        progressFill.style.width = '30%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '60%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    
                    // Clear any service worker cache for this game
                    try {
                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({
                                type: 'CLEAR_GAME_CACHE',
                                gameUrl: game.link
                            });
                        }
                    } catch (e) {
                        console.warn('Failed to clear game cache:', e);
                    }
                    
                    // Complete progress animation
                    if (progressFill) {
                        progressFill.style.width = '100%';
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                    
                    // Navigate to the game
                    window.location.href = `/Classes.html?game=${encodeURIComponent(game.link)}`;
                } catch (error) {
                    console.error('Error starting game:', error);
                    
                    // Show error in loading overlay
                    document.getElementById('loadingText').textContent = 'Error loading game';
                    
                    // Hide after delay
                    setTimeout(() => {
                        loadingOverlay.classList.add('fade-out');
                    }, 2000);
                }
            };
            
            gamesList.appendChild(gameElement);
        }

        if (Array.isArray(combinedGames) && combinedGames.length > 0) {
            combinedGames.forEach(game => {
                loadGame(game);
            });
        } else {
            throw new Error("No games data available");
        }

        // Set up search functionality
        document.getElementById("searchGames").addEventListener("keyup", function(e) {
            gamesList.innerHTML = '';
            const searchTerm = this.value.toLowerCase();
            for (const game of combinedGames) {
                if (game.title.toLowerCase().includes(searchTerm)) {
                    loadGame(game);
                }
            }
            
            // Show message if no results
            if (gamesList.children.length === 0) {
                gamesList.innerHTML = `
                    <div style="grid-column: 1 / -1; padding: 20px; text-align: center; color: white;">
                        <h3>No games found</h3>
                        <p>Try a different search term</p>
                    </div>
                `;
            }
        });
    } catch (error) {
        console.error("Error loading games:", error);
        
        // Display error in games list
        gamesList.innerHTML = `
            <div style="grid-column: 1 / -1; padding: 20px; text-align: center; color: white;">
                <h3>Error loading games</h3>
                <p>${error.message || 'Unknown error'}</p>
                <button onclick="location.reload(true)" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; margin-top: 10px; border-radius: 4px; cursor: pointer;">Retry</button>
            </div>
        `;
        
        // Also show notification
        document.getElementById('errorNotification').style.display = 'block';
    }
    
    // Load header and footer
    try {
        if (window.loadHTML) {
            loadHTML("/assets/html/header.html", "header");
            loadHTML("/assets/html/footer.html", "footer");
        } else {
            console.warn("loadHTML function not available");
        }
    } catch (error) {
        console.error("Error loading header/footer:", error);
    }
    </script>
</body>
</html>
