<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        
        // Progress animation
        function animateProgress() {
            let progress = 0;
            const maxProgress = 100;
            const speed = 0.5;

            function updateProgress() {
                if (progress < maxProgress) {
                    progress += speed;
                    progressFill.style.width = `${Math.min(progress, maxProgress)}%`;
                    
                    if (progress < maxProgress) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        // Final checks and removal
                        setTimeout(() => {
                            loadingOverlay.classList.add('fade-out');
                            loadingOverlay.addEventListener('transitionend', () => {
                                loadingOverlay.remove();
                            });
                        }, 500);
                    }
                }
            }

            // Ensure initial visibility
            progressFill.style.width = '1%';
            requestAnimationFrame(updateProgress);
        }

        // Ensure all critical resources are loaded
        function waitForCriticalResources() {
            const criticalChecks = [
                () => window.CONFIG !== undefined,
                () => window.loadHTML !== undefined,
                () => window.__uv$config !== undefined,
                () => {
                    try {
                        return window.gamesData && window.games2Data;
                    } catch {
                        return false;
                    }
                }
            ];

            function checkResources() {
                const allLoaded = criticalChecks.every(check => check());
                
                if (allLoaded) {
                    animateProgress();
                } else {
                    // If not loaded, check again after a short delay
                    setTimeout(checkResources, 100);
                }
            }

            // Start initial check with a timeout fallback
            checkResources();
            
            // Fallback timeout to prevent indefinite waiting
            setTimeout(() => {
                animateProgress();
            }, 10000);
        }

        // Kick off the loading process
        waitForCriticalResources();

        // Ensure loading bar is visible even if resources are cached
        window.addEventListener('load', () => {
            if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
                animateProgress();
            }
        });
    });
</script>

<!-- FIXED Service Worker Registration -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const stockSW = "/uv/sw.js";
        // IMPORTANT: Use the allowed scope instead of root scope
        const swScope = "/uv/"; 
        const swAllowedHostnames = ["localhost", "127.0.0.1"];
        
        // Function to preload and register the service worker with correct scope
        async function preloadServiceWorker() {
            // Check if service workers are supported
            if (!('serviceWorker' in navigator)) {
                console.error("Service workers are not supported in this browser");
                return false;
            }
            
            // Check if we're on HTTPS or allowed development hostnames
            if (location.protocol !== 'https:' && !swAllowedHostnames.includes(location.hostname)) {
                console.warn("Service workers require HTTPS (except on localhost/127.0.0.1)");
                return false;
            }
            
            try {
                console.log('Registering UV service worker with scope:', swScope);
                
                // Register the service worker with the CORRECT scope
                const registration = await navigator.serviceWorker.register(stockSW, { 
                    scope: swScope,
                    updateViaCache: 'none'
                });
                
                // Wait for the service worker to be ready
                await navigator.serviceWorker.ready;
                
                // If we have an active service worker, send it a message to skip waiting
                if (registration.active) {
                    registration.active.postMessage({ type: 'SKIP_WAITING' });
                }
                
                console.log('UV service worker successfully registered with scope:', registration.scope);
                window.__uv$serviceWorkerRegistered = true;
                return true;
            } catch (error) {
                console.error('UV service worker registration failed:', error);
                return false;
            }
        }
        
        // Start preloading the service worker immediately
        preloadServiceWorker();
    });
</script>

<script type="module">
    try {
        const gamesList = document.getElementById("gamesList");
        
        await new Promise(resolve => {
            if (window.__uv$config) {
                resolve();
            } else {
                const checkUV = setInterval(() => {
                    if (window.__uv$config) {
                        clearInterval(checkUV);
                        resolve();
                    }
                }, 100);
            }
        });

        const { gamesData } = await import("/assets/json/games.js");
        const { games2Data } = await import("/assets/json/games2.js");
        
        const games = [...gamesData, ...games2Data];

        function loadGame(game) {
            const gameElement = document.createElement("div");
            gameElement.className = "game-item";
            gameElement.innerHTML = `<div class="game-icon">
                    <img src="${game.imgSrc}" alt="${game.title} icon">
                </div>
                <h3 class="game-title">${game.title}</h3>
            `;
            
            // Update click handler to work with service worker scope limitations
            gameElement.onclick = async () => {
                // Show loading overlay
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay && loadingOverlay.classList.contains('fade-out')) {
                    loadingOverlay.classList.remove('fade-out');
                    document.getElementById('loadingText').textContent = 'Preparing game...';
                    document.getElementById('progressFill').style.width = '0%';
                }
                
                try {
                    // Progress animation
                    const progressFill = document.getElementById('progressFill');
                    if (progressFill) {
                        progressFill.style.width = '30%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '60%';
                        await new Promise(resolve => setTimeout(resolve, 100));
                        progressFill.style.width = '100%';
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                } catch (error) {
                    console.error('Error in loading animation:', error);
                } finally {
                    // Navigate to the game
                    window.location.href = `/Classes.html?game=${encodeURIComponent(game.link)}`;
                }
            };
            
            gamesList.appendChild(gameElement);
        }

        if (Array.isArray(games)) {
            games.forEach(game => {
                loadGame(game);
            });
        } else {
            console.error("Games is not an array:", games);
            gamesList.innerHTML = '<div style="color: white;">Error: Games data is not in the correct format</div>';
        }

        document.getElementById("searchGames").addEventListener("keyup", function(e) {
            gamesList.innerHTML = '';
            const searchTerm = this.value.toLowerCase();
            for (const game of games) {
                if (game.title.toLowerCase().includes(searchTerm)) {
                    loadGame(game);
                }
            }
        });
    } catch (error) {
        console.error("Error loading games:", error);
        gamesList.innerHTML = `<div style="color: white;">Error loading games: ${error.message}</div>`;
    }
    loadHTML("/assets/html/header.html", "header"),
    loadHTML("/assets/html/footer.html", "footer")
</script>

    const skipButton = document.createElement('button');
    skipButton.textContent = 'Ad will be skippable in 25s';
    skipButton.style.cssText = 'margin-top:15px; padding:8px 16px; background:#333; color:#fff; border:none; border-radius:4px; cursor:not-allowed; opacity:0.7;';
    skipButton.disabled = true;
    
    // Add elements to DOM
    adContainer.appendChild(video);
    adContainer.appendChild(adLabel);
    adContainer.appendChild(clickPrompt);
    adOverlay.appendChild(adContainer);
    adOverlay.appendChild(skipButton);
    document.body.appendChild(adOverlay);
    
    // Track impression immediately
    trackEvent(impressionUrl);
    
    // Make container clickable - MODIFIED: just track, don't navigate
    adContainer.addEventListener('click', function() {
      // Track the click (you still get monetized)
      trackEvent(clickThrough);
      
      // Show a visual feedback that click was registered
      const feedback = document.createElement('div');
      feedback.textContent = 'Click Tracked!';
      feedback.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.7); color:#fff; padding:10px 20px; border-radius:5px; font-size:16px; z-index:10; pointer-events:none;';
      adContainer.appendChild(feedback);
      
      // Remove feedback after 1 second
      setTimeout(function() {
        if (adContainer.contains(feedback)) {
          adContainer.removeChild(feedback);
        }
      }, 1000);
    });
    
    // Prevent spacebar pausing
    const keydownHandler = function(e) {
      if (e.code === 'Space' && document.body.contains(adOverlay)) {
        e.preventDefault();
      }
    };
    document.addEventListener('keydown', keydownHandler);
    
    // Prevent video from pausing
    video.addEventListener('pause', function() {
      if (!video.ended) video.play();
    });
    
    // Track video start
    video.addEventListener('playing', function() {
      if (!video.hasTrackedStart) {
        trackEvent(startUrl);
        video.hasTrackedStart = true;
      }
    });
    
    // Function to clean up everything
    function cleanupAd() {
      // Clear timers
      if (countdownTimer) clearInterval(countdownTimer);
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
      
      // Remove keyboard event listener
      document.removeEventListener('keydown', keydownHandler);
      
      // Remove ad overlay
      if (document.body.contains(adOverlay)) {
        document.body.removeChild(adOverlay);
      }
      
      // Run callback
      runCallback();
    }
    
    // Skip button countdown
    countdownTimer = setInterval(function() {
      const remaining = parseInt(skipButton.textContent.match(/\d+/)[0]) - 1;
      if (remaining <= 0) {
        clearInterval(countdownTimer);
        skipButton.disabled = false;
        skipButton.textContent = 'Skip Ad';
        skipButton.style.cursor = 'pointer';
        skipButton.style.opacity = '1';
        skipButton.style.backgroundColor = '#3a78ee';
      } else {
        skipButton.textContent = `Ad will be skippable in ${remaining}s`;
      }
    }, 1000);
    
    // Skip button click handler
    skipButton.addEventListener('click', function() {
      if (!skipButton.disabled) cleanupAd();
    });
    
    // Video ended handler
    video.addEventListener('ended', cleanupAd);
    
    // Video error handler
    video.addEventListener('error', function() {
      // Make skip button active immediately
      skipButton.disabled = false;
      skipButton.textContent = 'Skip Ad';
      skipButton.style.cursor = 'pointer';
      skipButton.style.opacity = '1';
      skipButton.style.backgroundColor = '#3a78ee';
    });
    
    // Ensure video keeps playing
    video.addEventListener('timeupdate', function() {
      if (video.paused && !video.ended) video.play();
    });
    
    // Force play video
    video.play().catch(function(error) {
      console.error('Video autoplay failed:', error);
    });
    
    // Auto-close fallback
    autoCloseTimer = setTimeout(cleanupAd, 35000);
  }
});
</script>
</body>
</html>
