      if (!lastClosedTime) return true;
      
      const now = new Date().getTime();
      const timeSinceClosed = now - parseInt(lastClosedTime);
      const fiveMinutesInMs = 5 * 60 * 1000;
      
      return timeSinceClosed > fiveMinutesInMs;
    }

    // If it's been shown recently, exit early
    if (!shouldShowPopup()) return;

    // Create particles
    (function() {
      const t = 20;

        const t = document.createElement("div");

        const o = 7 * Math.random() + 3;
        t.style.width = `${o}px`;
        t.style.height = `${o}px`;

        t.style.top = `${a}%`;

        }, {
          transform: "translate(0, 0) rotate(360deg)"

          duration: 1e3 * r,

  <style>

      border-radius: 60px;

      transition: opacity 0.3s ease;

<body>
  <div id="header"></div>
  
  <div class="main-content">
    <div class="search-container">
      <h1 class="search-title">Search the Web</h1>
      <div class="search-wrapper">
        <input 
          class="uvsearch" 
          id="uvsearch" 
          onkeypress="handleSearch(event)" 
          placeholder="Enter your search..."
        >
        <div class="search-glow"></div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    // Load header and footer
    loadHTML("/assets/html/header.html", "header")
    loadHTML("/assets/html/footer.html", "footer")

    function parseSearch(str) {
      if (str.includes("http") && str.includes(":")) {
        return str;
      }
      if (str.includes(".")) {
        return "https://" + str;
      }
      return "https://duckduckgo.com/?t=h_&q=" + str
    }
    
    function handleSearch(e) {
      if (e.key === 'Enter') {
        let url = parseSearch(document.getElementById("uvsearch").value);
        let encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
        // Instead of using localStorage, pass the URL as a query parameter
        location.href = "/Classes.html?game=" + encodeURIComponent(encodedUrl);
        e.preventDefault();
      }
    }
  </script>
  
  <!-- Essential UV Scripts -->
